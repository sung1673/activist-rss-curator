name: Governance expedited protected cutover

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CUTOVER_EXPEDITED_ALPHA_EARLY_ACCESS
        required: true
        type: string
      evidence_run_id:
        description: Successful same-SHA expedited evidence workflow run
        required: true
        type: string
      evidence_artifact_name:
        description: Exact immutable expedited evidence artifact
        required: true
        default: global-alpha-expedited-evidence
        type: string
      evidence_artifact_digest:
        description: Exact sha256 digest reported by the evidence workflow
        required: true
        type: string
      reason:
        description: Auditable Early Access cutover reason
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: governance-production-official-write-${{ github.repository }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-release
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_artifact_id: ${{ steps.evidence.outputs.artifact_id }}
      evidence_artifact_digest: ${{ steps.evidence.outputs.artifact_digest }}
      evidence_run_id: ${{ steps.evidence.outputs.run_id }}
      pages_artifact_id: ${{ steps.pages.outputs.artifact_id }}
      pages_artifact_digest: ${{ steps.pages.outputs.artifact_digest }}
      pages_run_id: ${{ steps.pages.outputs.run_id }}
    steps:
      - name: Checkout the exact cutover revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce protected expedited cutover inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REASON: ${{ inputs.reason }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          STANDARD_OBSERVATION: ${{ vars.GLOBAL_ALPHA_OBSERVATION_ENABLED }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CUTOVER_EXPEDITED_ALPHA_EARLY_ACCESS" ]] || {
            echo "::error::The explicit expedited cutover confirmation did not match."
            exit 1
          }
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Expedited cutover is restricted to the default branch."
            exit 1
          }
          [[ ${#REASON} -ge 16 && ${#REASON} -le 500 ]]
          [[ "$PAGES_OWNER" == "governance" ]] || {
            echo "::error::PAGES_OWNER must be committed to governance by the authenticated operator before protected cutover."
            exit 1
          }
          [[ "$PIPELINE_MODE" == "shadow" ]] || {
            echo "::error::GOVERNANCE_PIPELINE_MODE must remain shadow until live activation."
            exit 1
          }
          [[ "${STANDARD_OBSERVATION,,}" == "false" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Resolve exact expedited evidence workflow and artifact
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_RUN_ID: ${{ inputs.evidence_run_id }}
          REQUESTED_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          REQUESTED_ARTIFACT_DIGEST: ${{ inputs.evidence_artifact_digest }}
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const text = process.env.REQUESTED_RUN_ID.trim();
            if (!/^[1-9][0-9]*$/.test(text)) {
              core.setFailed("evidence_run_id must be a positive integer");
              return;
            }
            if (process.env.REQUESTED_ARTIFACT_NAME !== "global-alpha-expedited-evidence") {
              core.setFailed(
                "Expedited evidence artifact name must be global-alpha-expedited-evidence",
              );
              return;
            }
            const requestedDigest = process.env.REQUESTED_ARTIFACT_DIGEST.toLowerCase();
            if (!/^sha256:[0-9a-f]{64}$/.test(requestedDigest)) {
              core.setFailed("evidence_artifact_digest must be an immutable sha256 digest");
              return;
            }
            const response = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(text),
            });
            const run = response.data;
            if (
              run.status !== "completed" ||
              run.conclusion !== "success" ||
              run.event !== "workflow_dispatch" ||
              run.head_branch !== process.env.DEFAULT_BRANCH ||
              (run.head_sha || "").toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase() ||
              run.path !== ".github/workflows/global-alpha-expedited-evidence.yml"
            ) {
              core.setFailed(
                "Expedited evidence failed its success, exact-SHA, workflow, or branch contract",
              );
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id, per_page: 100},
            );
            const matches = artifacts.filter(
              (item) =>
                item.name === process.env.REQUESTED_ARTIFACT_NAME &&
                !item.expired,
            );
            if (
              matches.length !== 1 ||
              (matches[0].digest || "").toLowerCase() !== requestedDigest
            ) {
              core.setFailed("The exact immutable expedited evidence digest did not match");
              return;
            }
            core.setOutput("artifact_id", String(matches[0].id));
            core.setOutput("artifact_digest", requestedDigest);
            core.setOutput("run_id", String(run.id));
            core.setOutput("run_attempt", String(run.run_attempt));
            core.setOutput("run_created_at", run.created_at);
            core.setOutput("run_updated_at", run.updated_at);
            core.setOutput("artifact_created_at", matches[0].created_at);

      - name: Download exact expedited evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.evidence.outputs.artifact_id }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Re-evaluate immutable expedited evidence and freshness
        shell: bash
        env:
          EVIDENCE_RUN_CREATED_AT: ${{ steps.evidence.outputs.run_created_at }}
          EVIDENCE_RUN_UPDATED_AT: ${{ steps.evidence.outputs.run_updated_at }}
          EVIDENCE_ARTIFACT_CREATED_AT: ${{ steps.evidence.outputs.artifact_created_at }}
          EVIDENCE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
        run: |
          set -euo pipefail
          for path in \
            evidence/global-alpha-expedited-release-report.json \
            evidence/expedited-inputs.json \
            evidence/expedited-producer-manifest.json \
            evidence/pages-artifact-identity.json \
            evidence/artifact-provenance.json \
            evidence/protected-input-provenance.json \
            evidence/preparation-provenance.json \
            evidence/approval-binding-materials.json \
            evidence/human-review.json \
            evidence/approval.json \
            evidence/automated-evidence/collection-provenance.json \
            evidence/automated-evidence/source-right-evidence/KR.json \
            evidence/automated-evidence/source-right-evidence/US.json \
            evidence/automated-evidence/source-right-evidence/CA.json \
            evidence/automated-evidence/source-right-evidence/AU.json \
            evidence/automated-evidence/source-right-evidence/JP.json \
            evidence/automated-evidence/source-right-evidence/GB.json \
            evidence/expedited-legacy-recovery-bundle/expedited-legacy-recovery-bundle.json \
            evidence/expedited-rollback-drill.json; do
            test -f "$path"
          done
          jq -e '
            .release_gate_passed == true
            and .code_revision == env.GITHUB_SHA
            and .release_channel == "production_alpha_early_access"
          ' evidence/global-alpha-expedited-release-report.json > /dev/null
          jq -e '
            .kind == "bside-global-alpha-expedited-artifact-provenance"
            and .code_revision == env.GITHUB_SHA
            and .release_channel == "production_alpha_early_access"
            and .workflow == ".github/workflows/global-alpha-expedited-evidence.yml"
            and .run_id == (env.EVIDENCE_RUN_ID | tonumber)
            and .run_attempt == (env.EVIDENCE_RUN_ATTEMPT | tonumber)
          ' evidence/artifact-provenance.json > /dev/null
          jq -e --slurpfile identity evidence/pages-artifact-identity.json '
            .pages_artifact_digest == $identity[0].artifact_digest
          ' evidence/artifact-provenance.json > /dev/null
          source_right_digest="$(
            (
              cd evidence/automated-evidence
              find source-right-evidence -type f -print0 \
                | sort -z \
                | xargs -0 sha256sum
            ) | sha256sum | cut -d' ' -f1
          )"
          jq -e --arg source_right_digest "$source_right_digest" '
            .source_right_evidence_sha256 == $source_right_digest
          ' evidence/artifact-provenance.json > /dev/null
          human_review_bytes_sha256="$(
            sha256sum evidence/human-review.json | cut -d' ' -f1
          )"
          approval_bytes_sha256="$(
            sha256sum evidence/approval.json | cut -d' ' -f1
          )"
          jq -e \
            --arg human_review_bytes_sha256 "$human_review_bytes_sha256" \
            --arg approval_bytes_sha256 "$approval_bytes_sha256" '
            .kind == "bside-global-alpha-expedited-protected-input-provenance"
            and .code_revision == env.GITHUB_SHA
            and .editorial_human_review.human_review_bytes_sha256
              == $human_review_bytes_sha256
            and .editorial_human_review
              .post_upload_identity_injected_only_in_evaluator_wrapper == true
            and .final_approval.approval_bytes_sha256 == $approval_bytes_sha256
            and .final_approval
              .post_upload_identity_injected_only_in_evaluator_wrapper == true
          ' evidence/protected-input-provenance.json > /dev/null
          evidence_as_of="$(
            jq -er '.evidence_as_of' evidence/global-alpha-expedited-release-report.json
          )"
          now_epoch="$(date -u +%s)"
          # The workflow starts before the rollback drill and 30-minute observation.
          # Keep its creation time as provenance, but use the completed run, immutable
          # artifact, and evidence timestamps for the actual 60-minute cutover window.
          date -u -d "$EVIDENCE_RUN_CREATED_AT" +%s > /dev/null
          for stamp in \
            "$EVIDENCE_RUN_UPDATED_AT" \
            "$EVIDENCE_ARTIFACT_CREATED_AT" \
            "$evidence_as_of"; do
            epoch="$(date -u -d "$stamp" +%s)"
            age="$((now_epoch - epoch))"
            [[ "$age" -ge -60 && "$age" -le 3600 ]] || {
              echo "::error::Expedited evidence is outside the 0-60 minute cutover window."
              exit 1
            }
          done
          python -m curator.global_alpha_expedited_gate evaluate \
            --input "$PWD/evidence/expedited-inputs.json" \
            --expected-revision "$GITHUB_SHA" \
            --output "$PWD/rechecked-expedited-report.json"
          cmp --silent \
            evidence/global-alpha-expedited-release-report.json \
            rechecked-expedited-report.json

      - name: Resolve evidence-bound candidate Pages artifact
        id: pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require("fs");
            const binding = JSON.parse(
              fs.readFileSync("evidence/pages-artifact-identity.json", "utf8"),
            );
            if (
              binding.kind !== "bside-global-alpha-pages-artifact-binding" ||
              binding.code_revision !== process.env.EXPECTED_SHA.toLowerCase() ||
              !Number.isInteger(binding.producer_run_id) ||
              !Number.isInteger(binding.artifact_id) ||
              !/^sha256:[0-9a-f]{64}$/.test(binding.artifact_digest || "")
            ) {
              core.setFailed("The evidence-bound Pages identity is invalid");
              return;
            }
            const {owner, repo} = context.repo;
            const response = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: binding.producer_run_id,
            });
            const run = response.data;
            if (
              run.conclusion !== "success" ||
              run.status !== "completed" ||
              run.head_branch !== process.env.DEFAULT_BRANCH ||
              (run.head_sha || "").toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase() ||
              run.path !== ".github/workflows/daily.yml" ||
              run.run_attempt !== binding.producer_run_attempt
            ) {
              core.setFailed("The evidence-bound Pages producer is not the exact successful run");
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id, per_page: 100},
            );
            const matches = artifacts.filter(
              (item) =>
                item.id === binding.artifact_id &&
                item.name === binding.artifact_name &&
                !item.expired,
            );
            if (
              matches.length !== 1 ||
              (matches[0].digest || "").toLowerCase() !== binding.artifact_digest
            ) {
              core.setFailed("Only the exact evidence-bound Pages artifact may be cut over");
              return;
            }
            core.setOutput("artifact_id", String(binding.artifact_id));
            core.setOutput("artifact_digest", binding.artifact_digest);
            core.setOutput("run_id", String(binding.producer_run_id));

      - name: Download evidence-bound candidate Pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.pages.outputs.artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ steps.pages.outputs.run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Verify exact Pages bytes and Early Access channel
        shell: bash
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        run: |
          set -euo pipefail
          python -m curator.global_alpha_pages_identity verify \
            --site candidate-pages \
            --binding evidence/pages-artifact-identity.json \
            --expected-revision "$GITHUB_SHA"
          python -m curator.governance_site_config \
            --site candidate-pages \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"
          cmp --silent candidate-pages/index.html candidate-pages/governance/index.html
          grep -Rqs --fixed-strings \
            "production_alpha_early_access" candidate-pages/governance
          grep -Rqs --fixed-strings \
            "Production Alpha · Early Access" candidate-pages/governance
          if find candidate-pages -type f \
            \( -iname '*telegram*' -o -iname '*admin*' -o -iname '*story-review*' \) \
            -print -quit | grep -q .; then
            echo "::error::Candidate Pages contains a forbidden internal asset."
            exit 1
          fi

      - name: Verify evidence-carried full-site expedited recovery at cutover time
        shell: bash
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          source_artifact_id="$(
            jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              evidence/expedited-legacy-recovery-bundle/expedited-legacy-recovery-bundle.json
          )"
          observed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python -m curator.expedited_legacy_recovery_bundle verify \
            --bundle evidence/expedited-legacy-recovery-bundle \
            --observed-at "$observed_at" \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$source_artifact_id" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          site="evidence/expedited-legacy-recovery-bundle/full-site"
          test ! -e "$site/feed/telegram.html"
          test ! -e "$site/feed/telegram-admin.html"
          python -m curator.legacy_telegram_safety verify-site \
            --site "$site" \
            --minimum-dated-reports 89

      - name: Bind exact recovery bytes for protected handoff
        shell: bash
        env:
          EVIDENCE_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact_id }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact_digest }}
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          mkdir -p cutover-handoff-recovery
          cp -R evidence/expedited-legacy-recovery-bundle \
            cutover-handoff-recovery/expedited-legacy-recovery-bundle
          cp evidence/global-alpha-expedited-release-report.json \
            cutover-handoff-recovery/global-alpha-expedited-release-report.json
          bundle_manifest="cutover-handoff-recovery/expedited-legacy-recovery-bundle/expedited-legacy-recovery-bundle.json"
          release_report="cutover-handoff-recovery/global-alpha-expedited-release-report.json"
          root_file="cutover-handoff-recovery/expedited-legacy-recovery-bundle/full-site/index.html"
          feed_file="cutover-handoff-recovery/expedited-legacy-recovery-bundle/full-site/feed.xml"
          test -f "$bundle_manifest"
          test -f "$release_report"
          test -f "$root_file"
          test -f "$feed_file"
          source_artifact_id="$(
            jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$bundle_manifest"
          )"
          jq -n \
            --arg kind "bside-global-alpha-expedited-cutover-recovery" \
            --arg release_channel "production_alpha_early_access" \
            --arg code_revision "$GITHUB_SHA" \
            --arg workflow ".github/workflows/governance-expedited-cutover.yml" \
            --arg evidence_artifact_digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --arg legacy_artifact_name "$LEGACY_ARTIFACT_NAME" \
            --arg legacy_code_revision "$LEGACY_CODE_REVISION" \
            --arg legacy_artifact_digest "$LEGACY_ARTIFACT_DIGEST" \
            --arg bundle_manifest_sha256 "$(sha256sum "$bundle_manifest" | cut -d' ' -f1)" \
            --arg release_report_sha256 "$(sha256sum "$release_report" | cut -d' ' -f1)" \
            --arg legacy_root_sha256 "$(sha256sum "$root_file" | cut -d' ' -f1)" \
            --arg legacy_feed_sha256 "$(sha256sum "$feed_file" | cut -d' ' -f1)" \
            --argjson cutover_run_id "$GITHUB_RUN_ID" \
            --argjson cutover_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson evidence_run_id "$EVIDENCE_RUN_ID" \
            --argjson evidence_artifact_id "$EVIDENCE_ARTIFACT_ID" \
            --argjson legacy_run_id "$LEGACY_RUN_ID" \
            --argjson legacy_artifact_id "$source_artifact_id" \
            '{
              schema_version:1,
              kind:$kind,
              release_channel:$release_channel,
              code_revision:$code_revision,
              workflow:$workflow,
              cutover_run_id:$cutover_run_id,
              cutover_run_attempt:$cutover_run_attempt,
              evidence:{
                run_id:$evidence_run_id,
                artifact_id:$evidence_artifact_id,
                artifact_digest:$evidence_artifact_digest
              },
              legacy_source:{
                run_id:$legacy_run_id,
                artifact_id:$legacy_artifact_id,
                artifact_name:$legacy_artifact_name,
                code_revision:$legacy_code_revision,
                artifact_digest:$legacy_artifact_digest
              },
              payload:{
                bundle_manifest_sha256:$bundle_manifest_sha256,
                release_report_sha256:$release_report_sha256,
                legacy_root_sha256:$legacy_root_sha256,
                legacy_feed_sha256:$legacy_feed_sha256
              }
            }' > cutover-handoff-recovery/cutover-recovery-binding.json

      - name: Preserve exact recovery bundle for protected handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-cutover-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: cutover-handoff-recovery
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  preflight:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: governance-runtime
    permissions:
      actions: write
      contents: read
    outputs:
      v1_state_version: ${{ steps.states.outputs.v1_state_version }}
      v2_state_version: ${{ steps.states.outputs.v2_state_version }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up preflight Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cancel, drain, and audit stale Pages producers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          CUTOVER_WORKFLOW: .github/workflows/governance-expedited-cutover.yml
        with:
          script: |
            const fs = require("node:fs");
            const orphanClassifier = require(
              "./.github/scripts/orphaned-pages-run.cjs",
            );
            const {owner, repo} = context.repo;
            const workflowSpecs = [
              {
                id: "build-feed.yml",
                path: ".github/workflows/build-feed.yml",
              },
              {
                id: "daily.yml",
                path: ".github/workflows/daily.yml",
              },
            ];
            const activeStatuses = [
              "queued", "in_progress", "pending", "waiting", "requested",
            ];
            const listActive = async () => {
              const found = new Map();
              for (const workflow of workflowSpecs) {
                for (const status of activeStatuses) {
                  const runs = await github.paginate(
                    github.rest.actions.listWorkflowRuns,
                    {
                      owner,
                      repo,
                      workflow_id: workflow.id,
                      branch: process.env.DEFAULT_BRANCH,
                      status,
                      per_page: 100,
                    },
                  );
                  for (const run of runs) {
                    if (Number(run.id) !== Number(context.runId)) {
                      found.set(run.id, {
                        run,
                        workflowId: workflow.path,
                        status,
                      });
                    }
                  }
                }
              }
              return [...found.values()];
            };
            const orphanedUnstarted = new Map();
            const orphanSnapshots = new Map();
            const attemptedCancel = new Set();
            const forceCancelled = new Set();
            const cancelOrClassify = async ({run, workflowId, status}) => {
              if (attemptedCancel.has(run.id) || orphanedUnstarted.has(run.id)) {
                return;
              }
              attemptedCancel.add(run.id);
              core.notice(
                `Cancelling pre-cutover Pages producer ${run.id} ` +
                `(${workflowId}, ${status}).`,
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
              } catch (error) {
                if ([409, 422].includes(orphanClassifier.statusOf(error))) {
                  await orphanClassifier.confirmTerminalAfterCancelConflict({
                    github,
                    owner,
                    repo,
                    runId: run.id,
                    error,
                  });
                  return;
                }
                const result = await orphanClassifier.handleCancelServerError({
                  github,
                  owner,
                  repo,
                  run,
                  workflowId,
                  currentSha: process.env.EXPECTED_SHA,
                  nowMs: Date.now(),
                  cancelError: error,
                });
                if (result.forceCancelled) {
                  forceCancelled.add(run.id);
                }
                if (result.orphanedUnstarted) {
                  orphanedUnstarted.set(run.id, result.orphanedUnstarted);
                  orphanSnapshots.set(run.id, {
                    id: run.id,
                    path: run.path,
                    status: run.status,
                    head_sha: run.head_sha,
                    run_attempt: run.run_attempt,
                    created_at: run.created_at,
                    run_started_at: run.run_started_at,
                    updated_at: run.updated_at,
                  });
                  core.warning(
                    `Quarantined orphaned_unstarted Pages producer ${run.id}.`,
                  );
                }
              }
            };
            for (const entry of await listActive()) {
              await cancelOrClassify(entry);
            }
            const deadline = Date.now() + 9 * 60 * 1000;
            const forceCancelAt = Date.now() + 60 * 1000;
            let consecutiveEmptyScans = 0;
            let auditEntries = [];
            while (true) {
              const scanned = await listActive();
              for (const entry of scanned) {
                await cancelOrClassify(entry);
              }
              const remaining = scanned.filter(
                ({run}) => !orphanedUnstarted.has(run.id),
              );
              if (remaining.length === 0) {
                consecutiveEmptyScans += 1;
                if (consecutiveEmptyScans >= 2) {
                  for (const [runId, classification] of orphanedUnstarted) {
                    const snapshot = orphanSnapshots.get(runId);
                    const revalidated =
                      await orphanClassifier.revalidateOrphanedUnstarted({
                        github,
                        owner,
                        repo,
                        listedRun: snapshot,
                        currentSha: process.env.EXPECTED_SHA,
                        nowMs: Date.now(),
                      });
                    if (
                      revalidated.run_id !== classification.run_id ||
                      revalidated.head_sha !== classification.head_sha ||
                      revalidated.created_at !== classification.created_at
                    ) {
                      throw new Error(
                        `Orphaned Pages run ${runId} audit changed during revalidation`,
                      );
                    }
                  }
                  auditEntries = [...orphanedUnstarted.keys()]
                    .sort((left, right) => left - right)
                    .map((runId) => ({
                      classification: orphanedUnstarted.get(runId),
                      snapshot: orphanSnapshots.get(runId),
                    }));
                  break;
                }
              } else {
                consecutiveEmptyScans = 0;
                if (Date.now() >= forceCancelAt) {
                  for (const {run} of remaining) {
                    if (forceCancelled.has(run.id)) continue;
                    try {
                      await github.rest.actions.forceCancelWorkflowRun({
                        owner,
                        repo,
                        run_id: run.id,
                      });
                      forceCancelled.add(run.id);
                    } catch (error) {
                      await orphanClassifier.confirmTerminalAfterCancelConflict({
                        github,
                        owner,
                        repo,
                        runId: run.id,
                        error,
                      });
                    }
                  }
                }
              }
              if (Date.now() >= deadline) {
                throw new Error(
                  `Pages producer drain timed out with ${remaining.length} active run(s).`,
                );
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            const audit = {
              schema_version: 1,
              kind: "bside-global-alpha-expedited-cutover-pages-producer-drain-audit",
              code_revision: process.env.EXPECTED_SHA,
              workflow: process.env.CUTOVER_WORKFLOW,
              cutover_run_id: Number(context.runId),
              cutover_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              observed_at: new Date().toISOString(),
              orphaned_unstarted: auditEntries,
            };
            fs.writeFileSync(
              "cutover-pages-producer-drain-audit.json",
              `${JSON.stringify(audit, null, 2)}\n`,
              {encoding: "utf8", flag: "wx"},
            );
            await core.summary
              .addHeading("Cutover Pages producer drain audit", 3)
              .addCodeBlock(JSON.stringify(audit, null, 2), "json")
              .write();

      - name: Upload exact Pages producer drain audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-cutover-pages-drain-${{ github.run_id }}-${{ github.run_attempt }}
          path: cutover-pages-producer-drain-audit.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Require exact Preview states and expedited source policy
        id: states
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V2_SCHEMA_VERSION: "12"
        run: |
          set -euo pipefail
          [[ -n "$BSIDE_ADMIN_TOKEN" && -n "$GOVERNANCE_PREVIEW_TOKEN" ]]
          [[ "${GOVERNANCE_API_BASE_URL%/}" == */api/v1 ]]
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          python .github/scripts/smoke-global-v2.py \
            --base-url "$v2_api" \
            --expected-sha "$GITHUB_SHA" \
            --release-state preview \
            --preview-token-env GOVERNANCE_PREVIEW_TOKEN \
            --privileged-token-env BSIDE_ADMIN_TOKEN
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > v1-state.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > v2-state.json
          [[ "$(jq -r '.release_state' v1-state.json)" == "preview" ]]
          [[ "$(jq -r '.data.release_state' v2-state.json)" == "preview" ]]
          [[ "$EXPECTED_V2_SCHEMA_VERSION" == "12" ]]
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
            "$v2_api/sources/status" > sources.json
          jq -e '
            def required: [
              "connector:kr:dart", "connector:us:sec-edgar",
              "connector:ca:issuer-ir", "connector:au:asic-register"
            ];
            def unavailable: [
              "connector:jp:edinet", "connector:gb:companies-house"
            ];
            .ok == true
            and .data.all_required_ready == true
            and (.data.items | length) == 6
            and ([.data.items[].connector_id] | sort) ==
              ((required + unavailable) | sort)
            and all(.data.items[] as $item;
              if (required | index($item.connector_id)) != null then
                $item.public_ready == true
                and $item.public_status == "active"
                and ($item.freshness_limit_minutes <= 45)
              else
                (unavailable | index($item.connector_id)) != null
                and $item.coverage_mode == "link-only"
                and $item.public_status == "coverage_unavailable"
                and $item.public_ready == false
                and $item.raw_count == 0
                and $item.acknowledged_count == 0
              end)
          ' sources.json > /dev/null
          v1_version="$(jq -er '.state_version' v1-state.json)"
          v2_version="$(jq -er '.data.state_version' v2-state.json)"
          [[ "$v1_version" =~ ^[0-9]+$ && "$v2_version" =~ ^[0-9]+$ ]]
          echo "v1_state_version=$v1_version" >> "$GITHUB_OUTPUT"
          echo "v2_state_version=$v2_version" >> "$GITHUB_OUTPUT"

  deploy_pages:
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify protected ownership and deployment fence
        shell: bash
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER" == "governance" ]]
          [[ "$PIPELINE_MODE" == "shadow" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]

      - name: Download exact validated candidate Pages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.pages_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Revalidate protected Preview versions inside the Pages lock
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
        run: |
          set -euo pipefail
          [[ "$PIPELINE_MODE" == "shadow" ]]
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > pages-v1.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > pages-v2.json
          [[ "$(jq -r '.release_state' pages-v1.json)" == "preview" ]]
          [[ "$(jq -r '.state_version' pages-v1.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.release_state' pages-v2.json)" == "preview" ]]
          [[ "$(jq -r '.data.state_version' pages-v2.json)" == "$EXPECTED_V2_VERSION" ]]

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload exact Early Access Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: candidate-pages

      - name: Deploy exact Early Access Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

  preview_smoke:
    needs: [validate, preflight, deploy_pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact smoke verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download evidence-bound candidate Pages for byte comparison
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.pages_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up smoke Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Smoke deployed Pages while both APIs remain Preview
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          python .github/scripts/smoke-global-v2.py \
            --base-url "$v2_api" \
            --expected-sha "$GITHUB_SHA" \
            --release-state preview \
            --preview-token-env GOVERNANCE_PREVIEW_TOKEN \
            --privileged-token-env BSIDE_ADMIN_TOKEN
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > smoke-v1.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > smoke-v2.json
          [[ "$(jq -r '.release_state' smoke-v1.json)" == "preview" ]]
          [[ "$(jq -r '.state_version' smoke-v1.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.release_state' smoke-v2.json)" == "preview" ]]
          [[ "$(jq -r '.data.state_version' smoke-v2.json)" == "$EXPECTED_V2_VERSION" ]]
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          cache_bust="expedited-cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/?$cache_bust" --output page_.html
          cmp --silent page_.html candidate-pages/index.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/governance/?$cache_bust" --output page__governance_.html
          cmp --silent \
            page__governance_.html candidate-pages/governance/index.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/feed.xml?$cache_bust" --output page_feed_xml.html
          cmp --silent page_feed_xml.html candidate-pages/feed.xml
          grep -qs --fixed-strings "Production Alpha · Early Access" page_.html
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/governance/config.js?$cache_bust" --output remote-preview-config.js
          cmp --silent \
            remote-preview-config.js candidate-pages/governance/config.js
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/governance/app.js?$cache_bust" --output remote-preview-app.js
          cmp --silent remote-preview-app.js candidate-pages/governance/app.js
          grep -qs --fixed-strings "$GITHUB_SHA" remote-preview-config.js
          grep -qs --fixed-strings "$GOVERNANCE_API_BASE_URL" remote-preview-config.js
          grep -qs --fixed-strings \
            "production_alpha_early_access" remote-preview-app.js
          for path in \
            '/briefs/latest?edition=global' \
            '/live?limit=1' \
            '/events?limit=1' \
            '/search?q=governance&limit=1' \
            '/calendar?limit=1'; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
              "$v2_api$path" --output /dev/null
          done

  activate:
    needs: [validate, preflight, deploy_pages, preview_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: governance-release
    permissions:
      actions: read
      contents: read
    steps:
      - name: Revalidate both exact Preview versions
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > activate-v1.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > activate-v2.json
          [[ "$(jq -r '.release_state' activate-v1.json)" == "preview" ]]
          [[ "$(jq -r '.state_version' activate-v1.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.release_state' activate-v2.json)" == "preview" ]]
          [[ "$(jq -r '.data.state_version' activate-v2.json)" == "$EXPECTED_V2_VERSION" ]]

      - name: Authorize and atomically activate v1 and v2
        shell: bash
        env:
          BSIDE_RELEASE_AUTHORIZER_TOKEN: ${{ secrets.BSIDE_RELEASE_AUTHORIZER_TOKEN }}
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.evidence_artifact_digest }}
          EVIDENCE_RUN_ID: ${{ needs.validate.outputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.validate.outputs.evidence_artifact_id }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
          CUTOVER_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ ${#BSIDE_RELEASE_AUTHORIZER_TOKEN} -ge 32 ]]
          [[ ${#BSIDE_ADMIN_TOKEN} -ge 32 ]]
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          release_nonce="$(openssl rand -hex 32)"
          echo "::add-mask::$release_nonce"
          expires="$(date -u -d '+5 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
          authorization_payload="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --arg nonce "$release_nonce" \
            --arg expires "$expires" \
            --arg reason "$CUTOVER_REASON" \
            --argjson evidence_run_id "$EVIDENCE_RUN_ID" \
            --argjson evidence_artifact_id "$EVIDENCE_ARTIFACT_ID" \
            --argjson v1_version "$EXPECTED_V1_VERSION" \
            --argjson v2_version "$EXPECTED_V2_VERSION" \
            '{candidate_sha:$sha,evidence_artifact_digest:$digest,
              evidence_run_id:$evidence_run_id,evidence_artifact_id:$evidence_artifact_id,
              release_nonce:$nonce,expected_v1_state_version:$v1_version,
              expected_v2_state_version:$v2_version,expires_at:$expires,reason:$reason}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $BSIDE_RELEASE_AUTHORIZER_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Request-ID: expedited-authorize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$authorization_payload" \
            "$v2_api/admin/release-authorizations" > authorization.json
          [[ "$(jq -r '.ok' authorization.json)" == "true" ]]
          cutover_payload="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --arg nonce "$release_nonce" \
            --arg reason "$CUTOVER_REASON" \
            --argjson v1_version "$EXPECTED_V1_VERSION" \
            --argjson v2_version "$EXPECTED_V2_VERSION" \
            '{candidate_sha:$sha,evidence_artifact_digest:$digest,release_nonce:$nonce,
              expected_v1_state_version:$v1_version,
              expected_v2_state_version:$v2_version,reason:$reason}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Request-ID: expedited-cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$cutover_payload" "$v2_api/admin/cutover" > live.json
          [[ "$(jq -r '.ok' live.json)" == "true" ]]
          [[ "$(jq -r '.data.states.governance_v1.release_state' live.json)" == "live" ]]
          [[ "$(jq -r '.data.states.global_terminal_v2.release_state' live.json)" == "live" ]]
          [[ "$(jq -r '.data.evidence_artifact_digest' live.json)" == "$EVIDENCE_ARTIFACT_DIGEST" ]]
          unset release_nonce authorization_payload cutover_payload

      - name: Final public Early Access smoke
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          for path in / /governance/ /feed.xml; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --output /dev/null "$web$path"
          done
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/governance/config.js" --output final-config.js
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$web/governance/app.js" --output final-app.js
          grep -qs --fixed-strings "$GITHUB_SHA" final-config.js
          grep -qs --fixed-strings "$GOVERNANCE_API_BASE_URL" final-config.js
          grep -qs --fixed-strings "production_alpha_early_access" final-app.js
          for path in \
            '/briefs/latest?edition=global' \
            '/live?limit=1' \
            '/events?limit=1' \
            '/search?q=governance&limit=1' \
            '/exports/events.json?limit=1' \
            '/exports/events.csv?limit=1' \
            '/feeds/events.atom?limit=1'; do
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --output /dev/null "$v2_api$path"
          done
          curl --fail-with-body --silent --show-error \
            --output /dev/null "$v1_api/events?limit=1"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "live"'

      - name: Verify protected handoff remains fenced
        shell: bash
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER" == "governance" ]]
          [[ "$PIPELINE_MODE" == "shadow" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          echo "::notice::Protected Pages and APIs are live. The authenticated operator must now set GOVERNANCE_PIPELINE_MODE=live, verify it, and only then disable the expedited deployment fence."

      - name: Record Early Access activation
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Production Alpha · Early Access is live"
            echo "- revision: \`$GITHUB_SHA\`"
            echo "- confirmation: \`CUTOVER_EXPEDITED_ALPHA_EARLY_ACCESS\`"
            echo "- v1 and v2 were activated in one protected atomic transaction"
            echo "- Telegram and governance outbound delivery remained disabled"
            echo "- governance ownership is committed and the deployment fence remains active until the authenticated operator commits live mode"
          } >> "$GITHUB_STEP_SUMMARY"

  recover_close:
    needs: [validate, preflight, deploy_pages, preview_smoke, activate]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          needs.preflight.result == 'success' &&
          (needs.deploy_pages.result != 'success' ||
           needs.preview_smoke.result != 'success' ||
           needs.activate.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      contents: read
    steps:
      - name: Fail safe by closing v2 then v1
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > recover-v2.json
          v2_state="$(jq -r '.data.release_state' recover-v2.json)"
          v2_version="$(jq -r '.data.state_version' recover-v2.json)"
          if [[ "$v2_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v2_version" \
              '{release_state:"closed",expected_version:$version,
                reason:"Expedited cutover failed; close v2 before v1"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" "$v2_api/admin/release-state" > recover-v2-closed.json
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > recover-v1.json
          v1_state="$(jq -r '.release_state' recover-v1.json)"
          v1_version="$(jq -r '.state_version' recover-v1.json)"
          if [[ "$v1_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v1_version" \
              '{release_state:"closed",expected_version:$version,
                reason:"Expedited cutover failed; automatic legacy recovery"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" "$v1_api/admin/release-state" > recover-v1-closed.json
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "closed"'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" | jq -e '.release_state == "closed"'

  recover_pages:
    needs: [validate, recover_close]
    if: ${{ always() && needs.recover_close.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout recovery verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up recovery Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download exact evidence-carried recovery bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.evidence_artifact_id }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.evidence_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Verify pinned legacy recovery before deployment
        shell: bash
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          source_artifact_id="$(
            jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              evidence/expedited-legacy-recovery-bundle/expedited-legacy-recovery-bundle.json
          )"
          python -m curator.expedited_legacy_recovery_bundle verify \
            --bundle evidence/expedited-legacy-recovery-bundle \
            --observed-at "$(
              jq -er '.evidence_as_of' \
                evidence/global-alpha-expedited-release-report.json
            )" \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$source_artifact_id" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          site="evidence/expedited-legacy-recovery-bundle/full-site"
          test ! -e "$site/feed/telegram.html"
          test ! -e "$site/feed/telegram-admin.html"
          python -m curator.legacy_telegram_safety verify-site \
            --site "$site" \
            --minimum-dated-reports 89

      - name: Configure Pages for automatic recovery
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pinned legacy recovery
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: evidence/expedited-legacy-recovery-bundle/full-site

      - name: Restore pinned legacy artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Report fail-closed recovery
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Expedited cutover recovery complete"
            echo "- v2 and v1 were closed before recovery"
            echo "- the pinned legacy Pages artifact was restored"
          } >> "$GITHUB_STEP_SUMMARY"

  recover_verify:
    needs: [recover_pages]
    if: ${{ always() && needs.recover_pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: governance-runtime
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify failed cutover remains fenced
        shell: bash
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER" == "governance" ]]
          [[ "$PIPELINE_MODE" == "shadow" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          echo "::notice::Recovery restored the legacy root and closed APIs. The authenticated operator must set PAGES_OWNER=legacy before disabling the expedited deployment fence."

      - name: Verify closed APIs and restored legacy root
        shell: bash
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "closed"'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" | jq -e '.release_state == "closed"'
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "${BSIDE_PUBLIC_WEB_URL%/}/" --output restored-root.html
          cache_bust="expedited-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for forbidden_path in feed/telegram.html feed/telegram-admin.html; do
            status="$(
              curl --silent --show-error --location \
                --retry 3 --retry-all-errors \
                --output /dev/null --write-out '%{http_code}' \
                "${BSIDE_PUBLIC_WEB_URL%/}/$forbidden_path?$cache_bust"
            )"
            if [[ "$status" != "404" ]]; then
              echo "::error::$forbidden_path must return HTTP 404 after recovery; got $status."
              exit 1
            fi
          done
          if grep -q --fixed-strings "Production Alpha · Early Access" restored-root.html; then
            echo "::error::Legacy recovery did not restore the legacy root."
            exit 1
          fi
          {
            echo "### Automatic expedited recovery verified"
            echo "- both APIs are closed"
            echo "- the pinned legacy root is restored"
            echo "- repository operation mode is verified as legacy/shadow"
          } >> "$GITHUB_STEP_SUMMARY"
