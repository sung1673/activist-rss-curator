name: Governance protected cutover

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful release-evidence workflow run at the current SHA
        required: true
        type: string
      evidence_artifact_name:
        description: Protected release evidence artifact
        required: true
        default: governance-release-evidence
        type: string
      governance_pages_run_id:
        description: Successful daily workflow run containing the immutable governance Pages artifact
        required: true
        type: string
      governance_pages_artifact_name:
        description: Immutable governance Pages source artifact
        required: true
        type: string
      reason:
        description: Auditable reason for the public cutover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-production-transition-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    environment:
      name: governance-release
    outputs:
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id }}
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id }}
      evidence_created_at: ${{ steps.resolve.outputs.evidence_created_at }}
      pages_artifact_id: ${{ steps.resolve.outputs.pages_artifact_id }}
      pages_run_id: ${{ steps.resolve.outputs.pages_run_id }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce default branch and safe rollout variables
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          CUTOVER_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Cutover is restricted to the default branch."
            exit 1
          }
          [[ "$PAGES_OWNER" == "governance" ]] || {
            echo "::error::The operator must set PAGES_OWNER=governance immediately before dispatch."
            exit 1
          }
          [[ "$GOVERNANCE_PIPELINE_MODE" == "shadow" ]] || {
            echo "::error::GOVERNANCE_PIPELINE_MODE must remain shadow until live activation."
            exit 1
          }
          for value in "$ENABLE_PAGES" "$ENABLE_GOVERNANCE_PAGES" "$ENABLE_GOVERNANCE_SHADOW" \
            "$ENABLE_TELEGRAM_DELIVERY" "$ENABLE_GOVERNANCE_DELIVERY"; do
            [[ "${value,,}" != "true" ]] || {
              echo "::error::Legacy rollout booleans and all outbound delivery flags must not be true."
              exit 1
            }
          done
          [[ ${#CUTOVER_REASON} -ge 8 ]] || {
            echo "::error::Cutover reason must contain at least eight characters."
            exit 1
          }

      - name: Cancel stale Pages producer runs before protected deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Set(["queued", "in_progress", "pending", "waiting"]);
            for (const workflow_id of ["build-feed.yml", "daily.yml"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, per_page: 100,
              });
              for (const run of runs) {
                if (run.id === context.runId || !active.has(run.status)) continue;
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              }
            }

      - name: Resolve same-SHA evidence and governance artifacts
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          PAGES_RUN_ID: ${{ inputs.governance_pages_run_id }}
          PAGES_ARTIFACT_NAME: ${{ inputs.governance_pages_artifact_name }}
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA.toLowerCase();
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            async function resolve(runText, artifactName, workflowFile, label) {
              if (!/^[0-9]+$/.test(runText || "")) {
                throw new Error(`${label} run id must contain digits only`);
              }
              if (!artifactName) throw new Error(`${label} artifact name is required`);
              const runId = Number(runText);
              if (runId === currentRunId) throw new Error(`${label} source cannot be the current run`);
              const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId});
              if (run.data.conclusion !== "success") throw new Error(`${label} source run was not successful`);
              if ((run.data.head_sha || "").toLowerCase() !== expectedSha) {
                throw new Error(`${label} source run SHA does not match the cutover SHA`);
              }
              if (run.data.head_branch !== defaultBranch) {
                throw new Error(`${label} source run is not from the default branch`);
              }
              if ((run.data.path || "") !== `.github/workflows/${workflowFile}`) {
                throw new Error(`${label} source run used an unexpected workflow`);
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: runId, per_page: 100,
              });
              const matches = artifacts.filter((item) => item.name === artifactName && !item.expired);
              if (matches.length !== 1) {
                throw new Error(`${label} requires exactly one unexpired named artifact`);
              }
              const artifact = matches[0];
              if (!/^sha256:[0-9a-f]{64}$/i.test(artifact.digest || "")) {
                throw new Error(`${label} artifact has no immutable SHA-256 digest`);
              }
              return {run, artifact};
            }
            try {
              const evidence = await resolve(
                process.env.EVIDENCE_RUN_ID,
                process.env.EVIDENCE_ARTIFACT_NAME,
                "release-evidence.yml",
                "evidence",
              );
              const ageHours = (Date.now() - Date.parse(evidence.run.data.created_at)) / 3600000;
              if (ageHours < -0.1 || ageHours > 72) {
                throw new Error(`evidence run age ${ageHours.toFixed(1)}h is outside the 0-72h window`);
              }
              const pages = await resolve(
                process.env.PAGES_RUN_ID,
                process.env.PAGES_ARTIFACT_NAME,
                "daily.yml",
                "governance Pages",
              );
              const expectedPagesArtifactName = `pages-${pages.run.data.id}-${pages.run.data.run_attempt}`;
              if (process.env.PAGES_ARTIFACT_NAME !== expectedPagesArtifactName) {
                throw new Error(
                  `governance Pages artifact name must be exactly ${expectedPagesArtifactName}`,
                );
              }
              core.setOutput("evidence_artifact_id", String(evidence.artifact.id));
              core.setOutput("evidence_run_id", String(evidence.run.data.id));
              core.setOutput("evidence_created_at", evidence.run.data.created_at);
              core.setOutput("pages_artifact_id", String(pages.artifact.id));
              core.setOutput("pages_run_id", String(pages.run.data.id));
            } catch (error) {
              core.setFailed(error instanceof Error ? error.message : String(error));
            }

      - name: Resolve rolling legacy recovery source
        id: legacy_recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const resolve = require("./.github/scripts/resolve-legacy-recovery.cjs");
            await resolve({github, context, core});

      - name: Download protected production evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.evidence_artifact_id }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.evidence_run_id }}
          digest-mismatch: error

      - name: Download immutable governance Pages source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.pages_run_id }}
          digest-mismatch: error

      - name: Download rolling legacy recovery bundle
        if: steps.legacy_recovery.outputs.mode == 'carry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.legacy_recovery.outputs.artifact_id }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          github-token: ${{ github.token }}
          run-id: ${{ steps.legacy_recovery.outputs.run_id }}
          digest-mismatch: error

      - name: Download immutable legacy seed archive
        if: steps.legacy_recovery.outputs.mode == 'seed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
        run: |
          set -euo pipefail
          [[ "$LEGACY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl --fail-with-body --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID/zip" \
            --output "$LEGACY_ARCHIVE_PATH"

      - name: Validate immutable governance Pages contents
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate-pages/index.html
          test -s candidate-pages/governance/index.html
          test -s candidate-pages/feed.xml
          test -s candidate-pages/legacy-feed-compatibility.json
          cmp --silent candidate-pages/index.html candidate-pages/governance/index.html || {
            echo "::error::Legacy compatibility assets overwrote the governance root."
            exit 1
          }
          if find candidate-pages -type l -print -quit | grep -q .; then
            echo "::error::Pages source contains a symbolic link."
            exit 1
          fi
          if find candidate-pages -type f \( -iname '*telegram*' -o -iname '*admin*' -o -iname '*story-review*' \) -print -quit | grep -q .; then
            echo "::error::Pages source contains a forbidden internal asset."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify immutable governance UI release config
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.governance_site_config \
            --site candidate-pages \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"

      - name: Prepare or verify rolling legacy recovery bundle
        id: recovery_bundle
        shell: bash
        env:
          LEGACY_SOURCE_MODE: ${{ steps.legacy_recovery.outputs.mode }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
          LEGACY_RECOVERY_ROOT: ${{ runner.temp }}/legacy-recovery-bundle
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_SEED_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          if [[ "$LEGACY_SOURCE_MODE" == "seed" ]]; then
            source_artifact_id="$LEGACY_SEED_ARTIFACT_ID"
            python -m curator.legacy_recovery_bundle prepare \
              --archive "$LEGACY_ARCHIVE_PATH" \
              --output "$LEGACY_RECOVERY_ROOT" \
              --source-run-id "$LEGACY_RUN_ID" \
              --source-artifact-id "$source_artifact_id" \
              --source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --source-code-revision "$LEGACY_CODE_REVISION" \
              --source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          else
            source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$LEGACY_RECOVERY_ROOT/legacy-recovery-bundle.json")"
            python -m curator.legacy_recovery_bundle verify \
              --bundle "$LEGACY_RECOVERY_ROOT" \
              --expected-source-run-id "$LEGACY_RUN_ID" \
              --expected-source-artifact-id "$source_artifact_id" \
              --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --expected-source-code-revision "$LEGACY_CODE_REVISION" \
              --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          fi
          echo "source_artifact_id=$source_artifact_id" >> "$GITHUB_OUTPUT"

      - name: Validate pinned 90-day legacy feed compatibility window
        shell: bash
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_ID: ${{ steps.recovery_bundle.outputs.source_artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          python -m curator.legacy_feed_compat verify \
            --site candidate-pages \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$LEGACY_ARTIFACT_ID" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Evaluate all six release evidence files
        run: >-
          python -m curator.release_gate
          --shadow evidence/shadow.jsonl
          --operations evidence/operations.jsonl
          --performance evidence/performance.jsonl
          --benchmark evidence/benchmark.json
          --usability evidence/usability.json
          --approval evidence/release-approval.json
          --expected-revision ${{ github.sha }}
          --evidence-as-of ${{ steps.resolve.outputs.evidence_created_at }}
          --output release-report/release-gate.json
          --shadow-output release-report/shadow-comparison.json

      - name: Preserve protected cutover validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-cutover-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-report
          if-no-files-found: error
          retention-days: 90

      - name: Preserve verified legacy recovery for cutover and rollback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-recovery-carry-forward
          path: ${{ runner.temp }}/legacy-recovery-bundle
          if-no-files-found: error
          retention-days: 90

  deploy_pages:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout observation producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated immutable governance Pages source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.pages_run_id }}
          digest-mismatch: error

      - name: Verify predeclared governance Pages ownership
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]]

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: candidate-pages

      - name: Capture governance Pages distribution start
        id: pages_distribution_start
        shell: bash
        run: echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy validated governance artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Record governance Pages distribution outcome
        if: >-
          ${{ always() && !cancelled() &&
              steps.pages_distribution_start.outcome == 'success' &&
              (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure') }}
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DISTRIBUTION_OBSERVED_AT: ${{ steps.pages_distribution_start.outputs.observed_at }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          succeeded=false
          if [[ "$DEPLOYMENT_OUTCOME" == "success" ]]; then
            succeeded=true
          fi
          python .github/scripts/record-web-distribution.py \
            --target pages \
            --operation cutover-governance \
            --succeeded "$succeeded" \
            --observed-at "$DISTRIBUTION_OBSERVED_AT"

  activate:
    needs: [validate, deploy_pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: governance-runtime
    permissions:
      contents: read
    steps:
      - name: Checkout deployed-config verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Require protected production configuration
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BSIDE_ADMIN_TOKEN GOVERNANCE_PREVIEW_TOKEN GOVERNANCE_API_BASE_URL BSIDE_PUBLIC_WEB_URL; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::$name is required for the protected release."
              exit 1
            }
          done

      - name: Set up deployed-config verifier Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify protected preview release state
        id: preview_state
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GOVERNANCE_API_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$api/admin/release-state" > release-state-before.json
          [[ "$(jq -r '.release_state' release-state-before.json)" == "preview" ]] || {
            echo "::error::Cutover requires an already reviewed preview release state."
            exit 1
          }
          [[ "$(jq -r '.preview_auth_configured' release-state-before.json)" == "true" ]] || {
            echo "::error::Preview authentication is not configured."
            exit 1
          }
          version="$(jq -r '.state_version' release-state-before.json)"
          [[ "$version" =~ ^[0-9]+$ ]] || exit 1
          echo "state_version=$version" >> "$GITHUB_OUTPUT"

      - name: Smoke deployed root governance feed API and export
        env:
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          api="${GOVERNANCE_API_BASE_URL%/}"
          for path in / /governance/ /feed.xml; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "$web$path"
          done
          mkdir -p deployed-config/governance
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            --output deployed-config/config.js "$web/config.js"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            --output deployed-config/governance/config.js "$web/governance/config.js"
          python -m curator.governance_site_config \
            --site deployed-config \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"
          curl --fail --silent --show-error --output /dev/null "$api/health"
          for path in '/events?limit=1' '/exports/events.json?limit=1'; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
              --output /dev/null "$api$path"
          done

      - name: Promote reviewed preview state to live
        id: release_live
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_VERSION: ${{ steps.preview_state.outputs.state_version }}
          CUTOVER_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GOVERNANCE_API_BASE_URL%/}"
          payload="$(jq -nc --argjson version "$EXPECTED_VERSION" --arg reason "$CUTOVER_REASON" \
            '{release_state:"live",expected_version:$version,reason:$reason}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            -H "Content-Type: application/json" -H "X-Request-ID: cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$payload" "$api/admin/release-state" > release-state-live.json
          [[ "$(jq -r '.release_state' release-state-live.json)" == "live" ]] || exit 1

      - name: Smoke public live API without preview credentials
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GOVERNANCE_API_BASE_URL%/}"
          for path in \
            '/events?limit=1' \
            '/feeds/events.atom?limit=1' \
            '/exports/events.json?limit=1' \
            '/exports/events.csv?limit=1'; do
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --output /dev/null "$api$path"
          done

      - name: Record verified governance ownership
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE_SNAPSHOT: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]]
          [[ "$GOVERNANCE_PIPELINE_MODE_SNAPSHOT" == "shadow" ]]
          {
            echo "### Governance cutover complete"
            echo "- release state: \`live\`"
            echo "- Pages owner: \`governance\`"
            echo "- repository variables are not changed by this workflow"
            echo "- until the commands below succeed, legacy and governance scheduled deployers both remain fail-closed"
            echo "- Telegram and governance outbound delivery remained disabled"
            echo ""
            echo "Run from the approved operator workstation using its currently authenticated local gh session:"
            echo '```bash'
            echo 'gh auth status'
            echo 'gh variable set GOVERNANCE_PIPELINE_MODE --body live --repo sung1673/activist-rss-curator'
            echo 'test "$(gh variable get GOVERNANCE_PIPELINE_MODE --repo sung1673/activist-rss-curator)" = "live"'
            echo 'test "$(gh variable get PAGES_OWNER --repo sung1673/activist-rss-curator)" = "governance"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close governance API if any activation step fails
        if: failure()
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GOVERNANCE_API_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$api/admin/release-state" > release-state-activation-failed.json
          state="$(jq -r '.release_state' release-state-activation-failed.json)"
          if [[ "$state" != "closed" ]]; then
            version="$(jq -r '.state_version' release-state-activation-failed.json)"
            payload="$(jq -nc --argjson version "$version" \
              '{release_state:"closed",expected_version:$version,reason:"Cutover activation failed; automatic legacy recovery started"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: cutover-activation-failed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$api/admin/release-state" > release-state-activation-closed.json
          fi

  recover_close:
    needs: [validate, deploy_pages, activate]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          (needs.deploy_pages.result != 'success' || needs.activate.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel stale Pages producer runs before automatic recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Set(["queued", "in_progress", "pending", "waiting"]);
            for (const workflow_id of ["build-feed.yml", "daily.yml"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, per_page: 100,
              });
              for (const run of runs) {
                if (active.has(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                }
              }
            }

      - name: Close governance API before automatic legacy recovery
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          api="${GOVERNANCE_API_BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$api/admin/release-state" > recovery-state-before.json
          state="$(jq -r '.release_state' recovery-state-before.json)"
          if [[ "$state" != "closed" ]]; then
            version="$(jq -r '.state_version' recovery-state-before.json)"
            payload="$(jq -nc --argjson version "$version" \
              '{release_state:"closed",expected_version:$version,reason:"Protected cutover failed; restoring pinned legacy artifact"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: cutover-recovery-close-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$api/admin/release-state" > recovery-state-closed.json
          fi

  recover_pages:
    needs: [validate, recover_close]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          needs.recover_close.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout recovery verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up recovery Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download same-run verified legacy recovery bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legacy-recovery-carry-forward
          path: legacy-recovery-bundle
          digest-mismatch: error

      - name: Validate pinned legacy recovery contents
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        shell: bash
        run: |
          set -euo pipefail
          source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
            legacy-recovery-bundle/legacy-recovery-bundle.json)"
          python -m curator.legacy_recovery_bundle verify \
            --bundle legacy-recovery-bundle \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$source_artifact_id" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Configure Pages for automatic legacy recovery
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pinned legacy recovery artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: legacy-recovery-bundle/full-site

      - name: Restore pinned legacy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

  recover_owner:
    needs: [validate, deploy_pages, activate, recover_pages]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          (needs.deploy_pages.result != 'success' || needs.activate.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      contents: read
    steps:
      - name: Verify fail-closed recovery and report operator declaration change
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.recover_pages.result }}" == "success" ]] || {
            echo "::error::Pinned legacy artifact was not restored; ownership will remain fail-closed."
            exit 1
          }
          api="${GOVERNANCE_API_BASE_URL%/}"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$api/admin/release-state" > recovery-final-state.json
          state="$(jq -r '.release_state' recovery-final-state.json)"
          if [[ "$state" != "closed" ]]; then
            version="$(jq -r '.state_version' recovery-final-state.json)"
            payload="$(jq -nc --argjson version "$version" \
              '{release_state:"closed",expected_version:$version,reason:"Final automatic cutover recovery close"}')"
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: cutover-recovery-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$api/admin/release-state" > recovery-final-closed.json
            [[ "$(jq -r '.release_state' recovery-final-closed.json)" == "closed" ]]
          fi
          {
            echo "### Automatic cutover recovery complete"
            echo "- the pinned legacy artifact was restored and the governance API is closed"
            echo "- repository variables were not changed by this workflow"
            echo "- until the commands below succeed, legacy and governance scheduled deployers both remain fail-closed"
            echo ""
            echo "Run from the approved operator workstation using its currently authenticated local gh session:"
            echo '```bash'
            echo 'gh auth status'
            echo 'gh variable set GOVERNANCE_PIPELINE_MODE --body shadow --repo sung1673/activist-rss-curator'
            echo 'gh variable set PAGES_OWNER --body legacy --repo sung1673/activist-rss-curator'
            echo 'test "$(gh variable get GOVERNANCE_PIPELINE_MODE --repo sung1673/activist-rss-curator)" = "shadow"'
            echo 'test "$(gh variable get PAGES_OWNER --repo sung1673/activist-rss-curator)" = "legacy"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
