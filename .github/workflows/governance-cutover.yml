name: Governance protected cutover

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Successful Production Alpha evidence workflow run at the current SHA
        required: true
        type: string
      evidence_artifact_name:
        description: Protected immutable Production Alpha evidence artifact
        required: true
        default: global-alpha-release-evidence
        type: string
      reason:
        description: Auditable reason for the public cutover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-production-official-write-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    environment:
      name: governance-release
    outputs:
      evidence_artifact_id: ${{ steps.resolve.outputs.evidence_artifact_id }}
      evidence_artifact_digest: ${{ steps.resolve.outputs.evidence_artifact_digest }}
      evidence_run_id: ${{ steps.resolve.outputs.evidence_run_id }}
      evidence_created_at: ${{ steps.resolve.outputs.evidence_created_at }}
      pages_artifact_id: ${{ steps.pages_binding.outputs.pages_artifact_id }}
      pages_run_id: ${{ steps.pages_binding.outputs.pages_run_id }}
      legacy_carry_artifact_name: ${{ steps.legacy_recovery.outputs.carry_artifact_name }}
      legacy_pin_run_id: ${{ steps.legacy_recovery.outputs.pin_run_id }}
      legacy_pin_artifact_name: ${{ steps.legacy_recovery.outputs.pin_artifact_name }}
      legacy_pin_code_revision: ${{ steps.legacy_recovery.outputs.pin_code_revision }}
      legacy_pin_artifact_digest: ${{ steps.legacy_recovery.outputs.pin_artifact_digest }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce default branch and safe rollout variables
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          BSIDE_RELEASE_AUTHORIZER_TOKEN: ${{ secrets.BSIDE_RELEASE_AUTHORIZER_TOKEN }}
          CUTOVER_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == "branch" && "$REF" == "refs/heads/$DEFAULT_BRANCH" ]] || {
            echo "::error::Cutover is restricted to the default branch."
            exit 1
          }
          [[ "$PAGES_OWNER" == "governance" ]] || {
            echo "::error::The operator must set PAGES_OWNER=governance immediately before dispatch."
            exit 1
          }
          [[ "$GOVERNANCE_PIPELINE_MODE" == "shadow" ]] || {
            echo "::error::GOVERNANCE_PIPELINE_MODE must remain shadow until live activation."
            exit 1
          }
          for value in "$ENABLE_PAGES" "$ENABLE_GOVERNANCE_PAGES" "$ENABLE_GOVERNANCE_SHADOW" \
            "$ENABLE_TELEGRAM_DELIVERY" "$ENABLE_GOVERNANCE_DELIVERY"; do
            [[ "${value,,}" != "true" ]] || {
              echo "::error::Legacy rollout booleans and all outbound delivery flags must not be true."
              exit 1
            }
          done
          [[ ${#CUTOVER_REASON} -ge 8 ]] || {
            echo "::error::Cutover reason must contain at least eight characters."
            exit 1
          }
          [[ ${#BSIDE_RELEASE_AUTHORIZER_TOKEN} -ge 32 ]] || {
            echo "::error::The protected release-authorizer token is missing or too short."
            exit 1
          }

      - name: Cancel stale Pages producer runs before protected deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Set(["queued", "in_progress", "pending", "waiting"]);
            for (const workflow_id of ["build-feed.yml", "daily.yml"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, per_page: 100,
              });
              for (const run of runs) {
                if (run.id === context.runId || !active.has(run.status)) continue;
                await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              }
            }

      - name: Resolve same-SHA Production Alpha evidence artifact
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ inputs.evidence_artifact_name }}
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA.toLowerCase();
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            async function resolve(runText, artifactName, workflowFile, label) {
              if (!/^[0-9]+$/.test(runText || "")) {
                throw new Error(`${label} run id must contain digits only`);
              }
              if (!artifactName) throw new Error(`${label} artifact name is required`);
              const runId = Number(runText);
              if (runId === currentRunId) throw new Error(`${label} source cannot be the current run`);
              const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId});
              if (run.data.conclusion !== "success") throw new Error(`${label} source run was not successful`);
              if ((run.data.head_sha || "").toLowerCase() !== expectedSha) {
                throw new Error(`${label} source run SHA does not match the cutover SHA`);
              }
              if (run.data.head_branch !== defaultBranch) {
                throw new Error(`${label} source run is not from the default branch`);
              }
              if ((run.data.path || "") !== `.github/workflows/${workflowFile}`) {
                throw new Error(`${label} source run used an unexpected workflow`);
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: runId, per_page: 100,
              });
              const matches = artifacts.filter((item) => item.name === artifactName && !item.expired);
              if (matches.length !== 1) {
                throw new Error(`${label} requires exactly one unexpired named artifact`);
              }
              const artifact = matches[0];
              if (!/^sha256:[0-9a-f]{64}$/i.test(artifact.digest || "")) {
                throw new Error(`${label} artifact has no immutable SHA-256 digest`);
              }
              return {run, artifact};
            }
            try {
              if (process.env.EVIDENCE_ARTIFACT_NAME !== "global-alpha-release-evidence") {
                throw new Error(
                  "Production Alpha evidence artifact name must be global-alpha-release-evidence",
                );
              }
              const evidence = await resolve(
                process.env.EVIDENCE_RUN_ID,
                process.env.EVIDENCE_ARTIFACT_NAME,
                "global-alpha-release-evidence.yml",
                "Production Alpha evidence",
              );
              const ageHours = (Date.now() - Date.parse(evidence.run.data.created_at)) / 3600000;
              if (ageHours < -0.1 || ageHours > 48) {
                throw new Error(`Production Alpha evidence run age ${ageHours.toFixed(1)}h is outside the 0-48h window`);
              }
              core.setOutput("evidence_artifact_id", String(evidence.artifact.id));
              core.setOutput(
                "evidence_artifact_digest",
                (evidence.artifact.digest || "").toLowerCase(),
              );
              core.setOutput("evidence_run_id", String(evidence.run.data.id));
              core.setOutput("evidence_created_at", evidence.run.data.created_at);
            } catch (error) {
              core.setFailed(error instanceof Error ? error.message : String(error));
            }

      - name: Resolve rolling legacy recovery source
        id: legacy_recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const resolve = require("./.github/scripts/resolve-legacy-recovery.cjs");
            await resolve({github, context, core});

      - name: Download protected production evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve.outputs.evidence_artifact_id }}
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.evidence_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Resolve evidence-bound daily Pages artifact
        id: pages_binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            const stable = (value) => {
              if (Array.isArray(value)) return `[${value.map(stable).join(",")}]`;
              if (value && typeof value === "object") {
                return `{${Object.keys(value).sort().map(
                  (key) => `${JSON.stringify(key)}:${stable(value[key])}`,
                ).join(",")}}`;
              }
              return JSON.stringify(value);
            };
            const binding = JSON.parse(
              fs.readFileSync("evidence/pages-artifact-identity.json", "utf8"),
            );
            const report = JSON.parse(
              fs.readFileSync("evidence/production-alpha-release-report.json", "utf8"),
            );
            const provenance = JSON.parse(
              fs.readFileSync("evidence/artifact-provenance.json", "utf8"),
            );
            if (
              binding.schema_version !== 1 ||
              binding.kind !== "bside-global-alpha-pages-artifact-binding" ||
              binding.code_revision !== process.env.EXPECTED_SHA.toLowerCase() ||
              binding.producer_workflow !== ".github/workflows/daily.yml" ||
              !Number.isInteger(binding.producer_run_id) ||
              binding.producer_run_id < 1 ||
              !Number.isInteger(binding.producer_run_attempt) ||
              binding.producer_run_attempt < 1 ||
              !Number.isInteger(binding.artifact_id) ||
              binding.artifact_id < 1 ||
              !/^sha256:[0-9a-f]{64}$/.test(binding.artifact_digest || "") ||
              binding.artifact_name !==
                `pages-${binding.producer_run_id}-${binding.producer_run_attempt}`
            ) {
              core.setFailed("Production Alpha evidence has an invalid daily Pages binding");
              return;
            }
            if (
              stable(report.pages_artifact) !== stable(binding) ||
              stable(provenance.pages_artifact) !== stable(binding)
            ) {
              core.setFailed("Release report and provenance do not agree on the exact daily Pages artifact");
              return;
            }
            const runResponse = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: binding.producer_run_id,
            });
            const run = runResponse.data;
            if (
              run.conclusion !== "success" ||
              (run.head_sha || "").toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase() ||
              run.head_branch !== process.env.DEFAULT_BRANCH ||
              run.path !== binding.producer_workflow ||
              run.run_attempt !== binding.producer_run_attempt
            ) {
              core.setFailed("Evidence-bound daily Pages run no longer matches its immutable provenance");
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: run.id, per_page: 100},
            );
            const matches = artifacts.filter(
              (item) =>
                item.id === binding.artifact_id &&
                item.name === binding.artifact_name &&
                !item.expired,
            );
            if (
              matches.length !== 1 ||
              (matches[0].digest || "").toLowerCase() !== binding.artifact_digest
            ) {
              core.setFailed("Only the exact evidence-bound daily Pages artifact may be cut over");
              return;
            }
            core.setOutput("pages_artifact_id", String(binding.artifact_id));
            core.setOutput("pages_run_id", String(binding.producer_run_id));
            core.setOutput("pages_artifact_name", binding.artifact_name);
            core.setOutput("pages_artifact_digest", binding.artifact_digest);

      - name: Download immutable governance Pages source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.pages_binding.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ steps.pages_binding.outputs.pages_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Download rolling legacy recovery bundle
        if: steps.legacy_recovery.outputs.mode == 'carry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.legacy_recovery.outputs.artifact_id }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          github-token: ${{ github.token }}
          run-id: ${{ steps.legacy_recovery.outputs.run_id }}
          digest-mismatch: error

      - name: Download immutable legacy seed archive
        if: steps.legacy_recovery.outputs.mode == 'seed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
        run: |
          set -euo pipefail
          [[ "$LEGACY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl --fail-with-body --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID/zip" \
            --output "$LEGACY_ARCHIVE_PATH"

      - name: Validate immutable governance Pages contents
        shell: bash
        run: |
          set -euo pipefail
          test -s candidate-pages/index.html
          test -s candidate-pages/governance/index.html
          test -s candidate-pages/feed.xml
          test -s candidate-pages/legacy-feed-compatibility.json
          cmp --silent candidate-pages/index.html candidate-pages/governance/index.html || {
            echo "::error::Legacy compatibility assets overwrote the governance root."
            exit 1
          }
          if find candidate-pages -type l -print -quit | grep -q .; then
            echo "::error::Pages source contains a symbolic link."
            exit 1
          fi
          if find candidate-pages -type f \( -iname '*telegram*' -o -iname '*admin*' -o -iname '*story-review*' \) -print -quit | grep -q .; then
            echo "::error::Pages source contains a forbidden internal asset."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify immutable governance UI release config
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.governance_site_config \
            --site candidate-pages \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"
          python -m curator.legacy_internal_safety verify-site \
            --site candidate-pages \
            --minimum-dated-reports 90

      - name: Verify evidence-bound full-site and terminal content identity
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.global_alpha_pages_identity verify \
            --site candidate-pages \
            --binding evidence/pages-artifact-identity.json \
            --expected-revision "$GITHUB_SHA"

      - name: Prepare or verify rolling legacy recovery bundle
        id: recovery_bundle
        shell: bash
        env:
          LEGACY_SOURCE_MODE: ${{ steps.legacy_recovery.outputs.mode }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
          LEGACY_RECOVERY_ROOT: ${{ runner.temp }}/legacy-recovery-bundle
          LEGACY_RUN_ID: ${{ steps.legacy_recovery.outputs.pin_run_id }}
          LEGACY_SEED_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ steps.legacy_recovery.outputs.pin_artifact_name }}
          LEGACY_CODE_REVISION: ${{ steps.legacy_recovery.outputs.pin_code_revision }}
          LEGACY_ARTIFACT_DIGEST: ${{ steps.legacy_recovery.outputs.pin_artifact_digest }}
        run: |
          set -euo pipefail
          if [[ "$LEGACY_SOURCE_MODE" == "seed" ]]; then
            source_artifact_id="$LEGACY_SEED_ARTIFACT_ID"
            python -m curator.legacy_recovery_bundle prepare \
              --archive "$LEGACY_ARCHIVE_PATH" \
              --output "$LEGACY_RECOVERY_ROOT" \
              --source-run-id "$LEGACY_RUN_ID" \
              --source-artifact-id "$source_artifact_id" \
              --source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --source-code-revision "$LEGACY_CODE_REVISION" \
              --source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          else
            source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$LEGACY_RECOVERY_ROOT/legacy-recovery-bundle.json")"
            python -m curator.legacy_recovery_bundle verify \
              --bundle "$LEGACY_RECOVERY_ROOT" \
              --expected-source-run-id "$LEGACY_RUN_ID" \
              --expected-source-artifact-id "$source_artifact_id" \
              --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --expected-source-code-revision "$LEGACY_CODE_REVISION" \
              --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          fi
          echo "source_artifact_id=$source_artifact_id" >> "$GITHUB_OUTPUT"

      - name: Validate pinned 90-day legacy feed compatibility window
        shell: bash
        env:
          LEGACY_RUN_ID: ${{ steps.legacy_recovery.outputs.pin_run_id }}
          LEGACY_ARTIFACT_ID: ${{ steps.recovery_bundle.outputs.source_artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ steps.legacy_recovery.outputs.pin_artifact_name }}
          LEGACY_CODE_REVISION: ${{ steps.legacy_recovery.outputs.pin_code_revision }}
          LEGACY_ARTIFACT_DIGEST: ${{ steps.legacy_recovery.outputs.pin_artifact_digest }}
        run: |
          set -euo pipefail
          python -m curator.legacy_feed_compat verify \
            --site candidate-pages \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$LEGACY_ARTIFACT_ID" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Evaluate immutable Production Alpha evidence
        shell: bash
        env:
          EVIDENCE_RUN_CREATED_AT: ${{ steps.resolve.outputs.evidence_created_at }}
        run: |
          set -euo pipefail
          test "$(jq -r '.kind' evidence/production-alpha-release-report.json)" = \
            "bside-global-production-alpha-release-report"
          test "$(jq -r '.release_tier' evidence/production-alpha-release-report.json)" = \
            "production-alpha"
          test "$(jq -r '.ga_certification_claimed' evidence/production-alpha-release-report.json)" = \
            "false"
          evidence_as_of="$(jq -er '.evidence_as_of' \
            evidence/production-alpha-release-report.json)"
          observation_ended_at="$(jq -er '.observation.ended_at' \
            evidence/production-alpha-release-report.json)"
          now_epoch="$(date -u +%s)"
          for evidence_time in \
            "$EVIDENCE_RUN_CREATED_AT" "$evidence_as_of" "$observation_ended_at"; do
            evidence_epoch="$(date -u -d "$evidence_time" +%s)" || {
              echo "::error::Production Alpha evidence has an invalid timestamp."
              exit 1
            }
            evidence_age="$((now_epoch - evidence_epoch))"
            [[ "$evidence_age" -ge -60 && "$evidence_age" -le 3600 ]] || {
              echo "::error::Production Alpha evidence creation/cutoff is outside the 0-60 minute cutover window."
              exit 1
            }
          done
          python -m curator.global_alpha_release_gate evaluate \
            --observations evidence/observations.jsonl \
            --pages-artifact-identity evidence/pages-artifact-identity.json \
            --connector-idempotency evidence/connector-idempotency.json \
            --human-review evidence/human-review.json \
            --content-integrity evidence/content-integrity.json \
            --experience evidence/experience.json \
            --approval evidence/approval.json \
            --expected-revision "$GITHUB_SHA" \
            --evidence-as-of "$evidence_as_of" \
            --output release-report/production-alpha-release-report.json
          cmp --silent \
            evidence/production-alpha-release-report.json \
            release-report/production-alpha-release-report.json || {
            echo "::error::Production Alpha report did not reproduce byte-for-byte."
            exit 1
          }

      - name: Preserve protected cutover validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-cutover-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-report
          if-no-files-found: error
          retention-days: 90

      - name: Preserve verified legacy recovery for cutover and rollback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.legacy_recovery.outputs.carry_artifact_name }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          if-no-files-found: error
          retention-days: 90

  preflight:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      contents: read
    outputs:
      v1_state_version: ${{ steps.release_states.outputs.v1_state_version }}
      v2_state_version: ${{ steps.release_states.outputs.v2_state_version }}
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python for exact deployment smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require protected production configuration
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          for name in BSIDE_ADMIN_TOKEN GOVERNANCE_PREVIEW_TOKEN GOVERNANCE_API_BASE_URL BSIDE_PUBLIC_WEB_URL; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::$name is required for the protected release."
              exit 1
            }
          done
          [[ "${GOVERNANCE_API_BASE_URL%/}" == */api/v1 ]] || {
            echo "::error::GOVERNANCE_API_BASE_URL must end in /api/v1 so the independent v2 boundary is unambiguous."
            exit 1
          }

      - name: Require v1 and v2 preview states before Pages deployment
        id: release_states
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V1_SCHEMA_VERSION: "10"
          EXPECTED_V2_SCHEMA_VERSION: "12"
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"

          python .github/scripts/smoke-global-v2.py \
            --base-url "$v2_api" \
            --expected-sha "$GITHUB_SHA" \
            --release-state preview \
            --preview-token-env GOVERNANCE_PREVIEW_TOKEN \
            --privileged-token-env BSIDE_ADMIN_TOKEN

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > preflight-v1-state.json
          [[ "$(jq -r '.release_state' preflight-v1-state.json)" == "preview" ]] || {
            echo "::error::v1 governance must already be in preview."
            exit 1
          }
          [[ "$(jq -r '.schema_version' preflight-v1-state.json)" == "$EXPECTED_V1_SCHEMA_VERSION" ]] || {
            echo "::error::v1 governance schema must be exactly $EXPECTED_V1_SCHEMA_VERSION."
            exit 1
          }
          [[ "$(jq -r '.preview_auth_configured' preflight-v1-state.json)" == "true" ]] || {
            echo "::error::v1 preview authentication is not configured."
            exit 1
          }

          curl --fail-with-body --silent --show-error --dump-header preflight-v2-headers.txt \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > preflight-v2-state.json
          grep -Eiq '^X-BSIDE-API-Version:[[:space:]]*v2' preflight-v2-headers.txt || {
            echo "::error::The v2 release-state response did not identify the v2 API."
            exit 1
          }
          [[ "$(jq -r '.data.release_state' preflight-v2-state.json)" == "preview" ]] || {
            echo "::error::v2 global terminal must already be in preview."
            exit 1
          }
          [[ "$(jq -r '.data.preview_auth_configured' preflight-v2-state.json)" == "true" ]] || {
            echo "::error::v2 preview authentication is not configured."
            exit 1
          }
          # The protected v2 endpoint executes v2_require_schema_version before routing.
          # A 200 response from the schema-12 build therefore proves an exact manifest match.
          [[ "$EXPECTED_V2_SCHEMA_VERSION" == "12" ]]

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
            "$v2_api/sources/status" > preflight-v2-sources.json
          jq -e '
            def required: [
              "connector:kr:dart", "connector:us:sec-edgar",
              "connector:ca:issuer-ir", "connector:au:asic-register"
            ];
            def optional: [
              "connector:jp:edinet", "connector:gb:companies-house"
            ];
            .ok == true
            and .data.all_required_ready == true
            and ((.data.required_source_ready | keys | sort) == (required | sort))
            and all(.data.required_source_ready[]; . == true)
            and (([.data.items[].connector_id] | sort) == ((required + optional) | sort))
            and all(.data.items[] as $item;
              if (required | index($item.connector_id)) != null then
                $item.public_ready == true
                and $item.public_status == "active"
                and ($item.freshness_limit_minutes <= 45)
              else
                (optional | index($item.connector_id)) != null
                and $item.coverage_mode == "link-only"
                and $item.public_status == "coverage_unavailable"
                and $item.public_ready == false
                and $item.raw_count == 0
                and $item.acknowledged_count == 0
              end)
          ' preflight-v2-sources.json > /dev/null || {
            echo "::error::Required Alpha sources must be ready and optional JP/GB coverage must stay unavailable."
            exit 1
          }

          v1_version="$(jq -r '.state_version' preflight-v1-state.json)"
          v2_version="$(jq -r '.data.state_version' preflight-v2-state.json)"
          [[ "$v1_version" =~ ^[0-9]+$ && "$v2_version" =~ ^[0-9]+$ ]] || {
            echo "::error::Both release states require numeric optimistic versions."
            exit 1
          }
          echo "v1_state_version=$v1_version" >> "$GITHUB_OUTPUT"
          echo "v2_state_version=$v2_version" >> "$GITHUB_OUTPUT"

  deploy_pages:
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout observation producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validated immutable governance Pages source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.pages_artifact_id }}
          path: candidate-pages
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.pages_run_id }}
          digest-mismatch: error

      - name: Verify predeclared governance Pages ownership
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]]

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Revalidate exact preview versions inside Pages deployment lock
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BSIDE_ADMIN_TOKEN" ]]
          [[ "${GOVERNANCE_API_BASE_URL%/}" == "https://alignpe.gabia.io/activist/api.php/api/v1" ]]
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > pages-lock-v1-preview.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > pages-lock-v2-preview.json
          [[ "$(jq -r '.release_state' pages-lock-v1-preview.json)" == "preview" ]]
          [[ "$(jq -r '.state_version' pages-lock-v1-preview.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.release_state' pages-lock-v2-preview.json)" == "preview" ]]
          [[ "$(jq -r '.data.state_version' pages-lock-v2-preview.json)" == "$EXPECTED_V2_VERSION" ]]

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: candidate-pages

      - name: Capture governance Pages distribution start
        id: pages_distribution_start
        shell: bash
        run: echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy validated governance artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Record governance Pages distribution outcome
        if: >-
          ${{ always() && !cancelled() &&
              steps.pages_distribution_start.outcome == 'success' &&
              (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure') }}
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DISTRIBUTION_OBSERVED_AT: ${{ steps.pages_distribution_start.outputs.observed_at }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          succeeded=false
          if [[ "$DEPLOYMENT_OUTCOME" == "success" ]]; then
            succeeded=true
          fi
          python .github/scripts/record-web-distribution.py \
            --target pages \
            --operation cutover-governance \
            --succeeded "$succeeded" \
            --observed-at "$DISTRIBUTION_OBSERVED_AT"

  activate:
    needs: [validate, preflight, deploy_pages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: governance-release
    permissions:
      contents: read
    steps:
      - name: Checkout deployed-config verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up deployed-config verifier Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Revalidate both protected preview versions
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > activation-v1-preview.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > activation-v2-preview.json
          [[ "$(jq -r '.release_state' activation-v1-preview.json)" == "preview" ]]
          [[ "$(jq -r '.schema_version' activation-v1-preview.json)" == "10" ]]
          [[ "$(jq -r '.state_version' activation-v1-preview.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.release_state' activation-v2-preview.json)" == "preview" ]]
          [[ "$(jq -r '.data.state_version' activation-v2-preview.json)" == "$EXPECTED_V2_VERSION" ]]

      - name: Smoke deployed root and both preview API boundaries
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          for path in / /governance/ /feed.xml; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "$web$path"
          done
          mkdir -p deployed-config/governance
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            --output deployed-config/config.js "$web/config.js"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
            --output deployed-config/governance/config.js "$web/governance/config.js"
          python -m curator.governance_site_config \
            --site deployed-config \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"
          python .github/scripts/smoke-global-v2.py \
            --base-url "$v2_api" \
            --expected-sha "$GITHUB_SHA" \
            --release-state preview \
            --preview-token-env GOVERNANCE_PREVIEW_TOKEN \
            --privileged-token-env BSIDE_ADMIN_TOKEN
          curl --fail --silent --show-error --output /dev/null "$v1_api/health"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
            --output /dev/null "$v1_api/events?limit=1"
          for path in \
            '/briefs/latest?edition=global' \
            '/live?limit=1' \
            '/events?limit=1' \
            '/sources/status' \
            '/exports/events.json?limit=1' \
            '/exports/events.csv?limit=1' \
            '/feeds/events.atom?limit=1'; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GOVERNANCE_PREVIEW_TOKEN" \
              --output /dev/null "$v2_api$path"
          done

      - name: Authorize and atomically activate both API versions
        id: atomic_release_live
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          BSIDE_RELEASE_AUTHORIZER_TOKEN: ${{ secrets.BSIDE_RELEASE_AUTHORIZER_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          EVIDENCE_ARTIFACT_DIGEST: ${{ needs.validate.outputs.evidence_artifact_digest }}
          EVIDENCE_RUN_ID: ${{ needs.validate.outputs.evidence_run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ needs.validate.outputs.evidence_artifact_id }}
          EXPECTED_V1_VERSION: ${{ needs.preflight.outputs.v1_state_version }}
          EXPECTED_V2_VERSION: ${{ needs.preflight.outputs.v2_state_version }}
          CUTOVER_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          [[ -n "$BSIDE_RELEASE_AUTHORIZER_TOKEN" ]] || {
            echo "::error::BSIDE_RELEASE_AUTHORIZER_TOKEN is required in the protected governance-release environment."
            exit 1
          }
          [[ "$BSIDE_RELEASE_AUTHORIZER_TOKEN" != "$BSIDE_ADMIN_TOKEN" ]] || {
            echo "::error::Protected release roles must use distinct credentials."
            exit 1
          }
          [[ "$EVIDENCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVIDENCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_V1_VERSION" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_V2_VERSION" =~ ^[0-9]+$ ]]
          release_nonce="$(openssl rand -hex 32)"
          [[ "$release_nonce" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$release_nonce"
          expires_at="$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          authorization_payload="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --arg nonce "$release_nonce" \
            --arg expires "$expires_at" \
            --arg reason "$CUTOVER_REASON" \
            --argjson evidence_run_id "$EVIDENCE_RUN_ID" \
            --argjson evidence_artifact_id "$EVIDENCE_ARTIFACT_ID" \
            --argjson v1_version "$EXPECTED_V1_VERSION" \
            --argjson v2_version "$EXPECTED_V2_VERSION" \
            '{candidate_sha:$sha,evidence_artifact_digest:$digest,
              evidence_run_id:$evidence_run_id,evidence_artifact_id:$evidence_artifact_id,
              release_nonce:$nonce,expected_v1_state_version:$v1_version,
              expected_v2_state_version:$v2_version,expires_at:$expires,reason:$reason}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $BSIDE_RELEASE_AUTHORIZER_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Request-ID: authorize-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$authorization_payload" \
            "$v2_api/admin/release-authorizations" > activation-authorization.json
          [[ "$(jq -r '.ok' activation-authorization.json)" == "true" ]]
          [[ "$(jq -r '.data.candidate_sha' activation-authorization.json)" == "$GITHUB_SHA" ]]
          [[ "$(jq -r '.data.evidence_artifact_digest' activation-authorization.json)" == "$EVIDENCE_ARTIFACT_DIGEST" ]]
          [[ "$(jq -r '.data.expected_v1_state_version' activation-authorization.json)" == "$EXPECTED_V1_VERSION" ]]
          [[ "$(jq -r '.data.expected_v2_state_version' activation-authorization.json)" == "$EXPECTED_V2_VERSION" ]]
          cutover_payload="$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg digest "$EVIDENCE_ARTIFACT_DIGEST" \
            --arg nonce "$release_nonce" \
            --arg reason "$CUTOVER_REASON" \
            --argjson v1_version "$EXPECTED_V1_VERSION" \
            --argjson v2_version "$EXPECTED_V2_VERSION" \
            '{candidate_sha:$sha,evidence_artifact_digest:$digest,release_nonce:$nonce,
              expected_v1_state_version:$v1_version,
              expected_v2_state_version:$v2_version,reason:$reason}')"
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Request-ID: atomic-cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data "$cutover_payload" "$v2_api/admin/cutover" > activation-live.json
          [[ "$(jq -r '.ok' activation-live.json)" == "true" ]]
          [[ "$(jq -r '.data.states.governance_v1.release_state' activation-live.json)" == "live" ]]
          [[ "$(jq -r '.data.states.global_terminal_v2.release_state' activation-live.json)" == "live" ]]
          [[ "$(jq -r '.data.states.governance_v1.state_version' activation-live.json)" == "$((EXPECTED_V1_VERSION + 1))" ]]
          [[ "$(jq -r '.data.states.global_terminal_v2.state_version' activation-live.json)" == "$((EXPECTED_V2_VERSION + 1))" ]]
          [[ "$(jq -r '.data.evidence_artifact_digest' activation-live.json)" == "$EVIDENCE_ARTIFACT_DIGEST" ]]
          unset release_nonce authorization_payload cutover_payload

      - name: Smoke public Production Alpha without preview credentials
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          python .github/scripts/smoke-global-v2.py \
            --base-url "$v2_api" \
            --expected-sha "$GITHUB_SHA" \
            --release-state live \
            --privileged-token-env BSIDE_ADMIN_TOKEN
          for path in / /governance/ /feed.xml; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              --output /dev/null "$web$path"
          done
          curl --fail-with-body --silent --show-error \
            --output /dev/null "$v1_api/events?limit=1"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            "$v2_api/sources/status" > public-v2-sources.json
          jq -e '
            def required: [
              "connector:kr:dart", "connector:us:sec-edgar",
              "connector:ca:issuer-ir", "connector:au:asic-register"
            ];
            def optional: [
              "connector:jp:edinet", "connector:gb:companies-house"
            ];
            .ok == true
            and .data.all_required_ready == true
            and ((.data.required_source_ready | keys | sort) == (required | sort))
            and all(.data.required_source_ready[]; . == true)
            and (([.data.items[].connector_id] | sort) == ((required + optional) | sort))
            and all(.data.items[] as $item;
              if (required | index($item.connector_id)) != null then
                $item.public_ready == true
                and $item.public_status == "active"
                and ($item.freshness_limit_minutes <= 45)
              else
                (optional | index($item.connector_id)) != null
                and $item.coverage_mode == "link-only"
                and $item.public_status == "coverage_unavailable"
                and $item.public_ready == false
                and $item.raw_count == 0
                and $item.acknowledged_count == 0
              end)
          ' public-v2-sources.json > /dev/null || {
            echo "::error::Post-cutover source readiness verification failed."
            exit 1
          }
          for path in \
            '/briefs/latest?edition=global' \
            '/live?limit=1' \
            '/events?limit=1' \
            '/exports/events.json?limit=1' \
            '/exports/events.csv?limit=1' \
            '/feeds/events.atom?limit=1'; do
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --output /dev/null "$v2_api$path"
          done

      - name: Record verified governance ownership
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE_SNAPSHOT: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]]
          [[ "$GOVERNANCE_PIPELINE_MODE_SNAPSHOT" == "shadow" ]]
          {
            echo "### Governance Production Alpha cutover complete"
            echo "- v2 global terminal release state: \`live\`"
            echo "- v1 compatibility release state: \`live\`"
            echo "- Pages owner: \`governance\`"
            echo "- v1 and v2 were activated in one atomic DB transaction using a protected, one-time release authorization"
            echo "- repository variables are not changed by this workflow"
            echo "- until the commands below succeed, legacy and governance scheduled deployers both remain fail-closed"
            echo "- Telegram and governance outbound delivery remained disabled"
            echo ""
            echo "Run from the approved operator workstation using its currently authenticated local gh session:"
            echo '```bash'
            echo 'gh auth status'
            echo 'gh variable set GOVERNANCE_PIPELINE_MODE --body live --repo sung1673/activist-rss-curator'
            echo 'test "$(gh variable get GOVERNANCE_PIPELINE_MODE --repo sung1673/activist-rss-curator)" = "live"'
            echo 'test "$(gh variable get PAGES_OWNER --repo sung1673/activist-rss-curator)" = "governance"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close v2 then v1 if any activation step fails
        if: failure()
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > activation-failed-v2-before.json
          v2_state="$(jq -r '.data.release_state' activation-failed-v2-before.json)"
          v2_version="$(jq -r '.data.state_version' activation-failed-v2-before.json)"
          if [[ "$v2_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v2_version" \
              '{release_state:"closed",expected_version:$version,reason:"Cutover activation failed; close v2 before v1 compatibility"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: cutover-failed-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v2_api/admin/release-state" > activation-failed-v2-closed.json
            [[ "$(jq -r '.data.release_state' activation-failed-v2-closed.json)" == "closed" ]]
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > activation-failed-v1-before.json
          v1_state="$(jq -r '.release_state' activation-failed-v1-before.json)"
          v1_version="$(jq -r '.state_version' activation-failed-v1-before.json)"
          if [[ "$v1_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v1_version" \
              '{release_state:"closed",expected_version:$version,reason:"Cutover activation failed; automatic legacy recovery started"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: cutover-failed-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v1_api/admin/release-state" > activation-failed-v1-closed.json
            [[ "$(jq -r '.release_state' activation-failed-v1-closed.json)" == "closed" ]]
          fi

  recover_close:
    needs: [validate, preflight, deploy_pages, activate]
    if: >-
      ${{ always() && needs.validate.result == 'success' && needs.preflight.result == 'success' &&
          (needs.deploy_pages.result != 'success' || needs.activate.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel stale Pages producer runs before automatic recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Set(["queued", "in_progress", "pending", "waiting"]);
            for (const workflow_id of ["build-feed.yml", "daily.yml"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, per_page: 100,
              });
              for (const run of runs) {
                if (active.has(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                }
              }
            }

      - name: Close v2 then v1 before automatic legacy recovery
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > recovery-v2-before.json
          v2_state="$(jq -r '.data.release_state' recovery-v2-before.json)"
          v2_version="$(jq -r '.data.state_version' recovery-v2-before.json)"
          if [[ "$v2_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v2_version" \
              '{release_state:"closed",expected_version:$version,reason:"Protected cutover failed; close v2 before v1"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: recovery-close-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v2_api/admin/release-state" > recovery-v2-closed.json
            [[ "$(jq -r '.data.release_state' recovery-v2-closed.json)" == "closed" ]]
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > recovery-v1-before.json
          v1_state="$(jq -r '.release_state' recovery-v1-before.json)"
          v1_version="$(jq -r '.state_version' recovery-v1-before.json)"
          if [[ "$v1_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v1_version" \
              '{release_state:"closed",expected_version:$version,reason:"Protected cutover failed; restoring pinned legacy artifact"}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: recovery-close-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v1_api/admin/release-state" > recovery-v1-closed.json
            [[ "$(jq -r '.release_state' recovery-v1-closed.json)" == "closed" ]]
          fi
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "closed"'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" | jq -e '.release_state == "closed"'

  recover_pages:
    needs: [validate, recover_close]
    if: >-
      ${{ always() && needs.validate.result == 'success' &&
          needs.recover_close.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout recovery verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up recovery Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download same-run verified legacy recovery bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.legacy_carry_artifact_name }}
          path: legacy-recovery-bundle
          digest-mismatch: error

      - name: Validate pinned legacy recovery contents
        env:
          LEGACY_RUN_ID: ${{ needs.validate.outputs.legacy_pin_run_id }}
          LEGACY_ARTIFACT_NAME: ${{ needs.validate.outputs.legacy_pin_artifact_name }}
          LEGACY_CODE_REVISION: ${{ needs.validate.outputs.legacy_pin_code_revision }}
          LEGACY_ARTIFACT_DIGEST: ${{ needs.validate.outputs.legacy_pin_artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
            legacy-recovery-bundle/legacy-recovery-bundle.json)"
          python -m curator.legacy_recovery_bundle verify \
            --bundle legacy-recovery-bundle \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$source_artifact_id" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Configure Pages for automatic legacy recovery
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pinned legacy recovery artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: legacy-recovery-bundle/full-site

      - name: Restore pinned legacy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

  recover_owner:
    needs: [validate, preflight, deploy_pages, activate, recover_pages]
    if: >-
      ${{ always() && needs.validate.result == 'success' && needs.preflight.result == 'success' &&
          (needs.deploy_pages.result != 'success' || needs.activate.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    permissions:
      contents: read
    steps:
      - name: Verify fail-closed recovery and report operator declaration change
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ needs.recover_pages.result }}" == "success" ]] || {
            echo "::error::Pinned legacy artifact was not restored; ownership will remain fail-closed."
            exit 1
          }
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "closed"'
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" | jq -e '.release_state == "closed"'
          {
            echo "### Automatic cutover recovery complete"
            echo "- the pinned legacy artifact was restored"
            echo "- v2 global terminal and v1 compatibility APIs were verified closed"
            echo "- recovery was a fail-closed compensating sequence, not an atomic DB transition"
            echo "- repository variables were not changed by this workflow"
            echo "- until the commands below succeed, legacy and governance scheduled deployers both remain fail-closed"
            echo ""
            echo "Run from the approved operator workstation using its currently authenticated local gh session:"
            echo '```bash'
            echo 'gh auth status'
            echo 'gh variable set GOVERNANCE_PIPELINE_MODE --body shadow --repo sung1673/activist-rss-curator'
            echo 'gh variable set PAGES_OWNER --body legacy --repo sung1673/activist-rss-curator'
            echo 'test "$(gh variable get GOVERNANCE_PIPELINE_MODE --repo sung1673/activist-rss-curator)" = "shadow"'
            echo 'test "$(gh variable get PAGES_OWNER --repo sung1673/activist-rss-curator)" = "legacy"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
