name: Production Alpha API deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-alpha-api-deployment-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deployment-smoke:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    env:
      GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
      ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
      ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}

    steps:
      - name: Checkout immutable deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Require a safe closed deployment boundary
        shell: bash
        env:
          REQUESTED_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" == "$DEFAULT_BRANCH" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "${GOVERNANCE_API_BASE_URL%/}" == */api/v1 ]]
          [[ "$ENABLE_TELEGRAM_DELIVERY" == "false" ]]
          [[ "$ENABLE_GOVERNANCE_DELIVERY" == "false" ]]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify exact closed API v2 deployment
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          python .github/scripts/smoke-global-v2.py \
            --base-url "${v1_api%/api/v1}/api/v2" \
            --expected-sha "$GITHUB_SHA" \
            --release-state closed
