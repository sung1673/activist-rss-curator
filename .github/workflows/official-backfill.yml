name: Official disclosure backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fetch-only validation or durable remote upsert
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      source:
        description: Official source selection
        required: true
        type: choice
        options:
          - dart
          - kind
          - both
        default: dart
      from_date:
        description: Inclusive start date (YYYY-MM-DD, no earlier than 2021-01-01)
        required: true
        type: string
      to_date:
        description: Exclusive end date (YYYY-MM-DD, no later than the current KST date)
        required: true
        type: string
      max_windows:
        description: Maximum pending one-day windows to process (1-31)
        required: true
        type: number
        default: 1
      sync_company_master:
        description: Refresh the DART company master once after a successful DART window
        required: true
        type: boolean
        default: false
      canary_lookback_days:
        description: Complete KST days eligible for the DART dry-run sample (2-365)
        required: true
        type: number
        default: 365
      canary_request_budget:
        description: Hard OpenDART request cap for the DART canary only (1-10000)
        required: true
        type: number
        default: 10000

permissions:
  contents: read
  actions: read

# Backfill, scheduled official ingest, protected release transitions, and the
# related protected metadata operations share one non-cancelling lock. This
# keeps a multi-request logical run entirely before or after a release change.
concurrency:
  group: governance-production-official-write-${{ github.repository }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      vars.DART_OFFICIAL_INGEST_ENABLED == 'true' &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: governance-runtime
    env:
      CHECKPOINT_PATH: data/backfill_official_checkpoint.json
      CHECKPOINT_ARTIFACT_NAME: official-backfill-checkpoint-${{ inputs.mode }}-${{ inputs.source }}-${{ inputs.from_date }}-${{ inputs.to_date }}-${{ inputs.sync_company_master }}
    steps:
      - name: Initialize backfill evidence
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          BACKFILL_LOG: ${{ runner.temp }}/official-backfill.stderr.log
          DART_CANARY_REPORT: ${{ runner.temp }}/dart-canary-sample-report.json
          DART_REVIEW_SAMPLE_JSONL: ${{ runner.temp }}/dart-review-sample.jsonl
          DART_REVIEW_SAMPLE_CSV: ${{ runner.temp }}/dart-review-sample.csv
          DART_REVIEW_SAMPLE_MANIFEST: ${{ runner.temp }}/dart-review-sample-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"not_started"}' > "$BACKFILL_REPORT"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_CANARY_REPORT"
          : > "$DART_REVIEW_SAMPLE_JSONL"
          : > "$DART_REVIEW_SAMPLE_CSV"
          printf '%s\n' '{"status":"not_applicable","release_eligible":false}' \
            > "$DART_REVIEW_SAMPLE_MANIFEST"
          : > "$BACKFILL_LOG"

      - name: Checkout immutable dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable dispatch revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out backfill revision $actual does not match dispatch revision $GITHUB_SHA."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        id: rollout
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode --github-output "$GITHUB_OUTPUT"

      - name: Validate bounded backfill inputs
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          MAX_WINDOWS: ${{ inputs.max_windows }}
          SOURCE: ${{ inputs.source }}
          SYNC_COMPANY_MASTER: ${{ inputs.sync_company_master }}
          CANARY_LOOKBACK_DAYS: ${{ inputs.canary_lookback_days }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          try:
              start = date.fromisoformat(os.environ["FROM_DATE"])
              end = date.fromisoformat(os.environ["TO_DATE"])
              max_windows = int(os.environ["MAX_WINDOWS"])
              canary_lookback_days = int(os.environ["CANARY_LOOKBACK_DAYS"])
              canary_request_budget = int(os.environ["CANARY_REQUEST_BUDGET"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"invalid backfill input: {exc}") from exc
          if start < date(2021, 1, 1):
              raise SystemExit("from_date must be 2021-01-01 or later")
          if end <= start:
              raise SystemExit("to_date must be later than from_date (exclusive boundary)")
          completed_kst_end_exclusive = datetime.now(ZoneInfo("Asia/Seoul")).date()
          if end > completed_kst_end_exclusive:
              raise SystemExit(
                  "to_date cannot be later than the current KST date as an "
                  "exclusive boundary; current or future KST dates must not be checkpointed"
              )
          if not 1 <= max_windows <= 31:
              raise SystemExit("max_windows must be between 1 and 31")
          if not 2 <= canary_lookback_days <= 365:
              raise SystemExit("canary_lookback_days must be between 2 and 365")
          if not 1 <= canary_request_budget <= 10_000:
              raise SystemExit("canary_request_budget must be between 1 and 10000")
          if os.environ["SYNC_COMPANY_MASTER"].lower() == "true" and os.environ["SOURCE"] == "kind":
              raise SystemExit("sync_company_master requires source=dart or source=both")
          PY

      - name: Validate operational configuration
        id: dart_credentials
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
        shell: bash
        run: |
          set -euo pipefail
          required=()
          if [[ "$SOURCE" == "dart" || "$SOURCE" == "both" ]]; then
            python .github/scripts/mask-opendart-credentials.py \
              --github-output "$GITHUB_OUTPUT"
            required+=(BSIDE_API_BASE_URL BSIDE_OPS_TOKEN BSIDE_BACKEND_BINDING_ID)
          fi
          if [[ "$SOURCE" == "kind" || "$SOURCE" == "both" ]]; then
            required+=(KIND_DISCLOSURE_ENDPOINT BSIDE_API_BASE_URL BSIDE_OPS_TOKEN BSIDE_BACKEND_BINDING_ID)
          fi
          if [[ "$MODE" == "apply" ]]; then
            required+=(ACTIVIST_API_URL ACTIVIST_API_SECRET BSIDE_OPS_TOKEN)
          fi
          bash .github/scripts/require-env.sh "${required[@]}"
          python .github/scripts/validate-api-base-urls.py --github-env "$GITHUB_ENV"

      - name: Verify DART SourceRight before any apply write
        if: inputs.mode == 'apply' && inputs.source != 'kind'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.official_source_rights \
            --preflight-dart \
            --expected-release-sha "$GITHUB_SHA" \
            --pipeline-mode "$GOVERNANCE_PIPELINE_MODE"

      - name: Verify KIND SourceRight before adapter network access
        if: inputs.source == 'kind' || inputs.source == 'both'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from curator.official_source_rights import OfficialSourceRightClient; OfficialSourceRightClient().check_kind_ingest()'

      - name: Validate KIND adapter contract
        if: inputs.source == 'kind' || inputs.source == 'both'
        env:
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          KIND_API_KEY: ${{ secrets.KIND_API_KEY }}
        run: python .github/scripts/validate-kind-adapter.py

      - name: Dry-run completed-day and revision DART canary
        if: inputs.mode == 'dry-run' && inputs.source != 'kind'
        id: dart_canary
        env:
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          DART_CANARY_REPORT: ${{ runner.temp }}/dart-canary-sample-report.json
          CANARY_LOOKBACK_DAYS: ${{ inputs.canary_lookback_days }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
          CURATOR_REQUIRE_DURABLE_DART_QUOTA: "1"
          CURATOR_DART_QUOTA_PHASE: dart-canary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANARY_LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || {
            echo "::error::canary_lookback_days must contain ASCII decimal digits."
            exit 1
          }
          [[ "$CANARY_REQUEST_BUDGET" =~ ^[0-9]+$ ]] || {
            echo "::error::canary_request_budget must contain ASCII decimal digits."
            exit 1
          }
          if (( CANARY_LOOKBACK_DAYS < 2 || CANARY_LOOKBACK_DAYS > 365 )); then
            echo "::error::canary_lookback_days must be between 2 and 365."
            exit 1
          fi
          if (( CANARY_REQUEST_BUDGET < 1 || CANARY_REQUEST_BUDGET > 10000 )); then
            echo "::error::canary_request_budget must be between 1 and 10000."
            exit 1
          fi
          python -m curator.dart_canary_sample \
            --lookback-days "$CANARY_LOOKBACK_DAYS" \
            --scan-chunk-days 7 \
            --sample-limit-per-kind 5 \
            --request-budget "$CANARY_REQUEST_BUDGET" \
            --report "$DART_CANARY_REPORT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["DART_CANARY_REPORT"]).read_text(encoding="utf-8"))
          if report.get("status") != "succeeded" or report.get("dry_run") is not True:
              raise SystemExit("DART canary did not produce successful dry-run evidence")
          requested_lookback = int(os.environ["CANARY_LOOKBACK_DAYS"])
          requested_budget = int(os.environ["CANARY_REQUEST_BUDGET"])
          history = report.get("history")
          if not isinstance(history, dict) or history.get("eligible_days") != requested_lookback:
              raise SystemExit("DART canary did not preserve the requested eligible-day range")
          if report.get("request_budget") != requested_budget:
              raise SystemExit("DART canary did not enforce the requested invocation budget")
          used = report.get("requests_used")
          if type(used) is not int or used < 0 or used > requested_budget:
              raise SystemExit("DART canary returned invalid request usage")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"requests_used={used}\n")
          PY

      - name: Resolve shared DART invocation budget
        id: dart_budget
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          CANARY_REQUESTS_USED: ${{ steps.dart_canary.outputs.requests_used }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          mode = os.environ["BACKFILL_MODE"]
          source = os.environ["BACKFILL_SOURCE"]
          raw_used = os.environ.get("CANARY_REQUESTS_USED", "")
          raw_canary_budget = os.environ["CANARY_REQUEST_BUDGET"]
          canary_required = mode == "dry-run" and source != "kind"

          if canary_required:
              if not raw_canary_budget.isascii() or not raw_canary_budget.isdecimal():
                  raise SystemExit("DART canary request budget is missing or invalid")
              canary_budget = int(raw_canary_budget)
              if not 1 <= canary_budget <= 10_000:
                  raise SystemExit("DART canary request budget is outside the safety cap")
              if not raw_used.isascii() or not raw_used.isdecimal():
                  raise SystemExit("DART canary request usage output is missing or invalid")
              used = int(raw_used)
              if used > canary_budget:
                  raise SystemExit("DART canary request usage exceeds its requested hard cap")
          else:
              if raw_used:
                  raise SystemExit("unexpected DART canary request usage output")
              used = 0

          if used < 0 or used > 10_000:
              raise SystemExit("DART canary request usage exceeds the invocation budget")
          remaining = max(0, 10_000 - used)
          if source != "kind" and remaining == 0:
              raise SystemExit(
                  "DART canary exhausted the shared 10,000-request invocation budget"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"canary_requests_used={used}\n")
              output.write(f"remaining_request_budget={remaining}\n")
          PY

      - name: Resolve previous matching checkpoint
        if: inputs.mode == 'apply'
        id: previous_checkpoint
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_ARTIFACT_NAME: ${{ env.CHECKPOINT_ARTIFACT_NAME }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "official-backfill.yml",
              branch: context.payload.repository.default_branch,
              status: "completed",
              per_page: 100,
            });
            for (const run of runs) {
              if (Number(run.id) === Number(context.runId)) continue;
              if (run.head_repository?.full_name !== `${owner}/${repo}`) continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const artifact = artifacts.find((item) =>
                item.name === process.env.EXPECTED_ARTIFACT_NAME && !item.expired
              );
              if (!artifact) continue;
              core.setOutput("found", "true");
              core.setOutput("run_id", String(run.id));
              core.setOutput("artifact_id", String(artifact.id));
              return;
            }
            core.setOutput("found", "false");

      - name: Download previous matching checkpoint
        if: inputs.mode == 'apply' && steps.previous_checkpoint.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.previous_checkpoint.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-official-backfill
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_checkpoint.outputs.run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Restore previous matching checkpoint
        if: inputs.mode == 'apply' && steps.previous_checkpoint.outputs.found == 'true'
        env:
          EXPECTED_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE: ${{ inputs.source }}
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          restore_root="${{ runner.temp }}/previous-official-backfill"
          resume_inventory="${{ runner.temp }}/official-backfill-resume-files.list"
          metadata_inventory="${{ runner.temp }}/official-backfill-metadata-files.list"
          find "$restore_root" -type f -name 'backfill_official_checkpoint.json' -print0 \
            > "$resume_inventory"
          mapfile -d '' -t restored_files < "$resume_inventory"
          if (( ${#restored_files[@]} > 1 )); then
            echo "::error::The matching checkpoint artifact contains multiple resume files."
            exit 1
          fi
          if (( ${#restored_files[@]} == 0 )); then
            find "$restore_root" -type f -name 'checkpoint-metadata.json' -print0 \
              > "$metadata_inventory"
            mapfile -d '' -t metadata_files < "$metadata_inventory"
            if (( ${#metadata_files[@]} != 1 )); then
              echo "::error::The non-resumable checkpoint artifact must contain exactly one metadata file."
              exit 1
            fi
            python .github/scripts/validate-backfill-checkpoint-metadata.py \
              --metadata "${metadata_files[0]}" \
              --mode "$EXPECTED_MODE" \
              --source "$EXPECTED_SOURCE" \
              --from-date "$EXPECTED_FROM_DATE" \
              --to-date "$EXPECTED_TO_DATE"
            echo "::notice::No prior resume file exists; starting the idempotent backfill from the requested boundary."
            exit 0
          fi
          mkdir -p "$(dirname "$CHECKPOINT_PATH")"
          cp "${restored_files[0]}" "$CHECKPOINT_PATH"

      - name: Run one-day official backfill windows
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BACKFILL_MAX_WINDOWS: ${{ inputs.max_windows }}
          BACKFILL_SYNC_COMPANY_MASTER: ${{ inputs.sync_company_master }}
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          BACKFILL_LOG: ${{ runner.temp }}/official-backfill.stderr.log
          CURATOR_INGEST_SCOPE: official
          CURATOR_DATA_SOURCE: mysql
          CURATOR_DISABLE_TELEGRAM_SEND: "1"
          CURATOR_DELIVERY_MODE: disabled
          ENABLE_TELEGRAM_DELIVERY: "false"
          ENABLE_GOVERNANCE_DELIVERY: "false"
          CURATOR_REQUIRE_REMOTE_API: ${{ inputs.mode == 'apply' && '1' || '0' }}
          CURATOR_ENABLE_KIND: ${{ inputs.source == 'dart' && '0' || '1' }}
          CURATOR_REQUIRE_KIND: ${{ inputs.source == 'dart' && '0' || '1' }}
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          KIND_API_KEY: ${{ secrets.KIND_API_KEY }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          CURATOR_REQUIRE_DURABLE_DART_QUOTA: "1"
          CURATOR_DART_QUOTA_PHASE: official-backfill
          DART_REQUEST_BUDGET: ${{ steps.dart_budget.outputs.remaining_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DART_REQUEST_BUDGET" =~ ^[0-9]+$ ]] || {
            echo "::error::The shared DART invocation budget is missing or invalid."
            exit 1
          }
          if (( DART_REQUEST_BUDGET < 1 || DART_REQUEST_BUDGET > 10000 )); then
            echo "::error::The remaining DART invocation budget must be between 1 and 10000."
            exit 1
          fi
          args=(
            --from-date "$BACKFILL_FROM_DATE"
            --to-date "$BACKFILL_TO_DATE"
            --source "$BACKFILL_SOURCE"
            --chunk-days 1
            --max-chunks "$BACKFILL_MAX_WINDOWS"
            --request-budget "$DART_REQUEST_BUDGET"
            --checkpoint "$CHECKPOINT_PATH"
          )
          if [[ "$BACKFILL_MODE" == "dry-run" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$BACKFILL_SYNC_COMPANY_MASTER" == "true" ]]; then
            args+=(--sync-company-master)
          fi

          temporary_report="${BACKFILL_REPORT}.tmp"
          if python -m curator.official_backfill "${args[@]}" > "$temporary_report" 2> >(tee "$BACKFILL_LOG" >&2); then
            mv "$temporary_report" "$BACKFILL_REPORT"
          else
            exit_code=$?
            printf '{"status":"failed","exit_code":%d}\n' "$exit_code" > "$BACKFILL_REPORT"
            exit "$exit_code"
          fi

      - name: Build deterministic 30-day DART review sample
        if: inputs.mode == 'apply' && inputs.source != 'kind'
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          BACKFILL_CHECKPOINT: ${{ env.CHECKPOINT_PATH }}
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          DART_REVIEW_SAMPLE_JSONL: ${{ runner.temp }}/dart-review-sample.jsonl
          DART_REVIEW_SAMPLE_CSV: ${{ runner.temp }}/dart-review-sample.csv
          DART_REVIEW_SAMPLE_MANIFEST: ${{ runner.temp }}/dart-review-sample-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          eligible="$(
            python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          start = date.fromisoformat(os.environ["BACKFILL_FROM_DATE"])
          end = date.fromisoformat(os.environ["BACKFILL_TO_DATE"])
          report = json.loads(Path(os.environ["BACKFILL_REPORT"]).read_text(encoding="utf-8"))
          exact_range = (end - start).days == 30
          complete = (
              report.get("status") == "succeeded"
              and report.get("dry_run") is False
              and report.get("range_start") == start.isoformat()
              and report.get("range_end_exclusive") == end.isoformat()
              and report.get("windows_total") == 30
              and report.get("windows_remaining") == 0
              and report.get("windows_failed") == 0
          )
          print("true" if exact_range and complete else "false")
          PY
          )"
          if [[ "$eligible" != "true" ]]; then
            echo "The requested apply range is not a completed exact 30-day DART corpus; review sampling is not applicable."
            exit 0
          fi
          python .github/scripts/validate-api-base-urls.py
          python -m curator.dart_review_sample \
            --from-date "$BACKFILL_FROM_DATE" \
            --to-date "$BACKFILL_TO_DATE" \
            --sample-size 100 \
            --seed 20260724 \
            --backfill-report "$BACKFILL_REPORT" \
            --checkpoint "$BACKFILL_CHECKPOINT" \
            --jsonl-output "$DART_REVIEW_SAMPLE_JSONL" \
            --csv-output "$DART_REVIEW_SAMPLE_CSV" \
            --manifest-output "$DART_REVIEW_SAMPLE_MANIFEST" \
            --code-revision "$GITHUB_SHA"

      - name: Prepare checkpoint evidence
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${{ runner.temp }}/official-backfill-checkpoint"
          mkdir -p "$evidence_dir"
          if [[ -f "$CHECKPOINT_PATH" ]]; then
            cp "$CHECKPOINT_PATH" "$evidence_dir/backfill_official_checkpoint.json"
          fi
          printf '{"mode":"%s","source":"%s","from_date":"%s","to_date":"%s","checkpoint_present":%s}\n' \
            "$MODE" "$SOURCE" "$FROM_DATE" "$TO_DATE" "$([[ -f "$CHECKPOINT_PATH" ]] && echo true || echo false)" \
            > "$evidence_dir/checkpoint-metadata.json"

      - name: Preserve backfill report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-backfill-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/official-backfill-report.json
            ${{ runner.temp }}/official-backfill.stderr.log
            ${{ runner.temp }}/dart-canary-sample-report.json
            ${{ runner.temp }}/dart-review-sample.jsonl
            ${{ runner.temp }}/dart-review-sample.csv
            ${{ runner.temp }}/dart-review-sample-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve resumable checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/official-backfill-checkpoint
          if-no-files-found: error
          retention-days: 90
