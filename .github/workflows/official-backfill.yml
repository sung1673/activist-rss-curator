      - name: Validate partial frozen DART resume boundary
        if: always() && inputs.mode == 'apply' && inputs.source == 'dart'
        id: frozen_resume_boundary
        env:
          FROZEN_BUNDLE_DIR: ${{ runner.temp }}/dart-frozen-apply
