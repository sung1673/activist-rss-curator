          fi
          if [[ ! -f "$CHECKPOINT_PATH" ]]; then
            echo "::error::A partial frozen bundle exists without its checkpoint."
            exit 1
          fi
          expected_job_fingerprint="$(
            jq -er '.job.fingerprint | select(type == "string" and test("^[0-9a-f]{64}$"))' \
              "$CHECKPOINT_PATH"
          )"
          expected_checkpoint_sha256="$(
            CHECKPOINT_FILE="$CHECKPOINT_PATH" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from curator.backfill_checkpoint_api import (
              canonical_checkpoint,
              checkpoint_payload_hash,
          )
          from curator.official_backfill import validate_checkpoint

          checkpoint = validate_checkpoint(
              json.loads(
                  Path(os.environ["CHECKPOINT_FILE"]).read_text(
                      encoding="utf-8"
                  )
              ),
              label="current run",
          )
          print(checkpoint_payload_hash(canonical_checkpoint(checkpoint)))
          PY
          )"
          python -m curator.dart_frozen_replay_bundle validate-resume \
            --path "$FROZEN_BUNDLE_DIR" \
            --expected-code-revision "$GITHUB_SHA" \
            --expected-job-fingerprint "$expected_job_fingerprint" \
            --expected-checkpoint-sha256 "$expected_checkpoint_sha256" \
            --expected-from-date "$EXPECTED_FROM_DATE" \
            --expected-to-date "$EXPECTED_TO_DATE" \
            --github-output "$GITHUB_OUTPUT" \
            > /dev/null

      - name: Prepare checkpoint evidence
        if: always()
        id: checkpoint_evidence
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${{ runner.temp }}/official-backfill-checkpoint"
          diagnostic_dir="${{ runner.temp }}/official-backfill-checkpoint-diagnostic"
          mkdir -p "$diagnostic_dir"
          checkpoint_present=false
          completed_count=0
          if [[ -f "$CHECKPOINT_PATH" ]]; then
            checkpoint_present=true
            completed_count="$(
              CHECKPOINT_FILE="$CHECKPOINT_PATH" python - <<'PY'
          import json
          import os
          from pathlib import Path

          checkpoint = json.loads(
              Path(os.environ["CHECKPOINT_FILE"]).read_text(encoding="utf-8")
          )
          completed = checkpoint.get("completed_windows")
          if not isinstance(completed, dict):
              raise SystemExit("checkpoint completed_windows is invalid")
          print(len(completed))
          PY
            )"
          fi
          resumable=false
          upload_checkpoint=false
          frozen_present=false
          if [[ "$MODE" == "apply" && "$checkpoint_present" == "true" ]]; then
            if [[ "$SOURCE" == "dart" ]]; then
              if (( completed_count > 0 )) && \
                 [[ "${{ steps.frozen_resume_boundary.outputs.evidence_safe }}" == "true" ]]; then
                mkdir -p "$evidence_dir"
                cp "$CHECKPOINT_PATH" \
                  "$evidence_dir/backfill_official_checkpoint.json"
                cp -R "${{ runner.temp }}/dart-frozen-apply" \
                  "$evidence_dir/frozen-replay-bundle"
                resumable=true
                upload_checkpoint=true
                frozen_present=true
              fi
            else
              mkdir -p "$evidence_dir"
              cp "$CHECKPOINT_PATH" \
                "$evidence_dir/backfill_official_checkpoint.json"
              resumable=true
              upload_checkpoint=true
            fi
          elif [[ "$MODE" == "replay" && "$checkpoint_present" == "true" ]]; then
            mkdir -p "$evidence_dir"
            cp "$CHECKPOINT_PATH" \
              "$evidence_dir/backfill_official_checkpoint.json"
            upload_checkpoint=true
          fi
          printf '{"mode":"%s","source":"%s","from_date":"%s","to_date":"%s","checkpoint_present":%s,"completed_window_count":%s,"resumable":%s,"upload_checkpoint":%s,"frozen_bundle_present":%s}\n' \
            "$MODE" "$SOURCE" "$FROM_DATE" "$TO_DATE" \
            "$checkpoint_present" "$completed_count" "$resumable" \
            "$upload_checkpoint" "$frozen_present" \
            > "$diagnostic_dir/checkpoint-metadata.json"
          echo "resumable=$resumable" >> "$GITHUB_OUTPUT"
          echo "upload_checkpoint=$upload_checkpoint" >> "$GITHUB_OUTPUT"

      - name: Enforce sanitized backfill artifact boundary
        if: always()
        id: backfill_artifact_boundary
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          KIND_API_KEY: ${{ secrets.KIND_API_KEY }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "${BACKFILL_REPORT}.raw" \
            "${BACKFILL_REPORT}.stderr.raw" \
            "${BACKFILL_REPORT}.tmp"
          command_exit_code="$(
            REPORT_PATH="$BACKFILL_REPORT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              report = json.loads(
                  Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
              )
              value = report.get("command_exit_code")
              print(value if type(value) is int and 0 <= value <= 255 else 1)
          except (OSError, UnicodeDecodeError, json.JSONDecodeError, AttributeError):
              print(1)
          PY
          )"
          boundary_exit=0
          python .github/scripts/sanitize-official-backfill-report.py \
            --output "$BACKFILL_REPORT" \
            --mode "$BACKFILL_MODE" \
            --from-date "$BACKFILL_FROM_DATE" \
            --to-date "$BACKFILL_TO_DATE" \
            --code-revision "$GITHUB_SHA" \
            --command-exit-code "$command_exit_code" \
            --verify-existing || boundary_exit=$?
          if (( boundary_exit != 0 && boundary_exit != 2 )); then
            echo "::error::No safe official backfill report is available for upload."
            exit 1
          fi
          if find "${{ runner.temp }}" -maxdepth 1 -type f \
            \( -name 'official-backfill-report.json.raw*' \
               -o -name 'official-backfill-report.json.stderr.raw*' \
               -o -name 'official-backfill-report.json.tmp*' \) \
            -print -quit | grep -q .; then
            echo "::error::Raw official backfill temporary output remains at the artifact boundary."
            exit 1
          fi
          echo "evidence_safe=true" >> "$GITHUB_OUTPUT"

      - name: Preserve backfill report
        if: always() && steps.backfill_artifact_boundary.outputs.evidence_safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-backfill-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/official-backfill-report.json
            ${{ runner.temp }}/dart-canary-sample-report.json
            ${{ runner.temp }}/dart-review-sample.jsonl
            ${{ runner.temp }}/dart-review-sample.csv
            ${{ runner.temp }}/dart-review-sample-manifest.json
            ${{ runner.temp }}/dart-replay-state-before.json
            ${{ runner.temp }}/dart-replay-state-after.json
            ${{ runner.temp }}/dart-replay-state-binding.json
            ${{ runner.temp }}/dart-frozen-apply-artifact-binding.json
            ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
            ${{ runner.temp }}/dart-replay-drift-probe.json
          if-no-files-found: error
          retention-days: 90

      - name: Preserve resumable checkpoint
        if: >-
          always() &&
          steps.checkpoint_evidence.outputs.upload_checkpoint == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CHECKPOINT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/official-backfill-checkpoint
          if-no-files-found: error
          retention-days: 90

      - name: Preserve checkpoint diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-backfill-checkpoint-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/official-backfill-checkpoint-diagnostic
          if-no-files-found: error
          retention-days: 30
