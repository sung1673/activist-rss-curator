name: Official disclosure backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fetch-only validation, durable upsert, or exact 30-day DART replay
        required: true
        type: choice
        options:
          - dry-run
          - apply
          - replay
        default: dry-run
      frozen_apply_run_id:
        description: Exact successful apply workflow run id required only for replay
        required: false
        type: string
        default: ""
      source:
        description: Official source selection
        required: true
        type: choice
        options:
          - dart
          - kind
          - both
        default: dart
      from_date:
        description: Inclusive start date (YYYY-MM-DD, no earlier than 2021-01-01)
        required: true
        type: string
      to_date:
        description: Exclusive end date (YYYY-MM-DD, no later than the current KST date)
        required: true
        type: string
      max_windows:
        description: Maximum pending one-day windows to process (1-31)
        required: true
        type: number
        default: 1
      sync_company_master:
        description: Refresh the DART company master once after a successful DART window
        required: true
        type: boolean
        default: false
      defer_review_sample:
        description: Defer the deterministic review sample for an exact 30-day DART apply only
        required: true
        type: boolean
        default: false
      canary_lookback_days:
        description: Complete KST days eligible for the DART dry-run sample (2-365)
        required: true
        type: number
        default: 365
      canary_request_budget:
        description: Hard OpenDART request cap for the DART canary only (1-10000)
        required: true
        type: number
        default: 10000

permissions:
  contents: read
  actions: read

# Backfill, scheduled official ingest, protected release transitions, and the
# related protected metadata operations share one non-cancelling lock. This
# keeps a multi-request logical run entirely before or after a release change.
concurrency:
  group: governance-production-official-write-${{ github.repository }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      vars.DART_OFFICIAL_INGEST_ENABLED == 'true' &&
      github.ref_type == 'branch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: governance-runtime
    env:
      CHECKPOINT_PATH: data/backfill_official_checkpoint.json
      CHECKPOINT_ARTIFACT_NAME: official-backfill-checkpoint-${{ inputs.mode }}-${{ inputs.source }}-${{ inputs.from_date }}-${{ inputs.to_date }}-${{ inputs.sync_company_master }}
      DART_FROZEN_APPLY_ARTIFACT_NAME: official-dart-frozen-replay-apply-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Initialize backfill evidence
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          DART_CANARY_REPORT: ${{ runner.temp }}/dart-canary-sample-report.json
          DART_REVIEW_SAMPLE_JSONL: ${{ runner.temp }}/dart-review-sample.jsonl
          DART_REVIEW_SAMPLE_CSV: ${{ runner.temp }}/dart-review-sample.csv
          DART_REVIEW_SAMPLE_MANIFEST: ${{ runner.temp }}/dart-review-sample-manifest.json
          DART_REPLAY_STATE_BEFORE: ${{ runner.temp }}/dart-replay-state-before.json
          DART_REPLAY_STATE_AFTER: ${{ runner.temp }}/dart-replay-state-after.json
          DART_REPLAY_STATE_BINDING: ${{ runner.temp }}/dart-replay-state-binding.json
          DART_FROZEN_APPLY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-apply-artifact-binding.json
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          DART_DRIFT_PROBE_REPORT: ${{ runner.temp }}/dart-replay-drift-probe.json
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"not_started"}' > "$BACKFILL_REPORT"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_CANARY_REPORT"
          : > "$DART_REVIEW_SAMPLE_JSONL"
          : > "$DART_REVIEW_SAMPLE_CSV"
          printf '%s\n' '{"status":"not_applicable","release_eligible":false}' \
            > "$DART_REVIEW_SAMPLE_MANIFEST"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_REPLAY_STATE_BEFORE"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_REPLAY_STATE_AFTER"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_REPLAY_STATE_BINDING"
          printf '%s\n' '{"status":"not_applicable"}' \
            > "$DART_FROZEN_APPLY_ARTIFACT_BINDING"
          printf '%s\n' '{"status":"not_applicable"}' \
            > "$DART_FROZEN_REPLAY_ARTIFACT_BINDING"
          printf '%s\n' '{"status":"not_applicable"}' > "$DART_DRIFT_PROBE_REPORT"

      - name: Checkout immutable dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable dispatch revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out backfill revision $actual does not match dispatch revision $GITHUB_SHA."
            exit 1
          }

      - name: Require exact current default-branch revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: defaultBranch,
            });
            if (context.ref !== `refs/heads/${defaultBranch}`) {
              core.setFailed("Official backfill must run from the default branch");
              return;
            }
            if (branch.data.commit.sha !== context.sha) {
              core.setFailed(
                `Dispatch revision ${context.sha} is not the current default-branch revision`,
              );
            }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        id: rollout
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode --github-output "$GITHUB_OUTPUT"

      - name: Validate bounded backfill inputs
        env:
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          MODE: ${{ inputs.mode }}
          FROZEN_APPLY_RUN_ID: ${{ inputs.frozen_apply_run_id }}
          MAX_WINDOWS: ${{ inputs.max_windows }}
          SOURCE: ${{ inputs.source }}
          SYNC_COMPANY_MASTER: ${{ inputs.sync_company_master }}
          DEFER_REVIEW_SAMPLE: ${{ inputs.defer_review_sample }}
          CANARY_LOOKBACK_DAYS: ${{ inputs.canary_lookback_days }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          try:
              start = date.fromisoformat(os.environ["FROM_DATE"])
              end = date.fromisoformat(os.environ["TO_DATE"])
              max_windows = int(os.environ["MAX_WINDOWS"])
              canary_lookback_days = int(os.environ["CANARY_LOOKBACK_DAYS"])
              canary_request_budget = int(os.environ["CANARY_REQUEST_BUDGET"])
          except (KeyError, TypeError, ValueError) as exc:
              raise SystemExit(f"invalid backfill input: {exc}") from exc
          if start < date(2021, 1, 1):
              raise SystemExit("from_date must be 2021-01-01 or later")
          if end <= start:
              raise SystemExit("to_date must be later than from_date (exclusive boundary)")
          completed_kst_end_exclusive = datetime.now(ZoneInfo("Asia/Seoul")).date()
          if end > completed_kst_end_exclusive:
              raise SystemExit(
                  "to_date cannot be later than the current KST date as an "
                  "exclusive boundary; current or future KST dates must not be checkpointed"
              )
          if not 1 <= max_windows <= 31:
              raise SystemExit("max_windows must be between 1 and 31")
          if not 2 <= canary_lookback_days <= 365:
              raise SystemExit("canary_lookback_days must be between 2 and 365")
          if not 1 <= canary_request_budget <= 10_000:
              raise SystemExit("canary_request_budget must be between 1 and 10000")
          if os.environ["SYNC_COMPANY_MASTER"].lower() == "true" and os.environ["SOURCE"] == "kind":
              raise SystemExit("sync_company_master requires source=dart or source=both")
          defer_review_sample = os.environ["DEFER_REVIEW_SAMPLE"].lower()
          if defer_review_sample not in {"true", "false"}:
              raise SystemExit("defer_review_sample must be true or false")
          if defer_review_sample == "true" and (
              os.environ["MODE"] != "apply"
              or os.environ["SOURCE"] != "dart"
              or (end - start).days != 30
              or max_windows != 30
              or os.environ["SYNC_COMPANY_MASTER"].lower() != "false"
          ):
              raise SystemExit(
                  "defer_review_sample requires mode=apply, source=dart, one exact "
                  "30-day range, max_windows=30, and sync_company_master=false"
              )
          if os.environ["MODE"] == "replay":
              frozen_apply_run_id = os.environ["FROZEN_APPLY_RUN_ID"]
              if (
                  not frozen_apply_run_id.isascii()
                  or not frozen_apply_run_id.isdecimal()
                  or int(frozen_apply_run_id) <= 0
              ):
                  raise SystemExit("replay requires a positive frozen_apply_run_id")
              if os.environ["SOURCE"] != "dart":
                  raise SystemExit("replay requires source=dart")
              if (end - start).days != 30:
                  raise SystemExit("replay requires one exact 30-day range")
              if max_windows != 30:
                  raise SystemExit("replay requires max_windows=30")
              if os.environ["SYNC_COMPANY_MASTER"].lower() != "false":
                  raise SystemExit("replay cannot sync the DART company master")
          elif os.environ["FROZEN_APPLY_RUN_ID"]:
              raise SystemExit("frozen_apply_run_id is forbidden outside replay mode")
          PY

      - name: Validate operational configuration
        id: dart_credentials
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          OPENDART_API_KEYS: ${{ inputs.mode != 'replay' && secrets.OPENDART_API_KEYS || '' }}
          DART_API_KEY: ${{ inputs.mode != 'replay' && secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
        shell: bash
        run: |
          set -euo pipefail
          required=()
          if [[ "$MODE" != "replay" && ( "$SOURCE" == "dart" || "$SOURCE" == "both" ) ]]; then
            python .github/scripts/mask-opendart-credentials.py \
              --github-output "$GITHUB_OUTPUT"
            required+=(BSIDE_API_BASE_URL BSIDE_OPS_TOKEN BSIDE_BACKEND_BINDING_ID)
          fi
          if [[ "$SOURCE" == "kind" || "$SOURCE" == "both" ]]; then
            required+=(KIND_DISCLOSURE_ENDPOINT BSIDE_API_BASE_URL BSIDE_OPS_TOKEN BSIDE_BACKEND_BINDING_ID)
          fi
          if [[ "$MODE" == "apply" || "$MODE" == "replay" ]]; then
            required+=(ACTIVIST_API_URL ACTIVIST_API_SECRET BSIDE_OPS_TOKEN)
          fi
          bash .github/scripts/require-env.sh "${required[@]}"
          python .github/scripts/validate-api-base-urls.py --github-env "$GITHUB_ENV"

      - name: Verify DART SourceRight before any durable DART write
        if: inputs.mode != 'dry-run' && inputs.source != 'kind'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.official_source_rights \
            --preflight-dart \
            --expected-release-sha "$GITHUB_SHA" \
            --pipeline-mode "$GOVERNANCE_PIPELINE_MODE"

      - name: Verify KIND SourceRight before adapter network access
        if: inputs.source == 'kind' || inputs.source == 'both'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from curator.official_source_rights import OfficialSourceRightClient; OfficialSourceRightClient().check_kind_ingest()'

      - name: Validate KIND adapter contract
        if: inputs.source == 'kind' || inputs.source == 'both'
        env:
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          KIND_API_KEY: ${{ secrets.KIND_API_KEY }}
        run: python .github/scripts/validate-kind-adapter.py

      - name: Dry-run completed-day and revision DART canary
        if: inputs.mode == 'dry-run' && inputs.source != 'kind'
        id: dart_canary
        env:
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          DART_CANARY_REPORT: ${{ runner.temp }}/dart-canary-sample-report.json
          CANARY_LOOKBACK_DAYS: ${{ inputs.canary_lookback_days }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
          CURATOR_REQUIRE_DURABLE_DART_QUOTA: "1"
          CURATOR_DART_QUOTA_PHASE: dart-canary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANARY_LOOKBACK_DAYS" =~ ^[0-9]+$ ]] || {
            echo "::error::canary_lookback_days must contain ASCII decimal digits."
            exit 1
          }
          [[ "$CANARY_REQUEST_BUDGET" =~ ^[0-9]+$ ]] || {
            echo "::error::canary_request_budget must contain ASCII decimal digits."
            exit 1
          }
          if (( CANARY_LOOKBACK_DAYS < 2 || CANARY_LOOKBACK_DAYS > 365 )); then
            echo "::error::canary_lookback_days must be between 2 and 365."
            exit 1
          fi
          if (( CANARY_REQUEST_BUDGET < 1 || CANARY_REQUEST_BUDGET > 10000 )); then
            echo "::error::canary_request_budget must be between 1 and 10000."
            exit 1
          fi
          python -m curator.dart_canary_sample \
            --lookback-days "$CANARY_LOOKBACK_DAYS" \
            --scan-chunk-days 7 \
            --sample-limit-per-kind 5 \
            --request-budget "$CANARY_REQUEST_BUDGET" \
            --report "$DART_CANARY_REPORT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["DART_CANARY_REPORT"]).read_text(encoding="utf-8"))
          if report.get("status") != "succeeded" or report.get("dry_run") is not True:
              raise SystemExit("DART canary did not produce successful dry-run evidence")
          requested_lookback = int(os.environ["CANARY_LOOKBACK_DAYS"])
          requested_budget = int(os.environ["CANARY_REQUEST_BUDGET"])
          history = report.get("history")
          if not isinstance(history, dict) or history.get("eligible_days") != requested_lookback:
              raise SystemExit("DART canary did not preserve the requested eligible-day range")
          if report.get("request_budget") != requested_budget:
              raise SystemExit("DART canary did not enforce the requested invocation budget")
          used = report.get("requests_used")
          if type(used) is not int or used < 0 or used > requested_budget:
              raise SystemExit("DART canary returned invalid request usage")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"requests_used={used}\n")
          PY

      - name: Resolve shared DART invocation budget
        id: dart_budget
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          CANARY_REQUESTS_USED: ${{ steps.dart_canary.outputs.requests_used }}
          CANARY_REQUEST_BUDGET: ${{ inputs.canary_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          mode = os.environ["BACKFILL_MODE"]
          source = os.environ["BACKFILL_SOURCE"]
          raw_used = os.environ.get("CANARY_REQUESTS_USED", "")
          raw_canary_budget = os.environ["CANARY_REQUEST_BUDGET"]
          canary_required = mode == "dry-run" and source != "kind"

          if canary_required:
              if not raw_canary_budget.isascii() or not raw_canary_budget.isdecimal():
                  raise SystemExit("DART canary request budget is missing or invalid")
              canary_budget = int(raw_canary_budget)
              if not 1 <= canary_budget <= 10_000:
                  raise SystemExit("DART canary request budget is outside the safety cap")
              if not raw_used.isascii() or not raw_used.isdecimal():
                  raise SystemExit("DART canary request usage output is missing or invalid")
              used = int(raw_used)
              if used > canary_budget:
                  raise SystemExit("DART canary request usage exceeds its requested hard cap")
          else:
              if raw_used:
                  raise SystemExit("unexpected DART canary request usage output")
              used = 0

          if used < 0 or used > 10_000:
              raise SystemExit("DART canary request usage exceeds the invocation budget")
          remaining = max(0, 10_000 - used)
          if source != "kind" and remaining == 0:
              raise SystemExit(
                  "DART canary exhausted the shared 10,000-request invocation budget"
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"canary_requests_used={used}\n")
              output.write(f"remaining_request_budget={remaining}\n")
          PY

      - name: Resolve exact immutable DART apply bundle
        if: inputs.mode == 'replay'
        id: frozen_apply
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FROZEN_APPLY_RUN_ID: ${{ inputs.frozen_apply_run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const now = Date.now();
            const cutoff = now - (72 * 60 * 60 * 1000);
            const digestPattern = /^sha256:[0-9a-f]{64}$/;
            const runId = Number(process.env.FROZEN_APPLY_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("frozen_apply_run_id must be a positive safe integer");
              return;
            }
            const response = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: runId,
            });
            const run = response.data;
            const expectedArtifactName =
              `official-dart-frozen-replay-apply-${run.id}-${run.run_attempt}`;
            const startedAt = Date.parse(run.run_started_at || run.created_at || "");
            const updatedAt = Date.parse(run.updated_at || "");
            const workflowPath = String(run.path || "").split("@", 1)[0];
            if (
              Number(run.id) === Number(context.runId) ||
              run.event !== "workflow_dispatch" ||
              run.status !== "completed" ||
              run.conclusion !== "success" ||
              run.head_sha !== context.sha ||
              run.head_branch !== defaultBranch ||
              run.head_repository?.full_name !== `${owner}/${repo}` ||
              workflowPath !== ".github/workflows/official-backfill.yml" ||
              !Number.isFinite(startedAt) ||
              !Number.isFinite(updatedAt) ||
              startedAt < cutoff ||
              updatedAt < cutoff ||
              startedAt > now + 300000 ||
              updatedAt > now + 300000
            ) {
              core.setFailed(
                "The selected apply run is not an exact-SHA successful default-branch workflow_dispatch within 72 hours",
              );
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: run.id, per_page: 100 },
            );
            const matches = artifacts.filter((artifact) =>
              artifact.name === expectedArtifactName &&
              !artifact.expired &&
              digestPattern.test(String(artifact.digest || "").toLowerCase())
            );
            if (matches.length !== 1) {
              core.setFailed(
                "The selected apply run must expose exactly one unexpired immutable DART apply bundle",
              );
              return;
            }
            const artifact = matches[0];
            const artifactCreatedAt = Date.parse(artifact.created_at || "");
            if (
              !Number.isFinite(artifactCreatedAt) ||
              artifactCreatedAt < cutoff ||
              artifactCreatedAt > now + 300000
            ) {
              core.setFailed("The selected DART apply bundle is outside its 72-hour freshness window");
              return;
            }
            core.setOutput("run_id", String(run.id));
            core.setOutput("run_attempt", String(run.run_attempt));
            core.setOutput("run_started_at", run.run_started_at);
            core.setOutput("artifact_id", String(artifact.id));
            core.setOutput("artifact_name", artifact.name);
            core.setOutput("artifact_digest", artifact.digest.toLowerCase());
            core.setOutput("artifact_created_at", artifact.created_at);

      - name: Download exact immutable DART apply bundle
        if: inputs.mode == 'replay'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.frozen_apply.outputs.artifact_id }}
          path: ${{ runner.temp }}/dart-frozen-replay-input
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.frozen_apply.outputs.run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Capture production DART state before replay
        if: inputs.mode == 'replay'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DART_REPLAY_STATE_BEFORE: ${{ runner.temp }}/dart-replay-state-before.json
        shell: bash
        run: |
          set -euo pipefail
          api_base="${BSIDE_API_BASE_URL%/}"
          case "$api_base" in
            */api/v1) api_base="${api_base%/api/v1}/api/v2" ;;
            */api/v2) ;;
            *) api_base="${api_base}/api/v2" ;;
          esac
          response="${DART_REPLAY_STATE_BEFORE}.response"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${BSIDE_OPS_TOKEN}" \
            -o "$response" \
            "${api_base}/ops/alpha-replay-state?code_revision=${GITHUB_SHA}"
          REPLAY_RESPONSE="$response" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          response = json.loads(
              Path(os.environ["REPLAY_RESPONSE"]).read_text(encoding="utf-8")
          )
          state = response.get("data") if response.get("ok") is True else None
          if not isinstance(state, dict):
              raise SystemExit("pre-replay API response is missing replay_state")
          revision = os.environ["GITHUB_SHA"]
          if (
              state.get("kind") != "bside-global-alpha-replay-state"
              or state.get("environment") != "production"
              or state.get("evidence_source") != "production_database_export"
              or state.get("is_synthetic") is not False
              or state.get("code_revision") != revision
          ):
              raise SystemExit("pre-replay state provenance is invalid")
          tables = state.get("tables")
          checkpoint = state.get("checkpoint")
          if (
              not isinstance(tables, dict)
              or set(tables)
              != {
                  "companies",
                  "issuers",
                  "issuer_identifiers",
                  "issuer_listings",
                  "documents",
                  "governance_events",
                  "actors",
                  "event_actors",
                  "event_documents",
                  "event_observations",
                  "timeline_entries",
                  "editorial_revisions",
                  "global_lifecycle_observations",
                  "collection_runs",
                  "source_connectors",
                  "official_slot_claims",
              }
              or not isinstance(checkpoint, dict)
              or checkpoint.get("completed_window_count") != 30
              or checkpoint.get("failed_window_count") != 0
          ):
              raise SystemExit("pre-replay state is not bound to a complete apply checkpoint")
          for name, digest in tables.items():
              if (
                  not isinstance(digest, dict)
                  or type(digest.get("row_count")) is not int
                  or digest["row_count"] < 0
                  or len(str(digest.get("content_sha256") or "")) != 64
              ):
                  raise SystemExit(f"invalid pre-replay table digest: {name}")
          contract = {
              "code_revision": revision,
              "tables": tables,
              "checkpoint": checkpoint,
          }
          calculated = hashlib.sha256(
              json.dumps(
                  contract,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          if calculated != state.get("state_sha256"):
              raise SystemExit("pre-replay state digest is invalid")
          destination = Path(os.environ["DART_REPLAY_STATE_BEFORE"])
          temporary = destination.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          temporary.replace(destination)
          PY
          rm -f "$response"

      - name: Verify and bind immutable DART apply bundle
        if: inputs.mode == 'replay'
        env:
          FROZEN_BUNDLE_DIR: ${{ runner.temp }}/dart-frozen-replay-input
          DART_REPLAY_STATE_BEFORE: ${{ runner.temp }}/dart-replay-state-before.json
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
          EXPECTED_ARTIFACT_ID: ${{ steps.frozen_apply.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.frozen_apply.outputs.artifact_name }}
          EXPECTED_ARTIFACT_DIGEST: ${{ steps.frozen_apply.outputs.artifact_digest }}
          EXPECTED_ARTIFACT_CREATED_AT: ${{ steps.frozen_apply.outputs.artifact_created_at }}
          EXPECTED_PRODUCER_RUN_ID: ${{ steps.frozen_apply.outputs.run_id }}
          EXPECTED_PRODUCER_RUN_ATTEMPT: ${{ steps.frozen_apply.outputs.run_attempt }}
          EXPECTED_PRODUCER_RUN_STARTED_AT: ${{ steps.frozen_apply.outputs.run_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.dart_frozen_replay_bundle build-binding \
            --path "$FROZEN_BUNDLE_DIR" \
            --replay-state "$DART_REPLAY_STATE_BEFORE" \
            --output "$DART_FROZEN_REPLAY_ARTIFACT_BINDING" \
            --artifact-id "$EXPECTED_ARTIFACT_ID" \
            --artifact-name "$EXPECTED_ARTIFACT_NAME" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --artifact-created-at "$EXPECTED_ARTIFACT_CREATED_AT" \
            --producer-run-id "$EXPECTED_PRODUCER_RUN_ID" \
            --producer-run-attempt "$EXPECTED_PRODUCER_RUN_ATTEMPT" \
            --producer-run-started-at "$EXPECTED_PRODUCER_RUN_STARTED_AT" \
            --consumer-repository "$GITHUB_REPOSITORY" \
            --consumer-workflow official-backfill.yml \
            --consumer-run-id "$GITHUB_RUN_ID" \
            --consumer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-code-revision "$GITHUB_SHA" \
            --expected-from-date "$EXPECTED_FROM_DATE" \
            --expected-to-date "$EXPECTED_TO_DATE" \
            --freshness-hours 72 \
            > /dev/null

      - name: Resolve previous matching checkpoint
        if: inputs.mode == 'apply'
        id: previous_checkpoint
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_ARTIFACT_NAME: ${{ env.CHECKPOINT_ARTIFACT_NAME }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "official-backfill.yml",
              branch: defaultBranch,
              status: "completed",
              per_page: 100,
            });
            for (const run of runs) {
              if (Number(run.id) === Number(context.runId)) continue;
              const workflowPath = String(run.path || "").split("@", 1)[0];
              if (run.event !== "workflow_dispatch") continue;
              if (run.head_sha !== context.sha) continue;
              if (run.head_branch !== defaultBranch) continue;
              if (run.head_repository?.full_name !== `${owner}/${repo}`) continue;
              if (workflowPath !== ".github/workflows/official-backfill.yml") continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner, repo, run_id: run.id, per_page: 100 },
              );
              const matches = artifacts.filter((item) =>
                item.name === process.env.EXPECTED_ARTIFACT_NAME && !item.expired
              );
              if (matches.length > 1) {
                core.setFailed(
                  "The exact-SHA checkpoint run contains ambiguous matching artifacts",
                );
                return;
              }
              if (matches.length === 0) continue;
              const artifact = matches[0];
              core.setOutput("found", "true");
              core.setOutput("run_id", String(run.id));
              core.setOutput("artifact_id", String(artifact.id));
              return;
            }
            core.setOutput("found", "false");

      - name: Download previous matching checkpoint
        if: inputs.mode == 'apply' && steps.previous_checkpoint.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.previous_checkpoint.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-official-backfill
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_checkpoint.outputs.run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Restore previous matching checkpoint
        if: inputs.mode == 'apply' && steps.previous_checkpoint.outputs.found == 'true'
        env:
          EXPECTED_MODE: ${{ inputs.mode }}
          EXPECTED_SOURCE: ${{ inputs.source }}
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          restore_root="${{ runner.temp }}/previous-official-backfill"
          resume_inventory="${{ runner.temp }}/official-backfill-resume-files.list"
          metadata_inventory="${{ runner.temp }}/official-backfill-metadata-files.list"
          frozen_inventory="${{ runner.temp }}/official-backfill-frozen-bundles.list"
          find "$restore_root" -type f -name 'backfill_official_checkpoint.json' -print0 \
            > "$resume_inventory"
          mapfile -d '' -t restored_files < "$resume_inventory"
          if (( ${#restored_files[@]} > 1 )); then
            echo "::error::The matching checkpoint artifact contains multiple resume files."
            exit 1
          fi
          if (( ${#restored_files[@]} == 0 )); then
            find "$restore_root" -type f -name 'checkpoint-metadata.json' -print0 \
              > "$metadata_inventory"
            mapfile -d '' -t metadata_files < "$metadata_inventory"
            if (( ${#metadata_files[@]} != 1 )); then
              echo "::error::The non-resumable checkpoint artifact must contain exactly one metadata file."
              exit 1
            fi
            python .github/scripts/validate-backfill-checkpoint-metadata.py \
              --metadata "${metadata_files[0]}" \
              --mode "$EXPECTED_MODE" \
              --source "$EXPECTED_SOURCE" \
              --from-date "$EXPECTED_FROM_DATE" \
              --to-date "$EXPECTED_TO_DATE"
            echo "::notice::No prior resume file exists; starting the idempotent backfill from the requested boundary."
            exit 0
          fi
          mkdir -p "$(dirname "$CHECKPOINT_PATH")"
          cp "${restored_files[0]}" "$CHECKPOINT_PATH"
          find "$restore_root" -type f -path '*/frozen-replay-bundle/manifest.json' -print0 \
            > "$frozen_inventory"
          mapfile -d '' -t frozen_manifests < "$frozen_inventory"
          if (( ${#frozen_manifests[@]} > 1 )); then
            echo "::error::The matching checkpoint artifact contains multiple frozen resume bundles."
            exit 1
          fi
          completed_count="$(
            CHECKPOINT_FILE="$CHECKPOINT_PATH" python - <<'PY'
          import json
          import os
          from pathlib import Path

          checkpoint = json.loads(
              Path(os.environ["CHECKPOINT_FILE"]).read_text(encoding="utf-8")
          )
          completed = checkpoint.get("completed_windows")
          if not isinstance(completed, dict):
              raise SystemExit("restored checkpoint completed_windows is invalid")
          print(len(completed))
          PY
          )"
          expected_checkpoint_sha256="$(
            CHECKPOINT_FILE="$CHECKPOINT_PATH" python - <<'PY'
          import json
          import os
          from pathlib import Path

          from curator.backfill_checkpoint_api import (
              canonical_checkpoint,
              checkpoint_payload_hash,
          )
          from curator.official_backfill import validate_checkpoint

          checkpoint = validate_checkpoint(
              json.loads(
                  Path(os.environ["CHECKPOINT_FILE"]).read_text(
                      encoding="utf-8"
                  )
              ),
              label="restored artifact",
          )
          print(checkpoint_payload_hash(canonical_checkpoint(checkpoint)))
          PY
          )"
          if (( completed_count > 0 && ${#frozen_manifests[@]} != 1 )); then
            echo "::error::A partial DART apply checkpoint cannot resume without its exact frozen bundle."
            exit 1
          fi
          if (( ${#frozen_manifests[@]} == 1 )); then
            frozen_root="$(dirname "${frozen_manifests[0]}")"
            if [[ -e "${{ runner.temp }}/dart-frozen-apply" ]]; then
              echo "::error::Refusing to overwrite an existing frozen apply workspace."
              exit 1
            fi
            cp -R "$frozen_root" "${{ runner.temp }}/dart-frozen-apply"
            expected_job_fingerprint="$(
              jq -er '.job.fingerprint | select(type == "string" and test("^[0-9a-f]{64}$"))' \
                "$CHECKPOINT_PATH"
            )"
            python -m curator.dart_frozen_replay_bundle validate-resume \
              --path "${{ runner.temp }}/dart-frozen-apply" \
              --expected-code-revision "$GITHUB_SHA" \
              --expected-job-fingerprint "$expected_job_fingerprint" \
              --expected-checkpoint-sha256 "$expected_checkpoint_sha256" \
              --expected-from-date "$EXPECTED_FROM_DATE" \
              --expected-to-date "$EXPECTED_TO_DATE" \
              > /dev/null
          fi

      - name: Run one-day official backfill windows
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_SOURCE: ${{ inputs.source }}
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BACKFILL_MAX_WINDOWS: ${{ inputs.max_windows }}
          BACKFILL_SYNC_COMPANY_MASTER: ${{ inputs.sync_company_master }}
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          DART_FROZEN_APPLY_DIR: ${{ runner.temp }}/dart-frozen-apply
          DART_FROZEN_REPLAY_INPUT_DIR: ${{ runner.temp }}/dart-frozen-replay-input
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          DART_DRIFT_PROBE_REPORT: ${{ runner.temp }}/dart-replay-drift-probe.json
          CURATOR_INGEST_SCOPE: official
          CURATOR_DATA_SOURCE: mysql
          CURATOR_DISABLE_TELEGRAM_SEND: "1"
          CURATOR_DELIVERY_MODE: disabled
          ENABLE_TELEGRAM_DELIVERY: "false"
          ENABLE_GOVERNANCE_DELIVERY: "false"
          CURATOR_REQUIRE_REMOTE_API: ${{ inputs.mode != 'dry-run' && '1' || '0' }}
          CURATOR_ENABLE_KIND: ${{ inputs.source == 'dart' && '0' || '1' }}
          CURATOR_REQUIRE_KIND: ${{ inputs.source == 'dart' && '0' || '1' }}
          OPENDART_API_KEYS: ${{ inputs.mode != 'replay' && secrets.OPENDART_API_KEYS || '' }}
          DART_API_KEY: ${{ inputs.mode != 'replay' && secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          KIND_DISCLOSURE_ENDPOINT: ${{ vars.KIND_DISCLOSURE_ENDPOINT }}
          KIND_API_KEY: ${{ secrets.KIND_API_KEY }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          CURATOR_REQUIRE_DURABLE_DART_QUOTA: ${{ inputs.mode != 'replay' && '1' || '0' }}
          CURATOR_DART_QUOTA_PHASE: ${{ inputs.mode == 'replay' && 'official-backfill-replay' || 'official-backfill' }}
          CURATOR_DART_DRIFT_PROBE_READ_ONLY: "1"
          DART_REQUEST_BUDGET: ${{ steps.dart_budget.outputs.remaining_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DART_REQUEST_BUDGET" =~ ^[0-9]+$ ]] || {
            echo "::error::The shared DART invocation budget is missing or invalid."
            exit 1
          }
          if (( DART_REQUEST_BUDGET < 1 || DART_REQUEST_BUDGET > 10000 )); then
            echo "::error::The remaining DART invocation budget must be between 1 and 10000."
            exit 1
          fi
          args=(
            --from-date "$BACKFILL_FROM_DATE"
            --to-date "$BACKFILL_TO_DATE"
            --source "$BACKFILL_SOURCE"
            --chunk-days 1
            --max-chunks "$BACKFILL_MAX_WINDOWS"
            --request-budget "$DART_REQUEST_BUDGET"
            --checkpoint "$CHECKPOINT_PATH"
          )
          if [[ "$BACKFILL_MODE" == "dry-run" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$BACKFILL_MODE" == "replay" ]]; then
            args+=(
              --replay
              --frozen-bundle-dir "$DART_FROZEN_REPLAY_INPUT_DIR"
              --frozen-artifact-binding "$DART_FROZEN_REPLAY_ARTIFACT_BINDING"
            )
          elif [[
            "$BACKFILL_MODE" == "apply" &&
            "$BACKFILL_SOURCE" == "dart" &&
            "$BACKFILL_MAX_WINDOWS" == "30" &&
            "$BACKFILL_SYNC_COMPANY_MASTER" == "false"
          ]]; then
            range_days="$(
              FROM_DATE="$BACKFILL_FROM_DATE" TO_DATE="$BACKFILL_TO_DATE" \
                python -c \
                'import os; from datetime import date; print((date.fromisoformat(os.environ["TO_DATE"]) - date.fromisoformat(os.environ["FROM_DATE"])).days)'
            )"
            if [[ "$range_days" == "30" ]]; then
              args+=(--write-frozen-bundle-dir "$DART_FROZEN_APPLY_DIR")
            fi
          fi
          if [[ "$BACKFILL_SYNC_COMPANY_MASTER" == "true" ]]; then
            args+=(--sync-company-master)
          fi

          raw_report="${BACKFILL_REPORT}.raw"
          raw_stderr="${BACKFILL_REPORT}.stderr.raw"
          cleanup_raw_backfill_output() {
            rm -f "$raw_report" "$raw_stderr"
          }
          trap cleanup_raw_backfill_output EXIT

          set +e
          python -m curator.official_backfill "${args[@]}" \
            > "$raw_report" 2> "$raw_stderr"
          exit_code=$?
          set -e

          sanitizer_exit=0
          python .github/scripts/sanitize-official-backfill-report.py \
            --input "$raw_report" \
            --output "$BACKFILL_REPORT" \
            --mode "$BACKFILL_MODE" \
            --from-date "$BACKFILL_FROM_DATE" \
            --to-date "$BACKFILL_TO_DATE" \
            --code-revision "$GITHUB_SHA" \
            --command-exit-code "$exit_code" || sanitizer_exit=$?

          cleanup_raw_backfill_output
          trap - EXIT
          if (( exit_code != 0 )); then
            echo "::error::Official backfill failed with exit code ${exit_code}; sanitized diagnostics are in the report artifact."
            exit "$exit_code"
          fi
          if (( sanitizer_exit != 0 )); then
            echo "::error::Official backfill output did not pass the artifact safety boundary."
            exit 1
          fi

      - name: Run fresh read-only DART drift probe
        if: inputs.mode == 'replay'
        env:
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BACKFILL_MAX_WINDOWS: ${{ inputs.max_windows }}
          DART_FROZEN_REPLAY_INPUT_DIR: ${{ runner.temp }}/dart-frozen-replay-input
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          DART_DRIFT_PROBE_REPORT: ${{ runner.temp }}/dart-replay-drift-probe.json
          OPENDART_API_KEYS: ${{ secrets.OPENDART_API_KEYS }}
          DART_API_KEY: ${{ secrets.OPENDART_API_KEYS == '' && secrets.DART_API_KEY || '' }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BSIDE_BACKEND_BINDING_ID: ${{ vars.BSIDE_BACKEND_BINDING_ID }}
          CURATOR_REQUIRE_DURABLE_DART_QUOTA: "1"
          CURATOR_DART_QUOTA_PHASE: official-backfill-drift-probe
          CURATOR_DART_DRIFT_PROBE_READ_ONLY: "1"
          DART_REQUEST_BUDGET: ${{ steps.dart_budget.outputs.remaining_request_budget }}
        shell: bash
        run: |
          set -euo pipefail
          raw_stdout="${{ runner.temp }}/dart-drift-probe.stdout.raw"
          raw_stderr="${{ runner.temp }}/dart-drift-probe.stderr.raw"
          cleanup_probe_raw() {
            rm -f "$raw_stdout" "$raw_stderr"
          }
          trap cleanup_probe_raw EXIT
          set +e
          python -m curator.official_backfill \
            --from-date "$BACKFILL_FROM_DATE" \
            --to-date "$BACKFILL_TO_DATE" \
            --source dart \
            --chunk-days 1 \
            --max-chunks "$BACKFILL_MAX_WINDOWS" \
            --request-budget "$DART_REQUEST_BUDGET" \
            --frozen-bundle-dir "$DART_FROZEN_REPLAY_INPUT_DIR" \
            --frozen-artifact-binding "$DART_FROZEN_REPLAY_ARTIFACT_BINDING" \
            --drift-probe-only \
            --drift-probe-output "$DART_DRIFT_PROBE_REPORT" \
            > "$raw_stdout" 2> "$raw_stderr"
          probe_exit=$?
          set -e
          cleanup_probe_raw
          trap - EXIT
          if (( probe_exit != 0 )); then
            echo "::error::Fresh DART drift probe failed; raw connector output was discarded."
            exit "$probe_exit"
          fi

      - name: Validate read-only DART drift probe diagnostic
        if: inputs.mode == 'replay'
        id: dart_drift_probe
        env:
          DART_DRIFT_PROBE_REPORT: ${{ runner.temp }}/dart-replay-drift-probe.json
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          expected_job_fingerprint="$(
            jq -er '.job_fingerprint | select(type == "string" and test("^[0-9a-f]{64}$"))' \
              "$DART_FROZEN_REPLAY_ARTIFACT_BINDING"
          )"
          jq -e '.artifact_sanitization.status == "verified"' \
            "$DART_DRIFT_PROBE_REPORT" > /dev/null
          python -m curator.dart_frozen_replay_bundle validate-probe \
            --path "$DART_DRIFT_PROBE_REPORT" \
            --expected-code-revision "$GITHUB_SHA" \
            --expected-from-date "$EXPECTED_FROM_DATE" \
            --expected-to-date "$EXPECTED_TO_DATE" \
            --expected-job-fingerprint "$expected_job_fingerprint" \
            --github-output "$GITHUB_OUTPUT" \
            > /dev/null

      - name: Capture production DART state after replay
        if: always() && inputs.mode == 'replay'
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DART_REPLAY_STATE_AFTER: ${{ runner.temp }}/dart-replay-state-after.json
        shell: bash
        run: |
          set -euo pipefail
          api_base="${BSIDE_API_BASE_URL%/}"
          case "$api_base" in
            */api/v1) api_base="${api_base%/api/v1}/api/v2" ;;
            */api/v2) ;;
            *) api_base="${api_base}/api/v2" ;;
          esac
          response="${DART_REPLAY_STATE_AFTER}.response"
          curl --silent --show-error --fail-with-body \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${BSIDE_OPS_TOKEN}" \
            -o "$response" \
            "${api_base}/ops/alpha-replay-state?code_revision=${GITHUB_SHA}"
          REPLAY_RESPONSE="$response" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          response = json.loads(
              Path(os.environ["REPLAY_RESPONSE"]).read_text(encoding="utf-8")
          )
          state = response.get("data") if response.get("ok") is True else None
          if not isinstance(state, dict):
              raise SystemExit("post-replay API response is missing replay_state")
          revision = os.environ["GITHUB_SHA"]
          contract = {
              "code_revision": revision,
              "tables": state.get("tables"),
              "checkpoint": state.get("checkpoint"),
          }
          calculated = hashlib.sha256(
              json.dumps(
                  contract,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode("utf-8")
          ).hexdigest()
          if (
              state.get("kind") != "bside-global-alpha-replay-state"
              or state.get("code_revision") != revision
              or calculated != state.get("state_sha256")
          ):
              raise SystemExit("post-replay state provenance or digest is invalid")
          destination = Path(os.environ["DART_REPLAY_STATE_AFTER"])
          temporary = destination.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          temporary.replace(destination)
          PY
          rm -f "$response"

      - name: Bind replay receipts to unchanged production state
        if: inputs.mode == 'replay'
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          DART_REPLAY_STATE_BEFORE: ${{ runner.temp }}/dart-replay-state-before.json
          DART_REPLAY_STATE_AFTER: ${{ runner.temp }}/dart-replay-state-after.json
          DART_REPLAY_STATE_BINDING: ${{ runner.temp }}/dart-replay-state-binding.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          def load(name):
              return json.loads(Path(os.environ[name]).read_text(encoding="utf-8"))

          def digest(value):
              return hashlib.sha256(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
              ).hexdigest()

          report = load("BACKFILL_REPORT")
          before = load("DART_REPLAY_STATE_BEFORE")
          after = load("DART_REPLAY_STATE_AFTER")
          revision = os.environ["GITHUB_SHA"]
          before_contract = {
              key: value for key, value in before.items() if key != "collected_at"
          }
          after_contract = {
              key: value for key, value in after.items() if key != "collected_at"
          }
          if before_contract != after_contract:
              raise SystemExit("DART-related production state changed during replay")
          checkpoint_before = report.get("checkpoint_before")
          checkpoint_after = report.get("checkpoint_after")
          if (
              report.get("status") != "succeeded"
              or report.get("mode") != "replay"
              or report.get("code_revision") != revision
              or report.get("windows_total") != 30
              or report.get("windows_attempted") != 30
              or report.get("windows_succeeded") != 30
              or report.get("windows_failed") != 0
              or report.get("windows_remaining") != 0
              or report.get("idempotent") is not True
              or report.get("replay_verified") is not True
              or checkpoint_before != checkpoint_after
              or not isinstance(checkpoint_before, dict)
          ):
              raise SystemExit("replay report is not a complete idempotent 30-window run")
          state_checkpoint = before.get("checkpoint")
          if (
              not isinstance(state_checkpoint, dict)
              or checkpoint_before.get("version")
              != state_checkpoint.get("checkpoint_version")
              or checkpoint_before.get("payload_sha256")
              != state_checkpoint.get("checkpoint_payload_sha256")
              or report.get("checkpoint_payload_sha256")
              != state_checkpoint.get("checkpoint_payload_sha256")
          ):
              raise SystemExit("replay checkpoint and database state are not bound")
          receipt = report.get("receipt_contract")
          windows = receipt.get("windows") if isinstance(receipt, dict) else None
          if (
              not isinstance(receipt, dict)
              or receipt.get("schema_version") != 1
              or receipt.get("source") != "dart"
              or receipt.get("mode") != "replay"
              or receipt.get("window_count") != 30
              or not isinstance(windows, list)
              or len(windows) != 30
              or receipt.get("checkpoint_payload_sha256")
              != checkpoint_before.get("payload_sha256")
          ):
              raise SystemExit("replay receipt contract is incomplete")
          cursor = date.fromisoformat(report["range_start"])
          for index, window in enumerate(windows):
              next_cursor = cursor + timedelta(days=1)
              if (
                  window.get("window_start") != cursor.isoformat()
                  or window.get("window_end_exclusive") != next_cursor.isoformat()
                  or window.get("raw_count")
                  != window.get("filtered_out_count")
                  + window.get("accepted_count")
                  or window.get("accepted_count")
                  != window.get("acknowledged_count")
                  or window.get("status") != "complete"
                  or window.get("code_revision") != revision
                  or window.get("idempotent") is not True
                  or window.get("replay_verified") is not True
              ):
                  raise SystemExit(f"replay receipt {index + 1} is invalid")
              cursor = next_cursor
          result_rows = report.get("window_results")
          if (
              not isinstance(result_rows, list)
              or len(result_rows) != 30
              or any(
                  row.get("apply_summary_counts_sha256")
                  != row.get("replay_summary_counts_sha256")
                  for row in result_rows
              )
          ):
              raise SystemExit("apply and replay summaries are not byte-bound")
          binding = {
              "schema_version": 1,
              "kind": "official-dart-replay-state-binding",
              "environment": "production",
              "is_synthetic": False,
              "code_revision": revision,
              "before": before,
              "after": after,
              "state_unchanged": True,
              "checkpoint_unchanged": True,
              "receipt_contract_sha256": digest(receipt),
          }
          binding["binding_sha256"] = digest(binding)
          report["replay_state"] = {
              "before": before,
              "after": after,
              "state_unchanged": True,
              "checkpoint_unchanged": True,
              "binding_sha256": binding["binding_sha256"],
          }
          report_path = Path(os.environ["BACKFILL_REPORT"])
          report_tmp = report_path.with_suffix(".tmp")
          report_tmp.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          report_tmp.replace(report_path)
          destination = Path(os.environ["DART_REPLAY_STATE_BINDING"])
          temporary = destination.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(binding, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          temporary.replace(destination)
          PY

      - name: Bind frozen replay and drift status into report
        if: inputs.mode == 'replay'
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          DART_FROZEN_REPLAY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-replay-artifact-binding.json
          DART_DRIFT_PROBE_REPORT: ${{ runner.temp }}/dart-replay-drift-probe.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def load(name):
              path = Path(os.environ[name])
              raw = path.read_bytes()
              return path, raw, json.loads(raw.decode("utf-8"))

          report_path, _report_raw, report = load("BACKFILL_REPORT")
          _binding_path, binding_raw, binding = load(
              "DART_FROZEN_REPLAY_ARTIFACT_BINDING"
          )
          _probe_path, probe_raw, probe = load("DART_DRIFT_PROBE_REPORT")
          diagnostic_only_window_count = probe.get(
              "diagnostic_only_window_count"
          )
          if (
              binding.get("kind") != "official-dart-frozen-replay-artifact-binding"
              or binding.get("consumer", {}).get("code_revision")
              != os.environ["GITHUB_SHA"]
              or binding.get("artifact_sanitization", {}).get("status")
              != "verified"
              or probe.get("kind") != "official-dart-fresh-drift-probe"
              or probe.get("code_revision") != os.environ["GITHUB_SHA"]
              or probe.get("read_only") is not True
              or probe.get("governance_write_attempted") is not False
              or probe.get("checkpoint_write_attempted") is not False
              or probe.get("quota_ledger_write_attempted") is not True
              or probe.get("status") not in {"matched", "drift_detected"}
              or probe.get("release_gate_policy")
              != "stable-public-payload-source-count-diagnostic-v1"
              or probe.get("release_gate_matched") is not True
              or isinstance(diagnostic_only_window_count, bool)
              or not isinstance(diagnostic_only_window_count, int)
              or not 0 <= diagnostic_only_window_count <= 30
              or probe.get("blocking_drift_window_count") != 0
              or (
                  probe.get("status") == "matched"
                  and diagnostic_only_window_count != 0
              )
              or (
                  probe.get("status") == "drift_detected"
                  and diagnostic_only_window_count < 1
              )
              or probe.get("artifact_sanitization", {}).get("status") != "verified"
          ):
              raise SystemExit("frozen replay or drift diagnostic binding is invalid")
          report["frozen_replay"] = {
              "schema_version": 1,
              "apply_artifact_binding_sha256": hashlib.sha256(binding_raw).hexdigest(),
              "apply_manifest_sha256": binding["manifest_sha256"],
              "drift_probe": {
                  "status": probe["status"],
                  "release_gate_policy": probe["release_gate_policy"],
                  "release_gate_matched": True,
                  "diagnostic_only_window_count": diagnostic_only_window_count,
                  "blocking_drift_window_count": 0,
                  "read_only": True,
                  "governance_write_attempted": False,
                  "checkpoint_write_attempted": False,
                  "quota_ledger_write_attempted": True,
                  "sha256": hashlib.sha256(probe_raw).hexdigest(),
              },
          }
          temporary = report_path.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          temporary.replace(report_path)
          PY

      - name: Validate exact 30-window DART receipt contract
        if: inputs.mode != 'dry-run' && inputs.source == 'dart' && inputs.max_windows == 30
        env:
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          EXPECTED_MODE: ${{ inputs.mode }}
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          report = json.loads(
              Path(os.environ["BACKFILL_REPORT"]).read_text(encoding="utf-8")
          )
          contract = report.get("receipt_contract")
          windows = contract.get("windows") if isinstance(contract, dict) else None
          start = date.fromisoformat(os.environ["EXPECTED_FROM_DATE"])
          end = date.fromisoformat(os.environ["EXPECTED_TO_DATE"])
          if (
              (end - start).days != 30
              or report.get("status") != "succeeded"
              or not isinstance(contract, dict)
              or contract.get("source") != "dart"
              or contract.get("mode") != os.environ["EXPECTED_MODE"]
              or contract.get("window_count") != 30
              or not isinstance(windows, list)
              or len(windows) != 30
          ):
              raise SystemExit("exact 30-window DART receipt contract is missing")
          cursor = start
          for window in windows:
              next_cursor = cursor + timedelta(days=1)
              if (
                  window.get("window_start") != cursor.isoformat()
                  or window.get("window_end_exclusive") != next_cursor.isoformat()
                  or window.get("raw_count")
                  != window.get("filtered_out_count")
                  + window.get("accepted_count")
                  or window.get("accepted_count")
                  != window.get("acknowledged_count")
                  or window.get("code_revision") != os.environ["GITHUB_SHA"]
              ):
                  raise SystemExit("DART receipt count, boundary, or revision mismatch")
              cursor = next_cursor
          PY

      - name: Validate private frozen DART apply bundle
        if: inputs.mode == 'apply' && inputs.source == 'dart'
        id: frozen_apply_bundle
        env:
          FROZEN_BUNDLE_DIR: ${{ runner.temp }}/dart-frozen-apply
          BACKFILL_REPORT: ${{ runner.temp }}/official-backfill-report.json
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
          EXPECTED_MAX_WINDOWS: ${{ inputs.max_windows }}
          EXPECTED_SYNC_COMPANY_MASTER: ${{ inputs.sync_company_master }}
        shell: bash
        run: |
          set -euo pipefail
          eligible="$(
            python -c \
              'from datetime import date; import os; print(str((date.fromisoformat(os.environ["EXPECTED_TO_DATE"]) - date.fromisoformat(os.environ["EXPECTED_FROM_DATE"])).days == 30 and os.environ["EXPECTED_MAX_WINDOWS"] == "30" and os.environ["EXPECTED_SYNC_COMPANY_MASTER"].lower() == "false").lower())'
          )"
          if [[ "$eligible" != "true" ]]; then
            {
              echo "eligible=false"
              echo "evidence_safe=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_job_fingerprint="$(
            jq -er '.job_fingerprint | select(type == "string" and test("^[0-9a-f]{64}$"))' \
              "$BACKFILL_REPORT"
          )"
          expected_checkpoint_sha256="$(
            jq -er '.checkpoint_payload_sha256 | select(type == "string" and test("^[0-9a-f]{64}$"))' \
              "$BACKFILL_REPORT"
          )"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '.producer.repository == $repository and
             .producer.workflow == "official-backfill.yml" and
             .producer.run_id == $run_id and
             .producer.run_attempt == $run_attempt and
             .artifact_sanitization.status == "verified"' \
            "$FROZEN_BUNDLE_DIR/manifest.json" > /dev/null
          python -m curator.dart_frozen_replay_bundle validate-apply \
            --path "$FROZEN_BUNDLE_DIR" \
            --expected-code-revision "$GITHUB_SHA" \
            --expected-from-date "$EXPECTED_FROM_DATE" \
            --expected-to-date "$EXPECTED_TO_DATE" \
            --expected-job-fingerprint "$expected_job_fingerprint" \
            --expected-checkpoint-sha256 "$expected_checkpoint_sha256" \
            --github-output "$GITHUB_OUTPUT" \
            > /dev/null
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable private frozen DART apply bundle
        if: >-
          inputs.mode == 'apply' &&
          steps.frozen_apply_bundle.outputs.eligible == 'true' &&
          steps.frozen_apply_bundle.outputs.evidence_safe == 'true'
        id: frozen_apply_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.DART_FROZEN_APPLY_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/dart-frozen-apply
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
          include-hidden-files: false

      - name: Bind uploaded frozen DART apply artifact
        if: steps.frozen_apply_upload.outcome == 'success'
        env:
          DART_FROZEN_APPLY_ARTIFACT_BINDING: ${{ runner.temp }}/dart-frozen-apply-artifact-binding.json
          ARTIFACT_ID: ${{ steps.frozen_apply_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.frozen_apply_upload.outputs.artifact-digest }}
          MANIFEST_SHA256: ${{ steps.frozen_apply_bundle.outputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          digest = os.environ["ARTIFACT_DIGEST"].lower()
          if re.fullmatch(r"[0-9a-f]{64}", digest):
              digest = f"sha256:{digest}"
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("uploaded frozen DART apply artifact digest is invalid")
          if not os.environ["ARTIFACT_ID"].isascii() or not os.environ["ARTIFACT_ID"].isdecimal():
              raise SystemExit("uploaded frozen DART apply artifact id is invalid")
          binding = {
              "schema_version": 1,
              "kind": "official-dart-frozen-apply-artifact-binding",
              "producer": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": "official-backfill.yml",
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "code_revision": os.environ["GITHUB_SHA"],
              },
              "artifact": {
                  "id": int(os.environ["ARTIFACT_ID"]),
                  "name": os.environ["DART_FROZEN_APPLY_ARTIFACT_NAME"],
                  "digest": digest,
                  "freshness_hours": 72,
                  "retention_days": 90,
              },
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "artifact_sanitization": {"status": "verified"},
          }
          canonical = json.dumps(
              binding,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          binding["binding_sha256"] = hashlib.sha256(canonical).hexdigest()
          destination = Path(os.environ["DART_FROZEN_APPLY_ARTIFACT_BINDING"])
          temporary = destination.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(binding, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          temporary.replace(destination)
          PY

      - name: Defer deterministic 30-day DART review sample
        if: inputs.defer_review_sample
        env:
          DART_REVIEW_SAMPLE_JSONL: ${{ runner.temp }}/dart-review-sample.jsonl
          DART_REVIEW_SAMPLE_CSV: ${{ runner.temp }}/dart-review-sample.csv
          DART_REVIEW_SAMPLE_MANIFEST: ${{ runner.temp }}/dart-review-sample-manifest.json
          EXPECTED_FROM_DATE: ${{ inputs.from_date }}
          EXPECTED_TO_DATE: ${{ inputs.to_date }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$DART_REVIEW_SAMPLE_JSONL"
          : > "$DART_REVIEW_SAMPLE_CSV"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "schema_version": 1,
              "contract_version": "dart-review-sample-deferred-v1",
              "status": "deferred",
              "release_eligible": False,
              "reason": "operator_requested_review_sample_deferral",
              "code_revision": os.environ["GITHUB_SHA"],
              "workflow_run": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": "official-backfill.yml",
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              },
              "range": {
                  "from": os.environ["EXPECTED_FROM_DATE"],
                  "to": os.environ["EXPECTED_TO_DATE"],
                  "semantics": "half_open",
              },
              "sample_count": 0,
          }
          destination = Path(os.environ["DART_REVIEW_SAMPLE_MANIFEST"])
          temporary = destination.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
