name: Repair Telegram history

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical window in days (1-365)"
        required: true
        type: string
        default: "365"
      limit_per_channel:
        description: "Telegram history page size per channel (1-3000)"
        required: true
        type: string
        default: "3000"
      channel_limit:
        description: "Maximum channels (0 means all; maximum 500)"
        required: true
        type: string
        default: "0"
      max_messages:
        description: "Global message cap (1-300000)"
        required: true
        type: string
        default: "300000"
      only_handles:
        description: "Optional comma-separated channel handles"
        required: false
        type: string
        default: ""
      start_after:
        description: "Optional channel handle to resume after"
        required: false
        type: string
        default: ""
      before_message_id:
        description: "Resume one only_handles channel before this message ID (0 means latest)"
        required: false
        type: string
        default: "0"
      expected_selection_fingerprint:
        description: "Required for start_after/before>0; optional assertion for before=0"
        required: false
        type: string
        default: ""
      finalize_signal_rebuild:
        description: "Finalize signals only after every segment artifact is verified successful"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-collection-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: telegram-history-repair
    steps:
      - name: Initialize repair metrics
        env:
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/telegram-repair-metrics.json
        shell: bash
        run: >-
          printf '%s\n' '{"ok":false,"status":"started"}'
          > "$CURATOR_RUN_METRICS_PATH"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable workflow revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out revision $actual does not match workflow revision $GITHUB_SHA."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate remote repair configuration
        env:
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        run: >-
          bash .github/scripts/require-env.sh
          ACTIVIST_API_URL ACTIVIST_API_SECRET

      - name: Validate Telegram collection configuration
        if: ${{ !inputs.finalize_signal_rebuild }}
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: >-
          bash .github/scripts/require-env.sh
          TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING

      - name: Backfill and reconcile Telegram history
        if: ${{ !inputs.finalize_signal_rebuild }}
        timeout-minutes: 105
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/telegram-repair-metrics.json
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          REPAIR_DAYS: ${{ inputs.days }}
          REPAIR_LIMIT_PER_CHANNEL: ${{ inputs.limit_per_channel }}
          REPAIR_CHANNEL_LIMIT: ${{ inputs.channel_limit }}
          REPAIR_MAX_MESSAGES: ${{ inputs.max_messages }}
          REPAIR_ONLY_HANDLES: ${{ inputs.only_handles }}
          REPAIR_START_AFTER: ${{ inputs.start_after }}
          REPAIR_BEFORE_MESSAGE_ID: ${{ inputs.before_message_id }}
          REPAIR_EXPECTED_SELECTION_FINGERPRINT: ${{ inputs.expected_selection_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.telegram_repair \
            --root . \
            --days "$REPAIR_DAYS" \
            --limit-per-channel "$REPAIR_LIMIT_PER_CHANNEL" \
            --channel-limit "$REPAIR_CHANNEL_LIMIT" \
            --max-messages "$REPAIR_MAX_MESSAGES" \
            --only-handles "$REPAIR_ONLY_HANDLES" \
            --start-after "$REPAIR_START_AFTER" \
            --before-message-id "$REPAIR_BEFORE_MESSAGE_ID" \
            --expected-selection-fingerprint "$REPAIR_EXPECTED_SELECTION_FINGERPRINT"

      - name: Finalize Telegram signal rebuild
        if: ${{ inputs.finalize_signal_rebuild }}
        timeout-minutes: 105
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/telegram-repair-metrics.json
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          REPAIR_DAYS: ${{ inputs.days }}
          REPAIR_LIMIT_PER_CHANNEL: ${{ inputs.limit_per_channel }}
          REPAIR_CHANNEL_LIMIT: ${{ inputs.channel_limit }}
          REPAIR_MAX_MESSAGES: ${{ inputs.max_messages }}
          REPAIR_ONLY_HANDLES: ${{ inputs.only_handles }}
          REPAIR_START_AFTER: ${{ inputs.start_after }}
          REPAIR_BEFORE_MESSAGE_ID: ${{ inputs.before_message_id }}
          REPAIR_EXPECTED_SELECTION_FINGERPRINT: ${{ inputs.expected_selection_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.telegram_repair \
            --root . \
            --days "$REPAIR_DAYS" \
            --limit-per-channel "$REPAIR_LIMIT_PER_CHANNEL" \
            --channel-limit "$REPAIR_CHANNEL_LIMIT" \
            --max-messages "$REPAIR_MAX_MESSAGES" \
            --only-handles "$REPAIR_ONLY_HANDLES" \
            --start-after "$REPAIR_START_AFTER" \
            --before-message-id "$REPAIR_BEFORE_MESSAGE_ID" \
            --expected-selection-fingerprint "$REPAIR_EXPECTED_SELECTION_FINGERPRINT" \
            --finalize-signal-rebuild

      - name: Publish repair metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-repair-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/telegram-repair-metrics.json
          if-no-files-found: error
          retention-days: 30
