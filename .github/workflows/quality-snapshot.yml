name: Governance immutable daily quality snapshot

on:
  schedule:
    # KST 00:25 after the completed day and before 00:35 evidence collection.
    - cron: "25 15 * * *"
  workflow_dispatch:
    inputs:
      observation_date:
        description: Completed KST date (YYYY-MM-DD; defaults to yesterday)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: governance-quality-snapshot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freeze:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
      vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
      (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: governance-runtime
    steps:
      - name: Checkout immutable candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce default branch and outbound-disabled policy
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "${ENABLE_TELEGRAM_DELIVERY,,}" != "true" ]]
          [[ "${ENABLE_GOVERNANCE_DELIVERY,,}" != "true" ]]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Freeze and verify previous-day production quality
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          OBSERVATION_DATE: ${{ inputs.observation_date || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--revision "$GITHUB_SHA" --output quality-snapshot/receipt.json)
          if [[ -n "$OBSERVATION_DATE" ]]; then
            args+=(--observation-date "$OBSERVATION_DATE")
          fi
          python -m curator.quality_snapshot "${args[@]}"

      - name: Preserve immutable quality receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-quality-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-snapshot/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
