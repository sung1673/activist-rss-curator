name: Production Alpha expedited immutable preparation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE_EXPEDITED_ALPHA_PREPARATION
        required: true
        type: string
      dart_apply_run_id:
        description: Successful exact-SHA 30-window DART apply run
        required: true
        type: string
      dart_replay_run_id:
        description: Successful exact-SHA 30-window DART replay run
        required: true
        type: string
      sec_apply_run_id:
        description: Successful exact-SHA 30-window SEC apply run
        required: true
        type: string
      sec_replay_run_id:
        description: Successful exact-SHA 30-window SEC replay run
        required: true
        type: string
      selected_markets_run_id:
        description: Successful exact-SHA CA and AU metadata run
        required: true
        type: string
      governance_pages_run_id:
        description: Successful exact-SHA Daily governance Pages producer run
        required: true
        type: string
      preview_smoke_run_id:
        description: Successful exact-SHA remote Preview smoke run
        required: true
        type: string
      web_vitals_run_id:
        description: Successful exact-SHA production mobile Web Vitals run
        required: true
        type: string
      web_vitals_artifact_digest:
        description: Immutable production Web Vitals artifact sha256 digest
        required: true
        type: string
      legacy_preview_pages_run_id:
        description: Successful exact-SHA build-feed run currently serving legacy plus governance Preview
        required: true
        type: string
      editorial_publication_run_id:
        description: Successful exact-SHA protected 20/40/5 editorial publication run
        required: true
        type: string
      editorial_publication_artifact_digest:
        description: Immutable editorial publication artifact sha256 digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: global-alpha-expedited-preparation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drain_pages_producers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: governance-release
    permissions:
      actions: write
      contents: read
    outputs:
      orphaned_unstarted_json: ${{ steps.drain.outputs.orphaned_unstarted_json }}
    steps:
      - name: Checkout the exact expedited candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce the active expedited deployment fence
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          STANDARD_OBSERVATION: ${{ vars.GLOBAL_ALPHA_OBSERVATION_ENABLED }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CREATE_EXPEDITED_ALPHA_PREPARATION" ]]
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$PAGES_OWNER" == "legacy" && "$PIPELINE_MODE" == "shadow" ]]
          [[ "${STANDARD_OBSERVATION,,}" == "false" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]

      - name: Cancel and drain pre-fence Pages producers
        id: drain
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const orphanClassifier = require(
              "./.github/scripts/orphaned-pages-run.cjs",
            );
            const {owner, repo} = context.repo;
            const workflowIds = [
              ".github/workflows/build-feed.yml",
              ".github/workflows/daily.yml",
            ];
            const activeStatuses = [
              "queued", "in_progress", "waiting", "pending", "requested",
            ];
            const listActive = async () => {
              const found = new Map();
              for (const workflowId of workflowIds) {
                for (const status of activeStatuses) {
                  const response = await github.paginate(
                    github.rest.actions.listWorkflowRuns,
                    {
                      owner,
                      repo,
                      workflow_id: workflowId,
                      branch: process.env.DEFAULT_BRANCH,
                      status,
                      per_page: 100,
                    },
                  );
                  for (const run of response) {
                    if (run.id !== context.runId) {
                      found.set(run.id, {run, workflowId, status});
                    }
                  }
                }
              }
              return [...found.values()];
            };
            const orphanedUnstarted = new Map();
            const orphanSnapshots = new Map();
            const attemptedCancel = new Set();
            const forceCancelled = new Set();
            const cancelOrClassify = async ({run, workflowId, status}) => {
              if (attemptedCancel.has(run.id) || orphanedUnstarted.has(run.id)) {
                return;
              }
              attemptedCancel.add(run.id);
              core.notice(
                `Cancelling pre-fence Pages producer ${run.id} ` +
                `(${workflowId}, ${status}).`,
              );
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
              } catch (error) {
                if ([409, 422].includes(orphanClassifier.statusOf(error))) {
                  await orphanClassifier.confirmTerminalAfterCancelConflict({
                    github,
                    owner,
                    repo,
                    runId: run.id,
                    error,
                  });
                  return;
                }
                const result = await orphanClassifier.handleCancelServerError({
                  github,
                  owner,
                  repo,
                  run,
                  workflowId,
                  currentSha: process.env.EXPECTED_SHA,
                  nowMs: Date.now(),
                  cancelError: error,
                });
                if (result.forceCancelled) {
                  forceCancelled.add(run.id);
                }
                if (result.orphanedUnstarted) {
                  orphanedUnstarted.set(run.id, result.orphanedUnstarted);
                  orphanSnapshots.set(run.id, {
                    id: run.id,
                    path: run.path,
                    status: run.status,
                    head_sha: run.head_sha,
                    run_attempt: run.run_attempt,
                    created_at: run.created_at,
                    run_started_at: run.run_started_at,
                    updated_at: run.updated_at,
                  });
                  core.warning(
                    `Quarantined orphaned_unstarted Pages producer ${run.id}.`,
                  );
                }
              }
            };
            const initial = await listActive();
            for (const entry of initial) {
              await cancelOrClassify(entry);
            }
            const deadline = Date.now() + 9 * 60 * 1000;
            const forceCancelAt = Date.now() + 60 * 1000;
            let consecutiveEmptyScans = 0;
            while (true) {
              const scanned = await listActive();
              for (const entry of scanned) {
                await cancelOrClassify(entry);
              }
              const remaining = scanned.filter(
                ({run}) => !orphanedUnstarted.has(run.id),
              );
              if (remaining.length === 0) {
                consecutiveEmptyScans += 1;
                if (consecutiveEmptyScans >= 2) {
                  for (const [runId, audit] of orphanedUnstarted) {
                    const revalidated =
                      await orphanClassifier.revalidateOrphanedUnstarted({
                        github,
                        owner,
                        repo,
                        listedRun: orphanSnapshots.get(runId),
                        currentSha: process.env.EXPECTED_SHA,
                        nowMs: Date.now(),
                      });
                    if (
                      revalidated.run_id !== audit.run_id ||
                      revalidated.head_sha !== audit.head_sha ||
                      revalidated.created_at !== audit.created_at
                    ) {
                      throw new Error(
                        `Orphaned Pages run ${runId} audit changed during revalidation`,
                      );
                    }
                  }
                  const orphanAudit = [...orphanedUnstarted.values()].sort(
                    (left, right) => left.run_id - right.run_id,
                  );
                  core.setOutput(
                    "orphaned_unstarted_json",
                    JSON.stringify(orphanAudit),
                  );
                  await core.summary
                    .addHeading("Pages producer drain audit", 3)
                    .addCodeBlock(
                      JSON.stringify(
                        {orphaned_unstarted: orphanAudit},
                        null,
                        2,
                      ),
                      "json",
                    )
                    .write();
                  core.notice(
                    `Pages producer drain complete; inspected ${attemptedCancel.size} ` +
                    `run(s), quarantined ${orphanAudit.length}.`,
                  );
                  break;
                }
              } else {
                consecutiveEmptyScans = 0;
                if (Date.now() >= forceCancelAt) {
                  for (const {run} of remaining) {
                    if (forceCancelled.has(run.id)) {
                      continue;
                    }
                    try {
                      await github.rest.actions.forceCancelWorkflowRun({
                        owner,
                        repo,
                        run_id: run.id,
                      });
                      forceCancelled.add(run.id);
                    } catch (error) {
                      await orphanClassifier.confirmTerminalAfterCancelConflict({
                        github,
                        owner,
                        repo,
                        runId: run.id,
                        error,
                      });
                    }
                  }
                }
              }
              if (Date.now() >= deadline) {
                core.setFailed(
                  `Pages producer drain timed out with ${remaining.length} active run(s).`,
                );
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }

  prepare_rollback:
    needs: drain_pages_producers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-release
    outputs:
      prepared_artifact_id: ${{ steps.prepared.outputs.artifact-id }}
      prepared_artifact_digest: ${{ steps.prepared.outputs.artifact-digest }}
    steps:
      - name: Checkout the exact expedited candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce protected rollback preparation boundary
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          STANDARD_OBSERVATION: ${{ vars.GLOBAL_ALPHA_OBSERVATION_ENABLED }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CREATE_EXPEDITED_ALPHA_PREPARATION" ]]
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$PAGES_OWNER" == "legacy" && "$PIPELINE_MODE" == "shadow" ]]
          [[ "${STANDARD_OBSERVATION,,}" == "false" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Resolve immutable legacy seed and exact Preview restore artifact
        id: rollback_sources
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          PREVIEW_RUN_ID: ${{ inputs.legacy_preview_pages_run_id }}
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const positive = (value) => /^[1-9][0-9]*$/.test(String(value || "").trim());
            const digest = (value) => /^sha256:[0-9a-f]{64}$/.test(String(value || "").toLowerCase());
            if (!positive(process.env.PREVIEW_RUN_ID) || !positive(process.env.LEGACY_RUN_ID)) {
              core.setFailed("Legacy Preview and archive run ids must be positive integers");
              return;
            }
            if (String(process.env.PREVIEW_RUN_ID) === String(process.env.LEGACY_RUN_ID)) {
              core.setFailed("The Preview restore and archive seed must be independent runs");
              return;
            }
            const previewResponse = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.PREVIEW_RUN_ID),
            });
            const preview = previewResponse.data;
            if (
              preview.status !== "completed" ||
              preview.conclusion !== "success" ||
              preview.event !== "workflow_dispatch" ||
              preview.head_branch !== process.env.DEFAULT_BRANCH ||
              preview.path !== ".github/workflows/build-feed.yml" ||
              (preview.head_sha || "").toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase()
            ) {
              core.setFailed("Preview restore run is not the exact successful build-feed candidate");
              return;
            }
            const previewArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: preview.id, per_page: 100},
            );
            const previewMatches = previewArtifacts.filter(
              (item) => item.name === "github-pages" && !item.expired,
            );
            if (previewMatches.length !== 1 || !digest(previewMatches[0].digest)) {
              core.setFailed("Preview restore run must have one immutable github-pages artifact");
              return;
            }
            const legacyRevision = String(process.env.LEGACY_CODE_REVISION || "").toLowerCase();
            const legacyDigest = String(process.env.LEGACY_ARTIFACT_DIGEST || "").toLowerCase();
            if (
              !/^[0-9a-f]{40}$/.test(legacyRevision) ||
              !digest(legacyDigest) ||
              !String(process.env.LEGACY_ARTIFACT_NAME || "").trim()
            ) {
              core.setFailed("Pinned legacy archive variables are invalid");
              return;
            }
            const legacyResponse = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.LEGACY_RUN_ID),
            });
            const legacy = legacyResponse.data;
            if (
              legacy.status !== "completed" ||
              legacy.conclusion !== "success" ||
              legacy.head_branch !== process.env.DEFAULT_BRANCH ||
              legacy.path !== ".github/workflows/build-feed.yml" ||
              (legacy.head_sha || "").toLowerCase() !== legacyRevision
            ) {
              core.setFailed("Pinned legacy archive producer is invalid");
              return;
            }
            const legacyArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: legacy.id, per_page: 100},
            );
            const legacyMatches = legacyArtifacts.filter(
              (item) =>
                item.name === process.env.LEGACY_ARTIFACT_NAME &&
                !item.expired,
            );
            if (
              legacyMatches.length !== 1 ||
              (legacyMatches[0].digest || "").toLowerCase() !== legacyDigest
            ) {
              core.setFailed("Pinned legacy archive digest changed");
              return;
            }
            core.setOutput("preview_run_id", String(preview.id));
            core.setOutput("preview_artifact_id", String(previewMatches[0].id));
            core.setOutput("preview_artifact_name", previewMatches[0].name);
            core.setOutput("preview_artifact_digest", previewMatches[0].digest.toLowerCase());
            core.setOutput("legacy_run_id", String(legacy.id));
            core.setOutput("legacy_artifact_id", String(legacyMatches[0].id));
            core.setOutput("legacy_artifact_name", legacyMatches[0].name);
            core.setOutput("legacy_artifact_digest", legacyDigest);
            core.setOutput("legacy_code_revision", legacyRevision);

      - name: Download raw immutable rollback and Preview artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: ${{ steps.rollback_sources.outputs.legacy_artifact_id }}
          PREVIEW_ARTIFACT_ID: ${{ steps.rollback_sources.outputs.preview_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p rollback-prepared
          for spec in \
            "$LEGACY_ARTIFACT_ID:rollback-prepared/pinned-legacy.zip" \
            "$PREVIEW_ARTIFACT_ID:rollback-prepared/preview-pages.zip"; do
            artifact_id="${spec%%:*}"
            output="${spec#*:}"
            curl --fail-with-body --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$output"
          done

      - name: Set up protected preparation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Materialize machine-only preparation base
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace(
              "+00:00", "Z"
          )
          payload = {
              "schema_version": 1,
              "kind": "bside-global-alpha-expedited-preparation-base",
              "environment": "production",
              "evidence_source": "immutable_actual_producer_chain",
              "is_synthetic": False,
              "code_revision": os.environ["GITHUB_SHA"].lower(),
              "collected_at": now,
              "evidence_as_of": now,
              "release_channel": "production_alpha_early_access",
          }
          Path("rollback-prepared/protected-input-template.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Extract actual legacy artifact for rollback drill without waiver
        shell: bash
        env:
          LEGACY_RUN_ID: ${{ steps.rollback_sources.outputs.legacy_run_id }}
          LEGACY_ARTIFACT_ID: ${{ steps.rollback_sources.outputs.legacy_artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ steps.rollback_sources.outputs.legacy_artifact_name }}
          LEGACY_CODE_REVISION: ${{ steps.rollback_sources.outputs.legacy_code_revision }}
          LEGACY_ARTIFACT_DIGEST: ${{ steps.rollback_sources.outputs.legacy_artifact_digest }}
        run: |
          set -euo pipefail
          python -m curator.expedited_legacy_recovery_bundle prepare-drill-site \
            --archive rollback-prepared/pinned-legacy.zip \
            --output rollback-prepared/legacy-drill-site \
            --receipt rollback-prepared/legacy-drill-site-receipt.json \
            --source-run-id "$LEGACY_RUN_ID" \
            --source-artifact-id "$LEGACY_ARTIFACT_ID" \
            --source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --source-code-revision "$LEGACY_CODE_REVISION" \
            --source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Fail closed on Telegram data in prepared legacy recovery
        shell: bash
        run: |
          set -euo pipefail
          site="rollback-prepared/legacy-drill-site"
          test ! -e "$site/feed/telegram.html"
          test ! -e "$site/feed/telegram-admin.html"
          python -m curator.legacy_telegram_safety verify-site \
            --site "$site" \
            --minimum-dated-reports 89

      - name: Extract and verify exact legacy plus governance Preview restore
        shell: bash
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        run: |
          set -euo pipefail
          mkdir -p rollback-prepared/preview-download rollback-prepared/preview-site
          unzip -q rollback-prepared/preview-pages.zip \
            -d rollback-prepared/preview-download
          mapfile -t tarballs < <(
            find rollback-prepared/preview-download -type f -name artifact.tar -print
          )
          [[ "${#tarballs[@]}" -eq 1 ]]
          tar -xf "${tarballs[0]}" -C rollback-prepared/preview-site
          python -m curator.governance_site_config \
            --site rollback-prepared/preview-site \
            --expected-api-base "$GOVERNANCE_API_BASE_URL" \
            --expected-web-base "$BSIDE_PUBLIC_WEB_URL" \
            --expected-build-sha "$GITHUB_SHA"
          test -f rollback-prepared/preview-site/feed.xml
          test -f rollback-prepared/preview-site/governance/config.js
          grep -Rqs --fixed-strings \
            "production_alpha_early_access" \
            rollback-prepared/preview-site/governance

      - name: Record immutable rollback preparation provenance
        shell: bash
        env:
          PREVIEW_RUN_ID: ${{ steps.rollback_sources.outputs.preview_run_id }}
          PREVIEW_ARTIFACT_ID: ${{ steps.rollback_sources.outputs.preview_artifact_id }}
          PREVIEW_ARTIFACT_NAME: ${{ steps.rollback_sources.outputs.preview_artifact_name }}
          PREVIEW_ARTIFACT_DIGEST: ${{ steps.rollback_sources.outputs.preview_artifact_digest }}
          LEGACY_RUN_ID: ${{ steps.rollback_sources.outputs.legacy_run_id }}
          LEGACY_ARTIFACT_ID: ${{ steps.rollback_sources.outputs.legacy_artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ steps.rollback_sources.outputs.legacy_artifact_name }}
          LEGACY_ARTIFACT_DIGEST: ${{ steps.rollback_sources.outputs.legacy_artifact_digest }}
          LEGACY_CODE_REVISION: ${{ steps.rollback_sources.outputs.legacy_code_revision }}
          ORPHANED_UNSTARTED_JSON: ${{ needs.drain_pages_producers.outputs.orphaned_unstarted_json }}
        run: |
          set -euo pipefail
          jq -n \
            --arg code_revision "$GITHUB_SHA" \
            --argjson preview_run_id "$PREVIEW_RUN_ID" \
            --argjson preview_artifact_id "$PREVIEW_ARTIFACT_ID" \
            --arg preview_artifact_name "$PREVIEW_ARTIFACT_NAME" \
            --arg preview_artifact_digest "$PREVIEW_ARTIFACT_DIGEST" \
            --argjson legacy_run_id "$LEGACY_RUN_ID" \
            --argjson legacy_artifact_id "$LEGACY_ARTIFACT_ID" \
            --arg legacy_artifact_name "$LEGACY_ARTIFACT_NAME" \
            --arg legacy_artifact_digest "$LEGACY_ARTIFACT_DIGEST" \
            --arg legacy_code_revision "$LEGACY_CODE_REVISION" \
            --argjson orphaned_unstarted "$ORPHANED_UNSTARTED_JSON" \
            '{
              schema_version: 1,
              kind: "bside-expedited-rollback-preparation",
              code_revision: $code_revision,
              preview_restore: {
                run_id: $preview_run_id,
                artifact_id: $preview_artifact_id,
                artifact_name: $preview_artifact_name,
                artifact_digest: $preview_artifact_digest
              },
              legacy_archive: {
                run_id: $legacy_run_id,
                artifact_id: $legacy_artifact_id,
                artifact_name: $legacy_artifact_name,
                artifact_digest: $legacy_artifact_digest,
                code_revision: $legacy_code_revision
              },
              pages_producer_drain: {
                orphaned_unstarted: $orphaned_unstarted
              }
            }' > rollback-prepared/rollback-preparation.json

      - name: Preserve protected rollback preparation
        id: prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rollback-prepared/protected-input-template.json
            rollback-prepared/rollback-preparation.json
            rollback-prepared/pinned-legacy.zip
            rollback-prepared/legacy-drill-site
            rollback-prepared/legacy-drill-site-receipt.json
            rollback-prepared/preview-site
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  rollback_drill:
    needs: prepare_rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.restore_preview.outputs.page_url }}
    steps:
      - name: Download protected rollback preparation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: global-alpha-expedited-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-prepared
          digest-mismatch: error

      - name: Configure Pages for the actual rollback drill
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Start monotonic rollback timer
        id: timer
        shell: bash
        run: |
          set -euo pipefail
          echo "started_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Upload full-site legacy rollback candidate
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: expedited-legacy-rollback
          path: rollback-prepared/legacy-drill-site

      - name: Deploy and verify the real legacy rollback
        id: deploy_legacy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: expedited-legacy-rollback

      - name: Smoke the deployed legacy root inside ten minutes
        id: legacy_smoke
        shell: bash
        env:
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          STARTED_EPOCH: ${{ steps.timer.outputs.started_epoch }}
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          cache_bust="expedited-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors \
            "$web/?$cache_bust" --output legacy-root.html
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors \
            "$web/feed.xml?$cache_bust" --output legacy-feed.xml
          cmp --silent \
            legacy-root.html \
            rollback-prepared/legacy-drill-site/index.html
          cmp --silent \
            legacy-feed.xml \
            rollback-prepared/legacy-drill-site/feed.xml
          pinned_date="$(
            find rollback-prepared/legacy-drill-site/feed \
              -maxdepth 1 -type f -name '????-??-??.html' -printf '%f\n' \
              | sed 's/\.html$//' | sort | tail -n 1
          )"
          [[ "$pinned_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors \
            "$web/feed/$pinned_date.html?$cache_bust" \
            --output legacy-pinned-date.html
          cmp --silent \
            legacy-pinned-date.html \
            "rollback-prepared/legacy-drill-site/feed/$pinned_date.html"
          for forbidden_path in feed/telegram.html feed/telegram-admin.html; do
            status="$(
              curl --silent --show-error --location \
                --retry 6 --retry-all-errors \
                --output /dev/null --write-out '%{http_code}' \
                "$web/$forbidden_path?$cache_bust"
            )"
            if [[ "$status" != "404" ]]; then
              echo "::error::$forbidden_path must return HTTP 404 after rollback; got $status."
              exit 1
            fi
          done
          sha256sum \
            legacy-root.html legacy-feed.xml legacy-pinned-date.html \
            > deployed-legacy-sha256.txt
          completed_epoch="$(date -u +%s)"
          duration_seconds="$((completed_epoch - STARTED_EPOCH))"
          [[ "$duration_seconds" -ge 0 && "$duration_seconds" -le 600 ]]
          echo "completed_epoch=$completed_epoch" >> "$GITHUB_OUTPUT"
          echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "duration_seconds=$duration_seconds" >> "$GITHUB_OUTPUT"

      - name: Upload exact legacy plus governance Preview restore
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: expedited-preview-restore
          path: rollback-prepared/preview-site

      - name: Restore exact legacy plus governance Preview
        id: restore_preview
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: expedited-preview-restore

      - name: Verify exact Preview restoration and write measured drill receipt
        shell: bash
        env:
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          STARTED_AT: ${{ steps.timer.outputs.started_at }}
          LEGACY_COMPLETED_AT: ${{ steps.legacy_smoke.outputs.completed_at }}
          DURATION_SECONDS: ${{ steps.legacy_smoke.outputs.duration_seconds }}
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          cache_bust="expedited-preview-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          paths=(
            "index.html"
            "governance/index.html"
            "governance/config.js"
            "governance/app.js"
          )
          mkdir -p restored-preview
          for path in "${paths[@]}"; do
            mkdir -p "$(dirname "restored-preview/$path")"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors \
              "$web/${path}?$cache_bust" --output "restored-preview/$path"
            cmp --silent \
              "restored-preview/$path" \
              "rollback-prepared/preview-site/$path"
          done
          terminal_content_sha256="$(
            (
              cd rollback-prepared/preview-site
              sha256sum "${paths[@]}"
            ) | sha256sum | cut -d' ' -f1
          )"
          [[ "$terminal_content_sha256" =~ ^[0-9a-f]{64}$ ]]
          grep -qs --fixed-strings \
            "$GITHUB_SHA" restored-preview/governance/config.js
          grep -qs --fixed-strings \
            "$GOVERNANCE_API_BASE_URL" restored-preview/governance/config.js
          grep -qs --fixed-strings \
            "production_alpha_early_access" restored-preview/governance/app.js
          restore_completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          archive_digest="$(
            jq -er '.legacy_archive.artifact_digest' \
              rollback-prepared/rollback-preparation.json
          )"
          jq -n \
            --arg code_revision "$GITHUB_SHA" \
            --arg started_at "$STARTED_AT" \
            --arg completed_at "$LEGACY_COMPLETED_AT" \
            --arg restored_at "$restore_completed_at" \
            --arg archive_digest "$archive_digest" \
            --arg terminal_content_sha256 "$terminal_content_sha256" \
            --argjson duration_seconds "$DURATION_SECONDS" \
            '{
              schema_version: 1,
              kind: "bside-expedited-actual-rollback-drill",
              code_revision: $code_revision,
              status: "succeeded",
              started_at: $started_at,
              legacy_deployed_at: $completed_at,
              preview_restored_at: $restored_at,
              duration_seconds: $duration_seconds,
              duration_minutes: ($duration_seconds / 60),
              succeeded: true,
              legacy_artifact_sha256: ($archive_digest | sub("^sha256:"; "")),
              preview_restore_verified: true,
              preview_terminal_content_sha256: $terminal_content_sha256
            }' > expedited-rollback-drill.json

      - name: Preserve actual rollback drill receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-rollback-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: expedited-rollback-drill.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  observe:
    needs: rollback_drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: governance-runtime
    steps:
      - name: Checkout the exact expedited candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce the explicit 30-minute observation boundary
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          STANDARD_OBSERVATION: ${{ vars.GLOBAL_ALPHA_OBSERVATION_ENABLED }}
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CREATE_EXPEDITED_ALPHA_PREPARATION" ]] || {
            echo "::error::The explicit expedited evidence confirmation did not match."
            exit 1
          }
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Expedited evidence is restricted to the default branch."
            exit 1
          }
          [[ "$PAGES_OWNER" == "legacy" && "$PIPELINE_MODE" == "shadow" ]]
          [[ "${STANDARD_OBSERVATION,,}" == "false" ]]
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Set up observation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect seven real five-minute Preview observations
        shell: bash
        env:
          GOVERNANCE_PIPELINE_MODE: shadow
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          BSIDE_ALPHA_PREVIEW_WEB_URL: ${{ vars.BSIDE_ALPHA_PREVIEW_WEB_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
          OBSERVATION_ROOT: ${{ runner.temp }}/expedited-observations
        run: |
          set -euo pipefail
          mkdir -p "$OBSERVATION_ROOT"
          incident_started_epoch="$(date -u +%s)"
          incident_started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if GITHUB_SHA=0000000000000000000000000000000000000000 \
            python -m curator.global_alpha_monitor \
              --evidence "$OBSERVATION_ROOT/failure-detection-probe.json" \
              --require-active-pipeline; then
            echo "::error::Watchdog did not detect a deliberately mismatched release SHA."
            exit 1
          fi
          detected_epoch="$(date -u +%s)"
          detected_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          detection_seconds="$((detected_epoch - incident_started_epoch))"
          [[ "$detection_seconds" -ge 0 && "$detection_seconds" -le 600 ]]
          jq -e '
            .status == "incident"
            and any(.reasons[];
              . == "api_revision_mismatch"
              or . == "terminal_build_sha_mismatch"
              or . == "unexpected_monitor_failure")
          ' "$OBSERVATION_ROOT/failure-detection-probe.json" > /dev/null
          jq -n \
            --arg code_revision "$GITHUB_SHA" \
            --arg incident_started_at "$incident_started_at" \
            --arg detected_at "$detected_at" \
            --argjson detection_seconds "$detection_seconds" \
            '{
              schema_version: 1,
              kind: "bside-expedited-watchdog-failure-detection-drill",
              code_revision: $code_revision,
              incident: "deliberate_release_sha_mismatch",
              incident_started_at: $incident_started_at,
              detected_at: $detected_at,
              detection_seconds: $detection_seconds,
              detection_minutes: ($detection_seconds / 60),
              succeeded: true
            }' > "$OBSERVATION_ROOT/failure-detection-drill.json"
          for slot in 0 1 2 3 4 5 6; do
            python -m curator.global_alpha_monitor \
              --evidence "$OBSERVATION_ROOT/observation-$slot.json" \
              --require-active-pipeline
            jq -e '
              .status == "healthy"
              and .pipeline_mode == "shadow"
              and .web_surface == "governance-preview"
              and .release_state == "preview"
              and .workflow_revision == env.GITHUB_SHA
              and .api_code_revision == env.GITHUB_SHA
            ' "$OBSERVATION_ROOT/observation-$slot.json" > /dev/null
            if [[ "$slot" != "6" ]]; then
              sleep 300
            fi
          done
          jq -s '.' "$OBSERVATION_ROOT"/observation-*.json \
            > "$OBSERVATION_ROOT/observations.json"
          jq -e '
            length == 7
            and all(.[]; .status == "healthy")
            and ((.[-1].observed_at | fromdateiso8601) -
                 (.[0].observed_at | fromdateiso8601) >= 1790)
            and ([.[].observed_at | fromdateiso8601] as $times |
                 all(range(1; length);
                   (($times[.] - $times[.-1]) >= 120)
                   and (($times[.] - $times[.-1]) <= 480)))
          ' "$OBSERVATION_ROOT/observations.json" > /dev/null

      - name: Preserve same-run expedited observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/expedited-observations/observations.json
            ${{ runner.temp }}/expedited-observations/failure-detection-drill.json
            ${{ runner.temp }}/expedited-observations/failure-detection-probe.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  collect_automated:
    needs: observe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: governance-runtime
    steps:
      - name: Checkout the exact expedited candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Export same-SHA automated evidence from production MySQL
        shell: bash
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_OPS_TOKEN" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          mkdir -p automated-evidence
          v1_api="${BSIDE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -H "Authorization: Bearer $BSIDE_OPS_TOKEN" \
            "$v2_api/ops/alpha-release-evidence?code_revision=$GITHUB_SHA" \
            --output automated-evidence/global-alpha-automated-evidence.json
          jq -e \
            '.ok == true
             and .data.evidence_source == "production_database_export"
             and .data.code_revision == env.GITHUB_SHA' \
            automated-evidence/global-alpha-automated-evidence.json > /dev/null

      - name: Export exact SourceRight eligibility from production MySQL
        shell: bash
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        run: |
          set -euo pipefail
          v1_api="${BSIDE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          mkdir -p automated-evidence/source-right-evidence
          : > automated-evidence/source-right-evidence/status.tsv
          for spec in \
            'KR|official:dart|active' \
            'US|official:sec-edgar|active' \
            'CA|official:ca-issuer-ir|active' \
            'AU|official:asic-register|active' \
            'JP|official:edinet|unavailable' \
            'GB|official:companies-house|unavailable'; do
            IFS='|' read -r country source_right_id expected <<< "$spec"
            output="automated-evidence/source-right-evidence/$country.json"
            status="$(
              curl --silent --show-error --retry 2 --retry-all-errors \
                --max-time 60 --output "$output" --write-out '%{http_code}' \
                -H "Authorization: Bearer $BSIDE_OPS_TOKEN" \
                --get \
                --data-urlencode "source_right_id=$source_right_id" \
                --data-urlencode "use=public" \
                "$v2_api/ops/source-right-eligibility"
            )"
            if [[ "$expected" == "active" ]]; then
              [[ "$status" == "200" ]]
              jq -e \
                --arg source_right_id "$source_right_id" \
                '.ok == true and .eligible == true
                 and .source_right_id == $source_right_id
                 and .use == "public"
                 and (.rights_revision | type == "string" and length > 0)
                 and (.contract_revision | type == "string" and length > 0)' \
                "$output" > /dev/null
            else
              [[ "$status" == "409" ]]
              jq -e \
                --arg source_right_id "$source_right_id" \
                '.ok == false and .eligible == false
                 and .error == "source_right_ineligible"
                 and .source_right_id == $source_right_id
                 and .use == "public"
                 and (.rights_revision | type == "string" and length > 0)
                 and (.contract_revision | type == "string" and length > 0)
                 and (.reasons | type == "array" and length > 0)' \
                "$output" > /dev/null
            fi
            printf '%s\t%s\t%s\t%s\n' \
              "$country" "$source_right_id" "$expected" "$status" \
              >> automated-evidence/source-right-evidence/status.tsv
          done
          jq -n \
            --arg code_revision "$GITHUB_SHA" \
            --arg collected_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              schema_version: 1,
              kind: "bside-global-alpha-expedited-automated-collection",
              code_revision: $code_revision,
              collected_at: $collected_at,
              environment: "production"
            }' > automated-evidence/collection-provenance.json

      - name: Preserve same-run protected automated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-automated-${{ github.run_id }}-${{ github.run_attempt }}
          path: automated-evidence
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  evaluate:
    needs: [prepare_rollback, rollback_drill, observe, collect_automated]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the exact approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Enforce protected default-branch evaluation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "CREATE_EXPEDITED_ALPHA_PREPARATION" ]] || {
            echo "::error::The explicit expedited evidence confirmation did not match."
            exit 1
          }
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Expedited evidence is restricted to the default branch."
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Resolve exact named protected producer runs
        id: producers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          DART_APPLY_RUN_ID: ${{ inputs.dart_apply_run_id }}
          DART_REPLAY_RUN_ID: ${{ inputs.dart_replay_run_id }}
          SEC_APPLY_RUN_ID: ${{ inputs.sec_apply_run_id }}
          SEC_REPLAY_RUN_ID: ${{ inputs.sec_replay_run_id }}
          SELECTED_MARKETS_RUN_ID: ${{ inputs.selected_markets_run_id }}
          GOVERNANCE_PAGES_RUN_ID: ${{ inputs.governance_pages_run_id }}
          PREVIEW_SMOKE_RUN_ID: ${{ inputs.preview_smoke_run_id }}
          WEB_VITALS_RUN_ID: ${{ inputs.web_vitals_run_id }}
          WEB_VITALS_DIGEST: ${{ inputs.web_vitals_artifact_digest }}
          EDITORIAL_PUBLICATION_RUN_ID: ${{ inputs.editorial_publication_run_id }}
          EDITORIAL_PUBLICATION_DIGEST: ${{ inputs.editorial_publication_artifact_digest }}
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            const expectedSha = process.env.EXPECTED_SHA.toLowerCase();
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const specs = [
              ["dart_apply", process.env.DART_APPLY_RUN_ID, "official-backfill.yml",
                [
                  {name: (run) => `official-backfill-report-${run.id}`},
                  {pattern: /^official-backfill-checkpoint-apply-dart-\d{4}-\d{2}-\d{2}-\d{4}-\d{2}-\d{2}-false$/},
                  {name: (run) =>
                    `official-dart-frozen-replay-apply-${run.id}-${run.run_attempt}`},
                ], true],
              ["dart_replay", process.env.DART_REPLAY_RUN_ID, "official-backfill.yml",
                [
                  {name: (run) => `official-backfill-report-${run.id}`},
                  {pattern: /^official-backfill-checkpoint-replay-dart-\d{4}-\d{2}-\d{2}-\d{4}-\d{2}-\d{2}-false$/},
                ], true],
              ["sec_apply", process.env.SEC_APPLY_RUN_ID, "global-backfill.yml",
                [{name: (run) => `global-backfill-US-${run.id}-${run.run_attempt}`}], true],
              ["sec_replay", process.env.SEC_REPLAY_RUN_ID, "global-backfill.yml",
                [{name: (run) => `global-backfill-US-${run.id}-${run.run_attempt}`}], true],
              ["selected_markets", process.env.SELECTED_MARKETS_RUN_ID,
                "ingest-selected-markets.yml",
                [
                  {name: (run) => `manual-official-link-ingest-CA-${run.id}-${run.run_attempt}`},
                  {name: (run) => `manual-official-link-ingest-AU-${run.id}-${run.run_attempt}`},
                ], true],
              ["governance_pages", process.env.GOVERNANCE_PAGES_RUN_ID, "daily.yml",
                [{name: (run) => `pages-${run.id}-${run.run_attempt}`}], true],
              ["preview_smoke", process.env.PREVIEW_SMOKE_RUN_ID,
                "global-alpha-preview-smoke.yml",
                [
                  {name: (run) =>
                    `global-alpha-preview-smoke-${expectedSha}-${run.id}-${run.run_attempt}`},
                ], true],
              ["web_vitals", process.env.WEB_VITALS_RUN_ID,
                "web-vitals.yml",
                [
                  {name: (run) =>
                    `governance-web-vitals-${run.id}-${run.run_attempt}`},
                ], true],
              ["editorial_publication", process.env.EDITORIAL_PUBLICATION_RUN_ID,
                "global-alpha-expedited-editorial.yml",
                [
                  {name: (run) =>
                    `global-alpha-expedited-editorial-publication-${expectedSha}-${run.id}-${run.run_attempt}`},
                ], true],
            ];
            const manifest = {
              schema_version: 1,
              kind: "bside-global-alpha-expedited-producer-manifest",
              code_revision: expectedSha,
              producers: {},
            };
            const requestedRunIds = specs.map((spec) => String(spec[1] || "").trim());
            if (new Set(requestedRunIds).size !== requestedRunIds.length) {
              core.setFailed("Every protected producer input must use a distinct workflow run");
              return;
            }
            for (const [key, rawId, workflow, selectors, requireSameSha] of specs) {
              const text = String(rawId || "").trim();
              if (!/^[1-9][0-9]*$/.test(text)) {
                core.setFailed(`${key} run id must be a positive integer`);
                return;
              }
              const response = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: Number(text),
              });
              const run = response.data;
              const ageHours = (Date.now() - Date.parse(run.created_at)) / 3600000;
              if (
                run.conclusion !== "success" ||
                run.status !== "completed" ||
                run.event !== "workflow_dispatch" ||
                run.head_branch !== defaultBranch ||
                run.path !== `.github/workflows/${workflow}` ||
                (requireSameSha && (run.head_sha || "").toLowerCase() !== expectedSha) ||
                ageHours < -0.1 ||
                ageHours > 72
              ) {
                core.setFailed(
                  `${key} failed the workflow, success, branch, exact-SHA, or freshness contract`,
                );
                return;
              }
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id: run.id, per_page: 100},
              );
              const selected = [];
              for (const selector of selectors) {
                const matches = artifacts.filter(
                  (item) =>
                    !item.expired &&
                    (
                      selector.name
                        ? item.name === selector.name(run)
                        : selector.pattern.test(item.name)
                    ),
                );
                if (
                  matches.length !== 1 ||
                  !/^sha256:[0-9a-f]{64}$/i.test(matches[0].digest || "")
                ) {
                  core.setFailed(`${key} has no unique immutable required artifact`);
                  return;
                }
                selected.push({
                  artifact_id: matches[0].id,
                  artifact_name: matches[0].name,
                  artifact_digest: matches[0].digest.toLowerCase(),
                });
              }
              if (
                key === "editorial_publication" &&
                selected[0].artifact_digest !==
                  String(process.env.EDITORIAL_PUBLICATION_DIGEST || "").toLowerCase()
              ) {
                core.setFailed("editorial publication artifact digest did not match input");
                return;
              }
              if (
                key === "web_vitals" &&
                selected[0].artifact_digest !==
                  String(process.env.WEB_VITALS_DIGEST || "").toLowerCase()
              ) {
                core.setFailed("Web Vitals artifact digest did not match input");
                return;
              }
              manifest.producers[key] = {
                run_id: run.id,
                run_attempt: run.run_attempt,
                run_created_at: run.created_at,
                workflow: `.github/workflows/${workflow}`,
                head_sha: (run.head_sha || "").toLowerCase(),
                artifacts: selected,
              };
            }
            const legacyRunText = String(process.env.LEGACY_RUN_ID || "").trim();
            const legacyName = String(process.env.LEGACY_ARTIFACT_NAME || "").trim();
            const legacyRevision = String(process.env.LEGACY_CODE_REVISION || "").toLowerCase();
            const legacyDigest = String(process.env.LEGACY_ARTIFACT_DIGEST || "").toLowerCase();
            if (
              !/^[1-9][0-9]*$/.test(legacyRunText) ||
              !legacyName ||
              !/^[0-9a-f]{40}$/.test(legacyRevision) ||
              !/^sha256:[0-9a-f]{64}$/.test(legacyDigest)
            ) {
              core.setFailed("The pinned legacy artifact variables are invalid");
              return;
            }
            const legacyResponse = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(legacyRunText),
            });
            const legacyRun = legacyResponse.data;
            if (
              legacyRun.status !== "completed" ||
              legacyRun.conclusion !== "success" ||
              legacyRun.head_branch !== defaultBranch ||
              (legacyRun.head_sha || "").toLowerCase() !== legacyRevision ||
              legacyRun.path !== ".github/workflows/build-feed.yml"
            ) {
              core.setFailed("The pinned legacy producer failed its immutable run contract");
              return;
            }
            const legacyArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: legacyRun.id, per_page: 100},
            );
            const legacyMatches = legacyArtifacts.filter(
              (item) => item.name === legacyName && !item.expired,
            );
            if (
              legacyMatches.length !== 1 ||
              (legacyMatches[0].digest || "").toLowerCase() !== legacyDigest
            ) {
              core.setFailed("The pinned legacy artifact digest changed");
              return;
            }
            manifest.producers.legacy_archive = {
              run_id: legacyRun.id,
              run_attempt: legacyRun.run_attempt,
              workflow: ".github/workflows/build-feed.yml",
              head_sha: legacyRevision,
              artifacts: [{
                artifact_id: legacyMatches[0].id,
                artifact_name: legacyMatches[0].name,
                artifact_digest: legacyDigest,
              }],
            };
            fs.writeFileSync(
              "expedited-producer-manifest.json",
              JSON.stringify(manifest, null, 2) + "\n",
            );
            const pages = manifest.producers.governance_pages;
            core.setOutput("pages_run_id", String(pages.run_id));
            core.setOutput("pages_run_attempt", String(pages.run_attempt));
            core.setOutput("pages_artifact_id", String(pages.artifacts[0].artifact_id));
            core.setOutput("pages_artifact_name", pages.artifacts[0].artifact_name);
            core.setOutput("pages_artifact_digest", pages.artifacts[0].artifact_digest);
            for (const key of ["dart_apply", "dart_replay", "sec_apply", "sec_replay"]) {
              const producer = manifest.producers[key];
              core.setOutput(`${key}_run_id`, String(producer.run_id));
              producer.artifacts.forEach((artifact, index) => {
                core.setOutput(`${key}_artifact_${index}_id`, String(artifact.artifact_id));
              });
            }
            const previewSmoke = manifest.producers.preview_smoke;
            core.setOutput("preview_smoke_run_id", String(previewSmoke.run_id));
            core.setOutput(
              "preview_smoke_artifact_id",
              String(previewSmoke.artifacts[0].artifact_id),
            );
            core.setOutput(
              "preview_smoke_artifact_digest",
              previewSmoke.artifacts[0].artifact_digest,
            );
            const webVitals = manifest.producers.web_vitals;
            core.setOutput("web_vitals_run_id", String(webVitals.run_id));
            core.setOutput(
              "web_vitals_artifact_id",
              String(webVitals.artifacts[0].artifact_id),
            );
            core.setOutput(
              "web_vitals_artifact_digest",
              webVitals.artifacts[0].artifact_digest,
            );
            const editorialPublication = manifest.producers.editorial_publication;
            core.setOutput(
              "editorial_publication_run_id",
              String(editorialPublication.run_id),
            );
            core.setOutput(
              "editorial_publication_run_attempt",
              String(editorialPublication.run_attempt),
            );
            core.setOutput(
              "editorial_publication_run_created_at",
              editorialPublication.run_created_at,
            );
            core.setOutput(
              "editorial_publication_artifact_id",
              String(editorialPublication.artifacts[0].artifact_id),
            );
            core.setOutput(
              "editorial_publication_artifact_name",
              editorialPublication.artifacts[0].artifact_name,
            );
            core.setOutput(
              "editorial_publication_artifact_digest",
              editorialPublication.artifacts[0].artifact_digest,
            );
            core.setOutput("legacy_run_id", String(legacyRun.id));
            core.setOutput("legacy_artifact_id", String(legacyMatches[0].id));
            core.setOutput("legacy_artifact_name", legacyMatches[0].name);
            core.setOutput("legacy_artifact_digest", legacyDigest);
            core.setOutput("legacy_code_revision", legacyRevision);

