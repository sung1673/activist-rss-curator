      - name: Derive DART and SEC receipts only from immutable producer artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from curator.backfill_checkpoint_api import checkpoint_payload_hash
          from curator.dart_frozen_replay_bundle import (
              FrozenReplayBundleError,
              validate_probe_contract,
          )
          from curator.official_backfill import validate_checkpoint

          root = Path("connector-artifacts")
          payload_path = Path("expedited-inputs.json")
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          manifest = json.loads(
              Path("expedited-producer-manifest.json").read_text(encoding="utf-8")
          )
          revision = os.environ["GITHUB_SHA"].lower()
          as_of = payload["evidence_as_of"]

          def canonical_sha(value):
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def artifact_dir(producer_key, index):
              artifact = manifest["producers"][producer_key]["artifacts"][index]
              path = root / artifact["artifact_name"]
              if not path.is_dir():
                  raise SystemExit(f"missing extracted artifact directory: {path}")
              return path, artifact

          def one_file(path, name):
              matches = list(path.rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one {name}, found {len(matches)}")
              return matches[0]

          def strict_json_bytes(raw, label):
              def reject_pairs(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError(f"{label}: duplicate JSON key")
                      result[key] = value
                  return result

              def reject_constant(_value):
                  raise ValueError(f"{label}: non-finite JSON number")

              try:
                  return json.loads(
                      raw.decode("utf-8"),
                      object_pairs_hook=reject_pairs,
                      parse_constant=reject_constant,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  raise SystemExit(f"{label}: invalid strict UTF-8 JSON") from exc

          def dart_run(producer_key, replay):
              report_dir, report_artifact = artifact_dir(producer_key, 0)
              checkpoint_dir, checkpoint_artifact = artifact_dir(producer_key, 1)
              report_file = one_file(report_dir, "official-backfill-report.json")
              report = strict_json_bytes(
                  report_file.read_bytes(),
                  f"{producer_key} report",
              )
              checkpoint_file = one_file(
                  checkpoint_dir, "backfill_official_checkpoint.json"
              )
              checkpoint = validate_checkpoint(
                  json.loads(checkpoint_file.read_text(encoding="utf-8")),
                  label=producer_key,
              )
              expected_report = {
                  "status": "succeeded",
                  "dry_run": False,
                  "code_revision": revision,
                  "mode": "replay" if replay else "apply",
                  "windows_total": 30,
                  "windows_remaining": 0,
                  "windows_failed": 0,
              }
              for key, expected in expected_report.items():
                  if report.get(key) != expected:
                      raise SystemExit(
                          f"{producer_key} report field {key} is not {expected!r}"
                      )
              if replay:
                  if (
                      report.get("windows_already_completed") != 30
                      or report.get("windows_attempted") != 30
                      or report.get("windows_succeeded") != 30
                      or report.get("idempotent") is not True
                      or report.get("replay_verified") is not True
                      or report.get("checkpoint_before")
                      != report.get("checkpoint_after")
                  ):
                      raise SystemExit(
                          "DART replay must refetch all 30 windows without changing checkpoint"
                      )
              else:
                  attempted = report.get("windows_attempted")
                  previously_completed = report.get("windows_already_completed")
                  if (
                      not isinstance(attempted, int)
                      or isinstance(attempted, bool)
                      or not 0 <= attempted <= 30
                      or not isinstance(previously_completed, int)
                      or isinstance(previously_completed, bool)
                      or not 0 <= previously_completed <= 30
                      or attempted + previously_completed != 30
                      or report.get("windows_succeeded") != attempted
                      or report.get("windows_selected") != attempted
                      or report.get("windows_pending_before_limit") != attempted
                      or report.get("idempotent") is not False
                      or report.get("replay_verified") is not False
                  ):
                      raise SystemExit(
                          "DART apply execution and authoritative 30-window "
                          "resume evidence are inconsistent"
                      )
              completed = checkpoint.get("completed_windows")
              failed = checkpoint.get("failed_windows")
              if not isinstance(completed, dict) or len(completed) != 30 or failed:
                  raise SystemExit(f"{producer_key} checkpoint is not a clean 30-window set")
              job = checkpoint.get("job")
              if (
                  not isinstance(job, dict)
                  or job.get("code_revision") != revision
                  or job.get("sources") != ["dart"]
                  or job.get("fingerprint") != report.get("job_fingerprint")
              ):
                  raise SystemExit(f"{producer_key} checkpoint job contract is invalid")
              checkpoint_hash = checkpoint_payload_hash(checkpoint)
              if report.get("checkpoint_payload_sha256") != checkpoint_hash:
                  raise SystemExit(
                      f"{producer_key} report is not bound to its checkpoint bytes"
                  )
              contract = report.get("receipt_contract")
              windows = contract.get("windows") if isinstance(contract, dict) else None
              if (
                  not isinstance(contract, dict)
                  or contract.get("schema_version") != 1
                  or contract.get("source") != "dart"
                  or contract.get("mode") != ("replay" if replay else "apply")
                  or contract.get("job_fingerprint") != report.get("job_fingerprint")
                  or contract.get("checkpoint_payload_sha256") != checkpoint_hash
                  or contract.get("window_count") != 30
                  or not isinstance(windows, list)
                  or len(windows) != 30
              ):
                  raise SystemExit(
                      f"{producer_key} actual receipt contract is incomplete"
                  )
              previous_end = None
              for index, window in enumerate(windows):
                  if (
                      not isinstance(window, dict)
                      or window.get("status") != "complete"
                      or window.get("code_revision") != revision
                      or window.get("raw_count")
                      != window.get("filtered_out_count")
                      + window.get("accepted_count")
                      or window.get("accepted_count")
                      != window.get("acknowledged_count")
                      or window.get("idempotent") is not replay
                      or window.get("replay_verified") is not replay
                      or (
                          previous_end is not None
                          and window.get("window_start") != previous_end
                      )
                  ):
                      raise SystemExit(
                          f"{producer_key} actual receipt window {index + 1} is invalid"
                      )
                  previous_end = window.get("window_end_exclusive")
              binding = None
              immutable = {
                  "report_artifact": report_artifact,
                  "report_sha256": hashlib.sha256(report_file.read_bytes()).hexdigest(),
              }
              if replay:
                  binding = json.loads(
                      one_file(
                          report_dir, "dart-replay-state-binding.json"
                      ).read_text(encoding="utf-8")
                  )
                  binding_unsigned = {
                      key: value
                      for key, value in binding.items()
                      if key != "binding_sha256"
                  }
                  before = binding.get("before")
                  after = binding.get("after")
                  before_contract = (
                      {
                          key: value
                          for key, value in before.items()
                          if key != "collected_at"
                      }
                      if isinstance(before, dict)
                      else None
                  )
                  after_contract = (
                      {
                          key: value
                          for key, value in after.items()
                          if key != "collected_at"
                      }
                      if isinstance(after, dict)
                      else None
                  )
                  replay_state = report.get("replay_state")
                  if (
                      binding.get("schema_version") != 1
                      or binding.get("kind")
                      != "official-dart-replay-state-binding"
                      or binding.get("environment") != "production"
                      or binding.get("is_synthetic") is not False
                      or binding.get("code_revision") != revision
                      or binding.get("state_unchanged") is not True
                      or binding.get("checkpoint_unchanged") is not True
                      or before_contract != after_contract
                      or binding.get("receipt_contract_sha256")
                      != canonical_sha(contract)
                      or binding.get("binding_sha256")
                      != canonical_sha(binding_unsigned)
                      or not isinstance(replay_state, dict)
                      or replay_state.get("before") != before
                      or replay_state.get("after") != after
                      or replay_state.get("state_unchanged") is not True
                      or replay_state.get("checkpoint_unchanged") is not True
                      or replay_state.get("binding_sha256")
                      != binding.get("binding_sha256")
                  ):
                      raise SystemExit(
                          "DART replay state binding does not prove unchanged production state"
                      )
                  result_rows = report.get("window_results")
                  if (
                      not isinstance(result_rows, list)
                      or len(result_rows) != 30
                      or any(
                          not isinstance(row, dict)
                          or row.get("apply_summary_counts_sha256")
                          != row.get("replay_summary_counts_sha256")
                          for row in result_rows
                      )
                  ):
                      raise SystemExit(
                          "DART replay results do not bind all apply/replay count hashes"
                      )
                  frozen_binding_file = one_file(
                      report_dir, "dart-frozen-replay-artifact-binding.json"
                  )
                  drift_file = one_file(report_dir, "dart-replay-drift-probe.json")
                  frozen_binding_bytes = frozen_binding_file.read_bytes()
                  drift_bytes = drift_file.read_bytes()
                  frozen_binding = strict_json_bytes(
                      frozen_binding_bytes,
                      "DART frozen replay artifact binding",
                  )
                  drift = strict_json_bytes(
                      drift_bytes,
                      "DART fresh drift probe",
                  )
                  frozen_report = report.get("frozen_replay")
                  drift_report = (
                      frozen_report.get("drift_probe")
                      if isinstance(frozen_report, dict)
                      else None
                  )
                  probe_range_start = frozen_binding.get("range_start")
                  probe_range_end = frozen_binding.get(
                      "range_end_exclusive"
                  )
                  probe_fingerprint = frozen_binding.get("job_fingerprint")
                  if (
                      not isinstance(probe_range_start, str)
                      or not isinstance(probe_range_end, str)
                      or not isinstance(probe_fingerprint, str)
                      or probe_range_start != report.get("range_start")
                      or probe_range_end != report.get("range_end_exclusive")
                      or probe_fingerprint != report.get("job_fingerprint")
                  ):
                      raise SystemExit(
                          "DART fresh drift probe expected range is not bound "
                          "to the replay producer"
                      )
                  try:
                      drift_validation = validate_probe_contract(
                          drift,
                          expected_code_revision=revision,
                          expected_range_start=probe_range_start,
                          expected_range_end_exclusive=probe_range_end,
                          expected_job_fingerprint=probe_fingerprint,
                      )
                  except FrozenReplayBundleError as exc:
                      raise SystemExit(
                          "DART fresh drift probe raw bytes do not prove an "
                          "exact release-gate-safe 30-day source observation"
                      ) from exc
                  diagnostic_only_window_count = drift.get(
                      "diagnostic_only_window_count"
                  )
                  if (
                      frozen_binding.get("kind")
                      != "official-dart-frozen-replay-artifact-binding"
                      or frozen_binding.get("consumer", {}).get("run_id")
                      != manifest["producers"][producer_key]["run_id"]
                      or frozen_binding.get("consumer", {}).get("code_revision")
                      != revision
                      or frozen_binding.get("artifact_sanitization", {}).get("status")
                      != "verified"
                      or drift.get("kind") != "official-dart-fresh-drift-probe"
                      or drift.get("code_revision") != revision
                      or drift.get("status") not in {"matched", "drift_detected"}
                      or drift.get("release_gate_policy")
                      != "stable-public-payload-source-count-diagnostic-v1"
                      or drift.get("release_gate_matched") is not True
                      or isinstance(diagnostic_only_window_count, bool)
                      or not isinstance(diagnostic_only_window_count, int)
                      or not 0 <= diagnostic_only_window_count <= 30
                      or drift.get("blocking_drift_window_count") != 0
                      or (
                          drift.get("status") == "matched"
                          and diagnostic_only_window_count != 0
                      )
                      or (
                          drift.get("status") == "drift_detected"
                          and diagnostic_only_window_count < 1
                      )
                      or drift.get("read_only") is not True
                      or drift.get("governance_write_attempted") is not False
                      or drift.get("checkpoint_write_attempted") is not False
                      or drift.get("quota_ledger_write_attempted") is not True
                      or drift.get("artifact_sanitization", {}).get("status")
                      != "verified"
                      or drift_validation.get("release_gate_policy")
                      != "stable-public-payload-source-count-diagnostic-v1"
                      or drift_validation.get("release_gate_matched") is not True
                      or drift_validation.get("diagnostic_only_window_count")
                      != diagnostic_only_window_count
                      or drift_validation.get("blocking_drift_window_count") != 0
                      or drift_validation.get("window_count") != 30
                      or not isinstance(frozen_report, dict)
                      or frozen_report.get("apply_artifact_binding_sha256")
                      != hashlib.sha256(frozen_binding_bytes).hexdigest()
                      or frozen_report.get("apply_manifest_sha256")
                      != frozen_binding.get("manifest_sha256")
                      or not isinstance(drift_report, dict)
                      or drift_report.get("status") != drift.get("status")
                      or drift_report.get("release_gate_policy")
                      != drift.get("release_gate_policy")
                      or drift_report.get("release_gate_matched") is not True
                      or drift_report.get("diagnostic_only_window_count")
                      != diagnostic_only_window_count
                      or drift_report.get("blocking_drift_window_count") != 0
                      or drift_report.get("read_only") is not True
                      or drift_report.get("governance_write_attempted") is not False
                      or drift_report.get("checkpoint_write_attempted") is not False
                      or drift_report.get("quota_ledger_write_attempted") is not True
                      or drift_report.get("sha256")
                      != hashlib.sha256(drift_bytes).hexdigest()
                  ):
                      raise SystemExit(
                          "DART fresh drift probe is not release-gate safe, "
                          "read-only, and immutably bound"
                      )
                  immutable.update(
                      {
                          "frozen_binding": frozen_binding,
                          "frozen_binding_sha256": hashlib.sha256(
                              frozen_binding_bytes
                          ).hexdigest(),
                          "drift_probe": drift,
                          "drift_probe_sha256": hashlib.sha256(drift_bytes).hexdigest(),
                      }
                  )
              else:
                  frozen_dir, frozen_artifact = artifact_dir(producer_key, 2)
                  frozen_manifest_file = one_file(frozen_dir, "manifest.json")
                  frozen_manifest_bytes = frozen_manifest_file.read_bytes()
                  frozen_manifest = strict_json_bytes(
                      frozen_manifest_bytes,
                      "DART frozen apply manifest",
                  )
                  artifact_binding_file = one_file(
                      report_dir, "dart-frozen-apply-artifact-binding.json"
                  )
                  artifact_binding_bytes = artifact_binding_file.read_bytes()
                  artifact_binding = strict_json_bytes(
                      artifact_binding_bytes,
                      "DART frozen apply upload binding",
                  )
                  frozen_windows = frozen_manifest.get("windows")
                  if (
                      frozen_manifest.get("kind")
                      != "official-dart-frozen-replay-bundle"
                      or frozen_manifest.get("code_revision") != revision
                      or frozen_manifest.get("mode") != "apply"
                      or frozen_manifest.get("source") != "dart"
                      or frozen_manifest.get("job", {}).get("fingerprint")
                      != report.get("job_fingerprint")
                      or frozen_manifest.get("checkpoint", {}).get("payload_sha256")
                      != checkpoint_hash
                      or not isinstance(frozen_windows, list)
                      or len(frozen_windows) != 30
                      or artifact_binding.get("kind")
                      != "official-dart-frozen-apply-artifact-binding"
                      or artifact_binding.get("producer", {}).get("run_id")
                      != manifest["producers"][producer_key]["run_id"]
                      or artifact_binding.get("producer", {}).get("code_revision")
                      != revision
                      or artifact_binding.get("artifact", {}).get("id")
                      != frozen_artifact["artifact_id"]
                      or artifact_binding.get("artifact", {}).get("name")
                      != frozen_artifact["artifact_name"]
                      or artifact_binding.get("artifact", {}).get("digest")
                      != frozen_artifact["artifact_digest"]
                      or artifact_binding.get("manifest_sha256")
                      != hashlib.sha256(frozen_manifest_bytes).hexdigest()
                      or artifact_binding.get("artifact_sanitization", {}).get("status")
                      != "verified"
                  ):
                      raise SystemExit(
                          "DART apply frozen bundle is not bound to its immutable artifact"
                      )
                  listed = {"manifest.json"}
                  for index, row in enumerate(frozen_windows):
                      relative = row.get("path") if isinstance(row, dict) else None
                      leaf = frozen_dir / str(relative or "")
                      if (
                          not isinstance(row, dict)
                          or row.get("index") != index
                          or not isinstance(relative, str)
                          or not relative.startswith("windows/")
                          or ".." in Path(relative).parts
                          or not leaf.is_file()
                          or leaf.stat().st_size != row.get("byte_size")
                          or hashlib.sha256(leaf.read_bytes()).hexdigest()
                          != row.get("sha256")
                      ):
                          raise SystemExit(
                              f"DART frozen apply leaf {index + 1} is invalid"
                          )
                      strict_json_bytes(
                          leaf.read_bytes(),
                          f"DART frozen apply leaf {index + 1}",
                      )
                      listed.add(Path(relative).as_posix())
                  actual = {
                      path.relative_to(frozen_dir).as_posix()
                      for path in frozen_dir.rglob("*")
                      if path.is_file()
                  }
                  if actual != listed:
                      raise SystemExit("DART frozen apply artifact has an unlisted file")
                  immutable.update(
                      {
                          "frozen_artifact": frozen_artifact,
                          "frozen_manifest": frozen_manifest,
                          "frozen_manifest_sha256": hashlib.sha256(
                              frozen_manifest_bytes
                          ).hexdigest(),
                          "frozen_artifact_binding": artifact_binding,
                          "frozen_artifact_binding_sha256": hashlib.sha256(
                              artifact_binding_bytes
                          ).hexdigest(),
                      }
                  )
              producer = manifest["producers"][producer_key]
              return {
                  "run_id": producer["run_id"],
                  "artifact_id": checkpoint_artifact["artifact_id"],
                  "artifact_name": checkpoint_artifact["artifact_name"],
                  "artifact_sha256": checkpoint_artifact["artifact_digest"].removeprefix(
                      "sha256:"
                  ),
                  "status": "succeeded",
                  "code_revision": revision,
                  "execution_window_count": report.get("windows_attempted"),
                  "preexisting_window_count": report.get(
                      "windows_already_completed"
                  ),
                  "evidenced_window_count": len(windows),
                  "windows": windows,
              }, checkpoint_file.read_bytes(), checkpoint, report, binding, immutable

          (
              dart_apply,
              dart_apply_bytes,
              dart_apply_checkpoint,
              dart_apply_report,
              _dart_apply_binding,
              dart_apply_immutable,
          ) = dart_run("dart_apply", False)
          (
              dart_replay,
              dart_replay_bytes,
              dart_replay_checkpoint,
              dart_replay_report,
              dart_replay_binding,
              dart_replay_immutable,
          ) = dart_run("dart_replay", True)
          if (
              dart_apply_bytes != dart_replay_bytes
              or dart_apply_checkpoint != dart_replay_checkpoint
          ):
              raise SystemExit(
                  "DART apply and replay checkpoints are not byte/canonical identical"
              )
          if dart_replay_report.get("apply_receipt_contract") != (
              dart_apply_report.get("receipt_contract")
          ):
              raise SystemExit(
                  "DART replay is not bound to the exact apply receipt contract"
              )
          stable_fields = (
              "window_start",
              "window_end_exclusive",
              "raw_count",
              "filtered_out_count",
              "accepted_count",
              "acknowledged_count",
              "status",
              "code_revision",
              "payload_sha256",
              "idempotency_key",
              "ingest_id",
          )
          apply_windows = dart_apply["windows"]
          replay_windows = dart_replay["windows"]
          for index, (apply_window, replay_window) in enumerate(
              zip(apply_windows, replay_windows, strict=True)
          ):
              if any(
                  apply_window.get(field) != replay_window.get(field)
                  for field in stable_fields
              ):
                  raise SystemExit(
                      f"DART apply/replay receipt counts differ at window {index + 1}"
                  )
          if not isinstance(dart_replay_binding, dict):
              raise SystemExit("DART replay binding artifact is missing")
          apply_artifact = dart_apply_immutable["frozen_artifact"]
          replay_artifact = dart_replay_immutable["frozen_binding"]["artifact"]
          if (
              replay_artifact.get("id") != apply_artifact["artifact_id"]
              or replay_artifact.get("name") != apply_artifact["artifact_name"]
              or replay_artifact.get("digest") != apply_artifact["artifact_digest"]
              or dart_replay_immutable["frozen_binding"].get("manifest_sha256")
              != dart_apply_immutable["frozen_manifest_sha256"]
          ):
              raise SystemExit(
                  "DART replay did not consume the exact immutable apply artifact"
              )
          apply_receipt = dart_apply_report.get("receipt_contract")
          replay_receipt = dart_replay_report.get("receipt_contract")
          frozen_manifest_sha256 = dart_apply_immutable["frozen_manifest_sha256"]
          if (
              not isinstance(apply_receipt, dict)
              or apply_receipt.get("frozen_bundle_manifest_sha256")
              != frozen_manifest_sha256
              or not isinstance(replay_receipt, dict)
              or replay_receipt.get("frozen_bundle_manifest_sha256")
              != frozen_manifest_sha256
              or replay_receipt.get("frozen_artifact_binding_sha256")
              != dart_replay_immutable["frozen_binding_sha256"]
              or replay_receipt.get("source_network_accessed") is not False
          ):
              raise SystemExit(
                  "DART apply/replay receipt payloads are not bound to frozen bytes"
              )
          dart_apply["frozen_bundle_manifest_sha256"] = frozen_manifest_sha256
          dart_replay.update(
              {
                  "frozen_bundle_manifest_sha256": frozen_manifest_sha256,
                  "frozen_artifact_binding_sha256": dart_replay_immutable[
                      "frozen_binding_sha256"
                  ],
                  "source_network_accessed": False,
                  "fresh_drift_probe": {
                      "status": dart_replay_immutable["drift_probe"]["status"],
                      "release_gate_policy": (
                          dart_replay_immutable["drift_probe"][
                              "release_gate_policy"
                          ]
                      ),
                      "release_gate_matched": True,
                      "diagnostic_only_window_count": (
                          dart_replay_immutable["drift_probe"][
                              "diagnostic_only_window_count"
                          ]
                      ),
                      "blocking_drift_window_count": 0,
                      "sha256": dart_replay_immutable["drift_probe_sha256"],
                      "read_only": True,
                      "governance_write_attempted": False,
                      "checkpoint_write_attempted": False,
                      "quota_ledger_write_attempted": True,
                  },
              }
          )

          def sec_run(producer_key, expected_mode):
              artifact_dir_path, artifact = artifact_dir(producer_key, 0)
              summaries = list(
                  artifact_dir_path.rglob("global-backfill-US-summary.json")
              )
              if len(summaries) != 1:
                  raise SystemExit(f"{producer_key}: exact SEC summary is missing")
              summary = json.loads(summaries[0].read_text(encoding="utf-8"))
              if (
                  summary.get("status") != "succeeded"
                  or summary.get("country_code") != "US"
                  or summary.get("mode") != expected_mode
                  or summary.get("code_revision") != revision
                  or summary.get("processed_windows") != 30
                  or len(summary.get("receipts", [])) != 30
              ):
                  raise SystemExit(f"{producer_key}: SEC summary contract failed")
              day_files = sorted(artifact_dir_path.rglob("US-????-??-??.json"))
              if len(day_files) != 30:
                  raise SystemExit(f"{producer_key}: SEC requires 30 per-day receipts")
              windows = []
              for path in day_files:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  window = item.get("window")
                  raw = item.get("raw_count")
                  acknowledged = item.get("acknowledged_count")
                  request_count = item.get("request_count")
                  if (
                      item.get("status") != "succeeded"
                      or item.get("country_code") != "US"
                      or item.get("connector_id") != "connector:us:sec-edgar"
                      or item.get("code_revision") != revision
                      or item.get("collection_mode") != "completed-day"
                      or not isinstance(window, dict)
                      or not isinstance(raw, int)
                      or isinstance(raw, bool)
                      or not isinstance(acknowledged, int)
                      or isinstance(acknowledged, bool)
                      or not isinstance(request_count, int)
                      or isinstance(request_count, bool)
                      or not 1 <= request_count <= 6
                      or raw < acknowledged
                      or acknowledged < 0
                  ):
                      raise SystemExit(f"{producer_key}: invalid SEC receipt {path.name}")
                  replay = item.get("replay_verification")
                  if expected_mode == "replay":
                      if (
                          item.get("idempotent") is not True
                          or not isinstance(replay, dict)
                          or replay.get("attempted") is not True
                          or replay.get("same_payload") is not True
                          or replay.get("idempotent") is not True
                          or replay.get("read_only") is not True
                          or replay.get("idempotency_keys_match") is not True
                          or replay.get("ingest_ids_match") is not True
                      ):
                          raise SystemExit(
                              f"{producer_key}: SEC replay verification failed"
                          )
                  elif "replay_verification" in item or item.get("idempotent") is not False:
                      raise SystemExit(f"{producer_key}: SEC apply is not a first apply")
                  idempotency_key = item.get("idempotency_key")
                  ingest_id = item.get("ingest_id")
                  if not isinstance(idempotency_key, str) or not idempotency_key:
                      raise SystemExit(f"{producer_key}: missing idempotency key")
                  if not isinstance(ingest_id, str) or not ingest_id:
                      raise SystemExit(f"{producer_key}: missing ingest id")
                  stable = {
                      "window": window,
                      "raw_count": raw,
                      "acknowledged_count": acknowledged,
                      "idempotency_key": idempotency_key,
                      "ingest_id": ingest_id,
                  }
                  windows.append(
                      {
                          "window_start": window["start"],
                          "window_end_exclusive": window["end_exclusive"],
                          "status": "complete",
                          "code_revision": revision,
                          "raw_count": raw,
                          "filtered_out_count": raw - acknowledged,
                          "accepted_count": acknowledged,
                          "acknowledged_count": acknowledged,
                          "payload_sha256": canonical_sha(stable),
                          "receipt_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                          "idempotency_key": idempotency_key,
                          "ingest_id": ingest_id,
                          "idempotent": expected_mode == "replay",
                          "replay_verified": expected_mode == "replay",
                      }
                  )
              windows.sort(key=lambda value: value["window_start"])
              producer = manifest["producers"][producer_key]
              return {
                  "run_id": producer["run_id"],
                  "artifact_id": artifact["artifact_id"],
                  "artifact_name": artifact["artifact_name"],
                  "artifact_sha256": artifact["artifact_digest"].removeprefix(
                      "sha256:"
                  ),
                  "status": "succeeded",
                  "code_revision": revision,
                  "windows": windows,
              }

          sec_apply = sec_run("sec_apply", "apply")
          sec_replay = sec_run("sec_replay", "replay")
          payload["connector_receipts"] = {
              "schema_version": 1,
              "kind": "bside-global-alpha-expedited-connector-receipts-v2",
              "environment": "production",
              "evidence_source": "immutable_producer_artifacts",
              "is_synthetic": False,
              "code_revision": revision,
              "collected_at": as_of,
              "evidence_as_of": as_of,
              "connectors": [
                  {
                      "connector_family": "dart",
                      "country": "KR",
                      "apply_run": dart_apply,
                      "replay_run": dart_replay,
                  },
                  {
                      "connector_family": "sec-edgar",
                      "country": "US",
                      "apply_run": sec_apply,
                      "replay_run": sec_replay,
                  },
              ],
          }
          payload_path.write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Inject actual source, experience, rollback, and integrity evidence
        shell: bash
        env:
          PREVIEW_SMOKE_ARTIFACT_DIGEST: ${{ steps.producers.outputs.preview_smoke_artifact_digest }}
          WEB_VITALS_ARTIFACT_DIGEST: ${{ steps.producers.outputs.web_vitals_artifact_digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def canonical_sha(value):
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          path = Path("expedited-inputs.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          revision = os.environ["GITHUB_SHA"].lower()
          as_of = payload["evidence_as_of"]
          observations = payload["observations"]
          last_sources = observations[-1]["sources"]
          if {item.get("country") for item in last_sources} != {
              "KR", "US", "JP", "GB", "CA", "AU"
          }:
              raise SystemExit("actual Preview observation omitted the exact six-country set")
          rights = {
              "KR": "official:dart",
              "US": "official:sec-edgar",
              "JP": "official:edinet",
              "GB": "official:companies-house",
              "CA": "official:ca-issuer-ir",
              "AU": "official:asic-register",
          }
          rights_evidence = {}
          for evidence_path in Path("automated-evidence/source-right-evidence").glob(
              "??.json"
          ):
              record = json.loads(evidence_path.read_text(encoding="utf-8"))
              rights_evidence[evidence_path.stem] = record
          if set(rights_evidence) != set(rights):
              raise SystemExit("actual SourceRight evidence omitted a required country")
          source_rows = []
          for actual in sorted(last_sources, key=lambda item: item["country"]):
              country = actual["country"]
              right = rights_evidence[country]
              expected_active = country in {"KR", "US", "CA", "AU"}
              right_contract_valid = (
                  right.get("source_right_id") == rights[country]
                  and right.get("use") == "public"
                  and isinstance(right.get("rights_revision"), str)
                  and bool(right.get("rights_revision"))
                  and isinstance(right.get("contract_revision"), str)
                  and bool(right.get("contract_revision"))
                  and (
                      (
                          expected_active
                          and right.get("ok") is True
                          and right.get("eligible") is True
                      )
                      or (
                          not expected_active
                          and right.get("ok") is False
                          and right.get("eligible") is False
                          and right.get("error") == "source_right_ineligible"
                      )
                  )
              )
              source_rows.append(
                  {
                      "country": country,
                      "source_right_id": rights[country],
                      "source_right_valid": right_contract_valid,
                      "connector_id": actual["connector_id"],
                      "coverage_mode": actual["coverage_mode"],
                      "public_status": actual["public_status"],
                      "public_ready": actual["public_ready"],
                      "raw_count": actual["raw_count"],
                      "acknowledged_count": actual["acknowledged_count"],
                  }
              )
          payload["source_readiness"] = {
              "schema_version": 1,
              "kind": "bside-global-alpha-expedited-source-readiness",
              "environment": "production",
              "evidence_source": "production_preview_sources_status",
              "is_synthetic": False,
              "code_revision": revision,
              "collected_at": as_of,
              "evidence_as_of": as_of,
              "sources": source_rows,
          }

          preview_receipts = []
          for receipt_path in Path("preview-smoke-evidence").rglob("preview-*.json"):
              record = json.loads(receipt_path.read_text(encoding="utf-8"))
              if record.get("evidence_type") == "global_alpha_remote_preview_smoke":
                  preview_receipts.append(record)
          if len(preview_receipts) != 3:
              raise SystemExit("remote Preview evidence must contain exact three viewports")
          viewports = []
          api_responses = None
          for record in preview_receipts:
              viewport = record.get("viewport")
              if (
                  record.get("status") != "completed"
                  or record.get("code_revision") != revision
                  or record.get("ui_build_sha") != revision
                  or record.get("api_code_revision") != revision
                  or record.get("used_mock_routes") is not False
                  or record.get("v1_fallback_count") != 0
                  or not isinstance(viewport, dict)
              ):
                  raise SystemExit("remote Preview receipt failed its production contract")
              viewport_name = f"{viewport.get('width')}x{viewport.get('height')}"
              row = {
                  "viewport": viewport_name,
                  "visual_regression_passed": (
                      record.get("visual_regression_passed") is True
                  ),
                  "axe_serious_count": record.get("axe_serious_count"),
                  "axe_critical_count": record.get("axe_critical_count"),
              }
              if viewport_name == "390x844":
                  row["first_important_event_top_px"] = record.get(
                      "first_important_event_top_px"
                  )
              viewports.append(row)
              budget = record.get("api_budget_receipts")
              if api_responses is None:
                  api_responses = budget
              elif budget != api_responses:
                  raise SystemExit("API byte receipts changed between viewport journeys")
          if {item["viewport"] for item in viewports} != {
              "390x844", "768x1024", "1440x900"
          }:
              raise SystemExit("remote Preview omitted a required viewport")
          if not isinstance(api_responses, list) or len(api_responses) != 10:
              raise SystemExit("remote Preview omitted exact API byte receipts")

          vitals_paths = list(
              Path("web-vitals-evidence").rglob("web-vitals-run-summary.json")
          )
          if len(vitals_paths) != 1:
              raise SystemExit("Web Vitals artifact must contain one run summary")
          vitals = json.loads(vitals_paths[0].read_text(encoding="utf-8"))
          if (
              vitals.get("schema_version") != 1
              or vitals.get("build_sha") != revision
              or vitals.get("source") != "first_party"
              or vitals.get("device_class") != "mobile"
              or vitals.get("accepted_count") != vitals.get("observation_count")
              or vitals.get("observation_count") != 60
          ):
              raise SystemExit("actual production Web Vitals summary failed")
          metrics = vitals.get("measured_metrics")
          if not isinstance(metrics, dict):
              raise SystemExit("actual Web Vitals summary omitted measured p75 values")

          detection = json.loads(
              Path(
                  "expedited-observations/failure-detection-drill.json"
              ).read_text(encoding="utf-8")
          )
          if (
              detection.get("kind")
              != "bside-expedited-watchdog-failure-detection-drill"
              or detection.get("code_revision") != revision
              or detection.get("succeeded") is not True
              or detection.get("detection_seconds", 601) > 600
          ):
              raise SystemExit("actual watchdog failure-detection drill failed")
          payload["experience"] = {
              "schema_version": 1,
              "kind": "bside-global-alpha-experience",
              "environment": "production",
              "evidence_source": "immutable_preview_and_web_vitals_artifacts",
              "is_synthetic": False,
              "code_revision": revision,
              "collected_at": observations[-1]["observed_at"],
              "evidence_as_of": as_of,
              "viewports": viewports,
              "web_vitals": metrics,
              "api_responses": api_responses,
              "failure_detection_drill": {
                  "incident_started_at": detection["incident_started_at"],
                  "detected_at": detection["detected_at"],
                  "detection_minutes": detection["detection_minutes"],
              },
              "producer_artifacts": {
                  "preview_smoke_artifact_digest": os.environ[
                      "PREVIEW_SMOKE_ARTIFACT_DIGEST"
                  ],
                  "web_vitals_artifact_digest": os.environ[
                      "WEB_VITALS_ARTIFACT_DIGEST"
                  ],
                  "observations_sha256": canonical_sha(observations),
                  "failure_detection_receipt_sha256": canonical_sha(detection),
              },
          }

          drill = json.loads(
              Path("actual-rollback-drill/expedited-rollback-drill.json").read_text(
                  encoding="utf-8"
              )
          )
          if (
              drill.get("status") != "succeeded"
              or drill.get("code_revision") != revision
              or drill.get("preview_restore_verified") is not True
              or drill.get("duration_seconds", 601) > 600
          ):
              raise SystemExit("actual protected rollback drill is not release eligible")
          payload["experience"]["rollback_drill"] = {
              "duration_minutes": drill["duration_minutes"],
              "succeeded": True,
              "legacy_artifact_sha256": drill["legacy_artifact_sha256"],
              "started_at": drill["started_at"],
              "completed_at": drill["legacy_deployed_at"],
          }
          payload["experience"]["rollback_drill_receipt"] = drill
          payload["experience"]["producer_artifacts"][
              "rollback_drill_receipt_sha256"
          ] = canonical_sha(drill)

          automated = json.loads(
              Path(
                  "automated-evidence/global-alpha-automated-evidence.json"
              ).read_text(encoding="utf-8")
          )
          data = automated.get("data")
          if (
              automated.get("ok") is not True
              or not isinstance(data, dict)
              or data.get("evidence_source") != "production_database_export"
              or data.get("code_revision") != revision
          ):
              raise SystemExit("production automated evidence contract failed")
          actual_content = data.get("content_integrity")
          if not isinstance(actual_content, dict):
              raise SystemExit("production automated evidence omitted content integrity")
          if (
              actual_content.get("code_revision") != revision
              or actual_content.get("evidence_source")
              != "production_database_export"
              or actual_content.get("is_synthetic") is not False
          ):
              raise SystemExit("production content-integrity provenance failed")
          actual_content = dict(actual_content)
          actual_content["evidence_as_of"] = as_of
          payload["content_integrity"] = actual_content

          database_connectors = {
              item.get("connector_family"): item
              for item in data.get("connector_coverage", [])
              if isinstance(item, dict)
          }
          if set(database_connectors) != {"dart", "sec-edgar"}:
              raise SystemExit("production MySQL omitted exact DART/SEC connector coverage")
          for connector in payload["connector_receipts"]["connectors"]:
              family = connector["connector_family"]
              actual_windows = database_connectors[family].get("completed_windows", [])
              expected_windows = connector["apply_run"]["windows"]
              actual_by_date = {
                  row.get("window_start"): row for row in actual_windows
              }
              if len(actual_by_date) != 30:
                  raise SystemExit(f"{family}: production MySQL does not contain 30 windows")
              for expected in expected_windows:
                  actual = actual_by_date.get(expected["window_start"])
                  if actual is None:
                      raise SystemExit(f"{family}: production window is missing")
                  for field in (
                      "window_end_exclusive",
                      "raw_count",
                      "filtered_out_count",
                      "accepted_count",
                      "acknowledged_count",
                      "code_revision",
                  ):
                      if actual.get(field) != expected.get(field):
                          raise SystemExit(
                              f"{family}: artifact and production DB differ on {field}"
                          )

          path.write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify protected input producer identities
        shell: bash
        env:
          LEGACY_ARTIFACT_ID: ${{ steps.producers.outputs.legacy_artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("expedited-inputs.json").read_text(encoding="utf-8"))
          manifest = json.loads(
              Path("expedited-producer-manifest.json").read_text(encoding="utf-8")
          )
          if payload.get("code_revision") != os.environ["GITHUB_SHA"].lower():
              raise SystemExit("protected input revision does not match the workflow SHA")
          expected = {
              ("dart", "apply_run"): "dart_apply",
              ("dart", "replay_run"): "dart_replay",
              ("sec-edgar", "apply_run"): "sec_apply",
              ("sec-edgar", "replay_run"): "sec_replay",
          }
          connectors = payload.get("connector_receipts", {}).get("connectors", [])
          by_family = {
              item.get("connector_family"): item
              for item in connectors
              if isinstance(item, dict)
          }
          for (family, field), producer_key in expected.items():
              run = by_family.get(family, {}).get(field, {})
              producer = manifest["producers"][producer_key]
              artifact_index = 1 if producer_key.startswith("dart_") else 0
              artifact = producer["artifacts"][artifact_index]
              actual = {
                  "run_id": producer["run_id"],
                  "artifact_id": artifact["artifact_id"],
                  "artifact_name": artifact["artifact_name"],
                  "artifact_sha256": artifact["artifact_digest"].removeprefix("sha256:"),
              }
              claimed = {
                  "run_id": run.get("run_id"),
                  "artifact_id": run.get("artifact_id"),
                  "artifact_name": run.get("artifact_name"),
                  "artifact_sha256": str(run.get("artifact_sha256", "")).removeprefix("sha256:"),
              }
              if claimed != actual:
                  raise SystemExit(f"{producer_key} protected provenance mismatch")
          legacy = payload.get("legacy_archive", {})
          expected_legacy = {
              "artifact_id": int(os.environ["LEGACY_ARTIFACT_ID"]),
              "artifact_name": os.environ["LEGACY_ARTIFACT_NAME"],
              "archive_sha256": os.environ["LEGACY_ARTIFACT_DIGEST"].removeprefix("sha256:"),
          }
          claimed_legacy = {
              "artifact_id": legacy.get("artifact_id"),
              "artifact_name": legacy.get("artifact_name"),
              "archive_sha256": str(legacy.get("archive_sha256", "")).removeprefix("sha256:"),
          }
          if claimed_legacy != expected_legacy:
              raise SystemExit("legacy archive protected provenance mismatch")
          PY

      - name: Freeze machine-only preparation before editorial binding
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .release_channel == "production_alpha_early_access"
            and (has("human_review") | not)
            and (has("approval") | not)
            and (.observations | length) == 7
            and (.connector_receipts.connectors | length) == 2
            and (.source_readiness.sources | length) == 6
          ' expedited-inputs.json > /dev/null
          jq '.kind = "bside-global-alpha-expedited-preparation-input"' \
            expedited-inputs.json > expedited-preparation.json
          evidence_as_of="$(jq -er '.evidence_as_of' expedited-preparation.json)"
          echo "evidence_as_of=$evidence_as_of" >> "$GITHUB_OUTPUT"

      - name: Verify actual editorial publication and inject its immutable identity
        shell: bash
        env:
          EDITORIAL_RUN_ID: ${{ steps.producers.outputs.editorial_publication_run_id }}
          EDITORIAL_RUN_ATTEMPT: ${{ steps.producers.outputs.editorial_publication_run_attempt }}
          EDITORIAL_RUN_CREATED_AT: ${{ steps.producers.outputs.editorial_publication_run_created_at }}
          EDITORIAL_ARTIFACT_ID: ${{ steps.producers.outputs.editorial_publication_artifact_id }}
          EDITORIAL_ARTIFACT_NAME: ${{ steps.producers.outputs.editorial_publication_artifact_name }}
          EDITORIAL_ARTIFACT_DIGEST: ${{ steps.producers.outputs.editorial_publication_artifact_digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def one(name):
              paths = list(Path("editorial-publication").rglob(name))
              if len(paths) != 1:
                  raise SystemExit(
                      f"editorial publication must contain exactly one {name}"
                  )
              return paths[0]

          def load(name):
              return json.loads(one(name).read_text(encoding="utf-8"))

          def canonical_sha(value):
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def file_sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          human_path = one("human-review.json")
          receipt_path = one("publication-receipt.json")
          replay_path = one("publication-replay-receipt.json")
          human = json.loads(human_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          replay = json.loads(replay_path.read_text(encoding="utf-8"))
          approval_chains = []
          for record, label in (
              (human, "human review"),
              (receipt, "publication receipt"),
              (replay, "publication replay receipt"),
          ):
              carry = record.get("carry_forward")
              chain = carry.get("human_approval_chain_sha256") if isinstance(carry, dict) else None
              if not isinstance(chain, str) or re.fullmatch(r"[0-9a-f]{64}", chain) is None:
                  raise SystemExit(f"{label} omitted a valid human approval chain digest")
              approval_chains.append(chain)
          if len(set(approval_chains)) != 1:
              raise SystemExit("editorial human approval chain digest mismatch")
          human_approval_chain_sha256 = approval_chains[0]
          human_carry = human.get("carry_forward")
          approved_basis = (
              human_carry.get("approved_canonical_basis")
              if isinstance(human_carry, dict)
              else None
          )
          approved_events = (
              approved_basis.get("events")
              if isinstance(approved_basis, dict)
              else None
          )
          if not isinstance(approved_events, list) or len(approved_events) != 20:
              raise SystemExit(
                  "editorial approved canonical basis must contain exactly 20 events"
              )
          for position, event in enumerate(approved_events, start=1):
              if not isinstance(event, dict):
                  raise SystemExit(
                      f"editorial approved event E{position:02d} is not an object"
                  )
              issuer_name = event.get("issuer_name")
              title = event.get("title")
              if not isinstance(issuer_name, str) or not isinstance(title, str):
                  raise SystemExit(
                      f"editorial approved event E{position:02d} omitted issuer or title"
                  )
              expected_target = issuer_name + " — " + title
              if event.get("identity_target") != expected_target:
                  raise SystemExit(
                      f"editorial approved event E{position:02d} identity target mismatch"
                  )
          revision = os.environ["GITHUB_SHA"].lower()
          publication_identity = {
              "artifact_id": int(os.environ["EDITORIAL_ARTIFACT_ID"]),
              "artifact_name": os.environ["EDITORIAL_ARTIFACT_NAME"],
              "artifact_sha256": os.environ[
                  "EDITORIAL_ARTIFACT_DIGEST"
              ].removeprefix("sha256:"),
          }
          expected_candidate = receipt.get("candidate_artifact")
          if not isinstance(expected_candidate, dict):
              raise SystemExit("editorial receipt omitted candidate artifact provenance")
          if replay.get("candidate_artifact") != expected_candidate:
              raise SystemExit("editorial apply and replay use different candidate artifacts")
          if human.get("candidate_artifact") != expected_candidate:
              raise SystemExit("human review is not bound to the published candidate")
          for field in ("artifact_id", "artifact_name", "artifact_sha256"):
              if field in human:
                  raise SystemExit(
                      "raw human review cannot self-assert publication artifact identity"
                  )
          for record, label in ((receipt, "apply"), (replay, "replay")):
              if (
                  record.get("schema_version") != 1
                  or record.get("kind")
                  != "bside-global-alpha-expedited-editorial-publication"
                  or record.get("environment") != "production"
                  or record.get("is_synthetic") is not False
                  or record.get("code_revision") != revision
                  or record.get("candidate_sha256") != human.get("candidate_sha256")
                  or record.get("decision_sha256") != receipt.get("decision_sha256")
                  or record.get("semantic_receipt_sha256")
                  != receipt.get("semantic_receipt_sha256")
              ):
                  raise SystemExit(f"editorial {label} receipt contract failed")
              if len(record.get("event_review_outcomes", [])) != 20:
                  raise SystemExit(f"editorial {label} did not verify 20 events")
              if len(record.get("same_event_pair_reviews", [])) != 40:
                  raise SystemExit(f"editorial {label} did not verify 40 pairs")
              if len(record.get("top5", [])) != 5:
                  raise SystemExit(f"editorial {label} did not publish exact Top 5")
              brief = record.get("brief")
              if (
                  not isinstance(brief, dict)
                  or brief.get("build_sha") != revision
                  or not brief.get("brief_id")
                  or not brief.get("cutoff_at")
              ):
                  raise SystemExit(f"editorial {label} brief provenance failed")
          if (
              replay.get("mutations_applied") != 0
              or replay.get("idempotent_replay") is not True
              or replay.get("brief", {}).get("idempotent") is not True
          ):
              raise SystemExit("editorial publication replay was not idempotent")
          if receipt.get("brief", {}).get("brief_id") != replay.get("brief", {}).get(
              "brief_id"
          ):
              raise SystemExit("editorial apply and replay published different briefs")
          counts = human.get("raw_counts")
          if counts != {
              "event_review_count": 20,
              "same_event_pair_review_count": 40,
              "top5_human_reviewed_count": 5,
              "top5_published_count": 5,
          }:
              raise SystemExit("actual editorial human review is not exact 20/40/5")
          if (
              human.get("schema_version") != 1
              or human.get("kind") != "bside-global-alpha-human-review"
              or human.get("environment") != "production"
              or human.get("is_synthetic") is not False
              or human.get("code_revision") != revision
              or human.get("ground_truth_source") != "human"
              or human.get("ai_generated_ground_truth") is not False
              or human.get("human_attestation") is not True
          ):
              raise SystemExit("actual editorial human-review provenance failed")
          event_reviews = human.get("event_reviews", [])
          pair_reviews = human.get("same_event_pair_reviews", [])
          top5_reviews = human.get("top5_reviews", [])
          event_ids = {item.get("event_id") for item in event_reviews}
          pair_ids = {item.get("pair_id") for item in pair_reviews}
          top5_ids = {item.get("event_id") for item in top5_reviews}
          if (
              len(event_ids) != 20
              or len(pair_ids) != 40
              or len(top5_ids) != 5
              or not top5_ids.issubset(event_ids)
          ):
              raise SystemExit("actual editorial human review contains duplicate records")
          approved_events = {
              item.get("event_id")
              for item in event_reviews
              if item.get("decision") == "approved"
              and item.get("reviewer_type") == "human"
          }
          if not top5_ids.issubset(approved_events):
              raise SystemExit("a published Top 5 event lacks human event approval")
          if any(
              item.get("decision") != "approved"
              or item.get("reviewer_type") != "human"
              or item.get("public_eligible") is not True
              or int(item.get("official_evidence_count", 0)) < 1
              for item in top5_reviews
          ):
              raise SystemExit("a published Top 5 record failed human or evidence policy")
          section_fields = (
              "ground_truth_source",
              "ai_generated_ground_truth",
              "human_attestation",
              "raw_counts",
              "event_reviews",
              "same_event_pair_reviews",
              "top5_reviews",
          )
          section = {field: human.get(field) for field in section_fields}
          if human.get("section_sha256") != canonical_sha(section):
              raise SystemExit("editorial human-review section digest mismatch")
          injected = dict(human)
          injected.update(publication_identity)
          preparation_path = Path("expedited-preparation.json")
          preparation = json.loads(preparation_path.read_text(encoding="utf-8"))
          preparation["human_review"] = injected
          preparation_path.write_text(
              json.dumps(preparation, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          provenance = {
              "schema_version": 1,
              "kind": "bside-global-alpha-expedited-editorial-publication-provenance",
              "code_revision": revision,
              "workflow": ".github/workflows/global-alpha-expedited-editorial.yml",
              "run_id": int(os.environ["EDITORIAL_RUN_ID"]),
              "run_attempt": int(os.environ["EDITORIAL_RUN_ATTEMPT"]),
              "run_created_at": os.environ["EDITORIAL_RUN_CREATED_AT"],
              "artifact_id": publication_identity["artifact_id"],
              "artifact_name": publication_identity["artifact_name"],
              "artifact_digest": os.environ["EDITORIAL_ARTIFACT_DIGEST"],
              "human_review_bytes_sha256": file_sha(human_path),
              "publication_receipt_bytes_sha256": file_sha(receipt_path),
              "publication_replay_receipt_bytes_sha256": file_sha(replay_path),
              "human_approval_chain_sha256": human_approval_chain_sha256,
              "semantic_receipt_sha256": receipt["semantic_receipt_sha256"],
              "candidate_artifact": expected_candidate,
              "candidate_sha256": receipt["candidate_sha256"],
              "decision_sha256": receipt["decision_sha256"],
              "brief_id": receipt["brief"]["brief_id"],
          }
          Path("editorial-publication-provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, sort_keys=True, indent=2)
              + "\n",
              encoding="utf-8",
          )
          Path("human-review.json").write_bytes(human_path.read_bytes())
          Path("publication-receipt.json").write_bytes(receipt_path.read_bytes())
          Path("publication-replay-receipt.json").write_bytes(replay_path.read_bytes())
          PY

      - name: Assemble immutable expedited preparation
        shell: bash
        env:
          EVIDENCE_AS_OF: ${{ steps.gate.outputs.evidence_as_of }}
          PAGES_ARTIFACT_DIGEST: ${{ steps.producers.outputs.pages_artifact_digest }}
        run: |
          set -euo pipefail
          jq -e '
            .kind == "bside-global-alpha-expedited-preparation-input"
            and .code_revision == env.GITHUB_SHA
            and (has("human_review") and (.human_review | type == "object"))
            and (.human_review.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
            and (has("approval") | not)
            and (has("legacy_archive") | not)
            and (.observations | length) == 7
            and (.connector_receipts.connectors | length) == 2
            and (.source_readiness.sources | length) == 6
            and (.experience | type == "object")
            and (.content_integrity | type == "object")
          ' expedited-preparation.json > /dev/null
          mkdir -p global-alpha-expedited-preparation/pages-terminal
          cp expedited-preparation.json expedited-producer-manifest.json \
            pages-artifact-identity.json \
            global-alpha-expedited-preparation/
          cp rollback-prepared/pinned-legacy.zip \
            rollback-prepared/legacy-drill-site-receipt.json \
            rollback-prepared/rollback-preparation.json \
            global-alpha-expedited-preparation/
          cp actual-rollback-drill/expedited-rollback-drill.json \
            global-alpha-expedited-preparation/
          cp -R automated-evidence \
            global-alpha-expedited-preparation/automated-evidence
          cp human-review.json publication-receipt.json \
            publication-replay-receipt.json \
            editorial-publication-provenance.json \
            global-alpha-expedited-preparation/
          cp -R preview-smoke-evidence \
            global-alpha-expedited-preparation/preview-smoke-evidence
          cp -R web-vitals-evidence \
            global-alpha-expedited-preparation/web-vitals-evidence
          cp -R expedited-observations \
            global-alpha-expedited-preparation/expedited-observations
          cp candidate-pages/index.html \
            global-alpha-expedited-preparation/pages-terminal/index.html
          mkdir -p global-alpha-expedited-preparation/pages-terminal/governance
          for path in index.html config.js app.js; do
            cp "candidate-pages/governance/$path" \
              "global-alpha-expedited-preparation/pages-terminal/governance/$path"
          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def digest(value):
              encoded = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          preparation = json.loads(
              Path("expedited-preparation.json").read_text(encoding="utf-8")
          )
          observations = preparation["observations"]
          content = preparation["content_integrity"]
          experience = preparation["experience"]
          human = preparation["human_review"]
          rollback = json.loads(
              Path("actual-rollback-drill/expedited-rollback-drill.json").read_text(
                  encoding="utf-8"
              )
          )
          legacy_source = json.loads(
              Path("rollback-prepared/rollback-preparation.json").read_text(
                  encoding="utf-8"
              )
          )["legacy_archive"]
          human_fields = (
              "ground_truth_source",
              "ai_generated_ground_truth",
              "human_attestation",
              "raw_counts",
              "event_reviews",
              "same_event_pair_reviews",
              "top5_reviews",
          )
          sections = {
              "human_review_section_sha256": digest(
                  {field: human.get(field) for field in human_fields}
              ),
              "human_approval_chain_sha256": human[
                  "carry_forward"
              ]["human_approval_chain_sha256"],
              "pages_terminal_content_sha256": digest(
                  observations[0]["terminal_content"]
              ),
              "content_integrity_sha256": digest(content),
              "experience_sha256": digest(experience),
              "rollback_drill_sha256": digest(rollback),
              "observations_sha256": digest(observations),
              "legacy_source_artifact_sha256": str(
                  legacy_source["artifact_digest"]
              ).removeprefix("sha256:"),
          }
          Path(
              "global-alpha-expedited-preparation/approval-binding-materials.json"
          ).write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "kind": "bside-global-alpha-expedited-approval-binding-materials",
                      "code_revision": preparation["code_revision"],
                      "evidence_as_of": preparation["evidence_as_of"],
                      **sections,
                      "binding_base_sha256": digest(sections),
                  },
                  ensure_ascii=False,
                  sort_keys=True,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          human_approval_chain_sha256="$(
            jq -er '.human_review.carry_forward.human_approval_chain_sha256' \
              expedited-preparation.json
          )"
          [[ "$human_approval_chain_sha256" =~ ^[0-9a-f]{64}$ ]]
          jq -n \
            --arg code_revision "$GITHUB_SHA" \
            --arg evidence_as_of "$EVIDENCE_AS_OF" \
            --arg workflow ".github/workflows/global-alpha-expedited-preparation.yml" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg pages_digest "$PAGES_ARTIFACT_DIGEST" \
            --arg human_approval_chain_sha256 \
              "$human_approval_chain_sha256" \
            '{
              schema_version: 1,
              kind: "bside-global-alpha-expedited-preparation-provenance",
              code_revision: $code_revision,
              evidence_as_of: $evidence_as_of,
              release_channel: "production_alpha_early_access",
              workflow: $workflow,
              run_id: ($run_id | tonumber),
              run_attempt: ($run_attempt | tonumber),
              pages_artifact_digest: $pages_digest,
              human_approval_chain_sha256: $human_approval_chain_sha256
            }' > global-alpha-expedited-preparation/preparation-provenance.json

      - name: Upload immutable expedited preparation
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-preparation
          path: global-alpha-expedited-preparation
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Record bounded Early Access preparation
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            echo "### Production Alpha Early Access preparation completed"
            echo "- revision: \`$GITHUB_SHA\`"
            echo "- artifact id: \`$ARTIFACT_ID\`"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- observation: 7 real checks over at least 30 minutes"
            echo "- confirmation: \`CREATE_EXPEDITED_ALPHA_PREPARATION\`"
            echo "- actual editorial publication is bound; final release approval remains separate"
          } >> "$GITHUB_STEP_SUMMARY"

  recover_preview_on_failure:
    needs: [prepare_rollback, rollback_drill]
    if: >-
      ${{ always() &&
          needs.prepare_rollback.result == 'success' &&
          needs.rollback_drill.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.restore.outputs.page_url }}
    steps:
      - name: Download protected Preview recovery source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: global-alpha-expedited-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-prepared
          digest-mismatch: error

      - name: Configure Pages recovery
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pinned legacy plus governance Preview recovery
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: expedited-preview-failure-recovery
          path: rollback-prepared/preview-site

      - name: Restore Preview after interrupted rollback drill
        id: restore
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: expedited-preview-failure-recovery

      - name: Verify restored Preview bytes
        shell: bash
        env:
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        run: |
          set -euo pipefail
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          cache_bust="expedited-preparation-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          specs=(
            "/|index.html"
            "/governance/|governance/index.html"
            "/governance/config.js|governance/config.js"
            "/governance/app.js|governance/app.js"
          )
          mkdir -p recovered
          for spec in "${specs[@]}"; do
            IFS='|' read -r url_path artifact_path <<< "$spec"
            output="recovered/${artifact_path//\//__}"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors \
              "$web$url_path?$cache_bust" --output "$output"
            cmp --silent "$output" "rollback-prepared/preview-site/$artifact_path"
          done

  cleanup_variables:
    needs:
      - prepare_rollback
      - rollback_drill
      - observe
      - collect_automated
      - evaluate
      - recover_preview_on_failure
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: governance-runtime
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify immutable deployment fence remains active
        shell: bash
        env:
          EXPEDITED_OBSERVATION: ${{ vars.GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          KIND_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
        run: |
          set -euo pipefail
          [[ "${EXPEDITED_OBSERVATION,,}" == "true" ]]
          [[ "$PAGES_OWNER" == "legacy" ]]
          [[ "$PIPELINE_MODE" == "shadow" ]]
          [[ "${TELEGRAM_DELIVERY,,}" == "false" ]]
          [[ "${GOVERNANCE_DELIVERY,,}" == "false" ]]
          [[ "${KIND_MODE,,}" == "off" ]]
          echo "::notice::Keep GLOBAL_ALPHA_EXPEDITED_OBSERVATION_ENABLED=true until governance ownership and live mode are committed after cutover."
