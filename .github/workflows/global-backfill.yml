name: Backfill global official sources

on:
  workflow_dispatch:
    inputs:
      source:
        description: Global official source to backfill
        required: true
        type: choice
        default: all
        options:
          - all
          - US
      from_date:
        description: Inclusive completed date (YYYY-MM-DD)
        required: true
        type: string
      to_date:
        description: Exclusive completed date (YYYY-MM-DD)
        required: true
        type: string
      mode:
        description: Apply once, or verify existing receipts without writes
        required: true
        type: choice
        default: apply
        options:
          - apply
          - replay
      max_windows:
        description: Maximum one-day windows; the full range must fit (1-31)
        required: true
        type: number
        default: 30

permissions:
  contents: read

# Historical and scheduled global collection share one non-cancelling lock.
concurrency:
  group: ingest-global-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref_name == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJSON(inputs.source != 'all' && format('["{0}"]', inputs.source) || '["US"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: governance-runtime
    env:
      GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
      SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
      EXPECTED_SEC_EDGAR_USER_AGENT: BSIDE-Governance-Intelligence/1.0 support@bside.ai

    steps:
      - name: Initialize global backfill evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/global-backfill-${{ matrix.country }}
          SUMMARY_PATH: ${{ runner.temp }}/global-backfill-${{ matrix.country }}-summary.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' \
            '{"schema_version":1,"artifact_type":"global-official-backfill","status":"not_started"}' \
            > "$SUMMARY_PATH"

      - name: Checkout immutable dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable dispatch revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out global backfill revision does not match the dispatch revision."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode

      - name: Validate source configuration
        env:
          COUNTRY: ${{ matrix.country }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          required=(BSIDE_API_BASE_URL BSIDE_OPS_TOKEN)
          case "$COUNTRY" in
            US)
              required+=(SEC_EDGAR_USER_AGENT)
              [[ "$SEC_EDGAR_USER_AGENT" == "$EXPECTED_SEC_EDGAR_USER_AGENT" ]] || {
                echo "::error::SEC_EDGAR_USER_AGENT must match the approved production identity."
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported global backfill country."
              exit 1
              ;;
          esac
          bash .github/scripts/require-env.sh "${required[@]}"
          python .github/scripts/validate-api-base-urls.py --github-env "$GITHUB_ENV"

      - name: Verify exact closed API v2 deployment
        env:
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          python .github/scripts/smoke-global-v2.py \
            --base-url "${v1_api%/api/v1}/api/v2" \
            --expected-sha "$GITHUB_SHA" \
            --release-state closed \
            --privileged-token-env BSIDE_OPS_TOKEN

      - name: Run sequential one-day global backfill
        env:
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_FROM_DATE: ${{ inputs.from_date }}
          BACKFILL_TO_DATE: ${{ inputs.to_date }}
          BACKFILL_MAX_WINDOWS: ${{ inputs.max_windows }}
          EVIDENCE_DIR: ${{ runner.temp }}/global-backfill-${{ matrix.country }}
          SUMMARY_PATH: ${{ runner.temp }}/global-backfill-${{ matrix.country }}-summary.json
        shell: bash
        run: |
          set -euo pipefail
          max_pages="200"
          python -m curator.global_backfill \
            --country "${{ matrix.country }}" \
            --mode "$BACKFILL_MODE" \
            --from-date "$BACKFILL_FROM_DATE" \
            --to-date "$BACKFILL_TO_DATE" \
            --max-windows "$BACKFILL_MAX_WINDOWS" \
            --max-pages "$max_pages" \
            --code-revision "$GITHUB_SHA" \
            --evidence-dir "$EVIDENCE_DIR" \
            --summary "$SUMMARY_PATH"

      - name: Publish receipt summary
        if: always()
        env:
          SUMMARY_PATH: ${{ runner.temp }}/global-backfill-${{ matrix.country }}-summary.json
          COUNTRY: ${{ matrix.country }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["SUMMARY_PATH"])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              payload = {"status": "missing", "processed_windows": 0}
          lines = [
              f"### Global backfill - {os.environ['COUNTRY']}",
              "",
              f"- Status: `{payload.get('status', 'missing')}`",
              f"- Mode: `{payload.get('mode', 'unknown')}`",
              f"- Processed one-day windows: `{payload.get('processed_windows', 0)}`",
              f"- Raw / ACK: `{payload.get('total_raw_count', 0)}` / "
              f"`{payload.get('total_acknowledged_count', 0)}`",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY

      - name: Preserve per-day receipts and summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-backfill-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/global-backfill-${{ matrix.country }}
            ${{ runner.temp }}/global-backfill-${{ matrix.country }}-summary.json
          if-no-files-found: error
          retention-days: 30
