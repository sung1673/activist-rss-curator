name: Decode Google News URLs

on:
  schedule:
    # KST 01:17-06:47 every 30 minutes. Kept away from top-of-hour scheduler congestion.
    - cron: "17,47 16-21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum Google News URLs to decode in one run"
        required: false
        type: string
        default: "40"
      sleep_seconds:
        description: "Seconds to wait between decode attempts"
        required: false
        type: string
        default: "25"
      max_runtime_minutes:
        description: "Hard runtime budget for the decode loop"
        required: false
        type: string
        default: "22"

permissions:
  contents: write

concurrency:
  group: curator-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decode-google-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Refresh checkout to latest branch head
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          git fetch --no-tags origin "$branch"
          git reset --hard "origin/$branch"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode Google News URLs
        env:
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
          SLEEP_INPUT: ${{ github.event.inputs.sleep_seconds }}
          RUNTIME_INPUT: ${{ github.event.inputs.max_runtime_minutes }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        run: |
          set -euo pipefail
          limit="${LIMIT_INPUT:-40}"
          sleep_seconds="${SLEEP_INPUT:-25}"
          max_runtime_minutes="${RUNTIME_INPUT:-22}"
          python -m curator.google_news_state_decode \
            --limit "$limit" \
            --sleep-seconds "$sleep_seconds" \
            --max-runtime-minutes "$max_runtime_minutes" \
            --sync-remote

      - name: Commit decoded state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No Google News URL changes to commit"
          else
            git commit -m "Decode Google News URLs"
            git push
          fi
