name: Publish delivery outbox (permanently disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-outbox-policy-check
  cancel-in-progress: false

jobs:
  publish:
    # BSIDE governance distribution is web-only.  This literal guard cannot be
    # enabled by repository variables or dispatch inputs.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Web-only distribution policy
        run: echo "Telegram outbound publishing is permanently disabled."
