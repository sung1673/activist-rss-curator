name: Reconcile Pages deployment incident

on:
  workflow_run:
    workflows:
      - Build curated RSS feed
      - Daily governance pages
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: pages-deployment-incident
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Reconcile the Pages incident from the verification step
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const attemptNumber = run.run_attempt || 1;
            const response = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
              {
                ...context.repo,
                run_id: run.id,
                attempt_number: attemptNumber,
                per_page: 100,
                headers: { "X-GitHub-Api-Version": "2022-11-28" },
              },
            );

            const verificationName = "Verify GitHub Pages deployment";
            const jobs = response.data.jobs || [];
            const verification = jobs
              .flatMap((job) =>
                (job.steps || []).map((step) => ({ ...step, jobName: job.name })),
              )
              .find((step) => step.name === verificationName);

            if (!verification || !["success", "failure"].includes(verification.conclusion)) {
              core.info("No completed Pages verification step; incident state is unchanged.");
              return;
            }

            const title = "[ops/incident] GitHub Pages deployment unhealthy";
            const label = "ops/incident";
            const failed = verification.conclusion === "failure";
            const observedAt = new Date().toISOString();
            const deploymentSteps = jobs
              .flatMap((job) => job.steps || [])
              .filter((step) =>
                [
                  "Deploy to GitHub Pages",
                  "Retry GitHub Pages deployment (2/3)",
                  "Retry GitHub Pages deployment (3/3)",
                ].includes(step.name),
              );
            const attempts = deploymentSteps.length
              ? deploymentSteps
                  .map((step, index) => `| ${index + 1} | \`${step.conclusion || "unknown"}\` |`)
                  .join("\n")
              : "| - | `unavailable` |";
            const state = failed ? "ACTIVE" : "RECOVERED";
            const body = [
              "# GitHub Pages deployment incident",
              "",
              `- Status: **${state}**`,
              `- Workflow: \`${run.name}\``,
              `- Job: \`${verification.jobName}\``,
              `- Run: [${run.id}](${run.html_url}) (attempt ${attemptNumber})`,
              `- Revision: \`${run.head_sha}\``,
              `- Branch: \`${run.head_branch}\``,
              `- Observed (UTC): \`${observedAt}\``,
              "",
              "| Deployment attempt | Outcome |",
              "|---:|---|",
              attempts,
              "",
              "The generated content remains in the workflow run artifacts; database and outbox state are not rolled back.",
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "all",
              per_page: 100,
            });
            const incident = issues
              .filter((issue) => !issue.pull_request && issue.title === title)
              .sort((left, right) => right.number - left.number)[0];

            if (!failed) {
              if (incident?.state === "open") {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: incident.number,
                  body,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: incident.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: "B60205",
                description: "Automated production pipeline incident",
              });
            }

            if (!incident) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
              return;
            }

            await github.rest.issues.update({
              ...context.repo,
              issue_number: incident.number,
              body,
              labels: [label],
              state: "open",
            });
            if (incident.state === "closed") {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: incident.number,
                body: `Incident recurred in [run ${run.id}](${run.html_url}).`,
              });
            }
