name: Production Alpha diagnostic watchdog

# GitHub scheduled workflows are best-effort and can be delayed or coalesced.
# This workflow remains useful for operational diagnostics, but release
# evidence is produced only by global-alpha-observation-chain.yml.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-alpha-watchdog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (
        vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'live'
      ) &&
      (
        vars.GLOBAL_ALPHA_OBSERVATION_ENABLED == 'true' ||
        (
          vars.GLOBAL_ALPHA_OBSERVATION_ENABLED != '' &&
          vars.GLOBAL_ALPHA_OBSERVATION_ENABLED != 'false'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: governance-runtime
    env:
      GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
      BSIDE_ALPHA_PREVIEW_WEB_URL: ${{ vars.BSIDE_ALPHA_PREVIEW_WEB_URL }}
      BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
      GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}

    steps:
      - name: Initialize fail-closed observation evidence
        id: initialize
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/global-alpha-observation.json
        run: |
          set -euo pipefail
          python -c "import json,os,pathlib; pathlib.Path(os.environ['EVIDENCE_PATH']).write_text(json.dumps({'schema_version':1,'status':'not_started','pipeline_mode':os.environ.get('GOVERNANCE_PIPELINE_MODE',''),'workflow_revision':os.environ.get('GITHUB_SHA','')},sort_keys=True,indent=2)+'\n',encoding='utf-8')"

      - name: Checkout immutable monitor revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve fail-closed observation mode
        id: rollout
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          KIND_CONNECTOR_MODE: ${{ vars.KIND_CONNECTOR_MODE }}
          GLOBAL_ALPHA_OBSERVATION_ENABLED: ${{ vars.GLOBAL_ALPHA_OBSERVATION_ENABLED }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
        run: python -m curator.operation_mode --github-output "$GITHUB_OUTPUT"

      - name: Observe API, release, sources, and public build
        if: steps.rollout.outputs.global_alpha_observation_enabled == 'true'
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/global-alpha-observation.json
        run: >-
          python -m curator.global_alpha_monitor
          --evidence "$EVIDENCE_PATH"
          --require-active-pipeline

      - name: Preserve immutable observation evidence
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-alpha-observation.json
          if-no-files-found: error
          retention-days: 30
