name: Ingest media sources

on:
  schedule:
    # Twice per hour, offset from the official-source collector.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: telegram-collection-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (
        github.event_name == 'workflow_dispatch' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
        (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: governance-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable workflow revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out revision $actual does not match workflow revision $GITHUB_SHA."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode

      - name: Validate operational configuration
        env:
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          CURATOR_FEEDS: ${{ secrets.CURATOR_FEEDS }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/require-env.sh \
            ACTIVIST_API_URL ACTIVIST_API_SECRET \
            TELEGRAM_API_ID TELEGRAM_API_HASH TELEGRAM_SESSION_STRING
          python .github/scripts/validate-media-feeds.py

      - name: Ingest licensed Telegram signals and media discovery feeds
        env:
          CURATOR_INGEST_SCOPE: media
          CURATOR_DATA_SOURCE: mysql
          CURATOR_DISABLE_TELEGRAM_SEND: "1"
          CURATOR_DELIVERY_MODE: disabled
          CURATOR_EVENT_SCHEDULE: ${{ github.event.schedule }}
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_FEEDS: ${{ secrets.CURATOR_FEEDS }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m curator.main
