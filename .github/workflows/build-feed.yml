name: Build curated RSS feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-feed.yml"
      - "config.yaml"
      - "requirements.txt"
      - "curator/**"
      - "deploy/activist/api.php"
      - "tests/**"
      - "public/404.html"
      - "data/priority_overrides.yaml"
  schedule:
    # KST 08:05-00:35 every 30 minutes.
    - cron: "5,35 0-15,23 * * *"
    # KST 03:35, covering the first half of the overnight 01:00-06:00 window.
    - cron: "35 18 * * *"
    # KST 05:00, scheduled early so the daily report can still arrive near 06:00 if Actions is delayed.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Execution mode. Use page_only for layout/template-only deploys without article collection."
        required: false
        type: choice
        default: auto
        options:
          - auto
          - full
          - page_only
      send_telegram_test:
        description: "Send a Telegram smoke-test message"
        required: false
        type: boolean
        default: false
      resend_last_briefing:
        description: "Resend the latest periodic Telegram briefing with current formatting"
        required: false
        type: boolean
        default: false
      resend_recent_articles:
        description: "Resend recently sent Telegram article clusters with current formatting"
        required: false
        type: boolean
        default: false
      resend_recent_article_count:
        description: "Number of recent sent article clusters to resend"
        required: false
        type: string
        default: "1"
      resend_cluster_guid:
        description: "Optional exact cluster guid to resend"
        required: false
        type: string
        default: ""
      send_daily_report:
        description: "Build a 24-hour HTML daily report and send a Telegram briefing link"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  models: read
  pages: write
  id-token: write

concurrency:
  group: curator-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-feed:
    if: vars.ENABLE_LEGACY_PIPELINE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment_result.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine run mode
        id: run_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          DISPATCH_MODE: ${{ github.event.inputs.run_mode || 'auto' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LEGACY_PAGES_ENABLED: ${{ vars.ENABLE_PAGES }}
          GOVERNANCE_PAGES_ENABLED: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
        run: |
          set -euo pipefail

          full_run=false
          page_run=false

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            full_run=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DISPATCH_MODE" in
              page_only)
                page_run=true
                ;;
              full|auto|"")
                full_run=true
                ;;
              *)
                echo "Unknown run_mode=$DISPATCH_MODE; defaulting to full"
                full_run=true
                ;;
            esac
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MESSAGE" == *"[page-only]"* || "$COMMIT_MESSAGE" == *"[send-daily-report]"* ]]; then
              page_run=true
            elif [[ "$COMMIT_MESSAGE" == *"[force-collect]"* || "$COMMIT_MESSAGE" == *"[send-regular-update]"* ]]; then
              full_run=true
            else
              base="$EVENT_BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-parse HEAD^ 2>/dev/null || true)"
              fi

              if [[ -n "$base" ]]; then
                if ! git diff --name-only "$base" "$GITHUB_SHA" > changed_files.txt 2>/tmp/diff_error; then
                  echo "Base commit $base is not in the shallow checkout; fetching more history"
                  git fetch --no-tags --deepen=50 origin "${GITHUB_REF#refs/heads/}" || true
                  git diff --name-only "$base" "$GITHUB_SHA" > changed_files.txt 2>/tmp/diff_error || git show --format= --name-only "$GITHUB_SHA" > changed_files.txt
                fi
              else
                git show --format= --name-only "$GITHUB_SHA" > changed_files.txt
              fi

              echo "Changed files:"
              cat changed_files.txt

              collection_regex='^(config\.yaml|requirements\.txt|data/priority_overrides\.yaml|curator/(ai|archive|cluster|config|dates|dedupe|fetch|main|normalize|priority|relevance|remote_api|rss_writer|state|story_judge|summaries|telegram_dashboard|telegram_publisher|telegram_resend|telegram_resend_digest|telegram_smoke_test|telegram_sources)\.py|tests/(conftest|test_archive|test_cluster|test_config|test_dates|test_dedupe|test_fetch|test_main|test_normalize|test_priority|test_relevance|test_remote_api|test_rss_writer|test_state|test_story_judge|test_summaries|test_telegram_dashboard|test_telegram_publisher|test_telegram_resend_digest|test_telegram_sources)\.py)$'
              page_regex='^(\.github/workflows/build-feed\.yml|curator/(daily_report|story_review)\.py|tests/(test_daily_report|test_story_review)\.py|public/404\.html)$'

              if grep -Eq "$collection_regex" changed_files.txt; then
                full_run=true
              fi
              if grep -Eq "$page_regex" changed_files.txt; then
                page_run=true
              fi
            fi
          fi

          if [[ "$LEGACY_PAGES_ENABLED" == "true" && "$GOVERNANCE_PAGES_ENABLED" == "true" ]]; then
            echo "::error::ENABLE_PAGES and ENABLE_GOVERNANCE_PAGES are mutually exclusive."
            exit 1
          fi

          deploy_pages=false
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" && "$LEGACY_PAGES_ENABLED" == "true" && "$GOVERNANCE_PAGES_ENABLED" != "true" && ( "$full_run" == "true" || "$page_run" == "true" ) ]]; then
            deploy_pages=true
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" && "$LEGACY_PAGES_ENABLED" == "true" && ( "$full_run" == "true" || "$page_run" == "true" ) ]]; then
            echo "::notice::Pages deployment is restricted to the default branch ($DEFAULT_BRANCH)."
          fi
          echo "full=$full_run" >> "$GITHUB_OUTPUT"
          echo "page=$page_run" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=$deploy_pages" >> "$GITHUB_OUTPUT"
          echo "Run mode: full=$full_run page=$page_run deploy_pages=$deploy_pages"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Send Telegram smoke test
        if: ${{ vars.ENABLE_GOVERNANCE_DELIVERY != 'true' && github.event_name == 'workflow_dispatch' && inputs.send_telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m curator.telegram_smoke_test

      - name: Build feed
        if: ${{ steps.run_mode.outputs.full == 'true' }}
        env:
          CURATOR_FEEDS: ${{ secrets.CURATOR_FEEDS }}
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_DELIVERY_MODE: ${{ vars.ENABLE_GOVERNANCE_DELIVERY == 'true' && 'disabled' || 'legacy-direct' }}
          CURATOR_EVENT_SCHEDULE: ${{ github.event.schedule }}
          CURATOR_DISABLE_TELEGRAM_SEND: ${{ github.event_name == 'push' && ! contains(github.event.head_commit.message, '[send-regular-update]') && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ADMIN_ACCESS_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.main

      - name: Build daily report page
        if: ${{ steps.run_mode.outputs.full == 'true' || steps.run_mode.outputs.page == 'true' }}
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_DAILY_REPORT_WRITE_ONLY: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORY_REVIEW_ACCESS_TOKEN: ${{ secrets.STORY_REVIEW_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.daily_report

      - name: Build token-gated Telegram admin shell
        if: ${{ steps.run_mode.outputs.full == 'true' || steps.run_mode.outputs.page == 'true' }}
        env:
          TELEGRAM_ADMIN_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ADMIN_ACCESS_TOKEN }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/require-env.sh TELEGRAM_ADMIN_ACCESS_TOKEN ACTIVIST_PUBLIC_API_URL
          python -m curator.telegram_dashboard write

      - name: Resend last Telegram briefing
        if: ${{ vars.ENABLE_GOVERNANCE_DELIVERY != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.resend_last_briefing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[resend-last-briefing]'))) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m curator.telegram_resend_digest

      - name: Resend recent Telegram articles
        if: ${{ vars.ENABLE_GOVERNANCE_DELIVERY != 'true' && github.event_name == 'workflow_dispatch' && inputs.resend_recent_articles }}
        env:
          TELEGRAM_RESEND_COUNT: ${{ inputs.resend_recent_article_count }}
          TELEGRAM_RESEND_GUID: ${{ inputs.resend_cluster_guid }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m curator.telegram_resend

      - name: Configure Pages
        if: steps.run_mode.outputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public

      - name: Deploy to GitHub Pages
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Wait before first Pages retry
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' }}
        run: sleep 180

      - name: Retry GitHub Pages deployment (2/3)
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' }}
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Wait before final Pages retry
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: sleep 300

      - name: Retry GitHub Pages deployment (3/3)
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        id: deployment_retry_final
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Verify GitHub Pages deployment
        if: ${{ !cancelled() && steps.run_mode.outputs.deploy_pages == 'true' }}
        id: pages_deployment_result
        shell: bash
        env:
          DEPLOYMENT_OUTCOME_1: ${{ steps.deployment.outcome }}
          DEPLOYMENT_OUTCOME_2: ${{ steps.deployment_retry.outcome }}
          DEPLOYMENT_OUTCOME_3: ${{ steps.deployment_retry_final.outcome }}
          DEPLOYMENT_URL_1: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_URL_2: ${{ steps.deployment_retry.outputs.page_url }}
          DEPLOYMENT_URL_3: ${{ steps.deployment_retry_final.outputs.page_url }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail

          selected_attempt=""
          selected_url=""
          if [[ "$DEPLOYMENT_OUTCOME_1" == "success" && -n "$DEPLOYMENT_URL_1" ]]; then
            selected_attempt="1"
            selected_url="$DEPLOYMENT_URL_1"
          elif [[ "$DEPLOYMENT_OUTCOME_2" == "success" && -n "$DEPLOYMENT_URL_2" ]]; then
            selected_attempt="2"
            selected_url="$DEPLOYMENT_URL_2"
          elif [[ "$DEPLOYMENT_OUTCOME_3" == "success" && -n "$DEPLOYMENT_URL_3" ]]; then
            selected_attempt="3"
            selected_url="$DEPLOYMENT_URL_3"
          fi

          {
            echo "### GitHub Pages deployment"
            echo ""
            echo "| Attempt | Outcome |"
            echo "|---:|---|"
            echo "| 1 | ${DEPLOYMENT_OUTCOME_1:-not-run} |"
            echo "| 2 | ${DEPLOYMENT_OUTCOME_2:-not-run} |"
            echo "| 3 | ${DEPLOYMENT_OUTCOME_3:-not-run} |"
            echo ""
            echo "Artifact: \`github-pages\` (ID: ${PAGES_ARTIFACT_ID:-unavailable})"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "$selected_attempt" ]]; then
            echo "::error::GitHub Pages deployment failed after three attempts."
            exit 1
          fi

          echo "page_url=$selected_url" >> "$GITHUB_OUTPUT"
          echo "attempt=$selected_attempt" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Succeeded on attempt $selected_attempt: $selected_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed Pages artifact
        if: ${{ !cancelled() && steps.run_mode.outputs.deploy_pages == 'true' && steps.pages_deployment_result.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
          if-no-files-found: error
          retention-days: 7

      - name: Send daily report message
        if: ${{ vars.ENABLE_GOVERNANCE_DELIVERY != 'true' && ((github.event_name == 'schedule' && github.event.schedule == '0 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.send_daily_report) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[send-daily-report]'))) }}
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_DELIVERY_MODE: legacy-direct
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.daily_report
