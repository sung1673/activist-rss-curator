name: Build curated RSS feed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-feed.yml"
      - ".github/workflows/resolve-links.yml"
      - ".github/scripts/prepare-legacy-pages.py"
      - ".github/scripts/restore-legacy-pages-archive.py"
      - "config.yaml"
      - "requirements.txt"
      - "curator/**"
      - "deploy/activist/api.php"
      - "tests/**"
      - "public/404.html"
      - "public/CNAME"
      - "public/governance/**"
      - "data/priority_overrides.yaml"
  schedule:
    # KST 08:05-00:35 every 30 minutes.
    - cron: "5,35 0-15,23 * * *"
    # KST 03:35, covering the first half of the overnight 01:00-06:00 window.
    - cron: "35 18 * * *"
    # KST 05:45 daily generation (UTC 20:45), aligned with the daily workflow.
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Execution mode. Use page_only for layout/template-only deploys without article collection."
        required: false
        type: choice
        default: auto
        options:
          - auto
          - full
          - page_only
      allow_pages_deploy:
        description: "Explicitly allow a manual run to deploy GitHub Pages"
        required: false
        type: boolean
        default: false
      preserve_legacy_archive_seed:
        description: "Preserve a sanitized rolling archive seed for recovery"
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  models: read
  pages: write
  id-token: write

concurrency:
  group: telegram-collection-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    if: vars.ENABLE_LEGACY_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: >-
        ${{ vars.PAGES_OWNER == 'legacy' &&
            format('bside-pages-deployment-{0}', github.repository) ||
            format('bside-pages-nondeploy-legacy-{0}-{1}', github.repository, github.run_id) }}
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment_result.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Determine run mode
        id: run_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          DISPATCH_MODE: ${{ github.event.inputs.run_mode || 'auto' }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          LEGACY_PAGES_ENABLED: ${{ vars.ENABLE_PAGES }}
          GOVERNANCE_PAGES_ENABLED: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          LEGACY_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          TELEGRAM_DELIVERY_ENABLED: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          GOVERNANCE_DELIVERY_ENABLED: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
          ALLOW_PAGES_DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_pages_deploy }}
        run: |
          set -euo pipefail

          full_run=false
          page_run=false
          governance_preview=false

          if [[ "$TELEGRAM_DELIVERY_ENABLED" == "true" || "$GOVERNANCE_DELIVERY_ENABLED" == "true" ]]; then
            echo "::error::Outbound Telegram delivery is permanently disabled; set both delivery variables to false."
            exit 1
          fi

          case "$PAGES_OWNER" in
            legacy)
              if [[ "$GOVERNANCE_PAGES_ENABLED" == "true" ]]; then
                echo "::error::PAGES_OWNER=legacy conflicts with ENABLE_GOVERNANCE_PAGES=true."
                exit 1
              fi
              LEGACY_PAGES_ENABLED=true
              GOVERNANCE_PAGES_ENABLED=false
              ;;
            governance)
              if [[ "$LEGACY_PAGES_ENABLED" == "true" ]]; then
                echo "::error::PAGES_OWNER=governance conflicts with ENABLE_PAGES=true."
                exit 1
              fi
              LEGACY_PAGES_ENABLED=false
              GOVERNANCE_PAGES_ENABLED=true
              ;;
            "")
              ;;
            *)
              echo "::error::PAGES_OWNER must be legacy or governance when set."
              exit 1
              ;;
          esac

          case "$GOVERNANCE_PIPELINE_MODE" in
            off|dart_canary|shadow|live|"")
              ;;
            *)
              echo "::error::GOVERNANCE_PIPELINE_MODE must be off, dart_canary, shadow, or live."
              exit 1
              ;;
          esac
          if [[ "$LEGACY_GOVERNANCE_SHADOW" == "true" && ( "$GOVERNANCE_PIPELINE_MODE" == "off" || "$GOVERNANCE_PIPELINE_MODE" == "dart_canary" ) ]]; then
            echo "::error::ENABLE_GOVERNANCE_SHADOW=true conflicts with GOVERNANCE_PIPELINE_MODE=$GOVERNANCE_PIPELINE_MODE."
            exit 1
          fi
          if [[ "$LEGACY_PAGES_ENABLED" == "true" && ( "$GOVERNANCE_PIPELINE_MODE" == "shadow" || "$GOVERNANCE_PIPELINE_MODE" == "live" || ( -z "$GOVERNANCE_PIPELINE_MODE" && "$LEGACY_GOVERNANCE_SHADOW" == "true" ) ) ]]; then
            governance_preview=true
          fi

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            full_run=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DISPATCH_MODE" in
              page_only)
                page_run=true
                ;;
              full|auto|"")
                full_run=true
                ;;
              *)
                echo "Unknown run_mode=$DISPATCH_MODE; defaulting to full"
                full_run=true
                ;;
            esac
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$COMMIT_MESSAGE" == *"[page-only]"* ]]; then
              page_run=true
            elif [[ "$COMMIT_MESSAGE" == *"[force-collect]"* ]]; then
              full_run=true
            else
              base="$EVENT_BEFORE"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-parse HEAD^ 2>/dev/null || true)"
              fi

              if [[ -n "$base" ]]; then
                if ! git diff --name-only "$base" "$GITHUB_SHA" > changed_files.txt 2>/tmp/diff_error; then
                  echo "Base commit $base is not in the shallow checkout; fetching more history"
                  git fetch --no-tags --deepen=50 origin "${GITHUB_REF#refs/heads/}" || true
                  git diff --name-only "$base" "$GITHUB_SHA" > changed_files.txt 2>/tmp/diff_error || git show --format= --name-only "$GITHUB_SHA" > changed_files.txt
                fi
              else
                git show --format= --name-only "$GITHUB_SHA" > changed_files.txt
              fi

              echo "Changed files:"
              cat changed_files.txt

              collection_regex='^(\.github/workflows/resolve-links\.yml|config\.yaml|requirements\.txt|data/priority_overrides\.yaml|curator/(ai|archive|cluster|config|dates|dedupe|fetch|link_discovery|main|normalize|priority|relevance|remote_api|resolve_links|rss_writer|state|story_judge|summaries|telegram_dashboard|telegram_publisher|telegram_resend|telegram_resend_digest|telegram_smoke_test|telegram_sources)\.py|tests/(conftest|test_archive|test_cluster|test_config|test_dates|test_dedupe|test_fetch|test_link_discovery|test_main|test_normalize|test_priority|test_relevance|test_remote_api|test_rss_writer|test_state|test_story_judge|test_summaries|test_telegram_dashboard|test_telegram_publisher|test_telegram_resend_digest|test_telegram_sources)\.py)$'
              page_regex='^(\.github/(workflows/build-feed\.yml|scripts/(prepare-legacy-pages|restore-legacy-pages-archive)\.py)|curator/(daily_report|governance_ui|story_review)\.py|public/(404\.html|CNAME|governance/.*))$'

              if grep -Eq "$collection_regex" changed_files.txt; then
                full_run=true
              fi
              if grep -Eq "$page_regex" changed_files.txt; then
                page_run=true
              fi
            fi
          fi

          if [[ "$LEGACY_PAGES_ENABLED" == "true" && "$GOVERNANCE_PAGES_ENABLED" == "true" ]]; then
            echo "::error::ENABLE_PAGES and ENABLE_GOVERNANCE_PAGES are mutually exclusive."
            exit 1
          fi

          if [[ "$page_run" == "true" && "$full_run" != "true" && "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" != *"[page-only]"* ]]; then
            echo "::notice::Promoting an automatic page-code push to a verified full run so publication metrics are produced in the same job."
            full_run=true
          fi

          deploy_pages=false
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" && "$LEGACY_PAGES_ENABLED" == "true" && "$GOVERNANCE_PAGES_ENABLED" != "true" && "$ALLOW_PAGES_DEPLOY" == "true" && ( "$full_run" == "true" || "$page_run" == "true" ) ]]; then
            deploy_pages=true
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" && "$LEGACY_PAGES_ENABLED" == "true" && ( "$full_run" == "true" || "$page_run" == "true" ) ]]; then
            echo "::notice::Pages deployment is restricted to the default branch ($DEFAULT_BRANCH)."
          fi
          echo "full=$full_run" >> "$GITHUB_OUTPUT"
          echo "page=$page_run" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=$deploy_pages" >> "$GITHUB_OUTPUT"
          echo "governance_preview=$governance_preview" >> "$GITHUB_OUTPUT"
          echo "Run mode: full=$full_run page=$page_run deploy_pages=$deploy_pages governance_preview=$governance_preview"

      - name: Initialize curator run metrics
        if: ${{ steps.run_mode.outputs.full == 'true' }}
        env:
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/curator-run-metrics.json
        shell: bash
        run: >-
          printf '%s\n' '{"ok":false,"status":"started"}'
          > "$CURATOR_RUN_METRICS_PATH"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Resolve previous legacy Pages artifact
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: previous_legacy_pages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const expectedWorkflowPath = ".github/workflows/build-feed.yml";
            const candidates = [
              { name: "github-pages", kind: "rolling" },
              { name: "legacy-pages-archive-seed", kind: "seed" },
            ];

            for (const candidate of candidates) {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  ...context.repo,
                  name: candidate.name,
                  per_page: 100,
                },
              );
              artifacts.sort((left, right) => right.id - left.id);

              for (const artifact of artifacts) {
                const sourceRunId = Number(artifact.workflow_run?.id || 0);
                if (artifact.expired || !sourceRunId || sourceRunId === Number(context.runId)) {
                  continue;
                }
                const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
                  ...context.repo,
                  run_id: sourceRunId,
                });
                if (
                  sourceRun.conclusion !== "success" ||
                  sourceRun.head_branch !== context.payload.repository.default_branch ||
                  sourceRun.path !== expectedWorkflowPath ||
                  sourceRun.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`
                ) {
                  continue;
                }

                core.setOutput("artifact_id", String(artifact.id));
                core.setOutput("artifact_kind", candidate.kind);
                core.setOutput("run_id", String(sourceRunId));
                core.info(
                  `Using ${candidate.kind} legacy Pages artifact ${artifact.id} from run ${sourceRunId}.`,
                );
                return;
              }
            }

            core.setFailed(
              "No unexpired successful legacy Pages artifact is available; refusing to remove historical report URLs.",
            );

      - name: Download previous legacy Pages artifact
        if: steps.run_mode.outputs.deploy_pages == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.previous_legacy_pages.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-legacy-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_legacy_pages.outputs.run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Send Telegram smoke test
        if: ${{ false }} # Permanent web-only distribution policy.
        run: echo "Telegram outbound delivery is permanently disabled."

      - name: Build feed
        if: ${{ steps.run_mode.outputs.full == 'true' }}
        timeout-minutes: 45
        env:
          CURATOR_FEEDS: ${{ secrets.CURATOR_FEEDS }}
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_DELIVERY_MODE: disabled
          CURATOR_EVENT_SCHEDULE: ${{ github.event.schedule }}
          CURATOR_DISABLE_TELEGRAM_SEND: "1"
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/curator-run-metrics.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_ADMIN_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ADMIN_ACCESS_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.main

      - name: Verify curator run metrics
        if: ${{ success() && steps.run_mode.outputs.full == 'true' }}
        env:
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/curator-run-metrics.json
        shell: bash
        run: >-
          python -c "import json, os, pathlib, sys;
          payload = json.loads(pathlib.Path(os.environ['CURATOR_RUN_METRICS_PATH']).read_text(encoding='utf-8'));
          sys.exit(0 if payload.get('ok') is True and payload.get('status') == 'complete'
          else 'curator run metrics did not complete successfully')"

      - name: Snapshot actual legacy engine output for shadow comparison
        id: legacy_shadow
        if: >-
          success() && steps.run_mode.outputs.full == 'true' &&
          (vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
           vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
           (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true'))
        env:
          SHADOW_OUTPUT: ${{ runner.temp }}/legacy-shadow/engine-output.json
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.shadow_engine snapshot-legacy-state \
            --state data/state.json \
            --output "$SHADOW_OUTPUT" \
            --expected-revision "$GITHUB_SHA" \
            --source-run-id "github:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          observation_date="$(python -c 'import json, os, pathlib; value=json.loads(pathlib.Path(os.environ["SHADOW_OUTPUT"]).read_text(encoding="utf-8")); print(value["observation_date"])')"
          [[ "$observation_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error::Legacy shadow output omitted a valid KST observation date."
            exit 1
          }
          echo "observation_date=$observation_date" >> "$GITHUB_OUTPUT"

      - name: Preserve immutable legacy shadow engine output
        if: steps.legacy_shadow.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-engine-legacy-${{ steps.legacy_shadow.outputs.observation_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-shadow/engine-output.json
          if-no-files-found: error
          retention-days: 21

      - name: Publish curator run metrics
        if: ${{ always() && steps.run_mode.outputs.full == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: curator-run-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/curator-run-metrics.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore validated legacy dated reports
        if: steps.run_mode.outputs.deploy_pages == 'true'
        run: >-
          python .github/scripts/restore-legacy-pages-archive.py
          --archive "${{ runner.temp }}/previous-legacy-pages"
          --destination-feed public/feed

      - name: Build daily report page
        if: ${{ steps.run_mode.outputs.full == 'true' || steps.run_mode.outputs.page == 'true' }}
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_REQUIRE_REMOTE_API: "1"
          CURATOR_DAILY_REPORT_WRITE_ONLY: "1"
          CURATOR_REQUIRE_NONEMPTY_DAILY_REPORT: "1"
          CURATOR_RUN_METRICS_PATH: ${{ runner.temp }}/curator-run-metrics.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORY_REVIEW_ACCESS_TOKEN: ${{ secrets.STORY_REVIEW_ACCESS_TOKEN }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.daily_report

      - name: Build token-gated Telegram admin shell
        if: ${{ steps.run_mode.outputs.full == 'true' || steps.run_mode.outputs.page == 'true' }}
        env:
          TELEGRAM_ADMIN_ACCESS_TOKEN: ${{ secrets.TELEGRAM_ADMIN_ACCESS_TOKEN }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/require-env.sh TELEGRAM_ADMIN_ACCESS_TOKEN ACTIVIST_PUBLIC_API_URL
          python -m curator.telegram_dashboard write

      - name: Resend last Telegram briefing
        if: ${{ false }} # Permanent web-only distribution policy.
        run: echo "Telegram outbound delivery is permanently disabled."

      - name: Resend recent Telegram articles
        if: ${{ false }} # Permanent web-only distribution policy.
        run: echo "Telegram outbound delivery is permanently disabled."

      - name: Configure token-gated governance shadow preview
        if: steps.run_mode.outputs.deploy_pages == 'true' && steps.run_mode.outputs.governance_preview == 'true'
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/require-env.sh GOVERNANCE_API_BASE_URL BSIDE_PUBLIC_WEB_URL
          python -m curator.governance_ui --root .

      - name: Prepare allowlisted legacy Pages artifact
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: legacy_pages_artifact
        shell: bash
        env:
          LEGACY_PAGES_ARTIFACT_PATH: ${{ runner.temp }}/legacy-pages-${{ github.run_id }}-${{ github.run_attempt }}
          GOVERNANCE_PREVIEW_ENABLED: ${{ steps.run_mode.outputs.governance_preview }}
        run: |
          set -euo pipefail
          arguments=(
            --source public
            --destination "$LEGACY_PAGES_ARTIFACT_PATH"
          )
          if [[ "$GOVERNANCE_PREVIEW_ENABLED" == "true" ]]; then
            arguments+=(--governance-preview-source public/governance)
          fi
          python .github/scripts/prepare-legacy-pages.py "${arguments[@]}"
          echo "path=$LEGACY_PAGES_ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Revalidate legacy ownership at the deployment boundary
        if: steps.run_mode.outputs.deploy_pages == 'true'
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "legacy" ]] || {
            echo "::error::This run did not start with legacy Pages ownership; deployment is blocked."
            exit 1
          }

      - name: Configure Pages
        if: steps.run_mode.outputs.deploy_pages == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: ${{ steps.legacy_pages_artifact.outputs.path }}

      - name: Preserve sanitized legacy archive seed
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '45 20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.preserve_legacy_archive_seed)) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-pages-archive-seed
          path: ${{ steps.legacy_pages_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Capture shadow preview Pages distribution start
        if: >-
          ${{ steps.run_mode.outputs.deploy_pages == 'true' &&
              steps.run_mode.outputs.governance_preview == 'true' }}
        id: pages_distribution_start
        shell: bash
        run: echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.run_mode.outputs.deploy_pages == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Wait before first Pages retry
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' }}
        run: sleep 180

      - name: Retry GitHub Pages deployment (2/3)
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' }}
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Wait before final Pages retry
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        run: sleep 300

      - name: Retry GitHub Pages deployment (3/3)
        if: ${{ steps.run_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure' }}
        id: deployment_retry_final
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Verify GitHub Pages deployment
        if: ${{ !cancelled() && steps.run_mode.outputs.deploy_pages == 'true' }}
        id: pages_deployment_result
        shell: bash
        env:
          DEPLOYMENT_OUTCOME_1: ${{ steps.deployment.outcome }}
          DEPLOYMENT_OUTCOME_2: ${{ steps.deployment_retry.outcome }}
          DEPLOYMENT_OUTCOME_3: ${{ steps.deployment_retry_final.outcome }}
          DEPLOYMENT_URL_1: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_URL_2: ${{ steps.deployment_retry.outputs.page_url }}
          DEPLOYMENT_URL_3: ${{ steps.deployment_retry_final.outputs.page_url }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail

          selected_attempt=""
          selected_url=""
          if [[ "$DEPLOYMENT_OUTCOME_1" == "success" && -n "$DEPLOYMENT_URL_1" ]]; then
            selected_attempt="1"
            selected_url="$DEPLOYMENT_URL_1"
          elif [[ "$DEPLOYMENT_OUTCOME_2" == "success" && -n "$DEPLOYMENT_URL_2" ]]; then
            selected_attempt="2"
            selected_url="$DEPLOYMENT_URL_2"
          elif [[ "$DEPLOYMENT_OUTCOME_3" == "success" && -n "$DEPLOYMENT_URL_3" ]]; then
            selected_attempt="3"
            selected_url="$DEPLOYMENT_URL_3"
          fi

          {
            echo "### GitHub Pages deployment"
            echo ""
            echo "| Attempt | Outcome |"
            echo "|---:|---|"
            echo "| 1 | ${DEPLOYMENT_OUTCOME_1:-not-run} |"
            echo "| 2 | ${DEPLOYMENT_OUTCOME_2:-not-run} |"
            echo "| 3 | ${DEPLOYMENT_OUTCOME_3:-not-run} |"
            echo ""
            echo "Artifact: \`github-pages\` (ID: ${PAGES_ARTIFACT_ID:-unavailable})"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          deployment_attempted=false
          for outcome in \
            "$DEPLOYMENT_OUTCOME_1" \
            "$DEPLOYMENT_OUTCOME_2" \
            "$DEPLOYMENT_OUTCOME_3"; do
            if [[ "$outcome" == "success" || "$outcome" == "failure" ]]; then
              deployment_attempted=true
              break
            fi
          done

          if [[ "$deployment_attempted" != "true" ]]; then
            echo "::error::GitHub Pages deployment was not attempted because an upstream step failed; inspect preceding steps."
            exit 1
          fi

          if [[ -z "$selected_attempt" ]]; then
            echo "::error::GitHub Pages deployment failed after three attempts."
            exit 1
          fi

          echo "page_url=$selected_url" >> "$GITHUB_OUTPUT"
          echo "attempt=$selected_attempt" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Succeeded on attempt $selected_attempt: $selected_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record final shadow preview Pages distribution outcome
        if: >-
          ${{ always() && !cancelled() &&
              steps.run_mode.outputs.deploy_pages == 'true' &&
              steps.run_mode.outputs.governance_preview == 'true' &&
              steps.pages_distribution_start.outcome == 'success' &&
              (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure') }}
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DISTRIBUTION_OBSERVED_AT: ${{ steps.pages_distribution_start.outputs.observed_at }}
          VERIFICATION_OUTCOME: ${{ steps.pages_deployment_result.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFICATION_OUTCOME" == "success" || "$VERIFICATION_OUTCOME" == "failure" ]]
          succeeded=false
          if [[ "$VERIFICATION_OUTCOME" == "success" ]]; then
            succeeded=true
          fi
          python .github/scripts/record-web-distribution.py \
            --target pages \
            --operation legacy-shadow-preview \
            --succeeded "$succeeded" \
            --observed-at "$DISTRIBUTION_OBSERVED_AT"

      - name: Preserve failed Pages artifact
        if: ${{ !cancelled() && steps.run_mode.outputs.deploy_pages == 'true' && steps.legacy_pages_artifact.outcome == 'success' && steps.pages_deployment_result.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.legacy_pages_artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Send daily report message
        if: ${{ false }} # Permanent web-only distribution policy.
        run: echo "Telegram outbound delivery is permanently disabled."
