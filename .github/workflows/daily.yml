name: Daily governance pages

on:
  schedule:
    # KST 05:45: generate and deploy the daily pages (UTC 20:45).
    - cron: "45 20 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Daily operation to run
        required: true
        type: choice
        default: generate
        options:
          - generate

permissions:
  contents: read
  models: read

concurrency:
  group: daily-pages-and-briefing-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  generate:
    if: >-
      (github.event_name == 'schedule' &&
       github.event.schedule == '45 20 * * *' &&
       (
         vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
         vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
         (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
       )) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.operation == 'generate')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: >-
        ${{ (vars.PAGES_OWNER == 'governance' && vars.GOVERNANCE_PIPELINE_MODE == 'live') &&
            format('bside-pages-deployment-{0}', github.repository) ||
            format('bside-pages-nondeploy-governance-{0}-{1}', github.repository, github.run_id) }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      models: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages_deployment_result.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve rolling legacy recovery source
        id: legacy_recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const resolve = require("./.github/scripts/resolve-legacy-recovery.cjs");
            await resolve({github, context, core});

      - name: Download rolling legacy recovery bundle
        if: steps.legacy_recovery.outputs.mode == 'carry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.legacy_recovery.outputs.artifact_id }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          github-token: ${{ github.token }}
          run-id: ${{ steps.legacy_recovery.outputs.run_id }}
          digest-mismatch: error

      - name: Download immutable legacy seed archive
        if: steps.legacy_recovery.outputs.mode == 'seed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
        run: |
          set -euo pipefail
          [[ "$LEGACY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl --fail-with-body --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID/zip" \
            --output "$LEGACY_ARCHIVE_PATH"

      - name: Prepare or verify rolling legacy recovery bundle
        id: recovery_bundle
        shell: bash
        env:
          LEGACY_SOURCE_MODE: ${{ steps.legacy_recovery.outputs.mode }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
          LEGACY_RECOVERY_ROOT: ${{ runner.temp }}/legacy-recovery-bundle
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_SEED_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          if [[ "$LEGACY_SOURCE_MODE" == "seed" ]]; then
            source_artifact_id="$LEGACY_SEED_ARTIFACT_ID"
            python -m curator.legacy_recovery_bundle prepare \
              --archive "$LEGACY_ARCHIVE_PATH" \
              --output "$LEGACY_RECOVERY_ROOT" \
              --source-run-id "$LEGACY_RUN_ID" \
              --source-artifact-id "$source_artifact_id" \
              --source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --source-code-revision "$LEGACY_CODE_REVISION" \
              --source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          else
            source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$LEGACY_RECOVERY_ROOT/legacy-recovery-bundle.json")"
            python -m curator.legacy_recovery_bundle verify \
              --bundle "$LEGACY_RECOVERY_ROOT" \
              --expected-source-run-id "$LEGACY_RUN_ID" \
              --expected-source-artifact-id "$source_artifact_id" \
              --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --expected-source-code-revision "$LEGACY_CODE_REVISION" \
              --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          fi
          echo "source_artifact_id=$source_artifact_id" >> "$GITHUB_OUTPUT"

      - name: Resolve fail-closed rollout mode
        id: rollout
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode --github-output "$GITHUB_OUTPUT"

      - name: Determine Pages deployment eligibility
        id: pages_mode
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GOVERNANCE_PAGES_ENABLED: ${{ steps.rollout.outputs.governance_pages_enabled }}
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        run: |
          set -euo pipefail
          deploy_pages=false
          release_state=not-checked
          if [[ "$REF_NAME" == "$DEFAULT_BRANCH" && "$GOVERNANCE_PAGES_ENABLED" == "true" && "$GOVERNANCE_PIPELINE_MODE" == "live" ]]; then
            release_state=unavailable
            if [[ -z "$GOVERNANCE_API_BASE_URL" || -z "$BSIDE_OPS_TOKEN" ]]; then
              echo "::warning::Governance Pages deployment is blocked because the protected live-state check is not configured."
            else
              api="${GOVERNANCE_API_BASE_URL%/}"
              [[ "$api" == */api/v1 ]] && api="${api%/api/v1}/api/v2"
              [[ "$api" == */api/v2 ]] || api="$api/api/v2"
              status="$(curl --silent --show-error --output release-state-for-pages.json \
                --write-out '%{http_code}' -H "Authorization: Bearer $BSIDE_OPS_TOKEN" \
                "$api/ops/release-state" || true)"
              if [[ "$status" == "200" ]]; then
                release_state="$(jq -r '.data.release_state // "invalid"' release-state-for-pages.json)"
                if [[ "$release_state" == "live" ]]; then
                  deploy_pages=true
                else
                  echo "::notice::Governance artifact was built but not deployed because release state is $release_state."
                fi
              else
                echo "::warning::Governance artifact was built but not deployed because the live-state check returned HTTP ${status:-request-failed}."
              fi
            fi
          elif [[ "$GOVERNANCE_PAGES_ENABLED" == "true" && "$GOVERNANCE_PIPELINE_MODE" != "live" ]]; then
            echo "::notice::Governance artifact was built but not deployed because this run started in $GOVERNANCE_PIPELINE_MODE mode."
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" && "$GOVERNANCE_PAGES_ENABLED" == "true" ]]; then
            echo "::notice::Pages deployment is restricted to the default branch ($DEFAULT_BRANCH)."
          fi
          echo "deploy_pages=$deploy_pages" >> "$GITHUB_OUTPUT"
          echo "release_state=$release_state" >> "$GITHUB_OUTPUT"

      - name: Validate data configuration
        env:
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        run: bash .github/scripts/require-env.sh ACTIVIST_API_URL ACTIVIST_API_SECRET

      - name: Generate pages from the MySQL source of truth
        env:
          CURATOR_DATA_SOURCE: mysql
          CURATOR_DAILY_REPORT_WRITE_ONLY: "1"
          GITHUB_TOKEN: ${{ github.token }}
          STORY_REVIEW_ACCESS_TOKEN: ${{ secrets.STORY_REVIEW_ACCESS_TOKEN }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.daily_report

      - name: Configure public governance UI
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        run: python -m curator.governance_ui --root .

      - name: Stage governance-only Pages artifact
        env:
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          LEGACY_COMPATIBILITY_ROOT: ${{ runner.temp }}/legacy-recovery-bundle/compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.governance_site \
            --root . \
            --output governance-pages-artifact \
            --legacy-root "$LEGACY_COMPATIBILITY_ROOT"

      - name: Preserve rollback artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: governance-pages-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Revalidate live governance ownership at the deployment boundary
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE_SNAPSHOT: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]] || {
            echo "::error::This run did not start with governance Pages ownership; deployment is blocked."
            exit 1
          }
          [[ "$GOVERNANCE_PIPELINE_MODE_SNAPSHOT" == "live" ]] || {
            echo "::error::This run did not start in live mode; deployment is blocked."
            exit 1
          }
          api="${GOVERNANCE_API_BASE_URL%/}"
          [[ "$api" == */api/v1 ]] && api="${api%/api/v1}/api/v2"
          [[ "$api" == */api/v2 ]] || api="$api/api/v2"
          state="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_OPS_TOKEN" \
            "$api/ops/release-state" | jq -r '.data.release_state')"
          [[ "$state" == "live" ]] || {
            echo "::error::Governance release state changed to $state; deployment is blocked."
            exit 1
          }

      - name: Configure Pages
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        id: pages_artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: governance-pages-artifact

      - name: Capture Pages distribution start
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        id: pages_distribution_start
        shell: bash
        run: echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Wait before first Pages retry
        if: steps.pages_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 180

      - name: Retry GitHub Pages deployment (2/3)
        if: steps.pages_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure'
        id: deployment_retry
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Wait before final Pages retry
        if: steps.pages_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 300

      - name: Retry GitHub Pages deployment (3/3)
        if: steps.pages_mode.outputs.deploy_pages == 'true' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_retry_final
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Verify GitHub Pages deployment
        if: ${{ !cancelled() && steps.pages_mode.outputs.deploy_pages == 'true' }}
        id: pages_deployment_result
        shell: bash
        env:
          DEPLOYMENT_OUTCOME_1: ${{ steps.deployment.outcome }}
          DEPLOYMENT_OUTCOME_2: ${{ steps.deployment_retry.outcome }}
          DEPLOYMENT_OUTCOME_3: ${{ steps.deployment_retry_final.outcome }}
          DEPLOYMENT_URL_1: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_URL_2: ${{ steps.deployment_retry.outputs.page_url }}
          DEPLOYMENT_URL_3: ${{ steps.deployment_retry_final.outputs.page_url }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail

          selected_attempt=""
          selected_url=""
          if [[ "$DEPLOYMENT_OUTCOME_1" == "success" && -n "$DEPLOYMENT_URL_1" ]]; then
            selected_attempt="1"
            selected_url="$DEPLOYMENT_URL_1"
          elif [[ "$DEPLOYMENT_OUTCOME_2" == "success" && -n "$DEPLOYMENT_URL_2" ]]; then
            selected_attempt="2"
            selected_url="$DEPLOYMENT_URL_2"
          elif [[ "$DEPLOYMENT_OUTCOME_3" == "success" && -n "$DEPLOYMENT_URL_3" ]]; then
            selected_attempt="3"
            selected_url="$DEPLOYMENT_URL_3"
          fi

          {
            echo "### GitHub Pages deployment"
            echo ""
            echo "| Attempt | Outcome |"
            echo "|---:|---|"
            echo "| 1 | ${DEPLOYMENT_OUTCOME_1:-not-run} |"
            echo "| 2 | ${DEPLOYMENT_OUTCOME_2:-not-run} |"
            echo "| 3 | ${DEPLOYMENT_OUTCOME_3:-not-run} |"
            echo ""
            echo "Artifact: \`github-pages\` (ID: ${PAGES_ARTIFACT_ID:-unavailable})"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

          deployment_attempted=false
          for outcome in \
            "$DEPLOYMENT_OUTCOME_1" \
            "$DEPLOYMENT_OUTCOME_2" \
            "$DEPLOYMENT_OUTCOME_3"; do
            if [[ "$outcome" == "success" || "$outcome" == "failure" ]]; then
              deployment_attempted=true
              break
            fi
          done

          if [[ "$deployment_attempted" != "true" ]]; then
            echo "::error::GitHub Pages deployment was not attempted because an upstream step failed; inspect preceding steps."
            exit 1
          fi

          if [[ -z "$selected_attempt" ]]; then
            echo "::error::GitHub Pages deployment failed after three attempts."
            exit 1
          fi

          echo "page_url=$selected_url" >> "$GITHUB_OUTPUT"
          echo "attempt=$selected_attempt" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Succeeded on attempt $selected_attempt: $selected_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record final Pages distribution outcome
        if: >-
          ${{ always() && !cancelled() &&
              steps.pages_mode.outputs.deploy_pages == 'true' &&
              steps.pages_distribution_start.outcome == 'success' &&
              (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure') }}
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DISTRIBUTION_OBSERVED_AT: ${{ steps.pages_distribution_start.outputs.observed_at }}
          VERIFICATION_OUTCOME: ${{ steps.pages_deployment_result.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFICATION_OUTCOME" == "success" || "$VERIFICATION_OUTCOME" == "failure" ]]
          succeeded=false
          if [[ "$VERIFICATION_OUTCOME" == "success" ]]; then
            succeeded=true
          fi
          python .github/scripts/record-web-distribution.py \
            --target pages \
            --operation daily-governance \
            --succeeded "$succeeded" \
            --observed-at "$DISTRIBUTION_OBSERVED_AT"

      - name: Create daily deployment marker
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        id: deployment_marker
        shell: bash
        run: |
          set -euo pipefail
          kst_date="$(TZ=Asia/Seoul date +%F)"
          mkdir -p deployment-marker
          printf '{"kst_date":"%s","run_id":"%s","revision":"%s"}\n' \
            "$kst_date" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > deployment-marker/deployment.json
          echo "kst_date=$kst_date" >> "$GITHUB_OUTPUT"

      - name: Publish daily deployment marker
        if: steps.pages_mode.outputs.deploy_pages == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-pages-ready-${{ steps.deployment_marker.outputs.kst_date }}
          path: deployment-marker/deployment.json
          if-no-files-found: error
          retention-days: 3

      - name: Refresh verified legacy recovery bundle retention
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-recovery-carry-forward
          path: ${{ runner.temp }}/legacy-recovery-bundle
          if-no-files-found: error
          retention-days: 90
