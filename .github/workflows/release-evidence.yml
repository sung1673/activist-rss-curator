name: Governance production evidence export

on:
  schedule:
    # KST 00:45 for the completed previous KST calendar day (UTC 15:45).
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional successful workflow run containing the protected source artifact
        required: false
        type: string
      source_artifact_name:
        description: Protected artifact containing all six production evidence inputs
        required: true
        default: governance-release-evidence-inputs
        type: string
      through_date:
        description: Optional final KST evidence date (YYYY-MM-DD; defaults to yesterday in KST)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: governance-production-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
      vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
      (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout evidence revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce default-branch evidence revision
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Production evidence export is restricted to the default branch."
            exit 1
          fi

      - name: Resolve protected same-revision source artifact
        id: source_artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_RUN_ID: ${{ inputs.source_run_id || '' }}
          REQUESTED_ARTIFACT_NAME: ${{ inputs.source_artifact_name || 'governance-release-evidence-inputs' }}
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedSha = process.env.EXPECTED_SHA.toLowerCase();
            const defaultBranch = process.env.DEFAULT_BRANCH;
            const expectedWorkflowPath = ".github/workflows/release-evidence-inputs.yml";
            const artifactName = process.env.REQUESTED_ARTIFACT_NAME.trim();
            const requestedRunId = process.env.REQUESTED_RUN_ID.trim();
            const currentRunId = Number(process.env.CURRENT_RUN_ID);
            if (!artifactName) {
              core.setFailed("source_artifact_name must not be empty");
              return;
            }
            if (requestedRunId && !/^[0-9]+$/.test(requestedRunId)) {
              core.setFailed("source_run_id must contain digits only");
              return;
            }
            let artifacts;
            if (requestedRunId) {
              artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: Number(requestedRunId),
                per_page: 100,
              });
            } else {
              artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner,
                repo,
                name: artifactName,
                per_page: 100,
              });
            }
            artifacts.sort((left, right) => right.id - left.id);
            for (const artifact of artifacts) {
              if (artifact.name !== artifactName || artifact.expired) continue;
              const runId = Number(artifact.workflow_run?.id || requestedRunId || 0);
              if (!runId || runId === currentRunId) continue;
              if ((artifact.workflow_run?.head_sha || "").toLowerCase() !== expectedSha) continue;
              const run = await github.rest.actions.getWorkflowRun({owner, repo, run_id: runId});
              if (run.data.conclusion !== "success") continue;
              if ((run.data.head_sha || "").toLowerCase() !== expectedSha) continue;
              if (run.data.head_branch !== defaultBranch) continue;
              if (run.data.path !== expectedWorkflowPath) continue;
              if (!/^sha256:[0-9a-f]{64}$/i.test(artifact.digest || "")) continue;
              core.setOutput("artifact_id", String(artifact.id));
              core.setOutput("run_id", String(runId));
              core.setOutput("digest", artifact.digest.toLowerCase());
              core.info(`Using protected source artifact ${artifact.id} from successful run ${runId}.`);
              return;
            }
            core.setFailed(
              `No unexpired ${artifactName} artifact from ${expectedWorkflowPath} at ${expectedSha} was found.`,
            );

      - name: Download protected source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.source_artifact.outputs.artifact_id }}
          path: evidence-input
          github-token: ${{ github.token }}
          run-id: ${{ steps.source_artifact.outputs.run_id }}
          digest-mismatch: error

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve fail-closed rollout mode
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode

      - name: Export immutable production evidence
        env:
          EVIDENCE_THROUGH_DATE: ${{ inputs.through_date || '' }}
          SOURCE_RUN_ID: ${{ steps.source_artifact.outputs.run_id }}
          SOURCE_ARTIFACT_ID: ${{ steps.source_artifact.outputs.artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source_artifact.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.release_evidence \
            --source-dir evidence-input \
            --output-dir evidence-output \
            --expected-revision "$GITHUB_SHA" \
            --through-date "$EVIDENCE_THROUGH_DATE" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-artifact-id "$SOURCE_ARTIFACT_ID" \
            --source-artifact-digest "$SOURCE_ARTIFACT_DIGEST"

      - name: Upload protected release evidence
        id: evidence_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-release-evidence
          path: evidence-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Record immutable artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence_artifact.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Governance production evidence"
            echo "- revision: \`$GITHUB_SHA\`"
            echo "- artifact id: \`$ARTIFACT_ID\`"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
