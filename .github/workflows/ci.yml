name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          curator
          tests
          .github/scripts/prepare-legacy-pages.py
          .github/scripts/restore-legacy-pages-archive.py

      - name: Validate governance UI build and budgets
        run: python -m curator.governance_ui --root .

      - name: Run Python tests
        run: pytest -q

      - name: Validate PHP API syntax
        shell: bash
        run: find deploy -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Run PHP API contract tests
        run: php tests/php_contracts.php

  php73:
    name: Production PHP 7.3 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PHP73_CI_INSPECTION_TOKEN: php73-ci-local-inspection-token
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_DATABASE: activist_ci
          MYSQL_USER: activist_ci
          MYSQL_PASSWORD: activist_ci_password
          MYSQL_ROOT_PASSWORD: activist_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=activist_ci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build exact API deployment identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m curator.deployment_manifest \
            --root deploy/activist \
            --code-revision "$GITHUB_SHA" \
            --output deploy/activist/deployment-manifest.json
          jq -e --arg revision "$GITHUB_SHA" \
            '.schema_version == 1 and .code_revision == $revision and (.files | length) == 6
              and (.files["migrations/011_global_terminal_v2.sql"] | test("^[0-9a-f]{64}$"))' \
            deploy/activist/deployment-manifest.json > /dev/null

      - name: Set up production-compatible PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "7.3"
          extensions: mbstring, pdo_mysql
          tools: none
          coverage: none
        env:
          fail-fast: true

      - name: Verify PHP runtime and extensions
        shell: bash
        run: |
          php -r 'if (PHP_MAJOR_VERSION !== 7 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "Expected PHP 7.3\n"); exit(1); }'
          php -r 'foreach (["mbstring", "pdo_mysql"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: $extension\n"); exit(1); } }'

      - name: Configure MySQL test user for PHP 7.3
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: >-
          docker exec "$MYSQL_CONTAINER_ID"
          mysql --user=root --password=activist_ci_root_password
          --execute="ALTER USER 'activist_ci'@'%' IDENTIFIED WITH mysql_native_password BY 'activist_ci_password';"

      - name: Validate PHP API syntax on PHP 7.3
        shell: bash
        run: |
          find deploy -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l tests/php73_config.php
          php -l tests/php73_router.php

      - name: Run PHP API contract tests on PHP 7.3
        run: php tests/php_contracts.php

      - name: Install isolated PHP API test configuration
        shell: bash
        run: |
          install -d -m 700 deploy/activist/_private
          install -m 600 tests/php73_config.php deploy/activist/_private/config.php

      - name: Run PHP 7.3 and MySQL Telegram staging smoke
        timeout-minutes: 3
        shell: bash
        run: |
          php -S 127.0.0.1:8787 -t deploy/activist tests/php73_router.php >"$RUNNER_TEMP/php73-server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/php73-server.pid"
          python3 tests/php73_staging_smoke.py --base-url http://127.0.0.1:8787

      - name: Validate governance schema and release-state guard
        timeout-minutes: 5
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          status="$(curl --silent --output "$RUNNER_TEMP/pre-migration-v1.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v1/events)"
          test "$status" = "503"
          grep -q 'schema_version_mismatch' "$RUNNER_TEMP/pre-migration-v1.json"
          legacy_status="$(curl --silent --output "$RUNNER_TEMP/pre-migration-legacy.json" --write-out '%{http_code}' \
            'http://127.0.0.1:8787/api.php?action=reports')"
          test "$legacy_status" = "503"
          grep -q 'schema_version_mismatch' "$RUNNER_TEMP/pre-migration-legacy.json"
          sed 's/activist_/ci_/g' deploy/activist/migrations/006_governance_release_guard.sql \
            > "$RUNNER_TEMP/006_governance_release_guard_ci.sql"
          sed 's/activist_/ci_/g' deploy/activist/migrations/007_governance_identity_and_evidence.sql \
            > "$RUNNER_TEMP/007_governance_identity_and_evidence_ci.sql"
          sed 's/activist_/ci_/g' deploy/activist/migrations/008_official_site_snapshot_receipts.sql \
            > "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"
          sed 's/activist_/ci_/g' deploy/activist/migrations/009_dart_global_quota_ledger.sql \
            > "$RUNNER_TEMP/009_dart_global_quota_ledger_ci.sql"
          sed 's/activist_/ci_/g' deploy/activist/migrations/010_official_slot_claim_ledger.sql \
            > "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"
          migration_010_checksum="$(printf '%s' 'bside-governance-migration-v1:10:010_official_slot_claim_ledger' | sha256sum | cut -d ' ' -f1)"
          test "$migration_010_checksum" = '2b8be6264c8a4f3be038729fbf6bbe22e720457874f02c89c82d33db9dc78f51'
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/006_governance_release_guard_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/006_governance_release_guard_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/007_governance_identity_and_evidence_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/007_governance_identity_and_evidence_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/009_dart_global_quota_ledger_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/009_dart_global_quota_ledger_ci.sql"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_name='tampered-006' WHERE migration_version=6;"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"; then
            echo "migration 008 overwrote a conflicting historical migration name" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_name='006_governance_release_guard' WHERE migration_version=6;"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum=REPEAT('0',64) WHERE migration_version=9;"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/009_dart_global_quota_ledger_ci.sql"; then
            echo "migration 009 overwrote a conflicting checksum" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum='9e60867847b7cc2b7d9166c73e395ae872d12a4e91aa62457049468017e5f94d' WHERE migration_version=9;"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum=REPEAT('0',64) WHERE migration_version=10;"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"; then
            echo "migration 010 overwrote a conflicting checksum" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum='2b8be6264c8a4f3be038729fbf6bbe22e720457874f02c89c82d33db9dc78f51' WHERE migration_version=10;"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_official_slot_claims DROP INDEX uq_official_slot_pipeline_run, ADD UNIQUE INDEX uq_official_slot_pipeline_run (github_run_id,pipeline);"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"; then
            echo "migration 010 accepted an incompatible same-name run identity index" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_official_slot_claims DROP INDEX uq_official_slot_pipeline_run, ADD UNIQUE INDEX uq_official_slot_pipeline_run (pipeline,github_run_id);"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_official_slot_claims MODIFY completion_ack_count BIGINT UNSIGNED NULL;"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"; then
            echo "migration 010 accepted an incompatible completion ACK column" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_official_slot_claims MODIFY completion_ack_count INT UNSIGNED NULL;"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/010_official_slot_claim_ledger_ci.sql"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_documents DROP INDEX uq_document_right_external_version, ADD UNIQUE INDEX uq_document_right_external_version (source_right_id,version_no,external_id);"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"; then
            echo "migration 008 accepted an incompatible same-name document version index" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_documents DROP INDEX uq_document_right_external_version;"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/008_official_site_snapshot_receipts_ci.sql"
          python3 tests/php73_release_state_smoke.py \
            --base-url http://127.0.0.1:8787 \
            --mysql-container-id "$MYSQL_CONTAINER_ID"

      - name: Validate global terminal v2 schema and HTTP lifecycle
        timeout-minutes: 7
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          identity_backup="$RUNNER_TEMP/deployment-manifest.json"
          core_backup="$RUNNER_TEMP/openapi-v2.yaml"
          migration_backup="$RUNNER_TEMP/011_global_terminal_v2.sql"
          cp deploy/activist/deployment-manifest.json "$identity_backup"
          cp deploy/activist/openapi-v2.yaml "$core_backup"
          cp deploy/activist/migrations/011_global_terminal_v2.sql "$migration_backup"
          trap 'cp "$identity_backup" deploy/activist/deployment-manifest.json; cp "$core_backup" deploy/activist/openapi-v2.yaml; cp "$migration_backup" deploy/activist/migrations/011_global_terminal_v2.sql' EXIT
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:8787/api.php/api/v2/health > "$RUNNER_TEMP/v2-health.json"
          jq -e --arg revision "$GITHUB_SHA" \
            '.ok == true and .api_version == "v2" and .code_revision == $revision' \
            "$RUNNER_TEMP/v2-health.json" > /dev/null
          mv deploy/activist/deployment-manifest.json "$RUNNER_TEMP/deployment-manifest.missing"
          missing_identity_status="$(curl --silent \
            --output "$RUNNER_TEMP/v2-health-missing.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/health)"
          test "$missing_identity_status" = "503"
          grep -q 'deployment_manifest_missing' "$RUNNER_TEMP/v2-health-missing.json"
          cp "$identity_backup" deploy/activist/deployment-manifest.json

          mv deploy/activist/openapi-v2.yaml "$RUNNER_TEMP/openapi-v2.missing"
          missing_core_status="$(curl --silent \
            --output "$RUNNER_TEMP/v2-health-core-missing.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/health)"
          test "$missing_core_status" = "503"
          grep -q 'deployment_core_file_missing' "$RUNNER_TEMP/v2-health-core-missing.json"
          cp "$core_backup" deploy/activist/openapi-v2.yaml
          printf '\n' >> deploy/activist/openapi-v2.yaml
          mismatched_identity_status="$(curl --silent \
            --output "$RUNNER_TEMP/v2-health-mismatch.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/health)"
          test "$mismatched_identity_status" = "503"
          grep -q 'deployment_core_hash_mismatch' "$RUNNER_TEMP/v2-health-mismatch.json"
          cp "$core_backup" deploy/activist/openapi-v2.yaml
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:8787/api.php/api/v2/health \
            | jq -e --arg revision "$GITHUB_SHA" '.code_revision == $revision' > /dev/null

          printf ' ' >> deploy/activist/migrations/011_global_terminal_v2.sql
          mismatched_migration_status="$(curl --silent \
            --output "$RUNNER_TEMP/v2-health-migration-mismatch.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/health)"
          test "$mismatched_migration_status" = "503"
          grep -q 'deployment_core_hash_mismatch' "$RUNNER_TEMP/v2-health-migration-mismatch.json"
          cp "$migration_backup" deploy/activist/migrations/011_global_terminal_v2.sql
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:8787/api.php/api/v2/health \
            | jq -e --arg revision "$GITHUB_SHA" '.code_revision == $revision' > /dev/null

          mv deploy/activist/migrations "$RUNNER_TEMP/migrations-real"
          ln -s "$RUNNER_TEMP/migrations-real" deploy/activist/migrations
          symlinked_parent_status="$(curl --silent \
            --output "$RUNNER_TEMP/v2-health-symlinked-parent.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/health)"
          test "$symlinked_parent_status" = "503"
          grep -q 'deployment_core_file_missing' "$RUNNER_TEMP/v2-health-symlinked-parent.json"
          rm deploy/activist/migrations
          mv "$RUNNER_TEMP/migrations-real" deploy/activist/migrations
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:8787/api.php/api/v2/health \
            | jq -e --arg revision "$GITHUB_SHA" '.code_revision == $revision' > /dev/null
          trap - EXIT

          status="$(curl --silent --output "$RUNNER_TEMP/pre-migration-v2.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/events)"
          test "$status" = "503"
          grep -q 'schema_version_mismatch' "$RUNNER_TEMP/pre-migration-v2.json"
          migration_011_source="deploy/activist/migrations/011_global_terminal_v2.sql"
          migration_011_checksum="$(sha256sum "$migration_011_source" | cut -d ' ' -f1)"
          manifest_migration_checksum="$(jq -r '.files["migrations/011_global_terminal_v2.sql"]' \
            deploy/activist/deployment-manifest.json)"
          test "$manifest_migration_checksum" = "$migration_011_checksum"
          apply_migration_011() {
            {
              printf "SET @bside_migration_011_sha256 = '%s';\n" "$migration_011_checksum"
              sed 's/activist_/ci_/g' "$migration_011_source"
            } | docker exec -i "$MYSQL_CONTAINER_ID" \
              mysql --user=root --password=activist_ci_root_password activist_ci
          }
          if sed 's/activist_/ci_/g' "$migration_011_source" \
            | docker exec -i "$MYSQL_CONTAINER_ID" \
              mysql --user=root --password=activist_ci_root_password activist_ci; then
            echo "migration 011 accepted a missing source byte checksum" >&2
            exit 1
          fi
          apply_migration_011
          initial_release="$(docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password \
            --batch --skip-column-names activist_ci \
            --execute="SELECT release_state,state_version,updated_by FROM ci_governance_release_state WHERE state_key='global_terminal_v2';")"
          test "$initial_release" = $'closed\t0\tmigration:011'
          initial_audit="$(docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password \
            --batch --skip-column-names activist_ci \
            --execute="SELECT previous_state IS NULL,new_state,state_version,changed_by FROM ci_governance_release_audit WHERE audit_id='release:global-terminal:initial:011';")"
          test "$initial_audit" = $'1\tclosed\t0\tmigration:011'
          apply_migration_011
          tampered_migration="$RUNNER_TEMP/011_global_terminal_v2_one_byte_changed.sql"
          cp "$migration_011_source" "$tampered_migration"
          printf ' ' >> "$tampered_migration"
          tampered_migration_checksum="$(sha256sum "$tampered_migration" | cut -d ' ' -f1)"
          test "$tampered_migration_checksum" != "$migration_011_checksum"
          if {
            printf "SET @bside_migration_011_sha256 = '%s';\n" "$tampered_migration_checksum"
            sed 's/activist_/ci_/g' "$tampered_migration"
          } | docker exec -i "$MYSQL_CONTAINER_ID" \
            mysql --user=root --password=activist_ci_root_password activist_ci; then
            echo "migration 011 accepted a one-byte source change" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum=REPEAT('0',64) WHERE migration_version=11;"
          tampered_checksum_status="$(curl --silent \
            --output "$RUNNER_TEMP/tampered-v2-checksum.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/events)"
          test "$tampered_checksum_status" = "503"
          grep -q 'schema_version_mismatch' "$RUNNER_TEMP/tampered-v2-checksum.json"
          if apply_migration_011; then
            echo "migration 011 overwrote a conflicting byte checksum" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_checksum='$migration_011_checksum' WHERE migration_version=11;"
          apply_migration_011
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_name='tampered-011' WHERE migration_version=11;"
          tampered_status="$(curl --silent --output "$RUNNER_TEMP/tampered-v2.json" --write-out '%{http_code}' \
            http://127.0.0.1:8787/api.php/api/v2/events)"
          test "$tampered_status" = "503"
          grep -q 'schema_version_mismatch' "$RUNNER_TEMP/tampered-v2.json"
          if apply_migration_011; then
            echo "migration 011 overwrote a conflicting manifest entry" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="UPDATE ci_schema_migrations SET migration_name='011_global_terminal_v2' WHERE migration_version=11;"
          apply_migration_011
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_brief_items MODIFY event_snapshot_json MEDIUMTEXT NULL;"
          if apply_migration_011; then
            echo "migration 011 accepted an incompatible frozen brief snapshot column" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_brief_items MODIFY event_snapshot_json MEDIUMTEXT NOT NULL;"
          apply_migration_011
          manifest="$(docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password \
            --batch --skip-column-names activist_ci \
            --execute="SELECT migration_name,migration_checksum FROM ci_schema_migrations WHERE migration_version=11;")"
          test "$manifest" = "$(printf '011_global_terminal_v2\t%s' "$migration_011_checksum")"
          python3 tests/php73_global_v2_smoke.py \
            --base-url http://127.0.0.1:8787 \
            --mysql-container-id "$MYSQL_CONTAINER_ID"

      - name: Validate Telegram channel identity index migration
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_telegram_messages DROP INDEX idx_telegram_channel_message_id;"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_telegram_channels DROP COLUMN identity_migration_version;"
          sed 's/activist_/ci_/g' deploy/activist/migrations/005_telegram_channel_identity_index.sql \
            > "$RUNNER_TEMP/005_telegram_channel_identity_index_ci.sql"
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_telegram_channels ADD COLUMN identity_migration_version VARCHAR(8) NULL;"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/005_telegram_channel_identity_index_ci.sql"; then
            echo "migration 005 accepted an incompatible marker column" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_telegram_channels DROP COLUMN identity_migration_version; ALTER TABLE ci_telegram_messages ADD INDEX idx_telegram_channel_message_id (telegram_message_id);"
          if docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/005_telegram_channel_identity_index_ci.sql"; then
            echo "migration 005 accepted an incompatible same-name index" >&2
            exit 1
          fi
          docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            --execute="ALTER TABLE ci_telegram_messages DROP INDEX idx_telegram_channel_message_id;"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/005_telegram_channel_identity_index_ci.sql"
          docker exec -i "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password activist_ci \
            < "$RUNNER_TEMP/005_telegram_channel_identity_index_ci.sql"
          columns="$(docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password \
            --batch --skip-column-names activist_ci --execute="SELECT GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ci_telegram_messages' AND INDEX_NAME='idx_telegram_channel_message_id';")"
          test "$columns" = "telegram_channel_id,telegram_message_id"
          version_columns="$(docker exec "$MYSQL_CONTAINER_ID" mysql --user=root --password=activist_ci_root_password \
            --batch --skip-column-names activist_ci --execute="SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ci_telegram_channels' AND COLUMN_NAME='identity_migration_version' AND DATA_TYPE='tinyint' AND IS_NULLABLE='NO' AND COLUMN_DEFAULT='0';")"
          test "$version_columns" = "1"
          python3 tests/php73_staging_smoke.py --base-url http://127.0.0.1:8787 --verify-post-migration

      - name: Collect PHP and MySQL diagnostics
        if: failure()
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          if [[ -f "$RUNNER_TEMP/php73-server.log" ]]; then
            cat "$RUNNER_TEMP/php73-server.log"
          fi
          docker logs "$MYSQL_CONTAINER_ID" >"$RUNNER_TEMP/php73-mysql.log" 2>&1 || true

      - name: Preserve failed PHP and MySQL diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php73-mysql-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/php73-server.log
            ${{ runner.temp }}/php73-mysql.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop PHP integration server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/php73-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/php73-server.pid")" 2>/dev/null || true
          fi

  quality:
    name: Lint, types, and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: python -m pip install "ruff==0.12.2" "mypy==1.16.1" "pip-audit==2.9.0"

      - name: Lint
        run: >-
          ruff check
          curator
          tests
          .github/scripts/prepare-legacy-pages.py
          .github/scripts/restore-legacy-pages-archive.py
          .github/scripts/validate-api-base-urls.py
          --output-format=github

      - name: Type check governance core
        run: >-
          mypy
          curator/governance.py
          curator/governance_ui.py
          curator/source_rights.py
          curator/link_discovery.py
          curator/editorial_ingest.py
          curator/governance_publisher.py
          curator/backfill_checkpoint_api.py
          curator/benchmark_candidates.py
          curator/dart_canary_sample.py
          curator/dart_quota.py
          curator/dart_review_sample.py
          curator/deployment_manifest.py
          curator/event_identity.py
          curator/global_alpha_monitor.py
          curator/global_alpha_pages_identity.py
          curator/global_alpha_release_gate.py
          curator/global_brief.py
          curator/global_connectors.py
          curator/global_ingest.py
          curator/global_market.py
          curator/governance_site.py
          curator/governance_site_config.py
          curator/label_agreement.py
          curator/legacy_feed_compat.py
          curator/legacy_recovery_bundle.py
          curator/official_source_rights.py
          curator/official_schedule.py
          curator/official_slot_claim.py
          curator/official_slot_epoch.py
          curator/official_ingest.py
          curator/official_backfill.py
          curator/official_site_ingest.py
          curator/operation_mode.py
          curator/quality_benchmark.py
          curator/quality_snapshot.py
          curator/release_evidence.py
          curator/release_evidence_inputs.py
          curator/release_gate.py
          curator/selected_market_ingest.py
          curator/shadow_compare.py
          curator/shadow_engine.py
          .github/scripts/validate-api-base-urls.py
          --ignore-missing-imports
          --follow-imports=skip
          --check-untyped-defs
          --disallow-untyped-defs
          --no-implicit-optional
          --warn-redundant-casts
          --warn-unused-ignores
          --show-error-codes

      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.txt

  ui-e2e:
    name: Browser journeys, accessibility, and mobile budgets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Audit browser test dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production Web Vitals producer contracts
        run: npm run test:web-vitals-probe

      - name: Run rolling legacy recovery resolver contracts
        run: npm run test:legacy-recovery-resolver

      - name: Run governance UI journeys and WCAG checks
        run: npm run test:ui

      - name: Preserve failed browser traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-ui-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
