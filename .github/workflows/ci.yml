name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests and PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          curator
          tests
          .github/scripts/prepare-legacy-pages.py
          .github/scripts/restore-legacy-pages-archive.py

      - name: Validate governance UI build and budgets
        run: python -m curator.governance_ui --root .

      - name: Run Python tests
        run: pytest -q

      - name: Validate PHP API syntax
        shell: bash
        run: find deploy -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Run PHP API contract tests
        run: php tests/php_contracts.php

  php73:
    name: Production PHP 7.3 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PHP73_CI_INSPECTION_TOKEN: php73-ci-local-inspection-token
    services:
      mysql:
        image: mysql:8.0.42
        env:
          MYSQL_DATABASE: activist_ci
          MYSQL_USER: activist_ci
          MYSQL_PASSWORD: activist_ci_password
          MYSQL_ROOT_PASSWORD: activist_ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent --host=127.0.0.1 --user=root --password=activist_ci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up production-compatible PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "7.3"
          extensions: mbstring, pdo_mysql
          tools: none
          coverage: none
        env:
          fail-fast: true

      - name: Verify PHP runtime and extensions
        shell: bash
        run: |
          php -r 'if (PHP_MAJOR_VERSION !== 7 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "Expected PHP 7.3\n"); exit(1); }'
          php -r 'foreach (["mbstring", "pdo_mysql"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing extension: $extension\n"); exit(1); } }'

      - name: Configure MySQL test user for PHP 7.3
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: >-
          docker exec "$MYSQL_CONTAINER_ID"
          mysql --user=root --password=activist_ci_root_password
          --execute="ALTER USER 'activist_ci'@'%' IDENTIFIED WITH mysql_native_password BY 'activist_ci_password';"

      - name: Validate PHP API syntax on PHP 7.3
        shell: bash
        run: |
          find deploy -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
          php -l tests/php73_config.php
          php -l tests/php73_router.php

      - name: Run PHP API contract tests on PHP 7.3
        run: php tests/php_contracts.php

      - name: Install isolated PHP API test configuration
        shell: bash
        run: |
          install -d -m 700 deploy/activist/_private
          install -m 600 tests/php73_config.php deploy/activist/_private/config.php

      - name: Run PHP 7.3 and MySQL Telegram staging smoke
        timeout-minutes: 3
        shell: bash
        run: |
          php -S 127.0.0.1:8787 -t deploy/activist tests/php73_router.php >"$RUNNER_TEMP/php73-server.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/php73-server.pid"
          python3 tests/php73_staging_smoke.py --base-url http://127.0.0.1:8787

      - name: Collect PHP and MySQL diagnostics
        if: failure()
        shell: bash
        env:
          MYSQL_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: |
          if [[ -f "$RUNNER_TEMP/php73-server.log" ]]; then
            cat "$RUNNER_TEMP/php73-server.log"
          fi
          docker logs "$MYSQL_CONTAINER_ID" >"$RUNNER_TEMP/php73-mysql.log" 2>&1 || true

      - name: Preserve failed PHP and MySQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: php73-mysql-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/php73-server.log
            ${{ runner.temp }}/php73-mysql.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop PHP integration server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/php73-server.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/php73-server.pid")" 2>/dev/null || true
          fi

  quality:
    name: Lint, types, and dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: python -m pip install "ruff==0.12.2" "mypy==1.16.1" "pip-audit==2.9.0"

      - name: Lint
        run: >-
          ruff check
          curator
          tests
          .github/scripts/prepare-legacy-pages.py
          .github/scripts/restore-legacy-pages-archive.py
          --output-format=github

      - name: Type check governance core
        run: >-
          mypy
          curator/governance.py
          curator/governance_ui.py
          curator/source_rights.py
          curator/link_discovery.py
          curator/editorial_ingest.py
          curator/governance_publisher.py
          curator/release_gate.py
          --ignore-missing-imports
          --follow-imports=skip
          --check-untyped-defs
          --disallow-untyped-defs
          --no-implicit-optional
          --warn-redundant-casts
          --warn-unused-ignores
          --show-error-codes

      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.txt

  ui-e2e:
    name: Browser journeys, accessibility, and mobile budgets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Audit browser test dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run governance UI journeys and WCAG checks
        run: npm run test:ui

      - name: Preserve failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: governance-ui-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
