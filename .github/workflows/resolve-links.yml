name: Resolve discovered links

on:
  schedule:
    # Run independently from collection and publishing.
    - cron: "22 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum links to inspect
        required: false
        type: number
        default: 100

permissions:
  contents: read

concurrency:
  group: resolve-links-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_GOVERNANCE_SHADOW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate database configuration
        env:
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        run: bash .github/scripts/require-env.sh ACTIVIST_API_URL ACTIVIST_API_SECRET

      - name: Resolve queued Google News discovery URLs
        env:
          CURATOR_DATA_SOURCE: mysql
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          limit="${{ inputs.limit || 100 }}"
          python -m curator.resolve_links --root . --limit "$limit" --timeout 8
