name: Resolve discovered links

on:
  schedule:
    # Capacity: 4 runs/hour x 200 links, independently from publication.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum links to inspect
        required: false
        type: number
        default: 200

permissions:
  contents: read

concurrency:
  group: resolve-links-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (
        github.event_name == 'workflow_dispatch' ||
        vars.PAGES_OWNER == 'legacy' ||
        vars.ENABLE_LEGACY_PIPELINE == 'true' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
        (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: governance-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify immutable workflow revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]] || {
            echo "::error::Checked-out revision $actual does not match workflow revision $GITHUB_SHA."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode

      - name: Validate database configuration
        env:
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
        run: bash .github/scripts/require-env.sh ACTIVIST_API_URL ACTIVIST_API_SECRET

      - name: Resolve queued Google News discovery URLs
        env:
          CURATOR_DATA_SOURCE: mysql
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          RESOLVE_LIMIT: ${{ inputs.limit || 200 }}
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.resolve_links --root . --limit "$RESOLVE_LIMIT" --timeout 8 --max-runtime 1200
