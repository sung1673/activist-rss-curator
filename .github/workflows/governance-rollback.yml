name: Governance protected rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ROLLBACK to close the API and restore the pinned legacy artifact
        required: true
        type: string
      reason:
        description: Auditable rollback reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-production-transition-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    environment:
      name: governance-release
    steps:
      - name: Checkout rollback verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up rollback Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Enforce protected rollback inputs and default branch
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          ROLLBACK_REASON: ${{ inputs.reason }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "ROLLBACK" ]] || {
            echo "::error::confirm must be exactly ROLLBACK."
            exit 1
          }
          [[ ${#ROLLBACK_REASON} -ge 8 ]] || {
            echo "::error::Rollback reason must contain at least eight characters."
            exit 1
          }
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Rollback is restricted to the default branch."
            exit 1
          }
          [[ "$PAGES_OWNER" == "governance" ]] || {
            echo "::error::PAGES_OWNER must remain governance until the API is closed and legacy Pages are restored."
            exit 1
          }
          [[ "$GOVERNANCE_PIPELINE_MODE" == "shadow" ]] || {
            echo "::error::The operator must set GOVERNANCE_PIPELINE_MODE=shadow before rollback dispatch."
            exit 1
          }
          [[ "${ENABLE_TELEGRAM_DELIVERY,,}" != "true" ]]
          [[ "${ENABLE_GOVERNANCE_DELIVERY,,}" != "true" ]]

      - name: Cancel stale Pages producer runs before rollback deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const active = new Set(["queued", "in_progress", "pending", "waiting"]);
            for (const workflow_id of ["build-feed.yml", "daily.yml"]) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id, per_page: 100,
              });
              for (const run of runs) {
                if (active.has(run.status)) {
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                }
              }
            }

      - name: Resolve rolling legacy recovery source
        id: legacy_recovery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const resolve = require("./.github/scripts/resolve-legacy-recovery.cjs");
            await resolve({github, context, core});

      - name: Download rolling legacy recovery bundle
        if: steps.legacy_recovery.outputs.mode == 'carry'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.legacy_recovery.outputs.artifact_id }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          github-token: ${{ github.token }}
          run-id: ${{ steps.legacy_recovery.outputs.run_id }}
          digest-mismatch: error

      - name: Download immutable legacy seed archive
        if: steps.legacy_recovery.outputs.mode == 'seed'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
        run: |
          set -euo pipefail
          [[ "$LEGACY_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl --fail-with-body --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID/zip" \
            --output "$LEGACY_ARCHIVE_PATH"

      - name: Prepare or verify rollback recovery bundle before deployment lock
        shell: bash
        env:
          LEGACY_SOURCE_MODE: ${{ steps.legacy_recovery.outputs.mode }}
          LEGACY_ARCHIVE_PATH: ${{ runner.temp }}/legacy-recovery-seed.zip
          LEGACY_RECOVERY_ROOT: ${{ runner.temp }}/legacy-recovery-bundle
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_SEED_ARTIFACT_ID: ${{ steps.legacy_recovery.outputs.artifact_id }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          if [[ "$LEGACY_SOURCE_MODE" == "seed" ]]; then
            source_artifact_id="$LEGACY_SEED_ARTIFACT_ID"
            python -m curator.legacy_recovery_bundle prepare \
              --archive "$LEGACY_ARCHIVE_PATH" \
              --output "$LEGACY_RECOVERY_ROOT" \
              --source-run-id "$LEGACY_RUN_ID" \
              --source-artifact-id "$source_artifact_id" \
              --source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --source-code-revision "$LEGACY_CODE_REVISION" \
              --source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          else
            source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
              "$LEGACY_RECOVERY_ROOT/legacy-recovery-bundle.json")"
            python -m curator.legacy_recovery_bundle verify \
              --bundle "$LEGACY_RECOVERY_ROOT" \
              --expected-source-run-id "$LEGACY_RUN_ID" \
              --expected-source-artifact-id "$source_artifact_id" \
              --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
              --expected-source-code-revision "$LEGACY_CODE_REVISION" \
              --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"
          fi

      - name: Preserve same-run verified rollback bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legacy-recovery-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-recovery-bundle
          if-no-files-found: error
          retention-days: 7

  deploy_legacy:
    needs: close
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bside-pages-deployment-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout observation producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up recovery Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download same-run verified rollback bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legacy-recovery-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: legacy-recovery-bundle
          digest-mismatch: error

      - name: Validate legacy artifact without executing its contents
        env:
          LEGACY_RUN_ID: ${{ vars.LEGACY_ROLLBACK_RUN_ID }}
          LEGACY_ARTIFACT_NAME: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_NAME }}
          LEGACY_CODE_REVISION: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          LEGACY_ARTIFACT_DIGEST: ${{ vars.LEGACY_ROLLBACK_ARTIFACT_DIGEST }}
        shell: bash
        run: |
          set -euo pipefail
          source_artifact_id="$(jq -er '.source.artifact_id | select(type == "string" and test("^[1-9][0-9]*$"))' \
            legacy-recovery-bundle/legacy-recovery-bundle.json)"
          python -m curator.legacy_recovery_bundle verify \
            --bundle legacy-recovery-bundle \
            --expected-source-run-id "$LEGACY_RUN_ID" \
            --expected-source-artifact-id "$source_artifact_id" \
            --expected-source-artifact-name "$LEGACY_ARTIFACT_NAME" \
            --expected-source-code-revision "$LEGACY_CODE_REVISION" \
            --expected-source-artifact-digest "$LEGACY_ARTIFACT_DIGEST"

      - name: Close v2 then v1 release states after acquiring Pages deployment lock
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$BSIDE_ADMIN_TOKEN" && -n "$GOVERNANCE_API_BASE_URL" ]] || {
            echo "::error::Protected admin token and governance API base URL are required."
            exit 1
          }
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          [[ "$v1_api" == */api/v1 ]] || {
            echo "::error::GOVERNANCE_API_BASE_URL must end in /api/v1."
            exit 1
          }
          v2_api="${v1_api%/api/v1}/api/v2"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" > rollback-v2-before.json
          v2_state="$(jq -r '.data.release_state' rollback-v2-before.json)"
          v2_version="$(jq -r '.data.state_version' rollback-v2-before.json)"
          [[ "$v2_version" =~ ^[0-9]+$ ]] || exit 1
          if [[ "$v2_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v2_version" --arg reason "$ROLLBACK_REASON" \
              '{release_state:"closed",expected_version:$version,reason:$reason}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: rollback-close-v2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v2_api/admin/release-state" > rollback-v2-closed.json
            [[ "$(jq -r '.data.release_state' rollback-v2-closed.json)" == "closed" ]] || exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" > rollback-v1-before.json
          v1_state="$(jq -r '.release_state' rollback-v1-before.json)"
          v1_version="$(jq -r '.state_version' rollback-v1-before.json)"
          [[ "$v1_version" =~ ^[0-9]+$ ]] || exit 1
          if [[ "$v1_state" != "closed" ]]; then
            payload="$(jq -nc --argjson version "$v1_version" --arg reason "$ROLLBACK_REASON" \
              '{release_state:"closed",expected_version:$version,reason:$reason}')"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" -H "Content-Type: application/json" \
              -H "X-Request-ID: rollback-close-v1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --data "$payload" "$v1_api/admin/release-state" > rollback-v1-closed.json
            [[ "$(jq -r '.release_state' rollback-v1-closed.json)" == "closed" ]] || exit 1
          fi

      - name: Verify both release states closed before legacy deployment
        env:
          BSIDE_ADMIN_TOKEN: ${{ secrets.BSIDE_ADMIN_TOKEN }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v2_api/admin/release-state" | jq -e '.data.release_state == "closed"'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $BSIDE_ADMIN_TOKEN" \
            "$v1_api/admin/release-state" | jq -e '.release_state == "closed"'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pinned legacy Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: legacy-recovery-bundle/full-site

      - name: Capture legacy Pages distribution start
        id: pages_distribution_start
        shell: bash
        run: echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Deploy pinned legacy artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages

      - name: Record legacy Pages distribution outcome
        if: >-
          ${{ always() && !cancelled() &&
              steps.pages_distribution_start.outcome == 'success' &&
              (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure') }}
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          DISTRIBUTION_BUILD_SHA: ${{ vars.LEGACY_ROLLBACK_CODE_REVISION }}
          DISTRIBUTION_OBSERVED_AT: ${{ steps.pages_distribution_start.outputs.observed_at }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          succeeded=false
          if [[ "$DEPLOYMENT_OUTCOME" == "success" ]]; then
            succeeded=true
          fi
          python .github/scripts/record-web-distribution.py \
            --target pages \
            --operation rollback-legacy \
            --succeeded "$succeeded" \
            --observed-at "$DISTRIBUTION_OBSERVED_AT" \
            --build-sha "$DISTRIBUTION_BUILD_SHA"

  finalize:
    needs: [close, deploy_legacy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Smoke restored legacy site and both closed API boundaries
        env:
          BSIDE_PUBLIC_WEB_URL: ${{ vars.BSIDE_PUBLIC_WEB_URL || 'https://news.bside.ai' }}
          GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
          ACTIVIST_PUBLIC_API_URL: ${{ vars.ACTIVIST_PUBLIC_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GOVERNANCE_API_BASE_URL" && -n "$ACTIVIST_PUBLIC_API_URL" ]] || {
            echo "::error::API smoke-test URLs are required."
            exit 1
          }
          web="${BSIDE_PUBLIC_WEB_URL%/}"
          v1_api="${GOVERNANCE_API_BASE_URL%/}"
          v2_api="${v1_api%/api/v1}/api/v2"
          legacy_api="${ACTIVIST_PUBLIC_API_URL%/}"
          for path in / /feed.xml; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "$web$path"
          done
          curl --fail --silent --show-error --output /dev/null "$v1_api/health"
          curl --fail --silent --show-error --output /dev/null "$v2_api/health"
          v2_status="$(curl --silent --show-error --output rollback-v2-closed-response.json \
            --write-out '%{http_code}' "$v2_api/events?limit=1")"
          [[ "$v2_status" == "503" ]]
          [[ "$(jq -r '.error' rollback-v2-closed-response.json)" == "global_terminal_release_closed" ]]
          v1_status="$(curl --silent --show-error --output rollback-v1-closed-response.json \
            --write-out '%{http_code}' "$v1_api/events?limit=1")"
          [[ "$v1_status" == "503" ]]
          [[ "$(jq -r '.error' rollback-v1-closed-response.json)" == "governance_release_closed" ]]
          curl --fail --silent --show-error --output /dev/null "$legacy_api?action=reports"

      - name: Verify protected ownership boundary and record rollback
        env:
          PAGES_OWNER_SNAPSHOT: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE_SNAPSHOT: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_OWNER_SNAPSHOT" == "governance" ]] || {
            echo "::error::PAGES_OWNER changed before the closed API and legacy deployment were verified."
            exit 1
          }
          [[ "$GOVERNANCE_PIPELINE_MODE_SNAPSHOT" == "shadow" ]]
          {
            echo "### Governance rollback deployment complete"
            echo "- v2 global terminal release state: \`closed\`"
            echo "- v1 compatibility release state: \`closed\`"
            echo "- deployed Pages artifact: \`legacy\`"
            echo "- declared Pages owner remains: \`governance\`"
            echo "- pipeline mode: \`shadow\`"
            echo "- rollback used a fail-closed compensating sequence, not an atomic DB transition"
            echo "- repository variables are not changed by this workflow"
            echo "- until the commands below succeed, legacy and governance scheduled deployers both remain fail-closed"
            echo "- database rows, SourceRight withdrawal history, and new governance data were preserved"
            echo ""
            echo "Run from the approved operator workstation using its currently authenticated local gh session:"
            echo '```bash'
            echo 'gh auth status'
            echo 'gh variable set GOVERNANCE_PIPELINE_MODE --body shadow --repo sung1673/activist-rss-curator'
            echo 'gh variable set PAGES_OWNER --body legacy --repo sung1673/activist-rss-curator'
            echo 'test "$(gh variable get GOVERNANCE_PIPELINE_MODE --repo sung1673/activist-rss-curator)" = "shadow"'
            echo 'test "$(gh variable get PAGES_OWNER --repo sung1673/activist-rss-curator)" = "legacy"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
