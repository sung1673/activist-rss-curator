name: Ingest global official sources

on:
  schedule:
    # Offset from the Korean official-ingest jobs to reduce API and DB bursts.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      market:
        description: Official market connector to run
        required: true
        type: choice
        default: all
        options:
          - all
          - US
      from_date:
        description: Inclusive YYYY-MM-DD (both dates blank resume the durable checkpoint)
        required: false
        type: string
        default: ""
      to_date:
        description: Exclusive YYYY-MM-DD (both dates blank resume the durable checkpoint)
        required: false
        type: string
        default: ""
      max_pages:
        description: Fail-closed total request/page budget (SEC daily + current Atom)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ingest-global-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (
        github.event_name == 'workflow_dispatch' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'live'
      )
    strategy:
      fail-fast: false
      matrix:
        country: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.market != 'all' && format('["{0}"]', inputs.market) || '["US"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: governance-runtime
    env:
      GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
      GOVERNANCE_API_BASE_URL: ${{ vars.GOVERNANCE_API_BASE_URL }}
      SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Initialize fail-safe evidence
        id: initialize
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/global-ingest-${{ matrix.country }}.json
        run: >-
          python -c "import json,os,pathlib;
          pathlib.Path(os.environ['EVIDENCE_PATH']).write_text(
          json.dumps({'schema_version':1,'status':'not_started',
          'country_code':'${{ matrix.country }}',
          'code_revision':'${{ github.sha }}'},sort_keys=True,indent=2)+'\n',
          encoding='utf-8')"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate the public and privileged API binding
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
        run: python .github/scripts/validate-api-base-urls.py --github-env "$GITHUB_ENV"

      - name: Collect and ingest official source
        env:
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          MAX_PAGES_INPUT: ${{ inputs.max_pages }}
          EVIDENCE_PATH: ${{ runner.temp }}/global-ingest-${{ matrix.country }}.json
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MAX_PAGES_INPUT:-}" ]]; then
            max_pages="$MAX_PAGES_INPUT"
          else
            max_pages="200"
          fi
          python -m curator.global_ingest \
            --country "${{ matrix.country }}" \
            --from-date "${FROM_DATE:-}" \
            --to-date "${TO_DATE:-}" \
            --max-pages "$max_pages" \
            --code-revision "$GITHUB_SHA" \
            --evidence "$EVIDENCE_PATH" \
            --require-active-pipeline

      - name: Preserve global ingest evidence
        if: always() && steps.initialize.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-ingest-${{ matrix.country }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/global-ingest-${{ matrix.country }}.json
          if-no-files-found: error
          retention-days: 30
