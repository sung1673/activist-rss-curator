name: Ingest company and activist official sites

on:
  schedule:
    # Every 30 minutes. The job itself is fail-closed unless the resolved mode
    # is shadow or live.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-official-sites-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (
        vars.GOVERNANCE_PIPELINE_MODE == 'shadow' ||
        vars.GOVERNANCE_PIPELINE_MODE == 'live' ||
        (vars.GOVERNANCE_PIPELINE_MODE == '' && vars.ENABLE_GOVERNANCE_SHADOW == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-runtime
    steps:
      - name: Checkout immutable candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve fail-closed rollout mode
        id: rollout
        env:
          PAGES_OWNER: ${{ vars.PAGES_OWNER }}
          GOVERNANCE_PIPELINE_MODE: ${{ vars.GOVERNANCE_PIPELINE_MODE }}
          ENABLE_PAGES: ${{ vars.ENABLE_PAGES }}
          ENABLE_GOVERNANCE_PAGES: ${{ vars.ENABLE_GOVERNANCE_PAGES }}
          ENABLE_GOVERNANCE_SHADOW: ${{ vars.ENABLE_GOVERNANCE_SHADOW }}
          ENABLE_TELEGRAM_DELIVERY: ${{ vars.ENABLE_TELEGRAM_DELIVERY }}
          ENABLE_GOVERNANCE_DELIVERY: ${{ vars.ENABLE_GOVERNANCE_DELIVERY }}
        run: python -m curator.operation_mode --github-output "$GITHUB_OUTPUT"

      - name: Require shadow or live and protected inputs
        env:
          RESOLVED_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          OFFICIAL_SITE_ALLOWLIST_B64: ${{ secrets.OFFICIAL_SITE_ALLOWLIST_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RESOLVED_MODE" == "shadow" || "$RESOLVED_MODE" == "live" ]]
          bash .github/scripts/require-env.sh \
            BSIDE_API_BASE_URL BSIDE_OPS_TOKEN ACTIVIST_API_URL \
            ACTIVIST_API_SECRET OFFICIAL_SITE_ALLOWLIST_B64

      - name: Collect credential-free official-site adapters
        env:
          GOVERNANCE_PIPELINE_MODE: ${{ steps.rollout.outputs.governance_pipeline_mode }}
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          BSIDE_OPS_TOKEN: ${{ secrets.BSIDE_OPS_TOKEN }}
          ACTIVIST_API_URL: ${{ secrets.ACTIVIST_API_URL }}
          ACTIVIST_API_SECRET: ${{ secrets.ACTIVIST_API_SECRET }}
          OFFICIAL_SITE_ALLOWLIST_B64: ${{ secrets.OFFICIAL_SITE_ALLOWLIST_B64 }}
          ENABLE_TELEGRAM_DELIVERY: "false"
          ENABLE_GOVERNANCE_DELIVERY: "false"
        run: >-
          python -m curator.official_site_ingest
          --apply
          --output official-site-receipt/receipt.json

      - name: Preserve immutable review receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-official-sites-${{ github.run_id }}-${{ github.run_attempt }}
          path: official-site-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
