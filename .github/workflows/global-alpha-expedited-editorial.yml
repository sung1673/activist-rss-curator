name: Expedited Alpha editorial review and publication

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Export, apply, or safely carry an immutable human review
        required: true
        default: export
        type: choice
        options:
          - export
          - apply
          - carry-forward
          - carry-forward-recover
      confirmation:
        description: Type the exact confirmation required by the selected operation
        required: true
        type: string
      candidate_run_id:
        description: Export workflow run ID (apply only)
        required: false
        type: string
      candidate_artifact_id:
        description: Immutable candidate artifact ID (apply only)
        required: false
        type: string
      candidate_artifact_name:
        description: Immutable candidate artifact name (apply only)
        required: false
        type: string
      candidate_artifact_digest:
        description: Immutable candidate artifact sha256 digest (apply only)
        required: false
        type: string
      publication_run_id:
        description: Prior protected publication workflow run ID (carry-forward only)
        required: false
        type: string
      publication_artifact_id:
        description: Prior protected publication artifact ID (carry-forward only)
        required: false
        type: string
      publication_artifact_name:
        description: Prior protected publication artifact name (carry-forward only)
        required: false
        type: string
      publication_artifact_digest:
        description: Prior protected publication sha256 digest (carry-forward only)
        required: false
        type: string
      intent_run_id:
        description: Pre-uploaded carry intent workflow run ID (recovery only)
        required: false
        type: string
      intent_artifact_id:
        description: Pre-uploaded carry intent artifact ID (recovery only)
        required: false
        type: string
      intent_artifact_name:
        description: Pre-uploaded carry intent artifact name (recovery only)
        required: false
        type: string
      intent_artifact_digest:
        description: Pre-uploaded carry intent sha256 digest (recovery only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: global-alpha-expedited-editorial-${{ github.repository }}
  cancel-in-progress: false

jobs:
  export:
    if: inputs.operation == 'export'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-runtime
    env:
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_EDITOR_TOKEN: ${{ secrets.BSIDE_EDITOR_TOKEN }}
    steps:
      - name: Enforce the exact deployed default-branch candidate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Editorial candidates must use the default branch."
            exit 1
          }
          [[ "$CONFIRMATION" == "EXPORT_EXPEDITED_EDITORIAL" ]] || {
            echo "::error::The export confirmation did not match."
            exit 1
          }
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_EDITOR_TOKEN" ]] || {
            echo "::error::The API base and editor token are required."
            exit 1
          }
          case "${BSIDE_API_BASE_URL%/}" in
            "https://alignpe.gabia.io/activist/api.php/api/v1" | \
            "https://alignpe.gabia.io/activist/api.php/api/v2") ;;
            *)
              echo "::error::The editor token may only be sent to the protected production API."
              exit 1
              ;;
          esac

      - name: Checkout the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned API client
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Export exact 20/40/5 blank human-review candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.global_alpha_expedited_editorial export \
            --output-dir editorial-candidate-artifact
          test -s editorial-candidate-artifact/editorial-candidates.json
          test -s editorial-candidate-artifact/human-decisions-template.json
          test -s editorial-candidate-artifact/review-pack.md

      - name: Upload immutable editorial candidates
        id: candidate_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-editorial-candidates-${{ github.sha }}
          path: editorial-candidate-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record immutable candidate identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          candidate_sha="$(
            python -c 'import json; from pathlib import Path; print(json.loads(Path("editorial-candidate-artifact/editorial-candidates.json").read_text(encoding="utf-8"))["candidate_sha256"])'
          )"
          {
            echo "### Expedited Alpha editorial candidates"
            echo "- code revision: \`$GITHUB_SHA\`"
            echo "- workflow run id: \`$GITHUB_RUN_ID\`"
            echo "- artifact id: \`$ARTIFACT_ID\`"
            echo "- artifact name: \`global-alpha-expedited-editorial-candidates-$GITHUB_SHA\`"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- candidate SHA-256: \`$candidate_sha\`"
            echo "- contains blank decisions only; no human judgment was generated"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: inputs.operation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: governance-release
    env:
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_EDITOR_TOKEN: ${{ secrets.BSIDE_EDITOR_TOKEN }}
      HUMAN_DECISIONS_GZIP_B64: ${{ secrets.GLOBAL_ALPHA_EXPEDITED_EDITORIAL_DECISIONS_GZIP_B64 }}
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
    steps:
      - name: Enforce protected apply inputs and default branch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$CONFIRMATION" == "APPLY_EXPEDITED_EDITORIAL" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" == \
            "global-alpha-expedited-editorial-candidates-$GITHUB_SHA" ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_EDITOR_TOKEN" ]]
          [[ -n "$HUMAN_DECISIONS_GZIP_B64" ]]
          case "${BSIDE_API_BASE_URL%/}" in
            "https://alignpe.gabia.io/activist/api.php/api/v1" | \
            "https://alignpe.gabia.io/activist/api.php/api/v2") ;;
            *)
              echo "::error::The editor token may only be sent to the protected production API."
              exit 1
              ;;
          esac

      - name: Checkout the exact approved release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

      - name: Resolve exact immutable candidate artifact metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_metadata="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID"
          )"
          artifacts_metadata="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100"
          )"
          export RUN_METADATA="$run_metadata"
          export ARTIFACTS_METADATA="$artifacts_metadata"
          python -c '
          import datetime as dt, json, os
          run = json.loads(os.environ["RUN_METADATA"])
          listing = json.loads(os.environ["ARTIFACTS_METADATA"])
          expected_run_id = int(os.environ["CANDIDATE_RUN_ID"])
          expected_artifact = {
              "id": int(os.environ["CANDIDATE_ARTIFACT_ID"]),
              "name": os.environ["CANDIDATE_ARTIFACT_NAME"],
              "digest": os.environ["CANDIDATE_ARTIFACT_DIGEST"],
              "workflow_run_id": expected_run_id,
          }
          actual_run = {
              "id": run.get("id"),
              "path": run.get("path"),
              "head_sha": run.get("head_sha"),
              "head_branch": run.get("head_branch"),
              "event": run.get("event"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "repository": (run.get("head_repository") or {}).get("full_name"),
          }
          expected_run = {
              "id": expected_run_id,
              "path": ".github/workflows/global-alpha-expedited-editorial.yml",
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": os.environ["DEFAULT_BRANCH"],
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "repository": os.environ["GITHUB_REPOSITORY"],
          }
          artifacts = listing.get("artifacts")
          if (
              actual_run != expected_run
              or not isinstance(run.get("run_attempt"), int)
              or run["run_attempt"] < 1
              or listing.get("total_count") != 1
              or not isinstance(artifacts, list)
              or len(artifacts) != 1
          ):
              raise SystemExit("candidate producer run provenance mismatch")
          artifact = artifacts[0]
          actual_artifact = {
              "id": artifact.get("id"),
              "name": artifact.get("name"),
              "digest": artifact.get("digest"),
              "workflow_run_id": (artifact.get("workflow_run") or {}).get("id"),
          }
          def instant(value):
              return dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
          now = dt.datetime.now(dt.timezone.utc)
          created = instant(artifact.get("created_at"))
          updated = instant(run.get("updated_at"))
          fresh = all(
              now - dt.timedelta(hours=72) <= value <= now + dt.timedelta(minutes=5)
              for value in (created, updated)
          )
          if (
              artifact.get("expired") is not False
              or actual_artifact != expected_artifact
              or not fresh
          ):
              raise SystemExit("candidate artifact provenance mismatch")
          '

      - name: Download exact immutable candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: editorial-candidate-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned API client
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Materialize one-use human decisions without logging
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m curator.global_alpha_expedited_editorial \
            decode-decisions \
            --output human-decisions.json
          test -s human-decisions.json
          [[ "$(wc -c < human-decisions.json)" -le 5000000 ]]

      - name: Preflight and apply exact human decisions
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.global_alpha_expedited_editorial apply \
            --candidate editorial-candidate-artifact/editorial-candidates.json \
            --decisions human-decisions.json \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --output-dir editorial-publication
          test -s editorial-publication/human-review.json
          test -s editorial-publication/publication-receipt.json

      - name: Replay the exact publication and prove idempotency
        shell: bash
        run: |
          set -euo pipefail
          python -m curator.global_alpha_expedited_editorial apply \
            --candidate editorial-candidate-artifact/editorial-candidates.json \
            --decisions human-decisions.json \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --output-dir editorial-replay
          cp editorial-replay/publication-receipt.json \
            editorial-publication/publication-replay-receipt.json
          python -c '
          import json
          from pathlib import Path
          first = json.loads(Path("editorial-publication/publication-receipt.json").read_text(encoding="utf-8"))
          replay = json.loads(Path("editorial-publication/publication-replay-receipt.json").read_text(encoding="utf-8"))
          if first["semantic_receipt_sha256"] != replay["semantic_receipt_sha256"]:
              raise SystemExit("publication semantic receipt changed on replay")
          if replay["mutations_applied"] != 0 or replay["idempotent_replay"] is not True:
              raise SystemExit("publication replay was not idempotent")
          if replay["brief"]["idempotent"] is not True:
              raise SystemExit("brief replay was not idempotent")
          '

      - name: Remove the materialized human decision file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f human-decisions.json ]]; then
            shred -u human-decisions.json 2>/dev/null || rm -f human-decisions.json
          fi

      - name: Upload protected publication evidence
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-editorial-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: editorial-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record publication identity
        shell: bash
        env:
          PUBLICATION_ARTIFACT_ID: ${{ steps.publication_artifact.outputs.artifact-id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ steps.publication_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          semantic="$(
            python -c 'import json; from pathlib import Path; print(json.loads(Path("editorial-publication/publication-receipt.json").read_text(encoding="utf-8"))["semantic_receipt_sha256"])'
          )"
          {
            echo "### Expedited Alpha protected editorial publication"
            echo "- code revision: \`$GITHUB_SHA\`"
            echo "- candidate artifact id: \`$CANDIDATE_ARTIFACT_ID\`"
            echo "- publication artifact id: \`$PUBLICATION_ARTIFACT_ID\`"
            echo "- publication artifact digest: \`$PUBLICATION_ARTIFACT_DIGEST\`"
            echo "- semantic publication receipt: \`$semantic\`"
            echo "- exact replay: idempotent"
            echo "- operator action: delete GLOBAL_ALPHA_EXPEDITED_EDITORIAL_DECISIONS_GZIP_B64 now"
          } >> "$GITHUB_STEP_SUMMARY"

  carry_forward_prepare:
    name: Freeze and upload carry-forward intent
    if: inputs.operation == 'carry-forward'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: governance-release
    outputs:
      profile_id: ${{ steps.profile.outputs.profile_id }}
      intent_run_id: ${{ steps.intent_identity.outputs.run_id }}
      intent_artifact_id: ${{ steps.intent_identity.outputs.artifact_id }}
      intent_artifact_name: ${{ steps.intent_identity.outputs.artifact_name }}
      intent_artifact_digest: ${{ steps.intent_identity.outputs.artifact_digest }}
    env:
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_EDITOR_TOKEN: ${{ secrets.BSIDE_EDITOR_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
      CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
      PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
      PUBLICATION_ARTIFACT_ID: ${{ inputs.publication_artifact_id }}
      PUBLICATION_ARTIFACT_NAME: ${{ inputs.publication_artifact_name }}
      PUBLICATION_ARTIFACT_DIGEST: ${{ inputs.publication_artifact_digest }}
    steps:
      - name: Enforce protected carry-forward inputs
        id: profile
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$CONFIRMATION" == "CARRY_FORWARD_EXPEDITED_EDITORIAL" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          legacy=false
          fresh=false
          if [[ "$CANDIDATE_RUN_ID" == "30581161308" \
            && "$CANDIDATE_ARTIFACT_ID" == "8774655231" \
            && "$CANDIDATE_ARTIFACT_NAME" == \
              "global-alpha-expedited-editorial-candidates-b44a1aebc2eb6e7b58e5960b0f8245b87e901052" \
            && "$CANDIDATE_ARTIFACT_DIGEST" == \
              "sha256:f7eec4481564f52b89fbda166544cb1bc0b79e8ee940a8173ed5859aade40afd" \
            && "$PUBLICATION_RUN_ID" == "30587485449" \
            && "$PUBLICATION_ARTIFACT_ID" == "8777083749" \
            && "$PUBLICATION_ARTIFACT_NAME" == \
              "global-alpha-expedited-editorial-publication-b44a1aebc2eb6e7b58e5960b0f8245b87e901052-30587485449-1" \
            && "$PUBLICATION_ARTIFACT_DIGEST" == \
              "sha256:95028a16adedfc19b5dfe3c6e0b0c36696b5c2619a44f0040d51ef3b1ffcbbaa" ]]; then
            legacy=true
            echo "profile_id=legacy:c2462769" >> "$GITHUB_OUTPUT"
          elif [[ "$CANDIDATE_RUN_ID" == "30909694091" \
            && "$CANDIDATE_ARTIFACT_ID" == "8892512377" \
            && "$CANDIDATE_ARTIFACT_NAME" == \
              "global-alpha-expedited-editorial-candidates-38be7d450a6e7865d94798ab6b57f3688413f743" \
            && "$CANDIDATE_ARTIFACT_DIGEST" == \
              "sha256:329a32cb071f180d7af94877349077f58470b5a05936ae6da61cdf518b4baff7" \
            && "$PUBLICATION_RUN_ID" == "30914113940" \
            && "$PUBLICATION_ARTIFACT_ID" == "8894369336" \
            && "$PUBLICATION_ARTIFACT_NAME" == \
              "global-alpha-expedited-editorial-publication-38be7d450a6e7865d94798ab6b57f3688413f743-30914113940-1" \
            && "$PUBLICATION_ARTIFACT_DIGEST" == \
              "sha256:736c6360470928593e921787486e01a73cc9ed680b84835ee03170196027217d" ]]; then
            fresh=true
            echo "profile_id=fresh:38be7d45:20260804" >> "$GITHUB_OUTPUT"
          fi
          [[ "$legacy" == "true" || "$fresh" == "true" ]] || {
            echo "::error::The carry-forward source is not an exact approved profile."
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" != "$PUBLICATION_RUN_ID" ]]
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_EDITOR_TOKEN" ]]
          case "${BSIDE_API_BASE_URL%/}" in
            "https://alignpe.gabia.io/activist/api.php/api/v1" | \
            "https://alignpe.gabia.io/activist/api.php/api/v2") ;;
            *)
              echo "::error::The editor token may only be sent to the protected production API."
              exit 1
              ;;
          esac

      - name: Checkout the exact current release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reuse an intent already frozen by this workflow run
        id: existing_intent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const prefix =
              `global-alpha-expedited-editorial-carry-intent-${context.sha}-${context.runId}-`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: context.runId, per_page: 100},
            );
            const matches = artifacts.filter((item) =>
              String(item.name || "").startsWith(prefix),
            );
            if (matches.length > 1) {
              core.setFailed("multiple frozen intents exist for this workflow run");
              return;
            }
            if (matches.length === 0) {
              core.setOutput("exists", "false");
              return;
            }
            const artifact = matches[0];
            const digest = String(artifact.digest || "").toLowerCase();
            if (
              artifact.expired ||
              !/^sha256:[0-9a-f]{64}$/.test(digest) ||
              (artifact.workflow_run || {}).id !== context.runId
            ) {
              core.setFailed("existing frozen intent provenance mismatch");
              return;
            }
            core.setOutput("exists", "true");
            core.setOutput("artifact_id", String(artifact.id));
            core.setOutput("artifact_name", artifact.name);
            core.setOutput("artifact_digest", digest);

      - name: Resolve immutable source publication chain
        if: steps.existing_intent.outputs.exists != 'true'
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CARRY_PROFILE_ID: ${{ steps.profile.outputs.profile_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const currentSha = context.sha.toLowerCase();
            const runIds = {
              candidate: Number(process.env.CANDIDATE_RUN_ID),
              publication: Number(process.env.PUBLICATION_RUN_ID),
            };
            const expectedArtifacts = {
              candidate: {
                id: Number(process.env.CANDIDATE_ARTIFACT_ID),
                name: process.env.CANDIDATE_ARTIFACT_NAME,
                digest: process.env.CANDIDATE_ARTIFACT_DIGEST.toLowerCase(),
              },
              publication: {
                id: Number(process.env.PUBLICATION_ARTIFACT_ID),
                name: process.env.PUBLICATION_ARTIFACT_NAME,
                digest: process.env.PUBLICATION_ARTIFACT_DIGEST.toLowerCase(),
              },
            };
            const oneTimeLegacyChain =
              runIds.candidate === 30581161308 &&
              runIds.publication === 30587485449 &&
              expectedArtifacts.candidate.id === 8774655231 &&
              expectedArtifacts.candidate.digest ===
                "sha256:f7eec4481564f52b89fbda166544cb1bc0b79e8ee940a8173ed5859aade40afd" &&
              expectedArtifacts.publication.id === 8777083749 &&
              expectedArtifacts.publication.digest ===
                "sha256:95028a16adedfc19b5dfe3c6e0b0c36696b5c2619a44f0040d51ef3b1ffcbbaa";
            const oneTimeLegacyDeadline = Date.parse("2026-08-04T23:59:59Z");
            const sourceAgeLimitHours =
              oneTimeLegacyChain && Date.now() <= oneTimeLegacyDeadline ? 168 : 72;
            const freshChain =
              process.env.CARRY_PROFILE_ID === "fresh:38be7d45:20260804" &&
              runIds.candidate === 30909694091 &&
              runIds.publication === 30914113940 &&
              expectedArtifacts.candidate.id === 8892512377 &&
              expectedArtifacts.candidate.digest ===
                "sha256:329a32cb071f180d7af94877349077f58470b5a05936ae6da61cdf518b4baff7" &&
              expectedArtifacts.publication.id === 8894369336 &&
              expectedArtifacts.publication.digest ===
                "sha256:736c6360470928593e921787486e01a73cc9ed680b84835ee03170196027217d";
            if (
              (process.env.CARRY_PROFILE_ID === "legacy:c2462769") !==
                oneTimeLegacyChain ||
              (process.env.CARRY_PROFILE_ID === "fresh:38be7d45:20260804") !==
                freshChain
            ) {
              core.setFailed("source profile and exact artifact tuple mismatch");
              return;
            }
            const resolved = {};
            for (const key of ["candidate", "publication"]) {
              const response = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: runIds[key],
              });
              const run = response.data;
              const ageHours = (Date.now() - Date.parse(run.created_at)) / 3600000;
              if (
                run.status !== "completed" ||
                run.conclusion !== "success" ||
                run.event !== "workflow_dispatch" ||
                run.path !== ".github/workflows/global-alpha-expedited-editorial.yml" ||
                run.head_branch !== process.env.DEFAULT_BRANCH ||
                !/^[0-9a-f]{40}$/i.test(run.head_sha || "") ||
                ageHours < -0.1 ||
                ageHours > sourceAgeLimitHours
              ) {
                core.setFailed(`${key} source run failed protected provenance`);
                return;
              }
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id: run.id, per_page: 100},
              );
              if (artifacts.length !== 1) {
                core.setFailed(`${key} source run must contain exactly one artifact`);
                return;
              }
              const artifact = artifacts[0];
              const actual = {
                id: artifact.id,
                name: artifact.name,
                digest: String(artifact.digest || "").toLowerCase(),
              };
              if (
                artifact.expired ||
                JSON.stringify(actual) !== JSON.stringify(expectedArtifacts[key])
              ) {
                core.setFailed(`${key} source artifact identity mismatch`);
                return;
              }
              resolved[key] = {run, artifact};
            }
            const sourceSha = resolved.candidate.run.head_sha.toLowerCase();
            if (
              sourceSha === currentSha ||
              resolved.publication.run.head_sha.toLowerCase() !== sourceSha ||
              resolved.candidate.artifact.name !==
                `global-alpha-expedited-editorial-candidates-${sourceSha}` ||
              resolved.publication.artifact.name !==
                `global-alpha-expedited-editorial-publication-${sourceSha}-${resolved.publication.run.id}-${resolved.publication.run.run_attempt}` ||
              Date.parse(resolved.candidate.run.created_at) >
                Date.parse(resolved.publication.run.created_at)
            ) {
              core.setFailed("source candidate/publication chain mismatch");
              return;
            }
            if (
              freshChain &&
              sourceSha !== "38be7d450a6e7865d94798ab6b57f3688413f743"
            ) {
              core.setFailed("fresh source revision mismatch");
              return;
            }
            core.setOutput("source_sha", sourceSha);

      - name: Prove the reviewed source is an ancestor of this code-only release
        if: steps.existing_intent.outputs.exists != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CARRY_PROFILE_ID: ${{ steps.profile.outputs.profile_id }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          if [[ "$CARRY_PROFILE_ID" == "fresh:38be7d45:20260804" ]]; then
            [[ "$SOURCE_SHA" == "38be7d450a6e7865d94798ab6b57f3688413f743" ]]
            [[ "$(git rev-parse "$SOURCE_SHA:.github/workflows/global-alpha-expedited-editorial.yml")" == \
              "c30c26b8329fce1fc2a7f5a1afc89258e8d73324" ]]
            [[ "$(git rev-parse "$SOURCE_SHA:curator/global_alpha_expedited_editorial.py")" == \
              "d9d3bb523034c10990efa0935c3f26872a05d374" ]]
            [[ "$(git rev-parse "$GITHUB_SHA:deploy/activist/governance_v1.php")" == \
              "73178a8323e1c7050d9bd7f2978363ae28be7132" ]]
            [[ "$(git rev-parse "$GITHUB_SHA:tests/php73_release_state_smoke.py")" == \
              "21ba42d4145ecb8a4159cc6351b17fadb6e4272c" ]]
            allowed=(
              ".github/workflows/global-alpha-expedited-editorial.yml"
              ".github/workflows/global-alpha-expedited-preparation.yml"
              ".github/workflows/global-alpha-preview-deploy.yml"
              "curator/global_alpha_expedited_editorial.py"
              "deploy/activist/governance_v1.php"
              "tests/php73_release_state_smoke.py"
              "tests/test_dart_frozen_replay_workflow.py"
              "tests/test_global_alpha_expedited_editorial.py"
              "tests/test_global_alpha_expedited_editorial_contract.py"
              "tests/test_global_alpha_expedited_workflows.py"
              "tests/test_global_alpha_preview_deploy_workflow.py"
            )
            mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT \
              "$SOURCE_SHA" "$GITHUB_SHA")
            [[ "$(git diff --name-only --diff-filter=D "$SOURCE_SHA" "$GITHUB_SHA")" == "" ]]
            for path in "${changed[@]}"; do
              permitted=false
              for expected in "${allowed[@]}"; do
                [[ "$path" == "$expected" ]] && permitted=true
              done
              [[ "$permitted" == "true" ]] || {
                echo "::error::Fresh carry-forward disallows target diff: $path"
                exit 1
              }
            done
          fi

      - name: Download exact source candidate artifact
        if: steps.existing_intent.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          path: source-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Download exact source publication artifact
        if: steps.existing_intent.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.publication_artifact_id }}
          path: source-publication
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publication_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up Python
        if: steps.existing_intent.outputs.exists != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned API client
        if: steps.existing_intent.outputs.exists != 'true'
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Repair only the six approved display targets and prove replay
        if: >-
          steps.existing_intent.outputs.exists != 'true' &&
          steps.profile.outputs.profile_id == 'legacy:c2462769'
        shell: bash
        run: |
          set -euo pipefail
          source_args=(
            --candidate source-candidate/editorial-candidates.json
            --source-human-review source-publication/human-review.json
            --source-publication-receipt source-publication/publication-receipt.json
            --source-publication-replay-receipt source-publication/publication-replay-receipt.json
            --candidate-run-id "$CANDIDATE_RUN_ID"
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID"
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME"
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST"
            --publication-run-id "$PUBLICATION_RUN_ID"
            --publication-artifact-id "$PUBLICATION_ARTIFACT_ID"
            --publication-artifact-name "$PUBLICATION_ARTIFACT_NAME"
            --publication-artifact-digest "$PUBLICATION_ARTIFACT_DIGEST"
          )
          python -m curator.global_alpha_expedited_editorial \
            carry-forward-repair-targets \
            "${source_args[@]}" \
            --output-dir display-target-repair-first
          python -m curator.global_alpha_expedited_editorial \
            carry-forward-repair-targets \
            "${source_args[@]}" \
            --output-dir display-target-repair-replay
          test -s display-target-repair-first/display-target-repair-receipt.json
          test -s display-target-repair-replay/display-target-repair-receipt.json
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .kind == "bside-global-alpha-expedited-editorial-display-target-repair"
            and (.expected_event_ids | length) == 6
            and (.verified_event_ids | length) == 6
            and (.mutations_applied >= 0 and .mutations_applied <= 6)
            and (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' display-target-repair-first/display-target-repair-receipt.json > /dev/null
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .kind == "bside-global-alpha-expedited-editorial-display-target-repair"
            and .mutations_applied == 0
            and .applied_event_ids == []
            and .idempotent_replay == true
            and (.verified_event_ids | length) == 6
            and (.receipt_sha256 | test("^[0-9a-f]{64}$"))
          ' display-target-repair-replay/display-target-repair-receipt.json > /dev/null

      - name: Freeze unchanged current-SHA basis without publishing
        if: steps.existing_intent.outputs.exists != 'true'
        shell: bash
        env:
          CARRY_PROFILE_ID: ${{ steps.profile.outputs.profile_id }}
        run: |
          set -euo pipefail
          test -f source-candidate/editorial-candidates.json
          test -f source-publication/human-review.json
          test -f source-publication/publication-receipt.json
          test -f source-publication/publication-replay-receipt.json
          repair_args=()
          if [[ "$CARRY_PROFILE_ID" == "legacy:c2462769" ]]; then
            test -s display-target-repair-first/display-target-repair-receipt.json
            test -s display-target-repair-replay/display-target-repair-receipt.json
            repair_args=(
              --display-target-repair-receipt
              display-target-repair-first/display-target-repair-receipt.json
              --display-target-repair-replay-receipt
              display-target-repair-replay/display-target-repair-receipt.json
            )
          elif [[ "$CARRY_PROFILE_ID" != "fresh:38be7d45:20260804" ]]; then
            echo "::error::Unknown carry-forward profile."
            exit 1
          fi
          python -m curator.global_alpha_expedited_editorial \
            carry-forward-prepare \
            --candidate source-candidate/editorial-candidates.json \
            --source-human-review source-publication/human-review.json \
            --source-publication-receipt \
              source-publication/publication-receipt.json \
            --source-publication-replay-receipt \
              source-publication/publication-replay-receipt.json \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-artifact-name "$CANDIDATE_ARTIFACT_NAME" \
            --candidate-artifact-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --publication-run-id "$PUBLICATION_RUN_ID" \
            --publication-artifact-id "$PUBLICATION_ARTIFACT_ID" \
            --publication-artifact-name "$PUBLICATION_ARTIFACT_NAME" \
            --publication-artifact-digest "$PUBLICATION_ARTIFACT_DIGEST" \
            "${repair_args[@]}" \
            --output-dir editorial-intent
          test -s editorial-intent/carry-forward-intent.json
          if [[ "$CARRY_PROFILE_ID" == "legacy:c2462769" ]]; then
            test -s editorial-intent/display-target-repair-receipt.json
            test -s editorial-intent/display-target-repair-replay-receipt.json
          else
            test ! -e editorial-intent/display-target-repair-receipt.json
            test ! -e editorial-intent/display-target-repair-replay-receipt.json
          fi
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .kind == "bside-global-alpha-expedited-editorial-carry-forward-intent"
            and .is_synthetic == false
            and .source_human_review_section.ground_truth_source == "human"
            and .source_human_review_section.ai_generated_ground_truth == false
            and .carry_forward.profile_id == env.CARRY_PROFILE_ID
            and .carry_forward.event_mutations_applied == 0
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
            and (.intent_sha256 | test("^[0-9a-f]{64}$"))
          ' editorial-intent/carry-forward-intent.json > /dev/null

      - name: Upload immutable carry-forward intent before any brief POST
        if: steps.existing_intent.outputs.exists != 'true'
        id: new_intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-editorial-carry-intent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: editorial-intent
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Resolve the one immutable intent identity
        id: intent_identity
        shell: bash
        env:
          EXISTING: ${{ steps.existing_intent.outputs.exists }}
          EXISTING_ID: ${{ steps.existing_intent.outputs.artifact_id }}
          EXISTING_NAME: ${{ steps.existing_intent.outputs.artifact_name }}
          EXISTING_DIGEST: ${{ steps.existing_intent.outputs.artifact_digest }}
          NEW_ID: ${{ steps.new_intent.outputs.artifact-id }}
          NEW_NAME: global-alpha-expedited-editorial-carry-intent-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          NEW_DIGEST: ${{ steps.new_intent.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          if [[ "$EXISTING" == "true" ]]; then
            artifact_id="$EXISTING_ID"
            artifact_name="$EXISTING_NAME"
            artifact_digest="$EXISTING_DIGEST"
          else
            artifact_id="$NEW_ID"
            artifact_name="$NEW_NAME"
            artifact_digest="$NEW_DIGEST"
          fi
          artifact_digest="${artifact_digest,,}"
          if [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
            artifact_digest="sha256:$artifact_digest"
          fi
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_name" == \
            "global-alpha-expedited-editorial-carry-intent-$GITHUB_SHA-$GITHUB_RUN_ID-"* ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "artifact_id=$artifact_id"
            echo "artifact_name=$artifact_name"
            echo "artifact_digest=$artifact_digest"
          } >> "$GITHUB_OUTPUT"

  carry_forward_publish:
    name: Publish only the pre-uploaded carry-forward intent
    if: inputs.operation == 'carry-forward'
    needs: carry_forward_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-release
    env:
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_EDITOR_TOKEN: ${{ secrets.BSIDE_EDITOR_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      CARRY_PROFILE_ID: ${{ needs.carry_forward_prepare.outputs.profile_id }}
    steps:
      - name: Enforce same-run intent publication boundary
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          if [[ "$CARRY_PROFILE_ID" == "legacy:c2462769" ]]; then
            deadline_epoch="$(date -u -d '2026-08-04T23:59:59Z' +%s)"
            now_epoch="$(date -u +%s)"
            (( now_epoch <= deadline_epoch )) || {
              echo "::error::The one-time legacy carry-forward publication window expired."
              exit 1
            }
          elif [[ "$CARRY_PROFILE_ID" != "fresh:38be7d45:20260804" ]]; then
            echo "::error::Unknown carry-forward profile."
            exit 1
          fi
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_EDITOR_TOKEN" ]]
          case "${BSIDE_API_BASE_URL%/}" in
            "https://alignpe.gabia.io/activist/api.php/api/v1" | \
            "https://alignpe.gabia.io/activist/api.php/api/v2") ;;
            *)
              echo "::error::The editor token may only be sent to the protected production API."
              exit 1
              ;;
          esac

      - name: Checkout the exact current release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Resolve the one exact pre-uploaded intent artifact
        id: intent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const prefix =
              `global-alpha-expedited-editorial-carry-intent-${context.sha}-${context.runId}-`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: context.runId, per_page: 100},
            );
            const matches = artifacts.filter((item) =>
              String(item.name || "").startsWith(prefix),
            );
            if (matches.length !== 1) {
              core.setFailed("same run must contain exactly one frozen intent");
              return;
            }
            const artifact = matches[0];
            const digest = String(artifact.digest || "").toLowerCase();
            if (
              artifact.expired ||
              !/^sha256:[0-9a-f]{64}$/.test(digest) ||
              (artifact.workflow_run || {}).id !== context.runId
            ) {
              core.setFailed("frozen intent artifact identity mismatch");
              return;
            }
            core.setOutput("run_id", String(context.runId));
            core.setOutput("artifact_id", String(artifact.id));
            core.setOutput("artifact_name", artifact.name);
            core.setOutput("artifact_digest", digest);

      - name: Download the exact pre-uploaded intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.intent.outputs.artifact_id }}
          path: editorial-intent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.intent.outputs.run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned API client
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Publish and replay only the frozen intent
        shell: bash
        env:
          INTENT_RUN_ID: ${{ steps.intent.outputs.run_id }}
          INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact_id }}
          INTENT_ARTIFACT_NAME: ${{ steps.intent.outputs.artifact_name }}
          INTENT_ARTIFACT_DIGEST: ${{ steps.intent.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -s editorial-intent/carry-forward-intent.json
          [[ "$(jq -er '.carry_forward.profile_id' \
            editorial-intent/carry-forward-intent.json)" == "$CARRY_PROFILE_ID" ]]
          repair_args=()
          if [[ "$CARRY_PROFILE_ID" == "legacy:c2462769" ]]; then
            test -s editorial-intent/display-target-repair-receipt.json
            test -s editorial-intent/display-target-repair-replay-receipt.json
            deadline_epoch="$(date -u -d '2026-08-04T23:59:59Z' +%s)"
            now_epoch="$(date -u +%s)"
            (( now_epoch <= deadline_epoch )) || {
              echo "::error::The one-time legacy carry-forward expired before publication."
              exit 1
            }
            repair_args=(
              --display-target-repair-receipt
              editorial-intent/display-target-repair-receipt.json
              --display-target-repair-replay-receipt
              editorial-intent/display-target-repair-replay-receipt.json
            )
          else
            test ! -e editorial-intent/display-target-repair-receipt.json
            test ! -e editorial-intent/display-target-repair-replay-receipt.json
          fi
          python -m curator.global_alpha_expedited_editorial \
            carry-forward-publish \
            --intent editorial-intent/carry-forward-intent.json \
            --intent-run-id "$INTENT_RUN_ID" \
            --intent-artifact-id "$INTENT_ARTIFACT_ID" \
            --intent-artifact-name "$INTENT_ARTIFACT_NAME" \
            --intent-artifact-digest "$INTENT_ARTIFACT_DIGEST" \
            "${repair_args[@]}" \
            --output-dir editorial-publication
          test -s editorial-publication/human-review.json
          test -s editorial-publication/publication-receipt.json
          test -s editorial-publication/publication-replay-receipt.json
          if [[ "$CARRY_PROFILE_ID" == "legacy:c2462769" ]]; then
            test -s editorial-publication/display-target-repair-receipt.json
            test -s editorial-publication/display-target-repair-replay-receipt.json
          else
            test ! -e editorial-publication/display-target-repair-receipt.json
            test ! -e editorial-publication/display-target-repair-replay-receipt.json
          fi
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .ground_truth_source == "human"
            and .ai_generated_ground_truth == false
            and .human_attestation == true
            and .carry_forward.event_mutations_applied == 0
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
            and .carry_forward.prepared_intent_artifact.run_id
              == (env.INTENT_RUN_ID | tonumber)
            and .carry_forward.prepared_intent_artifact.artifact_id
              == (env.INTENT_ARTIFACT_ID | tonumber)
          ' editorial-publication/human-review.json > /dev/null
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .mutations_applied == 0
            and .event_mutations_applied == 0
            and .brief.idempotent == .recovered_existing_brief
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
          ' editorial-publication/publication-receipt.json > /dev/null
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .mutations_applied == 0
            and .event_mutations_applied == 0
            and .idempotent_replay == true
            and .brief.idempotent == true
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
          ' editorial-publication/publication-replay-receipt.json > /dev/null
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          paths = (
              Path("editorial-intent/carry-forward-intent.json"),
              Path("editorial-publication/human-review.json"),
              Path("editorial-publication/publication-receipt.json"),
              Path("editorial-publication/publication-replay-receipt.json"),
          )
          chains = []
          for path in paths:
              record = json.loads(path.read_text(encoding="utf-8"))
              carry = record.get("carry_forward")
              chain = carry.get("human_approval_chain_sha256") if isinstance(carry, dict) else None
              if not isinstance(chain, str) or re.fullmatch(r"[0-9a-f]{64}", chain) is None:
                  raise SystemExit(f"{path}: human approval chain digest is missing or invalid")
              chains.append(chain)
          if len(set(chains)) != 1:
              raise SystemExit("human approval chain digest changed during publication")
          PY

      - name: Upload current-SHA protected publication evidence
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-editorial-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: editorial-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record carry-forward identity
        shell: bash
        env:
          INTENT_RUN_ID: ${{ steps.intent.outputs.run_id }}
          INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact_id }}
          PUBLICATION_ARTIFACT_ID: ${{ steps.publication_artifact.outputs.artifact-id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ steps.publication_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          semantic="$(jq -er '.semantic_receipt_sha256' \
            editorial-publication/publication-receipt.json)"
          {
            echo "### Expedited Alpha editorial carry-forward"
            echo "- current code revision: \`$GITHUB_SHA\`"
            echo "- frozen intent run: \`$INTENT_RUN_ID\`"
            echo "- frozen intent artifact id: \`$INTENT_ARTIFACT_ID\`"
            echo "- publication artifact id: \`$PUBLICATION_ARTIFACT_ID\`"
            echo "- publication artifact digest: \`$PUBLICATION_ARTIFACT_DIGEST\`"
            echo "- semantic publication receipt: \`$semantic\`"
            echo "- event mutations: \`0\`"
          } >> "$GITHUB_STEP_SUMMARY"

  carry_forward_recover:
    name: Recover only an existing immutable carry-forward intent
    if: inputs.operation == 'carry-forward-recover'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-release
    env:
      BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
      BSIDE_EDITOR_TOKEN: ${{ secrets.BSIDE_EDITOR_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      INTENT_RUN_ID: ${{ inputs.intent_run_id }}
      INTENT_ARTIFACT_ID: ${{ inputs.intent_artifact_id }}
      INTENT_ARTIFACT_NAME: ${{ inputs.intent_artifact_name }}
      INTENT_ARTIFACT_DIGEST: ${{ inputs.intent_artifact_digest }}
    steps:
      - name: Enforce protected recovery inputs
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]
          [[ "$CONFIRMATION" == \
            "RECOVER_CARRY_FORWARD_EXPEDITED_EDITORIAL" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INTENT_RUN_ID" != "$GITHUB_RUN_ID" ]]
          [[ "$INTENT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INTENT_ARTIFACT_NAME" == \
            "global-alpha-expedited-editorial-carry-intent-$GITHUB_SHA-$INTENT_RUN_ID-"* ]]
          [[ "$INTENT_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$BSIDE_API_BASE_URL" && -n "$BSIDE_EDITOR_TOKEN" ]]
          case "${BSIDE_API_BASE_URL%/}" in
            "https://alignpe.gabia.io/activist/api.php/api/v1" | \
            "https://alignpe.gabia.io/activist/api.php/api/v2") ;;
            *)
              echo "::error::The editor token may only be sent to the protected production API."
              exit 1
              ;;
          esac

      - name: Checkout the exact current release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Resolve the exact prior protected intent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const runId = Number(process.env.INTENT_RUN_ID);
            const response = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: runId,
            });
            const run = response.data;
            if (
              run.status !== "completed" ||
              !["success", "failure", "cancelled", "timed_out"].includes(run.conclusion) ||
              run.event !== "workflow_dispatch" ||
              run.path !== ".github/workflows/global-alpha-expedited-editorial.yml" ||
              run.head_branch !== process.env.DEFAULT_BRANCH ||
              String(run.head_sha || "").toLowerCase() !== context.sha.toLowerCase()
            ) {
              core.setFailed("prior intent run provenance mismatch");
              return;
            }
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {owner, repo, run_id: runId, filter: "all", per_page: 100},
            );
            const prepareJobs = jobs.filter((job) =>
              job.name === "Freeze and upload carry-forward intent" &&
              job.conclusion === "success",
            );
            if (prepareJobs.length < 1) {
              core.setFailed("prior run has no successful intent preparation");
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: runId, per_page: 100},
            );
            const prefix =
              `global-alpha-expedited-editorial-carry-intent-${context.sha}-${runId}-`;
            const matches = artifacts.filter((item) =>
              String(item.name || "").startsWith(prefix),
            );
            if (matches.length !== 1) {
              core.setFailed("prior run must have exactly one frozen intent");
              return;
            }
            const artifact = matches[0];
            if (
              artifact.expired ||
              artifact.id !== Number(process.env.INTENT_ARTIFACT_ID) ||
              artifact.name !== process.env.INTENT_ARTIFACT_NAME ||
              String(artifact.digest || "").toLowerCase() !==
                process.env.INTENT_ARTIFACT_DIGEST.toLowerCase() ||
              (artifact.workflow_run || {}).id !== runId
            ) {
              core.setFailed("prior frozen intent artifact identity mismatch");
            }

      - name: Download only the prior immutable intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.intent_artifact_id }}
          path: editorial-intent
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.intent_run_id }}
          digest-mismatch: error
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned API client
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Recover publication from only the frozen intent
        shell: bash
        run: |
          set -euo pipefail
          test -s editorial-intent/carry-forward-intent.json
          carry_profile_id="$(jq -er '.carry_forward.profile_id' \
            editorial-intent/carry-forward-intent.json)"
          repair_args=()
          if [[ "$carry_profile_id" == "legacy:c2462769" ]]; then
            test -s editorial-intent/display-target-repair-receipt.json
            test -s editorial-intent/display-target-repair-replay-receipt.json
            deadline_epoch="$(date -u -d '2026-08-04T23:59:59Z' +%s)"
            now_epoch="$(date -u +%s)"
            (( now_epoch <= deadline_epoch )) || {
              echo "::error::The one-time legacy carry-forward expired before recovery publication."
              exit 1
            }
            repair_args=(
              --display-target-repair-receipt
              editorial-intent/display-target-repair-receipt.json
              --display-target-repair-replay-receipt
              editorial-intent/display-target-repair-replay-receipt.json
            )
          elif [[ "$carry_profile_id" == "fresh:38be7d45:20260804" ]]; then
            test ! -e editorial-intent/display-target-repair-receipt.json
            test ! -e editorial-intent/display-target-repair-replay-receipt.json
          else
            echo "::error::Unknown carry-forward profile."
            exit 1
          fi
          python -m curator.global_alpha_expedited_editorial \
            carry-forward-publish \
            --intent editorial-intent/carry-forward-intent.json \
            --intent-run-id "$INTENT_RUN_ID" \
            --intent-artifact-id "$INTENT_ARTIFACT_ID" \
            --intent-artifact-name "$INTENT_ARTIFACT_NAME" \
            --intent-artifact-digest "$INTENT_ARTIFACT_DIGEST" \
            "${repair_args[@]}" \
            --output-dir editorial-publication
          test -s editorial-publication/human-review.json
          test -s editorial-publication/publication-receipt.json
          test -s editorial-publication/publication-replay-receipt.json
          if [[ "$carry_profile_id" == "legacy:c2462769" ]]; then
            test -s editorial-publication/display-target-repair-receipt.json
            test -s editorial-publication/display-target-repair-replay-receipt.json
          else
            test ! -e editorial-publication/display-target-repair-receipt.json
            test ! -e editorial-publication/display-target-repair-replay-receipt.json
          fi
          jq -e '
            .code_revision == env.GITHUB_SHA
            and .ground_truth_source == "human"
            and .ai_generated_ground_truth == false
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
            and .carry_forward.prepared_intent_artifact.run_id
              == (env.INTENT_RUN_ID | tonumber)
            and .carry_forward.prepared_intent_artifact.artifact_id
              == (env.INTENT_ARTIFACT_ID | tonumber)
          ' editorial-publication/human-review.json > /dev/null
          jq -e '
            .mutations_applied == 0
            and .event_mutations_applied == 0
            and .brief.idempotent == .recovered_existing_brief
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
          ' editorial-publication/publication-receipt.json > /dev/null
          jq -e '
            .mutations_applied == 0
            and .event_mutations_applied == 0
            and .idempotent_replay == true
            and .brief.idempotent == true
            and (.carry_forward.human_approval_chain_sha256
              | test("^[0-9a-f]{64}$"))
          ' editorial-publication/publication-replay-receipt.json > /dev/null
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          paths = (
              Path("editorial-intent/carry-forward-intent.json"),
              Path("editorial-publication/human-review.json"),
              Path("editorial-publication/publication-receipt.json"),
              Path("editorial-publication/publication-replay-receipt.json"),
          )
          chains = []
          for path in paths:
              record = json.loads(path.read_text(encoding="utf-8"))
              carry = record.get("carry_forward")
              chain = carry.get("human_approval_chain_sha256") if isinstance(carry, dict) else None
              if not isinstance(chain, str) or re.fullmatch(r"[0-9a-f]{64}", chain) is None:
                  raise SystemExit(f"{path}: human approval chain digest is missing or invalid")
              chains.append(chain)
          if len(set(chains)) != 1:
              raise SystemExit("human approval chain digest changed during recovery")
          PY

      - name: Upload recovered current-SHA publication evidence
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-expedited-editorial-publication-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: editorial-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record recovered carry-forward identity
        shell: bash
        env:
          PUBLICATION_ARTIFACT_ID: ${{ steps.publication_artifact.outputs.artifact-id }}
          PUBLICATION_ARTIFACT_DIGEST: ${{ steps.publication_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          semantic="$(jq -er '.semantic_receipt_sha256' \
            editorial-publication/publication-receipt.json)"
          {
            echo "### Recovered expedited editorial carry-forward"
            echo "- current code revision: \`$GITHUB_SHA\`"
            echo "- source intent run: \`$INTENT_RUN_ID\`"
            echo "- source intent artifact id: \`$INTENT_ARTIFACT_ID\`"
            echo "- publication artifact id: \`$PUBLICATION_ARTIFACT_ID\`"
            echo "- publication artifact digest: \`$PUBLICATION_ARTIFACT_DIGEST\`"
            echo "- semantic publication receipt: \`$semantic\`"
          } >> "$GITHUB_STEP_SUMMARY"
