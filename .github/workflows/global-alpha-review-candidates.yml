name: Production Alpha review candidates

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type EXPORT_GLOBAL_ALPHA_REVIEW_CANDIDATES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: global-alpha-review-candidates-${{ github.repository }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: governance-runtime
    steps:
      - name: Enforce manual default-branch export
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]] || {
            echo "::error::Review candidates must be exported from the default branch."
            exit 1
          }
          [[ "$CONFIRMATION" == "EXPORT_GLOBAL_ALPHA_REVIEW_CANDIDATES" ]] || {
            echo "::error::The explicit review export confirmation did not match."
            exit 1
          }

      - name: Checkout the exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the API client
        run: >-
          python -m pip install
          --disable-pip-version-check
          "httpx==0.27.2"

      - name: Export blank human-review candidates from preview
        shell: bash
        env:
          BSIDE_API_BASE_URL: ${{ secrets.BSIDE_API_BASE_URL || vars.GOVERNANCE_API_BASE_URL }}
          GOVERNANCE_PREVIEW_TOKEN: ${{ secrets.GOVERNANCE_PREVIEW_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$BSIDE_API_BASE_URL" && -n "$GOVERNANCE_PREVIEW_TOKEN" ]] || {
            echo "::error::The API base and preview token are required."
            exit 1
          }
          python -m curator.global_alpha_review_export \
            --event-count 60 \
            --pair-count 120 \
            --max-events 500 \
            --output global-alpha-review-candidate-export.json

      - name: Verify evidence-bundle prepare compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; from curator.global_alpha_evidence_bundle import _parse_review_export,_select_review_candidates; export,_=_parse_review_export(Path('global-alpha-review-candidate-export.json'),expected_revision='$GITHUB_SHA'); events,pairs,top5=_select_review_candidates(export); assert (len(events),len(pairs),len(top5)) == (60,120,5)"

      - name: Upload immutable review candidates
        id: review_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-alpha-review-candidates-${{ github.sha }}
          path: global-alpha-review-candidate-export.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Record candidate identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.review_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.review_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          file_digest="$(sha256sum global-alpha-review-candidate-export.json | cut -d ' ' -f1)"
          canonical_digest="$(python -c 'import hashlib,json; from pathlib import Path; value=json.loads(Path("global-alpha-review-candidate-export.json").read_text(encoding="utf-8")); encoded=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8"); print(hashlib.sha256(encoded).hexdigest())')"
          {
            echo "### Production Alpha review candidates"
            echo "- revision: \`$GITHUB_SHA\`"
            echo "- canonical JSON SHA-256 used by evidence bundle: \`$canonical_digest\`"
            echo "- uploaded file bytes SHA-256: \`$file_digest\`"
            echo "- artifact id: \`$ARTIFACT_ID\`"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "- human decisions and ground truth are intentionally absent"
          } >> "$GITHUB_STEP_SUMMARY"
