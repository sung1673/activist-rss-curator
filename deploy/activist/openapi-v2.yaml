              enum: [global, KR, US, JP, GB, CA, AU]
            published:
              const: true
            idempotent:
              type: boolean
            top_count:
              type: integer
              minimum: 0
              maximum: 5
            item_count:
              type: integer
              minimum: 0
              maximum: 105
            empty_reason:
              type: [string, 'null']
              enum: [no_confirmed_material_events, coverage_unavailable, null]
        api_version:
          const: v2
    ReleaseState:
      type: string
