            - internal_field_exposure_count
          properties:
            public_event_count: {type: integer, minimum: 0}
            original_language_preserved_count: {type: integer, minimum: 0}
            official_url_preserved_count: {type: integer, minimum: 0}
            title_provenance_labeled_count: {type: integer, minimum: 0}
            source_title_event_count: {type: integer, minimum: 0}
            source_title_preserved_count: {type: integer, minimum: 0}
            generated_metadata_title_count: {type: integer, minimum: 0}
            operator_metadata_title_count: {type: integer, minimum: 0}
            unknown_title_provenance_count: {type: integer, minimum: 0}
            scanned_response_count: {type: integer, minimum: 0}
            telegram_exposure_count: {type: integer, minimum: 0}
            internal_field_exposure_count: {type: integer, minimum: 0}
    GlobalIngestRequest:
      type: object
      required: [idempotency_key, code_revision, envelope]
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 191
          pattern: '^[A-Za-z0-9_.:\-]+$'
          description: >-
            SEC EDGAR accepts only classified global-ingest-v2-current:us:
            or global-ingest-v2-day:us: semantic-digest namespaces. Standard
            receipt keys are rejected for both apply and replay, and every
            classified SEC receipt requires an expected release-state binding.
        code_revision:
          type: string
          minLength: 7
          maxLength: 64
          pattern: '^[a-f0-9]+$'
          description: Must equal the verified deployment manifest revision.
        expected_release_state:
          type: string
          enum: [closed, preview, live]
          description: >-
            Required for classified SEC completed-day/current receipts and
            CA/AU link-only apply requests. Both v1 and v2 release-state rows
            must match; apply rechecks under transaction locks. Preview writes
            also require the independent preview token.
        ingest_mode:
          type: string
          enum: [apply, replay]
          default: apply
          description: >-
            replay is a server-enforced read-only check. Every exact receipt
            must already exist with the same payload and deployment revision;
            otherwise the request fails before any durable state is changed.
            An authorized CA/AU link-only apply may refresh connector
            verification timestamps after the exact complete receipt,
            approved manifest digest, and current SourceRight are revalidated;
            replay never performs that refresh.
        envelope:
          $ref: '#/components/schemas/GlobalIngestPayload'
    GlobalIngestPayload:
      type: object
      required:
        - schema_version
        - connector_id
        - country_code
        - source_right_id
        - rights_revision
        - retrieved_at
        - coverage_mode
        - records
        - exhausted
        - request_count
        - raw_count
        - public_allowed
        - ai_allowed
        - lifecycle_observations
        - next_cursor
        - chunk
      additionalProperties: false
      properties:
        schema_version:
          const: 1
        connector_id:
          type: string
          pattern: '^connector:[a-z]{2}:[a-z0-9_.:\-]{1,64}$'
        country_code:
          $ref: '#/components/schemas/CountryCode'
        source_right_id:
          type: string
          pattern: '^official:[a-z0-9_.:\-]{1,48}$'
        rights_revision:
          type: string
          pattern: '^[a-f0-9]{64}$'
        source_manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            Required only for CA and AU link-only ingestion. It is the
            canonical SHA-256 of the complete human-approved manifest and
            must match the current SourceRight evidence_hash. It is rejected
            for every other connector.
        retrieved_at:
          type: string
          format: date-time
          description: >-
            Source retrieval time. A mutating SEC current-poll receipt must be
            no more than 15 minutes behind or 1 minute ahead of server time;
            only a value strictly newer than the connector's last observation
            may refresh readiness.
        coverage_mode:
          type: string
          enum: [market-wide, official-register, selected-issuers, link-only]
        records:
          type: array
          maxItems: 500
          description: >-
            CA/AU link-only verification requires at least one record in one
            complete chunk, zero lifecycle observations, and zero source
            requests.
          items:
            $ref: '#/components/schemas/GlobalIngestRecord'
        lifecycle_observations:
          type: array
          maxItems: 500
          default: []
          items:
            $ref: '#/components/schemas/GlobalLifecycleObservation'
        next_cursor:
          type: [string, 'null']
          maxLength: 1000
        exhausted:
          type: boolean
        request_count:
          type: integer
          minimum: 0
          description: >-
            Requests performed for this chunk. The final chunk of a mutating
            SEC current poll must report at least one source request.
        raw_count:
          type: integer
          minimum: 0
          description: Must be at least the accepted record count.
        public_allowed:
          type: boolean
          description: >-
            Producer snapshot that must exactly equal the current
            redistribution grant. The server revalidates it and includes it in
            every record semantic hash.
        ai_allowed:
          type: boolean
          description: >-
            Producer snapshot that must exactly equal the current AI grant.
            The server revalidates it and includes it in every record semantic
            hash.
        chunk:
          $ref: '#/components/schemas/GlobalIngestChunk'
    GlobalIngestChunk:
      type: object
      additionalProperties: false
      required:
        - index
        - count
        - batch_raw_count
        - batch_acknowledged_count
        - batch_request_count
        - batch_id
        - window_start
        - window_end_exclusive
      properties:
        index:
          type: integer
          minimum: 1
        count:
          type: integer
          minimum: 1
          maximum: 10000
        batch_raw_count:
          type: integer
          minimum: 0
        batch_acknowledged_count:
          type: integer
          minimum: 0
        batch_request_count:
          type: integer
          minimum: 0
          description: >-
            Requests performed for the complete batch. A mutating SEC current
            poll must report at least one source request.
        batch_id:
          type: string
          pattern: '^global-batch:[a-f0-9]{64}$'
          description: >-
            Stable identity shared by every chunk in one source window and
            scoped to the exact code revision.
        window_start:
          type: string
          format: date
        window_end_exclusive:
          type: string
          format: date
          description: Exclusive completion checkpoint; the window is limited to 31 days.
    GlobalIssuerReference:
      type: object
      required: [namespace, identifier_type, value, legal_name]
      additionalProperties: false
      properties:
        namespace:
          type: string
          pattern: '^[A-Z][A-Z0-9_:.\-]{1,63}$'
        identifier_type:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,39}$'
        value:
          type: string
          maxLength: 191
        legal_name:
          type: string
          maxLength: 255
          description: Preserved in its source language.
        market:
          type: [string, 'null']
          maxLength: 40
        ticker:
          type: [string, 'null']
          maxLength: 24
    GlobalIngestRecord:
      type: object
      required:
        - record_id
        - external_id
        - issuer_id
        - issuer_reference
        - country_code
        - source_key
        - source_right_id
        - record_kind
        - document_type
        - event_family
        - title
        - original_language
        - filed_at
        - first_observed_at
        - original_url
        - content_hash
        - change_type
        - metadata
      additionalProperties: false
      properties:
        record_id:
          type: string
          pattern: '^globaldoc:[a-f0-9]{40}$'
          description: Stable hash identifier verified by the server.
        external_id:
          type: string
          minLength: 1
          maxLength: 191
        issuer_id:
          type: string
          pattern: '^issuer:[a-z]{2}:[a-z0-9][a-z0-9\-]{0,31}:[a-z0-9_.\-]{1,40}$'
        issuer_reference:
          $ref: '#/components/schemas/GlobalIssuerReference'
        country_code:
          $ref: '#/components/schemas/CountryCode'
        source_key:
          type: string
          minLength: 1
          maxLength: 191
        source_right_id:
          type: string
          pattern: '^official:[a-z0-9_.:\-]{1,48}$'
        record_kind:
          type: string
          enum: [disclosure, registry_filing, link]
        document_type:
          type: string
          minLength: 1
          maxLength: 80
        event_family:
          $ref: '#/components/schemas/IngestEventFamily'
        title:
          type: string
          minLength: 1
          maxLength: 700
          description: Preserved in its source language.
        original_language:
          type: string
          pattern: '^[a-z]{2,3}(?:-[A-Z]{2})?$'
        filed_at:
          type: string
          format: date-time
        first_observed_at:
          type: string
          format: date-time
        original_url:
          type: string
          format: uri
          pattern: '^https://'
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: >-
            SHA-256 of the server-normalized semantic record contract:
            schema version; record, external and issuer identity; the complete
            issuer reference; country; source key, right and registered source
            type; record kind; document type; event family; title and language;
            filed time; original URL; body; correction and change type;
            canonical metadata; and the exact public_allowed and ai_allowed
            envelope flags. first_observed_at is excluded. The server
            recomputes this value before writes.
        body_text:
          type: [string, 'null']
          maxLength: 500000
          description: >-
            Rejected when the current SourceRight forbids redistribution.
            Independently of permission_scope or redistribution flags, the
            fixed Production Alpha contracts official:sec-edgar,
            official:edinet, official:companies-house,
            official:ca-issuer-ir and official:asic-register require this
            value to be null; those sources persist metadata and official URLs
            only.
        correction_of_external_id:
          type: [string, 'null']
          maxLength: 191
        change_type:
          type: string
          enum: [new, updated, corrected, withdrawn]
        metadata:
          type: object
          required: [title_provenance]
          properties:
            title_provenance:
              $ref: '#/components/schemas/TitleProvenance'
          description: >-
            Cross-runtime canonical JSON object. Floats are forbidden; integers
            must fit signed 64-bit; maximum depth is 12 and maximum node count
            is 5000. Nested empty objects and empty arrays share the canonical
            [] representation because PHP's associative decoder cannot
            preserve that distinction. The root remains an object.
          additionalProperties:
            $ref: '#/components/schemas/CanonicalMetadataValue'
    CanonicalMetadataValue:
      description: JSON value accepted by the cross-runtime metadata contract.
      oneOf:
        - type: 'null'
        - type: boolean
        - type: integer
          minimum: -9223372036854775808
          maximum: 9223372036854775807
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/CanonicalMetadataValue'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/CanonicalMetadataValue'
    GlobalLifecycleObservation:
      type: object
      required:
        - observation_id
        - country_code
        - source_key
        - external_id
        - change_type
        - observed_at
      additionalProperties: false
      properties:
        observation_id:
          $ref: '#/components/schemas/EntityId'
        country_code:
          $ref: '#/components/schemas/CountryCode'
        source_key:
          type: string
          maxLength: 191
        external_id:
          type: string
          maxLength: 191
        parent_external_id:
          type: [string, 'null']
          maxLength: 191
        change_type:
          type: string
          enum: [updated, corrected, withdrawn]
        observed_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    GlobalIngestEnvelope:
      type: object
      required: [ok, data, api_version]
      properties:
        ok:
          const: true
        data:
          type: object
          required:
            - ingest_id
            - connector_id
            - raw_count
            - acknowledged_count
            - idempotent
          properties:
            ingest_id:
              type: string
            connector_id:
              type: string
            raw_count:
              type: integer
              minimum: 0
            acknowledged_count:
              type: integer
              minimum: 0
            idempotent:
              type: boolean
            public_events_created:
              const: 0
            review_required:
              type: integer
              minimum: 0
        api_version:
          const: v2
    ReviewQueueItem:
      type: object
      required:
