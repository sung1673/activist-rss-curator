            issuer_identifiers:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            issuer_listings:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            documents:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            governance_events:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            actors:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            event_actors:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            event_documents:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            event_observations:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            timeline_entries:
              $ref: '#/components/schemas/AlphaReplayTableDigest'
            editorial_revisions:
