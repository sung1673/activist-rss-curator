        filtered_out_count:
          type: integer
          minimum: 0
          description: Official source rows intentionally excluded before ingest.
        accepted_count:
          type: integer
          minimum: 0
          description: Must equal acknowledged_count.
        acknowledged_count:
          type: integer
          minimum: 0
        status:
          const: complete
        code_revision:
          type: string
          pattern: '^[a-f0-9]{40}$'
        receipt_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    AlphaReplayState:
