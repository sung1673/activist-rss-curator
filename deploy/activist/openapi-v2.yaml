        event_id:
          $ref: '#/components/schemas/EntityId'
        lane:
          type: string
          enum: [top, watch, deadline]
        position_no:
          type: integer
          minimum: 1
          maximum: 100
        selection_reason:
          type: string
          minLength: 1
          maxLength: 500
    BriefPublicationRequest:
      type: object
      required: [edition, cutoff_at, build_sha, items]
      additionalProperties: false
      description: >-
        Across items, top is limited to 5 and watch/deadline to 50 each. When
        top is empty, empty_reason is required; when top is non-empty,
        empty_reason must be absent or null.
      properties:
        edition:
          type: string
          enum: [global, KR, US, JP, GB, CA, AU]
        cutoff_at:
          type: string
          format: date-time
          description: Cannot be more than five minutes in the future.
        build_sha:
          type: string
          minLength: 40
          maxLength: 40
          pattern: '^[a-f0-9]{40}$'
        empty_reason:
          type: [string, 'null']
          enum: [no_confirmed_material_events, coverage_unavailable, null]
        items:
          type: array
          maxItems: 105
          items:
            $ref: '#/components/schemas/BriefPublicationItem'
