openapi: 3.1.0
info:
  title: BSIDE Global Market Terminal API
  version: 2.0.0-alpha.2
  summary: Six-jurisdiction governance event API
  description: >-
    Production Alpha API for the BSIDE shareholder and capital-markets daily.
    It exposes reviewed governance events for South Korea, the United States,
    Japan, the United Kingdom, Canada and Australia. Coverage is reported per
    source and event family and must not be interpreted as equal market recall
    across jurisdictions. Source titles and original-language fields are
    preserved without automatic translation.
x-production-stage: Production Alpha
x-schema-version: 12
x-production-alpha-source-scope:
  KR:
    coverage-mode: market-wide
    ingest-mode: official-disclosure
  US:
    coverage-mode: market-wide
    ingest-mode: official-disclosure
  JP:
    coverage-mode: link-only
    ingest-mode: coverage-unavailable
    public-ready: false
  GB:
    coverage-mode: link-only
    ingest-mode: coverage-unavailable
    public-ready: false
  CA:
    coverage-mode: link-only
    ingest-mode: manual-metadata
    host-policy: issuer-bound-provenance
  AU:
    coverage-mode: link-only
    ingest-mode: manual-metadata
    host-policy: official-asic-hosts-only
x-response-budget:
  maximum-bytes: 250000
  applies-to: [json, csv, atom]
x-pagination:
  default-items: 25
  maximum-items: 100
  maximum-page: 100
  maximum-offset: 10000
  continuation: next_offset
  rule: page and offset are mutually exclusive
x-public-site: https://news.bside.ai
x-release-gate:
  state-key: global_terminal_v2
  states: [closed, preview, live]
  direct-state-endpoint-transitions:
    closed: [preview]
    preview: [closed]
    live: [closed]
  protected-atomic-transitions:
    preview: [live]
  transition-policy: >-
    POST /admin/release-state cannot promote preview to live. Both governance_v1
    and global_terminal_v2 are promoted together only by POST /admin/cutover
    after POST /admin/release-authorizations has issued a short-lived,
    single-use authorization bound to the exact deployed candidate SHA,
    release-evidence artifact digest and both state versions.
  behavior:
    closed: Public data routes return HTTP 503.
    preview: A preview Bearer token is required and responses are not cacheable.
    live: Public data routes are readable without authentication.
  live-transition-guard: >-
    Protected atomic preview-to-live cutover locks both release-state rows,
    validates the exact unexpired one-time authorization, and locks the four
    required Production Alpha connector and SourceRight rows (KR, US, CA and
    AU) even when a country has zero published documents. Every required connector must retain
    its exact country, source key/type, SourceRight id and coverage identity,
    including an exact immutable source identity match to its grant. Each
    connector must be active and error-free, and its latest successful and
    checked timestamps must satisfy the server's 15-to-45-minute,
    schedule-derived freshness limit. The SEC connector must also contain a
    strictly decoded, fresh sec-current-v1 cursor; link-only connectors require
    a recent non-zero acknowledged observation. The grant must be active,
    evidenced, current, collectable and publicly redistributable. The existing
    JP and GB connector identities are also locked and must remain exact, but
    they stay link-only, coverage_unavailable and never public-ready; no
    credential-free HTML fallback is permitted. The existing
    published v1/v2 document rights guard then runs before the authorization is
    consumed. Any failure rolls back both release states and leaves the
    authorization unconsumed.
  always-available: [/health, /openapi.yaml, /openapi.json]
  privileged-bypass:
    - /ops/connectors/{connector_id}/checkpoint
    - /ops/source-right-eligibility
    - /ops/alpha-replay-state
    - /ops/alpha-release-evidence
    - /ops/ingest
    - /ops/release-state
    - /admin/release-state
    - /admin/release-authorizations
    - /admin/cutover
    - /admin/connectors
    - /admin/connectors/{connector_id}
    - /admin/review-queue
    - /admin/expedited-review-candidates
    - /admin/expedited-review-candidates/{event_id}
    - /admin/events/{event_id}/review
    - /admin/brief-candidates
    - /admin/briefs
servers:
  - url: https://alignpe.gabia.io/activist/api.php/api/v2
    description: Production API origin
tags:
  - name: Service
  - name: Public
  - name: Operations
  - name: Editorial
  - name: Administration
paths:
  /:
    get:
      tags: [Service]
      summary: Get the API descriptor
      description: Release-gated like the other public data routes.
      x-release-gated: true
      responses:
        '200':
          description: API descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceEnvelope'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health:
    get:
      tags: [Service]
      summary: Get deployment-identity health
      description: >-
        Public and independent of the release state and database schema
        manifest. A 200 response proves that every API core file matches the
        generated deployment manifest and returns its exact Git revision and
        the schema version required by that build. It does not prove that the
        database schema or source connectors are healthy; a data-route smoke
        check must verify that separately.
      responses:
        '200':
          description: API core files match one exact deployment revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: Deployment manifest is missing, invalid, or does not match the API files
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /openapi.yaml:
    get:
      tags: [Service]
      summary: Download this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      tags: [Service]
      summary: Discover the YAML specification
      description: JSON serialization is not deployed; this route points to the YAML document.
      responses:
        '406':
          description: JSON specification is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /briefs/latest:
    get:
      tags: [Public]
      summary: Get the latest approved brief edition
      description: >-
        Returns only a published BriefEdition and approved BriefItems whose
        linked events remain publicly eligible. Item values come from immutable
        publication-time snapshots. A coverage_unavailable edition is never
        replaced by an older snapshot: it returns an empty Top lane and a
        blocking coverage_notice. When only some required sources are
        unavailable, currently visible events remain available with a
        partial_coverage warning.
        When no approved brief exists, the request succeeds with empty arrays
        and empty_reason=no_approved_brief.
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Edition'
      responses:
        '200':
          description: Latest approved brief or an explicit empty brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /live:
    get:
      tags: [Public]
      summary: List public events ordered by their latest change
      description: >-
        This is a change-ordered stream, not a guaranteed real-time market feed
        and not an implicit 24-hour window.
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events:
    get:
      tags: [Public]
      summary: List public events ordered by occurrence time
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /events/{event_id}:
    get:
      tags: [Public]
      summary: Get an event with eligible evidence documents and observations
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Public event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailEnvelope'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /issuers:
    get:
      tags: [Public]
      summary: List issuers that have at least one public event
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - name: q
          in: query
          description: Issuer-name search
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Paginated issuer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /issuers/{issuer_id}:
    get:
      tags: [Public]
      summary: Get an issuer, identifiers, listings and recent public events
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/IssuerId'
      responses:
        '200':
          description: Issuer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerDetailEnvelope'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /calendar:
    get:
      tags: [Public]
      summary: List public events that have a deadline
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /search:
    get:
      tags: [Public]
      summary: Search public event, issuer, actor and evidence fields
      description: >-
        Returns event-shaped results matching event title, summary, current
        status or event family; issuer legal name, primary ticker, market or
        identifier; approved active actor display name; or the title or
        document type of evidence that is currently redistributable and is not
        a Telegram source.
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          $ref: '#/components/responses/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /sources/status:
    get:
      tags: [Public]
      summary: List declared coverage and current connector status
      description: >-
        Connector status and zero-event results are separate concepts. A
        connector can be pending, inactive or failed even when an event list is
        empty. A connector whose source_type/source_key does not exactly match
        its referenced SourceRight is blocked_identity. Coverage notes disclose
        jurisdiction and event-family limits.
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Country'
      responses:
        '200':
          description: Source status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceStatusEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /exports/events.json:
    get:
      tags: [Public]
      summary: Export up to 100 filtered public events as JSON
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: JSON export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventExportEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /exports/events.csv:
    get:
      tags: [Public]
      summary: Export up to 100 filtered public events as UTF-8 CSV
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: UTF-8 CSV export with a BOM
          headers:
            X-BSIDE-Offset:
              schema:
                type: integer
            X-BSIDE-Returned:
              schema:
                type: integer
            X-BSIDE-Has-More:
              schema:
                type: boolean
            X-BSIDE-Next-Offset:
              schema:
                type: integer
                maximum: 10000
            Link:
              description: Present with rel="next" while a continuation is available.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /feeds/events.atom:
    get:
      tags: [Public]
      summary: Get an Atom feed of up to 100 filtered public events
      x-release-gated: true
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Market'
        - $ref: '#/components/parameters/IssuerIdQuery'
        - $ref: '#/components/parameters/EventFamily'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: '#/components/parameters/ChangeType'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Atom feed with a rel="next" link while continuation is available
          headers:
            X-BSIDE-Offset:
              schema:
                type: integer
            X-BSIDE-Returned:
              schema:
                type: integer
            X-BSIDE-Has-More:
              schema:
                type: boolean
            X-BSIDE-Next-Offset:
              schema:
                type: integer
                maximum: 10000
            Link:
              description: Present with rel="next" while a continuation is available.
              schema:
                type: string
          content:
            application/atom+xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/release-state:
    get:
      tags: [Operations]
      summary: Read the release state for watchdog observation
      description: >-
        Least-privilege, read-only view of the global terminal release state
        and recent audit history. This route exists so the five-minute
        watchdog never needs an administrator token. It bypasses the public
        release state but still requires schema version 12.
      security:
        - OpsBearer: []
      responses:
        '200':
          description: Release state and the latest 50 audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStateEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/connectors/{connector_id}/checkpoint:
    get:
      tags: [Operations]
      summary: Read the durable completion checkpoint for one connector
      security:
        - OpsBearer: []
      parameters:
        - name: connector_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^connector:[a-z]{2}:[a-z0-9_.:\-]{1,64}$'
      responses:
        '200':
          description: Registered connector checkpoint without credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorCheckpointEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/source-right-eligibility:
    get:
      tags: [Operations]
      summary: Revalidate one official SourceRight for a proposed use
      description: >-
        Returns rights_revision and the stable source-right-contract-v1
        contract_revision only after checking current status, evidence,
        validity and the requested collection, public-redistribution or AI use.
        contract_revision excludes updated_at and exposes no raw permission or
        evidence value. This endpoint bypasses the public release state but
        remains authenticated and requires schema version 12.
      security:
        - OpsBearer: []
      parameters:
        - name: source_right_id
          in: query
          required: true
          schema:
            type: string
            pattern: '^official:[a-z0-9_.:\-]{1,48}$'
        - name: use
          in: query
          required: true
          schema:
            type: string
            enum: [collect, public, ai]
      responses:
        '200':
          description: SourceRight is eligible for the requested use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRightEligibilityEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: SourceRight is currently ineligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/alpha-release-evidence:
    get:
      tags: [Operations]
      summary: Export database-derived Production Alpha evidence
      description: >-
        Recomputes exactly two latest contiguous 30-day collection horizons:
        KR OpenDART from durable checkpoints and US SEC EDGAR from durable
        MySQL receipts. JP and GB are dormant coverage-unavailable identities,
        while CA and AU are link-only metadata sources, so none of those four
        is represented as an automated 30-day connector horizon. It also
        compares every currently public source-provenance event title
        byte-for-byte with a linked eligible official document title.
        Operator-supplied counts are not accepted. The requested revision
        must equal the deployed manifest revision.
      security:
        - OpsBearer: []
      parameters:
        - name: code_revision
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
      responses:
        '200':
          description: Same-revision evidence derived from production MySQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlphaAutomatedEvidenceEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Revision mismatch or incomplete/corrupt evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/alpha-replay-state:
    get:
      tags: [Operations]
      summary: Export a deterministic DART replay state
      description: >-
        Returns deterministic row counts and content digests for all
        DART-related company, document, governance-event and observation rows,
        together with the exact 30-day apply checkpoint version and payload
        hash. This route does not require SEC evidence and is intended to be
        sampled immediately before and after a protected DART replay.
      security:
        - OpsBearer: []
      parameters:
        - name: code_revision
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{40}$'
      responses:
        '200':
          description: Same-revision DART state derived from production MySQL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlphaReplayStateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Revision mismatch or incomplete/corrupt DART checkpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /ops/ingest:
    post:
      tags: [Operations]
      summary: Persist one idempotent official-source ingestion envelope
      description: >-
        Revalidates the registered connector and current SourceRight revision
        before and inside the transaction. Automated ingestion may persist an
        eligible document, but every new GovernanceEvent is created with
        publication_status=draft, review_status=pending and
        identity_status=needs_review. It never creates a public event. A
        connector/idempotency-key replay is accepted only when the payload hash
        and code revision are unchanged. Chunks are accepted in index order and
        the final chunk advances the checkpoint only after the server verifies
        one complete receipt set with identical window, revision and declared
        totals, plus exact raw, acknowledged and request-count sums.
        Every record content_hash is independently recomputed before any write
        from the normalized document, issuer, source type, classification,
        source-right flags and canonical metadata. first_observed_at is the
        only record field excluded from that semantic hash. A producer hash
        mismatch is rejected as a validation error, while a matching hash
        against different stored core fields is rejected as
        global_document_hash_contract_conflict.
        connector:kr:dart is rejected because OpenDART remains on the
        established official-ingest pipeline. connector:jp:edinet and
        connector:gb:companies-house return global_ingest_source_disabled
        before normalization or any mutable write.
        Classified SEC completed-day/current requests must carry the expected
        closed, preview, or live state. The server checks both v1 and v2 state
        before processing and locks them again before an apply write. Preview
        additionally requires X-BSIDE-Preview-Token, independently of the ops
        Bearer credential.
        Unclassified candidates remain private until an editor assigns one of
        the eight public event families.
      x-rejected-connector-ids:
        - connector:kr:dart
        - connector:jp:edinet
        - connector:gb:companies-house
      security:
        - OpsBearer: []
      parameters:
        - name: X-BSIDE-Preview-Token
          in: header
          required: false
          description: >-
            Required in addition to OpsBearer when expected_release_state is
            preview. Never place this value in a URL or request body.
          schema:
            type: string
            minLength: 32
            maxLength: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalIngestRequest'
      responses:
        '200':
          description: Envelope persisted or an identical replay acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalIngestEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Rights, identity, idempotency or database constraint conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/connectors:
    get:
      tags: [Administration]
      summary: List configured global source connectors and current collect eligibility
      description: >-
        Returns connector state together with a current, read-only SourceRight
        collect eligibility evaluation. This operation does not approve or
        modify a SourceRight.
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Connector states ordered by country and source key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorAdminListEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/connectors/{connector_id}:
    parameters:
      - $ref: '#/components/parameters/ConnectorId'
    get:
      tags: [Administration]
      summary: Get one connector and its latest audit entries
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Connector state and at most 50 newest audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorAdminDetailEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Administration]
      summary: Activate or administratively stop one connector
      description: >-
        Applies an optimistic connector-state transition. configured is
        accepted only when the referenced SourceRight is currently eligible
        for collection and its id, source type and source key match the
        connector. JP and GB configured transitions are rejected with
        connector_disabled_by_alpha_policy regardless of stale credentials.
        inactive is allowed independently of SourceRight state.
        Every accepted request creates an audit row, including an idempotent
        same-state request where changed is false.
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorUpdateRequest'
      responses:
        '200':
          description: Connector state updated and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorUpdateEnvelope'
        '400':
          description: connector_update_validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            stale_connector_update, connector_source_right_ineligible or
            connector_disabled_by_alpha_policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/review-queue:
    get:
      tags: [Editorial]
      summary: List draft global events awaiting editorial identity review
      description: >-
        Returns only issuer-linked events whose identity needs review and whose
        review/publication states are pending/draft.
      security:
        - EditorBearer: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Country'
      responses:
        '200':
          description: Paginated editorial review queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/expedited-review-candidates:
    get:
      tags: [Editorial]
      summary: Export pending events with their immutable official evidence basis
      description: >-
        Editor-only Production Alpha review input. Returns pending draft events
        and currently redistributable official documents only. Document bodies,
        media and Telegram data are never returned. Every document is bound to
        an active SourceRight and matching connector identity; content hashes
        and update timestamps are required by the protected publication
        preflight.
      security:
        - EditorBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 20
            maximum: 50
            default: 50
      responses:
        '200':
          description: Deterministically ordered pending event candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpeditedReviewCandidateEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/expedited-review-candidates/{event_id}:
    get:
      tags: [Editorial]
      summary: Read the current official evidence and editorial state for one event
      description: >-
        Used immediately before protected mutation and during idempotent
        recovery. The evidence digest changes when the event timestamp or any
        official document identity, hash, URL, language or timestamp changes.
      security:
        - EditorBearer: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Current event and official evidence snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpeditedReviewCandidateDetailEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/events/{event_id}/review:
    post:
      tags: [Editorial]
      summary: Approve or reject one pending global event
      description: >-
        Editor-only optimistic review. expected_updated_at must still match the
        locked event row. Approval requires a complete canonical identity,
        actor, current status, importance and at least one currently publishable
        official evidence document. An unclassified candidate requires an
        explicit public event_family. Identity conflicts are never merged
        automatically: the editor must repeat approval with
        merge_into_event_id equal to the reported conflicting_event_id.
        Rejection keeps the event non-public.
        Protected batch publication also supplies expected_evidence_sha256 so
        any official document change fails before that event is mutated.
      security:
        - EditorBearer: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EventApprovalRequest'
                - $ref: '#/components/schemas/EventRejectionRequest'
      responses:
        '200':
          description: Review decision applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReviewEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Stale review, identity conflict requiring an explicit merge target,
            actor conflict or missing official evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/brief-candidates:
    get:
      tags: [Editorial]
      summary: List reviewed public events eligible for brief selection
      security:
        - EditorBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/Country'
      responses:
        '200':
          description: Importance-ordered eligible candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefCandidateEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/briefs:
    post:
      tags: [Editorial]
      summary: Publish one immutable reviewed brief edition
      description: >-
        Freezes an event snapshot for every selected item. The top lane accepts
        at most five events and each must have official evidence. A brief with
        the same event in more than one of top, watch or deadline is rejected
        across the entire publication, not merely within one lane. A brief with
        zero top events requires an explicit empty_reason consistent with
        current source availability. no_confirmed_material_events requires at
        least one active, fresh connector for the country edition, or for every
        one of KR, US, JP, GB, CA and AU in the global edition. A
        coverage_unavailable edition becomes the canonical latest state and
        returns an empty Top lane instead of exposing an older edition. Reusing
        an edition and cutoff is
        idempotent only for the identical semantic payload; a changed payload
        conflicts instead of mutating the published snapshot.
      security:
        - EditorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefPublicationRequest'
      responses:
        '200':
          description: Immutable brief published or identical replay acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefPublicationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Edition conflict, ineligible event or source-availability mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/release-state:
    get:
      tags: [Administration]
      summary: Read the global terminal release state and audit history
      description: Bypasses the public release state but requires schema version 12.
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Release state and the latest 50 audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStateEnvelope'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Administration]
      summary: Enter preview or perform an emergency close
      description: >-
        Uses optimistic state-version matching. A transition to preview fails
        when preview authentication is not configured. This endpoint permits
        closed to preview, preview to closed, live to closed and idempotent
        same-state requests. It always rejects preview to live with
        protected_atomic_cutover_required. Production promotion must use the
        protected, two-state POST /admin/cutover contract.
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseStateUpdate'
      responses:
        '200':
          description: State changed or an idempotent same-state request was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStateChangeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            The expected state version is stale, the transition is disallowed,
            or protected_atomic_cutover_required blocks a direct
            preview-to-live request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/release-authorizations:
    post:
      tags: [Administration]
      summary: Issue one protected, single-use cutover authorization
      description: >-
        Requires the exact release_authorizer role rather than an
        administrator fallback.
        The protected governance-release workflow supplies a fresh 32-byte
        nonce and binds it to the deployed 40-character candidate SHA, the
        verified GitHub evidence artifact digest and identifiers, and the
        current v1 and v2 preview state versions. The server stores only the
        nonce SHA-256, accepts an expiry 60 to 900 seconds in the future, and
        revokes every older unused authorization. The nonce is deliberately
        omitted from the response.
      security:
        - ReleaseAuthorizerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseAuthorizationRequest'
      responses:
        '201':
          description: Short-lived authorization was recorded without returning its nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAuthorizationEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Candidate, preview state/version or authorization uniqueness
            conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
  /admin/cutover:
    post:
      tags: [Administration]
      summary: Promote v1 and v2 from preview to live atomically
      description: >-
        Consumes one unexpired protected authorization in the same MySQL
        transaction that locks and promotes governance_v1 and
        global_terminal_v2. Candidate SHA, evidence artifact digest, nonce and
        both expected state versions must exactly match the authorization.
        The four required Production Alpha connectors and their exact
        SourceRights are locked and revalidated even if a country currently has
        zero published documents. Each grant must be active, evidenced,
        current, collectable and publicly redistributable; each connector must
        be configured or active and retain its registered country, source
        key/type, SourceRight id and coverage mode. Current public SourceRights
        for both API versions are then revalidated under lock. Failure leaves
        both release states unchanged and does not consume the authorization.
        Success writes both release audits with one authorization id and one
        cutover/sunset clock. A used authorization is never reusable, including
        after an emergency rollback.
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtomicCutoverRequest'
      responses:
        '200':
          description: Both release states were promoted and the authorization was consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtomicCutoverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RoleAuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            Preview/version, candidate/evidence/nonce binding, authorization
            lifecycle, required four-source registry/right eligibility,
            optional JP/GB identity policy, or
            current published-document SourceRight guard conflict
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/RequiredAlphaSourcesInvalidError'
                  - $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: application/json is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    PreviewBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque preview token
      description: Required only while a public data route is in preview.
    OpsBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque operations token
      description: The server stores only SHA-256 token hashes; admin tokens also satisfy this role.
    EditorBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque editor token
      description: Required for event review and frozen brief publication; admin tokens also satisfy this role.
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque administrator token
      description: >-
        Required for administrative release-state changes and consumption of a
        previously issued protected cutover authorization. It cannot issue an
        authorization.
    ReleaseAuthorizerBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque release-authorizer token
      description: >-
        Exact release_authorizer role supplied as
        BSIDE_RELEASE_AUTHORIZER_TOKEN only by the protected
        governance-release environment. It can issue a short-lived, single-use
        cutover authorization. Admin, editor and ops fallback is intentionally
        forbidden; the server stores only SHA-256 token hashes.
  parameters:
    Page:
      name: page
      in: query
      description: Legacy page cursor. It cannot be combined with offset.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      description: >-
        Row continuation offset returned as next_offset. It cannot be combined
        with page.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
    Country:
      name: country
      in: query
      schema:
        $ref: '#/components/schemas/CountryCode'
    Market:
      name: market
      in: query
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:\-]{1,40}$'
    IssuerIdQuery:
      name: issuer_id
      in: query
      schema:
        $ref: '#/components/schemas/IssuerId'
    EventFamily:
      name: event_family
      in: query
      schema:
        $ref: '#/components/schemas/EventFamily'
    VerificationStatus:
      name: verification_status
      in: query
      schema:
        $ref: '#/components/schemas/PublicVerificationStatus'
    ChangeType:
      name: change_type
      in: query
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{1,23}$'
    From:
      name: from
      in: query
      description: Inclusive lower bound on occurred_at.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Inclusive upper bound on occurred_at.
      schema:
        type: string
        format: date-time
    Edition:
      name: edition
      in: query
      schema:
        type: string
        enum: [global, KR, US, JP, GB, CA, AU]
        default: global
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntityId'
    IssuerId:
      name: issuer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IssuerId'
    ConnectorId:
      name: connector_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^connector:[a-z]{2}:[a-z0-9_.:\-]{1,64}$'
  responses:
    EventList:
      description: Paginated public events
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventListEnvelope'
    BadRequest:
      description: Invalid query or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreviewAuthenticationRequired:
      description: A preview token is required while the release state is preview
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RoleAuthenticationRequired:
      description: An operations or administrator token is required
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Supplied Bearer token is not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource is absent or not publicly eligible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: >-
        Public release is closed, the release-state row is unavailable, or the
        exact migration manifest through schema version 12 is unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    EntityId:
      type: string
      pattern: '^[A-Za-z0-9_.:\-]{1,96}$'
    IssuerId:
      type: string
      pattern: '^[A-Za-z0-9_.:\-]{1,96}$'
    CountryCode:
      type: string
      enum: [KR, US, JP, GB, CA, AU]
    EventFamily:
      type: string
      enum:
        - large_ownership
        - meeting_and_vote
        - tender_offer_and_mna
        - capital_issuance
        - capital_return
        - board_and_compensation
        - listing_status
        - correction_and_withdrawal
    IngestEventFamily:
      description: >-
        Automated collection may use unclassified only for a private review
        candidate. An editor must assign one of the eight EventFamily values
        before approval. For example, SEC daily-index 8-K/8-K/A records without
        item numbers and opaque or ambiguous EDINET extraordinary reports
        remain unclassified. Their source title, original language and official
        URL are still preserved.
      oneOf:
        - $ref: '#/components/schemas/EventFamily'
        - type: string
          const: unclassified
    PublicVerificationStatus:
      type: string
      description: signal is intentionally excluded from the public API.
      enum: [official, confirmed, corroborated, corrected, withdrawn]
    EventImportance:
      type: string
      description: Editor-reviewed categorical importance; never inferred by the client.
      enum: [low, medium, high, critical, market_sensitive]
    TitleProvenance:
      type: string
      description: >-
        source preserves a title supplied by the official source;
        generated_metadata is an explicit filing label derived from source
        metadata when no title exists; operator_metadata is a human-entered
        label for an approved official link.
      enum: [source, generated_metadata, operator_metadata]
