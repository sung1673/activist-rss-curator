openapi: 3.1.0
info:
  title: BSIDE Governance Intelligence API
  version: 1.12.1
  description: >-
    Public, read-only governance event records and role-gated operations APIs.
    Document title and body fields preserve their original language; the API
    never translates source text. Public data routes return 503 while the
    server-side release state is closed and require a preview Bearer token
    while it is preview. Health and this specification remain public; the API
    root descriptor is a public data route and is therefore closed with 503.
x-changelog:
  - version: 1.12.1
    date: '2026-07-27'
    changes:
      - DART quota mutation responses now return HTTP 200 only after a confirmed commit and an independent fresh-connection readback of the exact durable attempt and credential state.
      - Clients must explicitly replay the exact acknowledged POST and require duplicate=true before dispatching a DART request or acting on a credential quarantine.
      - Published the stable dart_quota_persistence_failed HTTP 503 contract with seven bounded, non-secret detail values.
  - version: 1.12.0
    date: '2026-07-26'
    changes:
      - Raised the authoritative OpenDART KST-day hard ceiling to 40,000 physical attempts across the credential pool.
      - Added SHA-256 credential identities, atomic global and per-credential accounting, credential-local status 020 blocks, and permanent fail-closed status 901 disablement.
      - Migrated legacy single-key attempts without exposing or persisting API-key material.
  - version: 1.11.1
    date: '2026-07-24'
    changes:
      - Added rights-lineage-preserving resolved-link export so independently decoded Google News discoveries can re-enter media curation.
      - Legacy web publication now rejects an empty daily report before writing files, syncing MySQL, or replacing the last good Pages artifact.
      - Link rights lineage is monotonic across URL collisions, and the resolver now has 800-links/hour scheduled capacity.
  - version: 1.11.0
    date: '2026-07-24'
    changes:
      - Added the ops-only, paginated DART human-review corpus with a deterministic full-corpus digest and strict correction-chain integrity checks.
      - Bound DART quota, review corpus, and HMAC governance writes to the same MySQL server, database, and table-prefix identity; quota and HMAC writes reject a mismatched expected binding before opening a transaction.
      - Governance HMAC writes now carry an expected backend binding inside the signed body and reject mismatches before opening a transaction.
  - version: 1.10.0
    date: '2026-07-24'
    changes:
      - Atom feeds now expose a canonical, normalized filtered self URL at the API origin and event alternate links at the public web origin.
      - DeliveryOutbox enqueue and claim contracts are permanently disabled with HTTP 410; remaining records are audit and reconciliation data only.
      - Preview-to-live promotion now rechecks every currently public-linked document SourceRight and fails closed on expiry or revocation.
      - Release quality evidence uses one shared cumulative v2 document corpus across all public-approved event, campaign, claim, vote, commitment and timeline references.
  - version: 1.9.0
    date: '2026-07-23'
    changes:
      - Added schema version 10 and a durable server-authoritative official-ingest slot claim ledger; delayed GitHub runs no longer infer slots from workflow creation timestamps.
      - Added exact oldest-slot repair, immutable completion/terminal-failure evidence and an audited next-KST-day epoch reset that preserves prior claims.
      - Release evidence now rejects ranges crossing an epoch boundary and reports claimed, late, incomplete and terminal-failure slot counts.
      - Availability evidence now proves all 288 KST minute-01 watchdog slots per route and reports an exact bitmap, missing/duplicate counts and day-edge maximum gaps.
  - version: 1.8.0
    date: '2026-07-22'
    changes:
      - Added schema version 9 and a server-authoritative 10,000-request KST-day DART quota ledger shared by scheduled, canary and backfill jobs.
      - Every physical DART HTTP attempt is consumed exactly once before dispatch; status 020 blocks all additional attempts until the next KST midnight.
  - version: 1.7.0
    date: '2026-07-22'
    changes:
      - Added schema version 8 atomic official-site snapshot receipts, identity-link history, review-only tombstones and an ops-only eligible-rights feed.
      - Added a paged official-run ledger with Python-compatible canonical JSONL digest and KST scheduled-slot attribution.
      - Health now reports only fully acknowledged scheduled official runs and the latest observed active web deployment.
      - Every preview-to-live promotion starts a new audited 90-day compatibility epoch.
  - version: 1.6.0
    date: '2026-07-22'
    changes:
      - Added editor-only canonical event identity completion with server-side comparison-key recomputation and conflict review.
      - Added fail-closed KIND SourceRight ingest eligibility preflight and a transaction-time rights recheck.
      - Defined cumulative 2021+ KST day-end corpus evidence, true KIND no-disclosure N/A days and seven-day denominator gates.
      - Required a non-empty lossless legacy crosswalk for every shadow day and permanently disabled outbound queue enqueue/claim actions.
  - version: 1.5.0
    date: '2026-07-22'
    changes:
      - Added complete-set server ranking for Today and deterministic official-site connector candidates.
      - Applied company, actor, type, status and source filters to both calendar event and proposal-vote rows.
      - Distinguished GitHub workflow rerun attempts in durable web-distribution observations.
  - version: 1.4.0
    date: '2026-07-22'
    changes:
      - Added KST day/build release evidence groups, immutable shadow run snapshots and separate DART/KIND freshness.
      - Added durable web-distribution and quality observation writers plus immutable human evidence bundles.
      - Recorded cutover and 90-day sunset timestamps atomically; legacy deprecation headers are absent before cutover.
      - Required every public document to have an active, evidenced SourceRight and removed heuristic event-correction merging.
  - version: 1.3.0
    date: '2026-07-22'
    changes:
      - Added canonical event identity, document observations, source run ACK metadata and schema version 7.
      - Added actors, public revisions, shadow review, production evidence, availability and privacy-minimal Web Vitals APIs.
      - Added byte-aware document body paging and a durable optimistic MySQL backfill checkpoint contract.
  - version: 1.2.0
    date: '2026-07-22'
    changes:
      - Added a fail-closed closed/preview/live release gate for all public v1 data routes.
      - Added an admin release-state transition API with optimistic concurrency and immutable audit history.
      - Replaced request-time schema DDL with an explicit migration version guard at schema version 6.
  - version: 1.1.0
    date: '2026-07-16'
    changes:
      - Added the seven-entity incremental editorial HMAC upsert contract with atomic chunk idempotency.
      - Added evidence-gated actor, event-party, campaign, claim, vote, commitment and timeline review routes.
      - Added optimistic review concurrency and fail-closed public/delivery visibility after evidence or rights changes.
  - version: 1.0.0
    date: '2026-07-16'
    changes:
      - Added stable DART company identifiers and governance event resources.
      - Added rights-gated documents, campaigns, calendar, exports and Atom.
      - Added private feedback, editorial review and operations health contracts.
x-compatibility:
  legacy-query-actions: [search, articles, reports, telegram_dashboard]
  legacy-feed: /feed.xml
  minimum-adapter-period-days: 90
servers:
  - url: https://alignpe.gabia.io/activist/api.php/api/v1
    description: Governance API origin
x-public-site: https://news.bside.ai
x-release-gate:
  states: [closed, preview, live]
  public-route-behavior:
    closed: HTTP 503 governance_release_closed
    preview: Bearer preview token required; responses are private and not cacheable
    live: Public read access with short-lived caching
  schema-version: 10
  protected-live-transition: >-
    POST /admin/release-state never promotes preview to live. Production
    promotion is the protected v2 POST /admin/cutover operation, which consumes
    one short-lived authorization and changes governance_v1 and
    global_terminal_v2 in the same transaction only after locking and
    revalidating the four required KR/US/CA/AU Production Alpha
    connector/SourceRight pairs, the optional JP/GB connector identities, plus
    every currently published document SourceRight. Document-empty required
    countries are not exempt.
tags:
  - name: Public
  - name: Feedback
  - name: Operations
  - name: Administration
paths:
  /companies:
    get:
      tags: [Public]
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: q, in: query, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: market, in: query, schema: {type: string, maxLength: 40}}
      responses:
        '200': {$ref: '#/components/responses/CompanyList'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /companies/{company_id}:
    get:
      tags: [Public]
      summary: Get a company, its campaigns, timeline and commitments
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200': {description: Company detail}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /actors:
    get:
      tags: [Public]
      summary: List actors attached to public events or campaigns
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: q, in: query, schema: {type: string, minLength: 2, maxLength: 100}}
        - {name: actor_type, in: query, schema: {type: string, maxLength: 40}}
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
      responses:
        '200': {description: Paginated public actors}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /actors/{actor_id}:
    get:
      tags: [Public]
      summary: Get an actor and linked public events and campaigns
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200': {description: Actor detail}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /events:
    get:
      tags: [Public]
      summary: List published governance events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: verification_status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}, description: Alias of verification_status; conflicting values are rejected.}
        - {name: identity_status, in: query, schema: {type: string, enum: [complete, needs_review]}}
        - {name: importance, in: query, schema: {$ref: '#/components/schemas/Importance'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: evidence_document_id, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {$ref: '#/components/responses/EventList'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /events/{event_id}:
    get:
      tags: [Public]
      summary: Get an event with parties, claims, evidence and revisions
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200': {description: Event detail}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /today:
    get:
      tags: [Public]
      summary: Rank Top 5 and Watch from the complete public event set
      description: >-
        Excludes signal events. Ranking is deterministic for the database state
        and uses importance, publishable official evidence, verification and
        deadline urgency. The full archive remains the paginated /events route.
      responses:
        '200':
          description: Server-ranked Top 5 and Watch lists; this response is not paginated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TodayResponse'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /campaigns/{campaign_id}:
    get:
      tags: [Public]
      summary: Get a campaign and its progress, votes and outcomes
      parameters:
        - {name: campaign_id, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200': {description: Campaign detail}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /documents/{document_id}:
    get:
      tags: [Public]
      summary: Get a rights-cleared source document
      description: >-
        licensed_telegram documents are unavailable unless SourceRight is
        active, unrevoked, in its validity period and permits redistribution.
      parameters:
        - {name: document_id, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
        - {name: include, in: query, schema: {type: string, enum: [body]}}
        - {name: body_offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000000, default: 0}}
        - {name: body_limit_bytes, in: query, schema: {type: integer, minimum: 1, maximum: 60000, default: 60000}}
      responses:
        '200': {description: Document detail with body_total_bytes, body_bytes_returned, body_truncated and body_next_offset}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /calendar:
    get:
      tags: [Public]
      summary: List event deadlines and proposal meeting dates
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: verification_status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: identity_status, in: query, schema: {type: string, enum: [complete, needs_review]}}
        - {name: importance, in: query, schema: {$ref: '#/components/schemas/Importance'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: evidence_document_id, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200': {description: Calendar page; filters apply to both event deadlines and proposal-vote meetings; date range is at most 366 days}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /search:
    get:
      tags: [Public]
      summary: Search companies, actors, events, campaigns and documents
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {$ref: '#/components/responses/SearchResults'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /exports/events.json:
    get:
      tags: [Public]
      summary: Export one page of events as JSON
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
      responses:
        '200': {$ref: '#/components/responses/EventList'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /exports/events.csv:
    get:
      tags: [Public]
      summary: Export one page of events as UTF-8 CSV
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
      responses:
        '200':
          description: CSV with pagination metadata in X-Has-More and X-Next-Page
          content:
            text/csv: {schema: {type: string}}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /feeds/events.atom:
    get:
      tags: [Public]
      summary: Latest published events as Atom with a canonical filtered self URL
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: company_id, in: query, schema: {$ref: '#/components/schemas/CompanyId'}}
        - {name: actor_id, in: query, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}}
        - {name: event_type, in: query, schema: {$ref: '#/components/schemas/EventType'}}
        - {name: verification_status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}, deprecated: true, description: Alias normalized to verification_status in the Atom self URL; conflicting values are rejected.}
        - {name: identity_status, in: query, schema: {type: string, enum: [complete, needs_review]}}
        - {name: importance, in: query, schema: {$ref: '#/components/schemas/Importance'}}
        - {name: source_class, in: query, schema: {$ref: '#/components/schemas/SourceClass'}}
        - {name: evidence_document_id, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Atom 1.0 feed
          content:
            application/atom+xml: {schema: {type: string}}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /revisions:
    get:
      tags: [Public]
      summary: List published correction metadata only
      description: Internal values, request identities and unpublished approvals are never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - {name: entity_type, in: query, schema: {type: string, enum: [company, event, campaign, document, actor]}}
        - {name: entity_id, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200': {description: Paginated published revisions}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /feedback:
    post:
      tags: [Feedback]
      summary: Submit a correction or right-of-reply request
      description: Every submission remains private and pending until editorial review.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
      responses:
        '202':
          description: Privately queued; never auto-published
        '429': {description: At most five submissions per source address per hour}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /metrics/web-vitals:
    post:
      tags: [Operations]
      summary: Record privacy-minimal first-party Web Vitals
      description: >-
        Accepts one metric object or an observations array of at most 50. Only
        route template, metric, value, device class, build SHA and measurement
        time are stored; IP, URL query, user agent, session and user identifiers
        are not stored. Rows expire after 30 days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/WebVitalObservation'
                - type: object
                  additionalProperties: false
                  required: [observations]
                  properties:
                    observations: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/WebVitalObservation'}}
      responses:
        '202': {description: Metrics accepted for 30-day retention}
        '429': {description: Global telemetry ingest limit reached}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
  /ops/health:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Watchdog state
      responses:
        '200':
          description: Last successful run and delivery queue health
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, last_success_at, official_sources, pending_outbox, oldest_pending_at, dead_letter_count, active_deployment, active_deployment_status, checked_at]
                properties:
                  ok: {type: boolean, const: true}
                  status: {type: string, enum: [ok, degraded]}
                  last_success_at: {type: [string, 'null'], format: date-time}
                  official_sources:
                    type: object
                    required: [dart, kind]
                    properties:
                      dart: {$ref: '#/components/schemas/OfficialSourceFreshness'}
                      kind: {$ref: '#/components/schemas/OfficialSourceFreshness'}
                  pending_outbox: {type: integer}
                  oldest_pending_at: {type: [string, 'null'], format: date-time}
                  dead_letter_count: {type: integer}
                  active_deployment:
                    anyOf:
                      - {$ref: '#/components/schemas/ActiveDeployment'}
                      - {type: 'null'}
                  active_deployment_status: {type: string, enum: [missing, observed, ambiguous, invalid]}
                  checked_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /ops/runtime-state:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Hydrate a fresh runner from MySQL source-of-truth state
      parameters:
        - {name: resource, in: query, required: true, schema: {type: string, enum: [runs, articles, stories, reports, telegram_channels, telegram_messages, telegram_article_matches, telegram_issue_signals, delivery_outbox, companies, source_rights, collection_runs, governance_events, documents, link_discoveries]}}
        - {name: after, in: query, schema: {type: string, maxLength: 512}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: Optional incremental lower time bound}
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {description: Cursor page capped below 250KB}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /ops/availability-observations:
    post:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Persist an idempotent watchdog observation batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observations]
              properties:
                observations: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/AvailabilityObservation'}}
      responses:
        '202': {description: Every row acknowledged; duplicates are counted separately}
        '409': {description: An observation ID was reused with different values}
        '429': {description: Global watchdog ingest limit reached}
  /ops/web-distribution-observations:
    post:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Persist actual Pages/API deployment outcomes idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observations]
              properties:
                observations: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/WebDistributionObservation'}}
      responses:
        '202': {description: Actual deployment observations acknowledged with exact accepted_count, inserted_count and duplicate_count}
        '409': {description: Observation or workflow-run attempt target was reused with different values}
  /ops/quality-observations:
    post:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Persist immutable, actual daily quality numerators and denominators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [observations]
              properties:
                observations: {type: array, minItems: 1, maxItems: 10, items: {$ref: '#/components/schemas/QualityObservation'}}
      responses:
        '202': {description: Quality observations acknowledged; zero values remain zero and never become synthetic successes}
        '409': {description: An immutable date/revision observation conflicts}
  /ops/release-evidence:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Export production-only release evidence numerators and denominators
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: code_revision, in: query, schema: {type: string, pattern: '^[a-f0-9]{40}$'}, description: Select the immutable same-SHA human evidence bundle.}
      responses:
        '200':
          description: Up to 31 days of non-synthetic production DB evidence
          content:
            application/json:
              schema:
                type: object
                required: [official_schedule, availability]
                properties:
                  official_schedule: {$ref: '#/components/schemas/OfficialScheduleEvidence'}
                  availability: {$ref: '#/components/schemas/AvailabilityEvidence'}
                  operations_days:
                    type: array
                    items: {$ref: '#/components/schemas/QualityObservationEvidence'}
        '400': {description: Invalid or excessive date range}
  /ops/official-run-ledger:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Page exact official collection-run evidence without exceeding the API response budget
      description: >-
        Scheduled rows are attributed to the KST date of scheduled_slot_at;
        manual, backfill and invalid-metadata rows use their observed completion date.
        ledger_sha256 is SHA-256 over sorted-key compact UTF-8 JSON plus a newline for every row in the complete range.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: A page plus the complete-range row count and digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficialRunLedgerPage'}
        '400': {description: Invalid cursor or date range}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /ops/dart-review-corpus:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Export the exact OpenDART document-event review corpus
      description: >-
        Available while the public release state is closed. The half-open KST
        date range is [from,to), is limited to 31 days, and to cannot be later
        than the API server's current Asia/Seoul date. Only official:dart
        official_disclosure documents are included. Every document must have
        exactly one event link and a matching company or the request fails
        closed. The receipt date encoded in the first eight external_id digits
        must equal the UTC published_at date. corpus_sha256 is SHA-256 over
        sorted-key compact UTF-8 JSON plus a newline for every item in the
        complete range, ordered by published_at, document_id and event_id.
        has_later_correction is the boolean OpenDART
        source flag stored with the document, while has_successor reports an
        actual correction_of_document_id successor in the database.
        is_correction and is_cancelled use the linked event's persisted source
        flags with safe lineage and lifecycle fallbacks. Source payloads are
        read only for these booleans and no payload_json field is exposed.
        backend_binding_id binds the page and full-corpus digest to the serving
        MySQL database and table namespace without disclosing either value.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}, description: Exclusive upper KST date, no later than the current KST date.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: A page plus the complete-range population count and canonical digest
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DartReviewCorpusPage'}
        '400': {description: Missing or invalid range, limit, or range-bound cursor}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Ambiguous linkage, malformed DART identity or metadata, unavailable backend binding, or response item over budget}
  /ops/dart-quota:
    get:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Read global and per-credential KST-day OpenDART quota state
      parameters:
        - {name: quota_day, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Current global usage and credential-local block or disable state, bound to the serving MySQL backend
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DartQuotaStatus'}
        '400': {description: quota_day differs from the server current KST date}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Migration 012 is unavailable or the serving MySQL backend identity cannot be derived safely}
    post:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Atomically consume one physical DART request or quarantine one credential
      description: >-
        A successful mutation is acknowledged only after commit succeeds and a
        separate fresh PDO connection, bound to the same expected MySQL
        backend, reads back the exact attempt request hash, quota day and
        credential state. After any valid first HTTP 200 acknowledgement, the
        client must POST the exact same JSON body again and proceed only when
        that explicit replay returns duplicate=true. The first acknowledgement
        may already have duplicate=true when an internal transport retry
        recovered a lost response; this never removes the separate replay
        requirement.
      x-durable-ack-contract:
        commit-confirmed-before-200: true
        independent-fresh-connection-readback-before-200: true
        exact-post-replay-required: true
        explicit-replay-duplicate-required: true
        persistence-failure:
          http-status: 503
          code: dart_quota_persistence_failed
          detail-enum:
            - transaction_commit_failed
            - transaction_state_invalid
            - transaction_readback_connection_failed
            - transaction_readback_binding_failed
            - transaction_readback_attempt_failed
            - transaction_readback_day_failed
            - transaction_readback_credential_failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/DartQuotaConsumeRequest'}
                - {$ref: '#/components/schemas/DartQuotaBlockRequest'}
                - {$ref: '#/components/schemas/DartQuotaDisableRequest'}
      responses:
        '200':
          description: >-
            First or replay acknowledgement based on committed state verified
            through an independent fresh-connection readback. This response
            alone is not a physical-request permit: the caller must repeat the
            exact POST and require duplicate=true on the explicit replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DartQuotaAcknowledgement'}
        '400': {description: Exact request contract or KST day mismatch}
        '409': {description: Requested credential blocked by 020 or disabled by 901, missing cause attempt, backend mismatch, or idempotency conflict}
        '429': {description: The global 40,000-request KST-day hard limit is exhausted}
        '503':
          description: >-
            Migration 012 or the backend identity is unavailable, or commit and
            independent readback could not prove the durable mutation. A
            persistence failure uses the stable bounded schema below.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/DartQuotaPersistenceFailure'}
                  - type: object
                    description: Existing schema- or backend-unavailable fail-closed response.
                    additionalProperties: true
                    required: [ok, error, api_version]
                    properties:
                      ok: {type: boolean, const: false}
                      error:
                        type: string
                        enum: [dart_quota_schema_unavailable, backend_binding_unavailable]
                      api_version: {type: string, const: v1}
