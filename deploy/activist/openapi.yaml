          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficialSlotEpochResetAcknowledgement'}
        '400': {description: Invalid action, reason, revision or confirmation}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Release is not closed, epoch is absent or expected version is stale}
  /admin/release-state:
    get:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Read the governance public release state and recent audit history
      parameters:
        - {name: history_limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: Current state, schema version, preview-auth readiness and audit history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReleaseState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
    post:
      tags: [Administration]
      security: [{bearerAuth: []}]
      summary: Transition the governance public release state
      description: >-
        Allowed transitions on this endpoint are closed to preview, preview to
        closed, and live to closed. Repeating the current state is idempotent.
        A stale expected_version returns 409 and every state change is audited.
        Preview to live always returns protected_atomic_cutover_required.
        Production promotion must use POST /api/v2/admin/cutover, which binds
        the exact candidate SHA and release-evidence digest, revalidates the four
        required KR/US/CA/AU connector/SourceRight pairs independently of
        document count, verifies the optional JP/GB connector identities,
        preserves the existing published-document rights guard, and promotes
        v1 and v2 atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleaseStateUpdate'}
      responses:
        '200': {description: State transition committed, or an idempotent replay acknowledged}
        '400': {description: Invalid state, version or reason}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale version, disallowed transition, or protected_atomic_cutover_required}
        '503': {$ref: '#/components/responses/GovernanceUnavailable'}
