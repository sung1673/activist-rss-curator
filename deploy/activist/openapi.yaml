                review_note: {type: string, minLength: 5}
      responses:
        '200': {description: Feedback remains private with is_public=false}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-role-token
    previewBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-preview-token
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CompanyId:
      name: company_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CompanyId'}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/EntityId'}
    ActorId:
      name: actor_id
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$'}
  requestBodies:
    EditorialReview:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EditorialReviewRequest'}
  schemas:
    EntityId:
      type: string
      pattern: '^[A-Za-z0-9_.:-]{1,96}$'
    CompanyId:
      type: string
      pattern: '^\d{8}$'
      description: OpenDART corp_code
    EventType:
      type: string
      enum: [five_percent_holding, shareholder_proposal, general_meeting, board, executive_compensation, dividend, treasury_shares, merger, split, duplicate_listing, rights_issue, convertible_bond, bond_with_warrant, exchangeable_bond, tender_offer, delisting, trading_suspension, value_up, other]
    Importance:
      type: string
      enum: [low, medium, high, market_sensitive, critical]
    VerificationStatus:
      type: string
      enum: [signal, unverified, corroborated, official, confirmed, disputed, corrected, withdrawn]
    PublicationStatus:
      type: string
      enum: [draft, published, withdrawn]
    ReviewStatus:
      type: string
      enum: [pending, not_required, changes_requested, approved, rejected]
    ReleaseStateName:
      type: string
      enum: [closed, preview, live]
    ReleaseStateUpdate:
      type: object
      additionalProperties: false
      required: [release_state, expected_version, reason]
      properties:
        release_state: {$ref: '#/components/schemas/ReleaseStateName'}
        expected_version: {type: integer, minimum: 0}
        reason: {type: string, minLength: 8, maxLength: 2000}
    ReleaseState:
      type: object
      required: [ok, release_state, state_version, schema_version, preview_auth_configured, history]
      properties:
        ok: {type: boolean}
        release_state: {$ref: '#/components/schemas/ReleaseStateName'}
        state_version: {type: integer, minimum: 0}
        schema_version: {type: integer, const: 10}
        preview_auth_configured: {type: boolean}
        updated_by: {type: string}
        update_reason: {type: string}
        cutover_at: {type: [string, 'null'], format: date-time, description: First protected preview-to-live cutover; null before cutover.}
        sunset_at: {type: [string, 'null'], format: date-time, description: Exactly 90 days after cutover; null before cutover.}
        updated_at: {type: string, format: date-time}
        history:
          type: array
          maxItems: 50
          items:
            type: object
            required: [audit_id, state_version, new_state, changed_by, change_reason, created_at]
            properties:
              audit_id: {type: string}
              state_version: {type: integer, minimum: 0}
              previous_state: {anyOf: [{$ref: '#/components/schemas/ReleaseStateName'}, {type: 'null'}]}
              new_state: {$ref: '#/components/schemas/ReleaseStateName'}
              changed_by: {type: string}
              change_reason: {type: string}
              request_id: {type: [string, 'null']}
              cutover_at: {type: [string, 'null'], format: date-time}
              sunset_at: {type: [string, 'null'], format: date-time}
              created_at: {type: string, format: date-time}
    OfficialSlotClaimRequest:
      type: object
      additionalProperties: false
      required: [action, pipeline, github_run_id, github_run_attempt, event_schedule, trigger_created_at, code_revision]
      properties:
        action: {type: string, enum: [claim, repair]}
        pipeline: {type: string, const: ingest-official}
        github_run_id: {type: string, pattern: '^[0-9]{1,64}$'}
        github_run_attempt: {type: integer, minimum: 1}
        event_schedule: {type: string, enum: ['0,15,30,45 22-23 * * *', '0,15,30,45 0-14 * * *', '0,30 15-21 * * *']}
        trigger_created_at: {type: string, format: date-time, description: Immutable GitHub workflow_run.created_at provenance; never used to floor or invent a slot.}
        code_revision: {type: string, pattern: '^[a-f0-9]{7,40}$'}
        expected_slot_at: {type: string, format: date-time, description: Required only for repair and must name the globally oldest due unclaimed slot.}
    OfficialSlotClaimAcknowledgement:
      type: object
      additionalProperties: false
      required: [ok, accepted, claim_id, pipeline, github_run_id, github_run_attempt, event_schedule, scheduled_slot_at, trigger_created_at, claimed_at, next_cadence_slot_at, trigger_lag_seconds, claim_lag_seconds, late, status, terminal_reason, duplicate]
      properties:
        ok: {type: boolean, const: true}
        accepted: {type: integer, const: 1}
        claim_id: {$ref: '#/components/schemas/EntityId'}
        pipeline: {type: string, const: ingest-official}
        github_run_id: {type: string, pattern: '^[0-9]{1,64}$'}
        github_run_attempt: {type: integer, minimum: 1}
        event_schedule: {type: string, enum: ['0,15,30,45 22-23 * * *', '0,15,30,45 0-14 * * *', '0,30 15-21 * * *']}
        scheduled_slot_at: {type: string, format: date-time}
        trigger_created_at: {type: string, format: date-time}
        claimed_at: {type: string, format: date-time}
        next_cadence_slot_at: {type: string, format: date-time, description: Next boundary in the full 82-slot cadence.}
        trigger_lag_seconds: {type: integer, minimum: 0}
        claim_lag_seconds: {type: integer, minimum: 0}
        late: {type: boolean, description: Immutable claim-time value; true exactly when claimed_at is at or after next_cadence_slot_at.}
        status: {type: string, enum: [claimed, failed, completed]}
        terminal_reason: {type: [string, 'null'], enum: [null, claim_after_next_cadence, completion_after_next_cadence, rerun_after_next_cadence], description: Non-null only when status is failed.}
        duplicate: {type: boolean}
    OfficialSlotClaimState:
      type: object
      additionalProperties: false
      required: [pipeline, active_from, epoch_version, activated_at, activation_revision, change_reason, changed_by]
      properties:
        pipeline: {type: string, const: ingest-official}
        active_from: {type: string, format: date-time}
        epoch_version: {type: integer, minimum: 1}
        activated_at: {type: string, format: date-time}
        activation_revision: {type: string, pattern: '^[a-f0-9]{7,40}$'}
        change_reason: {type: string, minLength: 20, maxLength: 500}
        changed_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OfficialSlotClaim:
      type: object
      additionalProperties: false
      required: [claim_id, pipeline, epoch_version, scheduled_slot_at, event_schedule, github_run_id, github_run_attempt, trigger_created_at, claimed_at, next_cadence_slot_at, trigger_lag_seconds, claim_lag_seconds, late, code_revision, status, terminal_reason, failed_at, completed_run_id, completed_run_attempt, completion_raw_count, completion_ack_count, completion_sha256, completed_at, created_at, updated_at]
      properties:
