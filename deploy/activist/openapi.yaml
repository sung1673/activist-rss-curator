        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Operations]
      security: [{bearerAuth: []}]
      summary: Claim the oldest due slot, or repair the globally oldest exact unclaimed slot
      description: >-
        The first request activates collection only at the next complete KST day and returns 409
        without assigning that run. A normal claim selects the oldest due unclaimed slot in the
        immutable cron family. Repair accepts an operator-supplied exact slot only when it is the
        globally oldest due unclaimed slot across all three cron families. Completed reruns are
        immutable no-ops; post-boundary reruns become permanent failed claims.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OfficialSlotClaimRequest'}
      responses:
        '200':
          description: Exact durable claim acknowledgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OfficialSlotClaimAcknowledgement'}
        '400': {description: Invalid identity, schedule, timestamp or repair slot}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {description: Activation, not-active, not-due, not-oldest, idempotency or concurrency conflict}
