        valid_from: {type: string, format: date-time}
        valid_until: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        ai_allowed: {type: boolean}
        redistribution_allowed: {type: boolean}
        status: {type: string, enum: [pending, active, expired, revoked]}
        expected_status:
          type: string
          enum: [missing, pending, active, expired, revoked]
          description: >-
            Optional compare-and-swap state. Use missing for a create and the
            exact current status for an update.
        expected_updated_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Required with expected_status other than missing and must equal
            the current row version.
