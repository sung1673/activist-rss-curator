        used_count: {type: integer, minimum: 0, maximum: 40000}
        remaining_count: {type: integer, minimum: 0, maximum: 40000}
        blocked: {type: boolean}
        block_reason: {type: [string, 'null'], enum: [opendart_status_020, null]}
        blocked_until: {type: [string, 'null'], format: date-time}
        blocked_by_attempt_id:
