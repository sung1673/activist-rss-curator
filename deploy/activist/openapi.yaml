    SourceRight:
      type: object
      description: >-
        An evidence-backed source grant. Once source_right_id exists,
        source_type and source_key are immutable; later updates may only change
        the grant metadata, validity, permissions, evidence, and status.
        Protected automation sends expected_status and expected_updated_at as
        an optimistic concurrency guard; stale or unexpectedly created rows
        return 409 without changing the grant.
      required: [source_type, source_key, source_name, permission_scope, valid_from, ai_allowed, redistribution_allowed, status]
      properties:
        source_right_id: {$ref: '#/components/schemas/EntityId'}
        source_type: {type: string, description: Immutable for an existing source_right_id.}
        source_key: {type: string, maxLength: 191, description: Immutable for an existing source_right_id.}
