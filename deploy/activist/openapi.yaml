    NotFound:
      description: Resource not found or not publicly visible
    Unauthorized:
      description: Valid Bearer token required
    Forbidden:
      description: Token does not have the required role
    GovernanceUnavailable:
      description: >-
        Governance v1 schema migration 010 is not active, release state is
        unavailable, or public access is intentionally closed. Retry-After is
        supplied for retryable 503 responses.
x-hmac-actions:
  description: >-
    Existing api.php HMAC authentication (timestamp, nonce, body signature) is
    reused for server-to-server writes. Every action is POSTed as
    ?action={action}; these routes are not accessible with public Bearer tokens.
  actions:
    - upsert_governance_snapshot
    - upsert_governance_snapshot_dart_guarded
    - upsert_official_site_snapshot
    - upsert_editorial_snapshot
    - export_runtime_state
    - enqueue_link_discoveries
    - claim_link_discoveries
    - resolve_link_discovery
  dart-guarded-write-contract:
    action: upsert_governance_snapshot_dart_guarded
    legacy_action_accepts_dart: false
    description: >-
      OpenDART writes use a candidate-only action so an older PHP deployment
      rejects them as an unknown action. Every signed chunk carries the exact
      deployment SHA plus mutable and semantic SourceRight revisions. The
      signed body also carries the exact release state observed by the
      collector preflight. Under one transaction the server verifies the
      deployment manifest, schema 12, equal v1/v2 release states matching that
      signed expectation, stored DART document/event lineage, and the locked
      SourceRight before any mutation. dart_canary binds closed, shadow binds
      preview, and live binds live; off, missing, or other modes do not write.
      official:dart is also a fixed metadata-only contract: body_text/content
      may be absent, null, or an empty string (stored as SQL NULL), while any
      non-empty body rejects the entire signed request before a transaction.
  permanently-disabled-actions:
    distribution_mode: web_only
    http_status: 410
    error: outbound_delivery_disabled
    actions: [enqueue_delivery_outbox, claim_delivery_outbox]
  historical-reconciliation-actions:
    deprecated: true
    description: Audit-only handling of pre-disable rows; never initiates delivery.
    actions: [ack_delivery_outbox, fail_delivery_outbox]
  delivery-outbox-contract:
    deprecated: true
    distribution_mode: web_only
    historical_schema_only: true
    new_enqueue_enabled: false
    new_claim_enabled: false
    claim:
      max_items: 1
      default_lease_seconds: 900
      min_lease_seconds: 300
      max_lease_seconds: 1800
      semantics: >-
        A worker must claim, externally send, and durably acknowledge one row
        before claiming the next. This prevents later items in a large batch
        from reaching lease expiry before their send starts.
    acknowledgement:
      external_message_id_required: true
      idempotent_when_external_message_id_matches: true
      ambiguous_send_outcome: dead_letter
      semantics: >-
        Telegram transport failures after sendMessage begins are not retried
        automatically because the Bot API offers no caller-supplied idempotency
        key. Rows with an unknown outcome require reconciliation.
    rights_lineage_complete:
      required: true
      const: true
    source_right_ids:
      required: true
      type: array
      items:
        type: string
    enforcement: >-
      Missing or malformed lineage is rejected at enqueue. Every listed right
      is revalidated at claim time, and an inactive or missing right moves the
      delivery to dead_letter before any external send.
  editorial-snapshot-contract:
    semantics: incremental-upsert
    description: >-
      Incremental governed editorial upsert; omission never deletes an existing record.
      Every accepted record is revalidated server-side and enters inactive, pending,
      or draft state unless identical reviewed content already exists.
    schema_version: 1
    max_records_per_chunk: 500
    chunk_id_format: 'editorial:{first-32-lowercase-bundle-sha256}:{1-based-index-4-digits}'
    arrays:
      - actors
      - event_actors
      - campaigns
      - claim_evidence
      - proposal_votes
      - commitment_outcomes
      - timeline_entries
    invariants:
      - All seven arrays are required and exactly one is non-empty.
      - Source-language text is stored byte-for-byte without trimming, translation, or silent truncation.
      - Timestamps require an explicit timezone offset and are stored in UTC.
      - A chunk commit includes entity writes, evidence links, and its payload hash atomically.
      - Replaying an identical chunk returns rejected=0 and exact accepted counts; changed payload under the same chunk identity returns 409.
    success_response_example:
      ok: true
      accepted: {campaigns: 25}
      rejected: 0
      idempotent: false
  official-governance-ingest-contract:
    schema_version: 10
    backend_binding:
      request_field: expected_backend_binding_id
      request_pattern: '^[a-f0-9]{64}$'
      signed_body_required: true
      verified_before_transaction: true
      mismatch_http_status: 409
      success_ack_field: backend_binding_id
    canonical_identity:
      complete_requires: [company_id, event_type, identity_action, identity_target, identity_actor_id, identity_effective_at, identity_deadline_at, comparison_key]
      comparison_key_pattern: '^eventcmp:v1:[a-f0-9]{64}$'
      failure_behavior: Reject conflicting complete identities atomically; incomplete identities remain draft and needs_review.
    observations: Every accepted event-document evidence edge creates or refreshes one idempotent EventObservation.
    run_metadata: [code_revision, first_observed_at, raw_count, acknowledged_count]
