        next_cadence_slot_at: {type: string, format: date-time}
        trigger_lag_seconds: {type: integer, minimum: 0}
        claim_lag_seconds: {type: integer, minimum: 0}
        late: {type: boolean}
        code_revision: {type: string, pattern: '^[a-f0-9]{7,40}$'}
        status: {type: string, enum: [claimed, failed, completed]}
        terminal_reason: {type: [string, 'null'], enum: [null, claim_after_next_cadence, completion_after_next_cadence, rerun_after_next_cadence]}
        failed_at: {type: [string, 'null'], format: date-time}
        completed_run_id: {type: [string, 'null']}
